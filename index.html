 holy city","Russia was Orthodox Christian."],["Gold from West Africa","West African gold drew Morocco, not Russia."],["Silver from Potosí","Potosí silver is in South America."]],"exp":"Ivan IV wanted to control the fur trade, and traders kept pushing east."},{"q":"Russia's push across Siberia is most similar to which other expansion?","right":"Morocco crossing the Sahara for gold","wrong":[["The Ottoman siege of Vienna, a failed attack on a rival European capital","That failed and was about a rival state."],["Akbar's tolerance","Not expansion for resources."],["The Peace of Augsburg","A treaty."]],"exp":"Both expanded to control valuable resources: furs and gold."}]},{"term":"Control of the Volga","def":"Gave Moscow an outlet to the Caspian Sea, so it could trade directly with Persia and the Ottomans.","hook":"A river road south.","asks":[{"q":"How did gaining the river that flows into the Caspian Sea help Russia?","right":"It allowed direct trade with Persia","wrong":[["It gave Russia a warm-water Baltic port","St. Petersburg on the Baltic came later under Peter."],["It ended Russian serfdom","Serfdom grew worse in this period."],["It linked Russia to the Pacific","The Volga flows south into the Caspian, not east."]],"exp":"The Volga let Moscow trade south without the Crimean Tatars in the way."},{"q":"Controlling the Volga mainly helped Russia","right":"trade directly with Persia and the Ottomans","wrong":[["defeat the Ottoman navy at the Battle of Lepanto in the Mediterranean Sea","That was Spain and Venice."],["reach the Pacific","That was across Siberia."],["cross the Sahara","No."]],"exp":"The Volga gave Moscow an outlet to the Caspian Sea."}]}],"intro":["Russia grew from a small state around Moscow into a giant empire. Ivan IV (\"the Terrible\"), crowned tsar in 1547, took the cities of Kazan and Astrakhan from the Mongols' heirs. That gave Moscow control of the Volga River, a trade road south to Persia and the Ottomans, and opened the way east. Cossacks, peasant warriors with guns, pushed across Siberia for furs, and Russians reached the Pacific by 1639."]},{"name":"West Africa","cards":[{"term":"Songhai","def":"West African empire that controlled Gao, Timbuktu and the trans-Saharan gold and salt trade.","hook":"Heir to Mali.","asks":[{"q":"Why did Timbuktu flourish under this West African empire?","right":"Rulers backed trade and Islamic scholarship","wrong":[["It was the Ottoman capital in North Africa","Timbuktu was never an Ottoman capital."],["It was the center of the global silver trade","The trade was in gold and salt."],["It was protected by a large Songhai navy on the coast","Songhai was a land empire on the Niger River."]],"exp":"Songhai rulers supported trade and learning, so Timbuktu became a center of both."},{"q":"Why did Morocco want Songhai's lands?","right":"Songhai controlled the gold and salt trade","wrong":[["Songhai had the largest navy in Africa and controlled the Mediterranean ports","It was an inland empire."],["Songhai was Christian","No."],["Songhai had no army","It had a large army."]],"exp":"Songhai controlled Gao, Timbuktu and the trans-Saharan trade."}]},{"term":"Battle of Tondibi (1591)","def":"A Moroccan army with early firearms beat a larger Songhai army near Gao.","hook":"Muskets beat numbers.","asks":[{"q":"Which battle shows that gunpowder decided wars outside Eurasia too?","right":"Tondibi, 1591","wrong":[["Chaldiran, 1514","Chaldiran was in Persia, in Eurasia."],["Panipat, 1526","Panipat was in northern India, in Eurasia."],["Mohács, 1526","Mohács was in Hungary, in Europe."]],"exp":"Morocco's arquebuses defeated Songhai in West Africa."},{"q":"What did Tondibi show about larger armies without firearms?","right":"They could lose to smaller armies with guns","wrong":[["They always won, because numbers mattered more than weapons in every battle","A larger army lost."],["They never fought","They fought at Tondibi."],["They used cannons","They lacked firearms."]],"exp":"A Moroccan army with firearms beat a larger Songhai army."}]},{"term":"Moroccan invasion of Songhai","def":"The North African kingdom crossed the Sahara in 1591 to seize the gold routes of West Africa.","hook":"Follow the gold.","asks":[{"q":"What was Morocco's main goal when it invaded the Songhai Empire?","right":"Control of the gold trade routes","wrong":[["Spreading Shi'a Islam across the Sahara","Both states were Sunni Muslim."],["Gaining a port on the Pacific Ocean","West Africa does not border the Pacific."],["Stopping Portuguese missionaries in Timbuktu and Gao","The invasion was about trade, not missionaries."]],"exp":"Morocco wanted West Africa's gold."},{"q":"Which pair shares the same motive?","right":"Morocco in Songhai; Russia in Siberia","wrong":[["Morocco in Songhai; Akbar ending the jizya to win over the Hindu majority","That's a religious policy."],["Morocco in Songhai; Luther's theses","Religious protest."],["Morocco in Songhai; the Edict of Nantes","Religious toleration."]],"exp":"Both expanded to seize valuable resources (gold; furs)."}]}],"intro":["Songhai was the great West African empire of this time. It controlled the cities of Gao and Timbuktu and the gold and salt trade across the Sahara. Its wealth drew an attack: in 1591 Morocco sent an army across the desert. At the Battle of Tondibi, Moroccan troops with firearms beat a much larger Songhai army. This is one more example of the unit's main pattern: guns beat numbers."]}],"intro":["This deck is the who-took-what part of the unit. Six powers grew by conquest in these years: the Ottomans, Safavids, Mughals, Qing, Russia and Songhai. Almost every one of them won its key battles with cannons and muskets. On the test, the pattern matters more than any single date: gunpowder plus strong rulers led to fast expansion."]},{"id":3,"name":"Rivalries and Decline","optional":false,"sections":[{"name":"Wars between empires","cards":[{"term":"Battle of Chaldiran (1514)","def":"Ottoman artillery and Janissaries beat Safavid cavalry, stopping Safavid expansion westward.","hook":"Guns beat horses.","asks":[{"q":"After losing this battle, the Safavids rebuilt their army with muskets and cannons. What does this show?","right":"Defeat pushed rivals to adopt gunpowder","wrong":[["Cavalry was more effective than gunpowder weapons","The cavalry lost; that is why the Safavids changed."],["The Ottomans gave up firearms after their victory","The Ottomans kept their artillery."],["Religion played no part at all in the war between them","The battle was also a Sunni versus Shi'a clash."]],"exp":"Losing to guns at Chaldiran made the Safavids adopt guns."},{"q":"What did Chaldiran show about cavalry armies?","right":"They lost to artillery and muskets","wrong":[["They were stronger than any army with guns, so the Safavids won the battle","The Safavids lost."],["They were no longer used anywhere","The Safavids still used them."],["They won at sea","It was a land battle."]],"exp":"Ottoman artillery and Janissaries beat Safavid cavalry."}]},{"term":"Ottoman–Safavid rivalry","def":"A conflict over territory, trade routes and the Sunni versus Shi'a split.","hook":"Land, silk and faith.","asks":[{"q":"Which statement best explains the long conflict between the Ottomans and the Safavids?","right":"Religion and territory both mattered","wrong":[["It was only a dispute about religious doctrine","Your textbook says it was also about territory and trade routes."],["It was only a contest over the West African gold trade","The gold trade is a West African issue."],["It was mainly about which of them would control India","India was ruled by the Mughals."]],"exp":"Each side saw the other's Islam as heresy, and they also fought over land and trade."},{"q":"Compare the Ottoman–Safavid and Safavid–Mughal rivalries.","right":"Religion mattered more in the Ottoman–Safavid one","wrong":[["Religion was the only cause of both rivalries, which were purely about faith","Territory and trade mattered too."],["They were the same conflict","Different rivals."],["Neither involved territory","Both involved territory."]],"exp":"Ottoman–Safavid: territory, trade and Sunni vs. Shi'a. Safavid–Mughal: mostly territory like Kandahar."}]},{"term":"Trade embargo","def":"An official ban on commerce; the Ottomans used them against Safavid silk merchants.","hook":"Starve the rival's market.","asks":[{"q":"The Ottomans banned trade with Safavid silk merchants. What does this show about the rivalry?","right":"It was economic as well as religious","wrong":[["The two empires had no contact at all","An embargo only matters because trade existed."],["The Safavids controlled the Bosporus","The Ottomans held the Bosporus."],["Silk was banned by Islamic law","The ban targeted a rival, not silk itself."]],"exp":"Economic pressure was part of the rivalry."},{"q":"Which is an example of a trade embargo?","right":"Ottomans banning trade with Safavid silk merchants","wrong":[["Malacca charging fees on ships that passed through the strait each year","That's a fee, not a ban."],["The Qing keeping the exams","Not trade."],["Tax farming","A revenue system."]],"exp":"An embargo is an official ban on commerce."}]},{"term":"Tabriz (1541)","def":"City in Persia where the Ottomans stopped Safavid forces; it became part of the border between Sunni and Shi'a lands.","hook":"A border drawn by faith.","asks":[{"q":"Your textbook says a city in Persia became part of the line between Sunni and Shi'a societies. Which city?","right":"Tabriz","wrong":[["Isfahan","Isfahan was the Safavid capital, deep inside Persia."],["Kandahar","Kandahar was fought over by the Safavids and Mughals."],["Istanbul","Istanbul was the Ottoman capital."]],"exp":"The Ottomans stopped the Safavids at Tabriz in 1541."},{"q":"Why does Tabriz matter for the map of religion in Southwest Asia?","right":"It marked the Sunni–Shi'a border","wrong":[["It was where the Safavids converted to Sunni Islam after losing to the Ottomans","They stayed Shi'a."],["It became the Mughal capital","No."],["It was where Luther preached","No."]],"exp":"Tabriz became part of the line between Sunni and Shi'a societies."}]},{"term":"Kandahar","def":"Fortress city in Afghanistan fought over by the Safavids and Mughals; the Safavids kept it after 1649.","hook":"The frontier fortress.","asks":[{"q":"Which place was at the center of the Safavid–Mughal rivalry?","right":"Kandahar, in Afghanistan","wrong":[["Constantinople, on the Bosporus","That city was taken by the Ottomans."],["Vienna, in Austria","Vienna was an Ottoman target."],["Timbuktu, on the Niger","Timbuktu was a Songhai city."]],"exp":"Kandahar changed hands in 1622, 1638 and 1649."},{"q":"What happened to Kandahar in the end?","right":"The Safavids kept it after 1649","wrong":[["The Mughals kept it and used it as the base for their conquest of Persia","The Safavids kept it."],["The Ottomans took it","Not on your card."],["It was destroyed by Timur","Not on your card."]],"exp":"The Safavids kept Kandahar after 1649."}]},{"term":"Humayun","def":"Babur's son, who regained the Mughal throne in 1555 with Safavid help.","hook":"Saved by a rival.","asks":[{"q":"The Safavid shah sheltered the exiled Mughal ruler and helped him regain his throne. What does this show?","right":"Rivals could also cooperate","wrong":[["The two empires shared one ruler","They had separate rulers."],["The Mughals were Shi'a like the Safavids","The Mughals were Sunni."],["Religion caused all their conflicts","Their cooperation shows the relationship was more complicated."]],"exp":"Rivalry was not constant; the Safavids helped Humayun in 1555."},{"q":"Humayun regaining his throne with Safavid help shows what about Safavid–Mughal relations?","right":"They could cooperate as well as compete","wrong":[["They were always enemies who never helped each other in any way","The Safavids helped Humayun."],["They were one empire","Two empires."],["They were both Christian","No."]],"exp":"Despite rivalry over Kandahar, the Safavids helped Humayun regain the throne in 1555."}]},{"term":"Mughal–Maratha conflict","def":"Hindu fighters of the Deccan, led by Shivaji, used guerrilla tactics against Aurangzeb's armies.","hook":"Hit and run in the Deccan.","asks":[{"q":"How did the Marathas contribute to Mughal decline?","right":"They drained Mughal resources","wrong":[["They converted the emperors to Hinduism","The Mughal emperors stayed Muslim."],["They captured Kandahar","Kandahar was taken by the Safavids."],["They brought British rule in 1526","1526 is when Babur founded the empire."]],"exp":"Guerrilla war in the Deccan was costly and helped weaken the empire."},{"q":"What tactic did the Marathas use against Aurangzeb?","right":"Guerrilla warfare","wrong":[["Naval blockades of the Mughal ports along the coast of the Arabian Sea","Your card says guerrilla tactics."],["Siege towers","Not on your card."],["Trade embargoes","Not on your card."]],"exp":"Shivaji's Marathas used guerrilla tactics."}]}],"intro":["Neighboring empires fought constantly. Ottoman vs. Safavid was the biggest rivalry: land, trade routes and Sunni vs. Shi'a Islam. At Chaldiran in 1514, Ottoman cannons and Janissaries beat Safavid horsemen, and the Ottomans also banned trade with Safavid silk merchants. Safavid vs. Mughal was mainly about the fortress city of Kandahar in Afghanistan and the trade routes around it, even though the Safavids had earlier helped Babur's son Humayun win back his throne. Inside India, Hindu Maratha fighters used hit-and-run attacks against Aurangzeb's armies."]},{"name":"Decline","cards":[{"term":"Battle of Lepanto (1571)","def":"A mostly Spanish and Venetian fleet defeated the Ottoman navy.","hook":"Ottoman sea power checked.","asks":[{"q":"Which event showed that European sea power could defeat the Ottomans?","right":"Lepanto, 1571","wrong":[["Mohács, 1526","Mohács was an Ottoman land victory."],["Chaldiran, 1514","Chaldiran was an Ottoman victory over the Safavids."],["The capture of Rhodes, 1522","The Ottomans won Rhodes."]],"exp":"Lepanto was an Ottoman naval defeat after Suleiman's death."},{"q":"Lepanto is evidence of which change in the 1500s?","right":"European sea power could beat the Ottomans","wrong":[["The Ottomans gaining control of the whole Mediterranean after the battle ended","They lost."],["The Safavids building a navy","They had none."],["Russia reaching the Pacific","Unrelated."]],"exp":"A mostly Spanish and Venetian fleet defeated the Ottoman navy."}]},{"term":"Second siege of Vienna (1683)","def":"A failed Ottoman attack that marked a turning point in their power in Eastern Europe.","hook":"The tide turns.","asks":[{"q":"Your textbook says the Ottomans failed to take Vienna twice. What did the second failure mark?","right":"The start of Ottoman retreat in Europe","wrong":[["The Ottomans' farthest push ever into Central Europe","The 1529 siege was already their farthest push."],["The founding of the first Ottoman navy in the Mediterranean","The navy existed long before."],["The fall of the Safavid capital to Afghan rebels","Isfahan fell in 1722 to Afghan rebels."]],"exp":"1529 was the high-water mark; 1683 was the turning point."},{"q":"Which best describes the significance of 1683?","right":"A turning point toward Ottoman decline in Europe","wrong":[["The high point of Ottoman expansion, when the empire took the city of Vienna","The attack failed."],["The founding of the Ottoman Empire","Much earlier."],["The end of the Safavids","That was 1722."]],"exp":"The failed attack marked a turning point in Ottoman power in Eastern Europe."}]},{"term":"Harem politics","def":"Wives and concubines of the sultan worked to put their own sons on the throne.","hook":"Power behind the curtain.","asks":[{"q":"Which problem made Ottoman successions weaker after Suleiman?","right":"Rival mothers pushing their own sons","wrong":[["A law banning sultans from having sons","No such law existed."],["The end of the devshirme in 1453","The devshirme expanded in the 1400s and 1500s."],["Elections of sultans by Janissaries","Sultans were not elected."]],"exp":"Harem politics made some women powerful behind the scenes and weakened succession."},{"q":"How did harem politics weaken the Ottoman state?","right":"Rival mothers pushed sons, weakening succession","wrong":[["It made the Janissaries convert to Christianity and abandon the sultan","Not on your card."],["It ended the devshirme","Not on your card."],["It strengthened every new sultan","It weakened successions."]],"exp":"Wives and concubines worked to put their own sons on the throne."}]},{"term":"Sick Man of Europe","def":"A later nickname for the declining Ottoman Empire.","hook":"Still alive, but weak.","asks":[{"q":"A cartoonist calls an empire that once besieged Vienna weak and dying. Which empire?","right":"The Ottoman Empire","wrong":[["The Russian Empire under the Romanovs","Russia modernized and stayed strong."],["The Qing Empire of the Manchus","The nickname refers to an empire in Europe."],["The Safavid Empire of Persia","The Safavids never besieged Vienna."]],"exp":"The nickname described the Ottomans' decline."},{"q":"The nickname \"Sick Man of Europe\" describes the Ottomans during which phase?","right":"Their later decline","wrong":[["Their rise under Mehmed II, when they first took the city of Constantinople","That was strength."],["Suleiman's peak","That was strength."],["Osman's founding","Too early."]],"exp":"A later nickname for the declining empire."}]},{"term":"Fall of Isfahan (1722)","def":"Rebellious Sunni Pashtuns from present-day Afghanistan sacked the Safavid capital.","hook":"The capital falls to rebels.","asks":[{"q":"Which event shows the Safavid Empire's collapse after Abbas I?","right":"Pashtun rebels sacking the capital in 1722","wrong":[["Morocco invading Persia across the Sahara in 1591","Morocco invaded Songhai."],["The Mughals capturing Istanbul from the Ottomans","The Mughals never took Istanbul."],["Ismail I founding the empire as a teenager in 1501","That was its beginning, in 1501."]],"exp":"Weak shahs and falling revenue led to the 1722 sack of Isfahan."},{"q":"Who sacked Isfahan in 1722?","right":"Rebellious Sunni Pashtuns","wrong":[["The Ottoman Janissaries, who finally captured the Safavid capital after Chaldiran","Your card says Sunni Pashtuns."],["The Mughals","No."],["The Russians","No."]],"exp":"Sunni Pashtuns from present-day Afghanistan sacked the capital."}]},{"term":"Why Russia survived","def":"The tsars modernized their army on Western European models; the Islamic gunpowder empires did not.","hook":"Adapt or decline.","asks":[{"q":"Your textbook explains why Russia outlasted the three Islamic gunpowder empires. Which reason does it give?","right":"Russia rebuilt its army on Western models","wrong":[["Russia avoided using gunpowder weapons entirely","Russia relied on firearms too."],["Russia had the largest and strongest navy in all of Asia","The textbook's reason is army reform."],["Russia converted to Islam to win over its southern neighbors","Russia remained Orthodox Christian."]],"exp":"Military modernization let Russia survive as an independent state."},{"q":"Which reform best explains why Russia outlasted the Islamic gunpowder empires?","right":"Modernizing its army on Western models","wrong":[["Making Shi'a Islam the state religion to unite the people behind the tsar","Russia was Orthodox Christian."],["Closing its borders to Europe","It borrowed from Europe."],["Ending all expansion","It expanded."]],"exp":"The tsars modernized the army on Western European models."}]}],"intro":["After about 1600 the Islamic gunpowder empires started to slip. The Ottomans lost at sea at Lepanto in 1571 and failed again at Vienna in 1683, the turning point of their decline in Europe. Inside the palace, wives and mothers schemed to put their own sons on the throne, which produced weak rulers. Rebels sacked the Safavid capital, Isfahan, in 1722. Russia, by contrast, kept rising because its tsars copied Western European armies. Key idea: the empires that adapted survived; the ones that didn't declined."]}],"intro":["Big empires next to each other fought, mostly over land, trade routes and religion. This deck covers those wars, then how the Islamic gunpowder empires started to weaken after about 1600 while Russia kept growing."]},{"id":4,"name":"Ruling the Empires (3.2)","optional":false,"sections":[{"name":"Loyal elites","cards":[{"term":"Devshirme","def":"Ottoman practice of taking Christian boys from the Balkans, converting them to Islam and training them as soldiers or officials.","hook":"The blood tax.","asks":[{"q":"Why were officials recruited this way loyal to the sultan alone?","right":"They had no ties to noble families","wrong":[["They were elected by local towns","They were taken by force, not elected."],["They were the sultan's own relatives","They came from Christian peasant families."],["They owned large private estates","Their position depended on the sultan, not on land."]],"exp":"Cut off from their families, they owed everything to the sultan."},{"q":"Why was the devshirme a tool of state building?","right":"It created officials loyal only to the sultan","wrong":[["It gave Balkan noble families more power over the sultan and the provinces","It balanced the nobles."],["It spread Christianity","Boys were converted to Islam."],["It raised taxes","Not its purpose."]],"exp":"Converted boys with no local ties owed everything to the sultan."}]},{"term":"Janissaries","def":"Elite Ottoman infantry with firearms, recruited through the forced levy of Christian boys.","hook":"Slaves of the state, masters of the musket.","asks":[{"q":"Which force was key to Ottoman victories at Constantinople and Chaldiran?","right":"The Janissary corps","wrong":[["The Qizilbash of Persia","The Qizilbash were Safavid warriors."],["The oprichnina of Ivan IV","The oprichnina served Ivan IV in Russia."],["The banners of the Manchus","The banners were Manchu units."]],"exp":"Janissaries were gunpowder infantry loyal to the sultan."},{"q":"What made the Janissaries different from feudal knights?","right":"They were the ruler's own trained infantry","wrong":[["They owned their own lands and could refuse to fight for the sultan if they chose","They depended on the sultan."],["They had no weapons","They had firearms."],["They were Christian","Converted to Islam."]],"exp":"Elite infantry with firearms, recruited through the devshirme."}]},{"term":"Ghulams","def":"Enslaved soldier-administrators of the Safavid shahs, often from Georgian, Armenian or Circassian peoples.","hook":"The Safavid version.","asks":[{"q":"Which institution is the closest Safavid parallel to the Janissaries?","right":"The ghulams","wrong":[["The zamindars","Zamindars were Mughal tax collectors."],["The daimyo","Daimyo were Japanese lords."],["The boyars","Boyars were Russian nobles."]],"exp":"Both were elites recruited from minorities and tied directly to the ruler."},{"q":"Why did the Safavids recruit ghulams from Georgian, Armenian and Circassian peoples?","right":"To get soldiers loyal only to the shah","wrong":[["To spread the Armenian church throughout Persia and Afghanistan","Not on your card."],["Because Persians refused to fight","Not on your card."],["To trade silk","Not their role."]],"exp":"Enslaved outsiders served the shah, like the Janissaries served the sultan."}]},{"term":"Qizilbash","def":"Turkic militants who helped establish the Safavid Empire.","hook":"The founding warriors.","asks":[{"q":"Why did Shah Abbas build a slave army instead of relying only on the warriors who founded the empire?","right":"The founders were loyal to their clans","wrong":[["The founders refused to fight on horseback","The point is loyalty, not horses."],["The founding warriors were Christian converts","The Qizilbash were Muslim."],["The founding warriors lived far away in India","They were in Persia."]],"exp":"Slave soldiers offset troops loyal to tribes or local leaders."},{"q":"What role did the Qizilbash play in the Safavid state?","right":"They helped found it","wrong":[["They were the enslaved soldiers that Abbas I created to replace the founders","Those were ghulams."],["They ran the bureaucracy","That was the men of the pen."],["They were Ottoman","They were Safavid."]],"exp":"Turkic militants who helped establish the Safavid Empire."}]},{"term":"Men of the pen","def":"Safavid bureaucrats recruited from the Persian population.","hook":"Persian scribes for a Turkic court.","asks":[{"q":"Where did the Safavid shahs find their civilian officials?","right":"Among their Persian subjects","wrong":[["Among Christian boys from the Balkans","That was the Ottoman devshirme."],["Through a Confucian exam","That was the Chinese system."],["From the samurai class","Samurai were Japanese."]],"exp":"The Safavids drew on educated Persians for their bureaucracy."},{"q":"How did the Safavids divide their elites?","right":"Ghulam soldiers and Persian bureaucrats","wrong":[["Christian bishops and Jewish merchants, who shared power in every province","Not on your cards."],["Only Qizilbash","Abbas added ghulams."],["Only Persian nobles","Not on your cards."]],"exp":"Ghulams served as soldier-administrators; men of the pen were Persian bureaucrats."}]},{"term":"Civil service exam (Qing)","def":"Confucian tests used to choose government officials; the Manchus kept them.","hook":"The test of Chinese-ness.","asks":[{"q":"Why did the Manchu rulers keep China's traditional test for officials?","right":"To look legitimate to Han Chinese","wrong":[["To give Manchus every top government job","The exam was open to Han scholars."],["Because the Yuan dynasty had relied on it heavily","The Yuan sidelined the exam."],["To train Janissaries for the imperial army","Janissaries were Ottoman."]],"exp":"Keeping the exam made the Qing look like proper Chinese rulers."},{"q":"Keeping the civil service exam helped the Qing by","right":"showing they upheld Chinese tradition","wrong":[["replacing Chinese officials with Manchu ones in every office of the empire","The exams brought in Han scholars."],["ending Confucianism","The exams were Confucian."],["raising an army","Not the exam's purpose."]],"exp":"Confucian tests chose officials; keeping them won acceptance."}]},{"term":"Manchu–Han shared posts","def":"The Qing divided government offices between the conquerors and Han officials to win acceptance.","hook":"Two names on every office door.","asks":[{"q":"How did the Qing reduce resistance from their Han Chinese majority?","right":"By sharing offices with Han officials","wrong":[["By banning Han Chinese from the government","The Qing included Han officials."],["By ending Confucian rituals at the imperial court","The Qing adopted Confucian rituals."],["By moving the capital from Beijing back to Manchuria","The capital stayed in Beijing."]],"exp":"Sharing posts was a legitimacy strategy."},{"q":"Shared Manchu–Han posts are most similar to which policy?","right":"Akbar giving Hindus government posts","wrong":[["Aurangzeb restoring the jizya on non-Muslims across his empire","That pushed people away."],["The Tokugawa ban on Christianity","Not about sharing offices."],["The devshirme","That used outsiders."]],"exp":"Both rulers shared power with the majority to win acceptance."}]},{"term":"Oprichnina","def":"Ivan IV's black-clad paramilitary force, drawn from lower officials and merchants, used to control the nobles.","hook":"Ivan's riders in black.","asks":[{"q":"Ivan IV recruited a loyal force from outside the noble class. Which Ottoman system had a similar goal?","right":"The devshirme","wrong":[["Tax farming","Tax farming raised money; it was not a loyal force."],["The millet system","Millets let religious groups govern themselves."],["The jizya","The jizya was a tax on non-Muslims."]],"exp":"Both created servants loyal only to the ruler, not to nobles."},{"q":"What was the oprichnina's main target?","right":"The boyars (nobles)","wrong":[["The Golden Horde's heirs in Kazan and Astrakhan, whom Ivan wanted to conquer","It controlled nobles at home."],["Foreign merchants","Not on your card."],["The Orthodox Church","Not on your card."]],"exp":"Ivan IV used it to control the nobles."}]},{"term":"Boyars","def":"Russia's noble landowning class.","hook":"Russia's nobles.","asks":[{"q":"Ivan IV forced opponents to move to Moscow and Peter the Great required them to serve in his government. Which group?","right":"The boyars","wrong":[["The Cossacks","Cossacks were frontier warriors."],["The serfs","Serfs were peasants bound to the land."],["The Streltsy","The Streltsy were a military corps."]],"exp":"Russian rulers kept the boyars close to control them, like Louis XIV at Versailles."},{"q":"Which shows the tsars limiting the boyars' power?","right":"The Table of Ranks promoting by service","wrong":[["Ivan IV taking Kazan and Astrakhan from the heirs of the Golden Horde","That's expansion."],["Cossacks crossing Siberia","Expansion."],["Control of the Volga","Trade."]],"exp":"The Table of Ranks weakened the hold of birth."}]},{"term":"Table of Ranks","def":"Peter the Great's system for promoting officials by service rather than birth.","hook":"Earn your rank.","asks":[{"q":"Which reform weakened the hold of birth on Russian government jobs?","right":"Peter's Table of Ranks","wrong":[["Ivan IV's black-clad oprichnina","The oprichnina was a loyal force, not a promotion system."],["The new head tax on peasants in 1718","The head tax raised money from peasants."],["Peter's creation of the Holy Synod for the Church","The Synod controlled the Church."]],"exp":"Promotion by service, not birth."},{"q":"The Table of Ranks is most similar in purpose to which Qing practice?","right":"The civil service exam","wrong":[["The banner system, which organized Manchu warriors into military units","That's military."],["The queue","A hairstyle law."],["Tribute","Revenue."]],"exp":"Both chose officials by merit or service, not birth."}]},{"term":"Intendants","def":"French royal officials sent to the provinces to carry out the central government's orders and oversee tax collection.","hook":"The king's eyes in the provinces.","asks":[{"q":"Which officials let French kings control the provinces directly?","right":"Intendants","wrong":[["Justices of the peace","Those were English officials chosen from the gentry."],["Zamindars","Zamindars served the Mughals."],["Daimyo","Daimyo were Japanese lords."]],"exp":"Richelieu and Louis XIII expanded the intendant system."},{"q":"Intendants and justices of the peace both show what?","right":"Monarchs extending control into the provinces","wrong":[["Monarchs giving up power to local nobles who ruled without any royal oversight","Both carried out the monarch's orders."],["Religious reform","Not religious."],["Overseas trade","Not trade."]],"exp":"Intendants (France) and JPs (England) enforced royal orders locally."}]},{"term":"Justices of the peace","def":"English officials chosen from the landed gentry under the Tudors to keep order in the counties and enforce the monarch's laws.","hook":"Local gentry, royal law.","asks":[{"q":"How did Tudor monarchs govern the English counties?","right":"Through gentry officials who enforced royal law","wrong":[["Through Janissaries sent out from the royal court","Janissaries were Ottoman."],["Through officials chosen by a Confucian exam","That was China."],["Through tax farmers who bid for each English county","That was the Ottoman Empire."]],"exp":"Justices of the peace grew in number and power under the Tudors."},{"q":"How did justices of the peace differ from French intendants?","right":"JPs were local gentry; intendants were sent royal officials","wrong":[["JPs were sent from Paris by the king; intendants were chosen from the local gentry","Reversed."],["JPs were Ottoman","English."],["They were the same office","Different countries and methods."]],"exp":"Tudor JPs came from the landed gentry; intendants were royal officials sent out."}]}],"intro":["Every ruler had the same problem: nobles and local leaders with their own armies could rebel. The fix was officials who owed everything to the ruler. The Ottomans took Christian boys from the Balkans (devshirme) and trained them as Janissary soldiers and officials. The Safavids did the same with enslaved ghulams, to balance the Qizilbash warriors who had founded their state. The Qing kept China's civil service exams and split offices between Manchus and Han Chinese. Russia's Ivan IV used a black-clad force against the nobles, and Peter the Great promoted officials by service, not birth. In Europe, France's kings sent intendants to the provinces and England's monarchs relied on local justices of the peace."]},{"name":"Japan","cards":[{"term":"Daimyo","def":"Regional landholding lords in Japan, each with his own army of samurai.","hook":"Japan's great lords.","asks":[{"q":"Before 1603, why was Japan hard to rule from the center?","right":"Regional lords had their own armies","wrong":[["Japan had no warrior class at all","Japan had samurai."],["The shogun had banned all firearms in Japan","Firearms helped unify Japan."],["Japan was ruled directly by the Qing emperors","Japan was independent."]],"exp":"Powerful daimyo made Japan feudal and divided."},{"q":"Why did daimyo threaten central rule in Japan?","right":"Each had his own samurai army","wrong":[["Each had a navy that could blockade the capital at Edo whenever it chose","Your card says armies of samurai."],["They were foreign","They were Japanese lords."],["They were monks","They were landholding lords."]],"exp":"Regional lords with their own armies made Japan hard to rule."}]},{"term":"Oda Nobunaga","def":"A Japanese lord who used muskets bought from the Portuguese to take Kyoto in 1568 and unify about a third of Japan.","hook":"Muskets unite Japan.","asks":[{"q":"How did gunpowder affect Japan in the late 1500s?","right":"It helped lords unify the country","wrong":[["It caused Japan to split into khanates","Khanates are Mongol."],["It was banned by the Portuguese","The Portuguese sold the muskets."],["It let the Ming conquer Japan","The Ming did not conquer Japan."]],"exp":"Like the gunpowder empires, Japan was unified with firearms."},{"q":"Where did Nobunaga get the muskets that helped him take Kyoto?","right":"From the Portuguese","wrong":[["From the Ottoman Janissaries, who traded their weapons across the Indian Ocean","Your card says the Portuguese."],["From China","Not on your card."],["He invented them","No."]],"exp":"Nobunaga used muskets bought from the Portuguese."}]},{"term":"Toyotomi Hideyoshi","def":"Continued Nobunaga's work until most of Japan was under his control; died in 1598.","hook":"The second unifier.","asks":[{"q":"Who completed most of Japan's unification after 1582?","right":"Toyotomi Hideyoshi","wrong":[["Tokugawa Ieyasu","Ieyasu came after Hideyoshi's death in 1598."],["Kangxi, the Qing emperor","Kangxi was a Qing emperor."],["Ivan IV of Russia","Ivan IV ruled Russia."]],"exp":"Nobunaga, Hideyoshi, then Tokugawa."},{"q":"Put Japan's unifiers in order.","right":"Nobunaga, Hideyoshi, Tokugawa Ieyasu","wrong":[["Tokugawa Ieyasu, Nobunaga and then Hideyoshi, who finished the work in 1603","Ieyasu came last."],["Hideyoshi, Nobunaga, Ieyasu","Nobunaga came first."],["Nobunaga, Ieyasu, Hideyoshi","Hideyoshi came second."]],"exp":"Nobunaga began, Hideyoshi continued, Ieyasu became shogun in 1603."}]},{"term":"Tokugawa Ieyasu","def":"Declared shogun in 1603 and ruled from Edo (Tokyo); his family ruled until the mid-1800s.","hook":"Edo begins.","asks":[{"q":"Who founded the shogunate that brought Japan its Period of Great Peace?","right":"Tokugawa Ieyasu","wrong":[["Oda Nobunaga","Nobunaga was assassinated in 1582."],["Toyotomi Hideyoshi","Hideyoshi died in 1598."],["Askia the Great","Askia ruled Songhai."]],"exp":"Ieyasu became shogun in 1603."},{"q":"From which city did the Tokugawa rule?","right":"Edo (Tokyo)","wrong":[["Kyoto, the city that Nobunaga took in 1568 using muskets from the Portuguese","Nobunaga took Kyoto; the Tokugawa ruled from Edo."],["Beijing","China."],["Isfahan","Persia."]],"exp":"Ieyasu ruled from Edo."}]},{"term":"Alternate attendance","def":"Tokugawa rule that lords keep homes in both the capital and their own lands; their families stayed in the capital when the lords were away.","hook":"Families as hostages.","asks":[{"q":"Which policy is the closest Japanese parallel to Louis XIV keeping nobles at Versailles?","right":"Making lords live part-time in Edo","wrong":[["Turning samurai into salaried officials","That changed warriors into officials, not where lords lived."],["Banning Christianity throughout Japan","That was about religion."],["Limiting trade with foreign merchants to one port","That was about foreigners."]],"exp":"Both kept powerful nobles where the ruler could watch them."},{"q":"How did alternate attendance keep the daimyo from rebelling?","right":"Their families stayed in the capital","wrong":[["It required them to give up their samurai and become merchants in Edo","Not on your card."],["It banned them from the capital","They had to live there part-time."],["It made them convert","Not on your card."]],"exp":"Homes in both places, with families in the capital when lords were away."}]},{"term":"Salaried samurai","def":"Warriors turned into paid officials who ran local government under the Tokugawa.","hook":"Swords to salaries.","asks":[{"q":"Paying warriors a salary helped the shogun mainly by","right":"making warriors depend on the government","wrong":[["ending the use of rice as payment in Japan","They were paid first in rice."],["giving warriors more land to rule as they wished","A salary replaced dependence on land."],["letting warriors build private armies of their own","It did the opposite."]],"exp":"Paid officials owed their income to the shogunate, not to feudal lords."},{"q":"Turning samurai into salaried officials mainly changed","right":"warriors into administrators","wrong":[["peasants into samurai who could own their own land and armies for the first time","The reverse direction."],["officials into merchants","No."],["samurai into daimyo","No."]],"exp":"Paid warriors ran local government under the Tokugawa."}]},{"term":"Tokugawa isolation","def":"The shogunate sharply limited contact with foreigners and banned Christianity.","hook":"Doors mostly closed.","asks":[{"q":"Why might the Tokugawa have banned Christianity?","right":"To remove a rival source of loyalty","wrong":[["Because the Jesuits never reached Japan","Jesuits did reach Japan in 1549."],["Because Japan was a Muslim state","Japan was not Muslim."],["Because the Qing ordered it","Japan was independent of the Qing."]],"exp":"Limiting foreign influence protected the shogun's control."},{"q":"Tokugawa isolation is best understood as a way to","right":"protect the shogun's control from outside influence","wrong":[["open Japan to trade with every European country that wanted to send ships","It limited contact."],["spread Christianity","It was banned."],["conquer China","Not on your card."]],"exp":"Limiting foreigners and banning Christianity protected the shogun's control."}]}],"intro":["Japan in the 1500s was split among daimyo, regional lords with private samurai armies. Three leaders unified it. Oda Nobunaga used muskets bought from the Portuguese to take Kyoto in 1568; Toyotomi Hideyoshi brought most of Japan under his control; and Tokugawa Ieyasu became shogun in 1603 and ruled from Edo (Tokyo). The Tokugawa kept the lords in line with alternate attendance: each lord had to live part of the time in the capital, and his family stayed there as hostages. Samurai became salaried officials, and Japan sharply limited contact with foreigners."]},{"name":"Legitimacy","cards":[{"term":"Divine right of kings","def":"The claim that a monarch's power comes directly from God, so challenging the ruler is challenging God.","hook":"Crowned by God.","asks":[{"q":"James I said kings 'sit upon God's throne.' Which idea is he using?","right":"Divine right","wrong":[["Mandate of Heaven","The Mandate is Chinese and can be lost through bad rule."],["Separation of church and state","James joins church and state."],["Rule by Parliament","He claims to be above any earthly authority."]],"exp":"European monarchs justified absolute power with divine right."},{"q":"Why did divine right make rebellion harder to justify?","right":"Challenging the king meant challenging God","wrong":[["It let Parliament remove any king who broke the law of the land","That's the English Bill of Rights idea."],["It made kings elected","Kings were not elected."],["It required the pope's approval","Not on your card."]],"exp":"The monarch's power came directly from God."}]},{"term":"Absolutism","def":"A system in which the monarch holds complete authority, with no body able to check him.","hook":"One man, all power.","asks":[{"q":"France in the 1600s and England after 1689 developed in opposite directions. Which describes France?","right":"Total power in the king","wrong":[["Parliament approving all taxes","That describes England after 1689."],["Rule by elected officials","France had no elected rulers."],["Power shared with the Pope","The French king did not share power with the Pope."]],"exp":"France became the model of absolutism under Louis XIV."},{"q":"Which development is the opposite of absolutism?","right":"England's Bill of Rights","wrong":[["Louis XIV saying 'I am the state' and keeping nobles at Versailles","That's absolutism."],["Peter the Great's head tax","A tsar's own decree."],["The Tokugawa alternate attendance","Central control."]],"exp":"The Bill of Rights required Parliament's consent; absolutism has no check."}]},{"term":"Louis XIV","def":"The Sun King of France (r. 1643–1715), the classic absolute monarch, who said, 'I am the state.'","hook":"L'état, c'est moi.","asks":[{"q":"Which ruler kept his nobles at court so they could not plot in the provinces?","right":"Louis XIV","wrong":[["Henry VIII","Henry VIII broke with the Pope in England."],["Ivan IV","Ivan moved boyars to Moscow, but he was not the Sun King."],["Akbar","Akbar ruled Mughal India."]],"exp":"Louis XIV kept nobles at Versailles."},{"q":"\"I am the state\" best expresses which idea?","right":"Absolutism","wrong":[["Constitutional monarchy, in which a parliament shares power with the ruler","That's England after 1689."],["The Mandate of Heaven","That's China."],["Sola fide","That's Luther."]],"exp":"Louis XIV is the classic absolute monarch."}]},{"term":"Versailles","def":"Louis XIV's palace, built to glorify him and to keep nobles where he could watch them.","hook":"Golden cage for nobles.","asks":[{"q":"The Palace of Versailles served which two purposes?","right":"Display power and control nobles","wrong":[["Train Janissaries and store gunpowder","That would be Ottoman."],["House the Pope and the Inquisition","Versailles was a royal palace."],["Collect tribute and hold exams","Those are Mexica and Chinese practices."]],"exp":"Monumental architecture plus control of the nobility."},{"q":"Versailles and the Tokugawa alternate attendance shared which goal?","right":"Keeping nobles where the ruler could watch them","wrong":[["Building trade with Europe by inviting foreign merchants to live at court","Not the goal."],["Spreading Christianity","No."],["Raising taxes on peasants","Not the goal."]],"exp":"Both kept nobles close so they couldn't plot."}]},{"term":"Caliph claim","def":"Ottoman sultans called themselves successors to the Prophet as leaders of the Muslim community.","hook":"Heir to the Prophet.","asks":[{"q":"Which Ottoman claim most resembles European divine right?","right":"Claiming to be caliph","wrong":[["Collecting the jizya","That is a tax, not a claim to authority."],["Using tax farming","That is a revenue method."],["Recruiting through devshirme","That is a recruitment method."]],"exp":"Both link the ruler's authority to religion."},{"q":"Calling himself caliph helped the Ottoman sultan by","right":"presenting him as leader of all Muslims","wrong":[["making him the head of the Orthodox Church in the former Byzantine lands","The caliph leads the Muslim community."],["letting him ignore religion","It used religion."],["allying him with the Safavids","They were rivals."]],"exp":"Successor to the Prophet as leader of the Muslim community."}]},{"term":"Mandate of Heaven","def":"The Chinese belief that the divine order grants the right to rule; disasters and revolts meant a dynasty had lost it.","hook":"Heaven's approval, revocable.","asks":[{"q":"How does the Mandate of Heaven differ from divine right?","right":"It can be lost by ruling badly","wrong":[["It came from a single creator god","Divine right comes from the Christian God; the Mandate comes from heaven."],["It was only used by European kings","The Mandate is Chinese."],["It rejected religious ideas entirely","Both are religious justifications."]],"exp":"Bad rule, disaster or revolt showed the Mandate was lost."},{"q":"A dynasty suffers floods and revolts. Under the Mandate of Heaven, what might people conclude?","right":"It has lost the right to rule","wrong":[["Its right to rule is proven, since disasters show the gods are paying attention","Disasters meant losing the Mandate."],["It must convert to Islam","No."],["Its ruler is the caliph","No."]],"exp":"Disasters and revolts meant a dynasty had lost the Mandate."}]},{"term":"Qing imperial portraits","def":"Official paintings showing the emperor's Confucian virtue.","hook":"Virtue on canvas.","asks":[{"q":"Why did Qing emperors commission official portraits showing Confucian virtue?","right":"To show they deserved the Mandate","wrong":[["To advertise Christianity to their subjects","The portraits showed Confucian virtue."],["To record the tax rates of each province","Portraits are art, not records."],["To honor the Mughal emperor as their overlord","They honored the Qing emperor."]],"exp":"Art projected legitimacy."},{"q":"Qing portraits showing Confucian virtue are best used as evidence of","right":"outsiders seeking legitimacy in Chinese terms","wrong":[["the Qing rejection of Chinese culture in favor of their own Manchu customs","The portraits adopt Chinese ideals."],["Christian influence","No."],["Mughal art","No."]],"exp":"As Manchus ruling Han Chinese, the Qing used Confucian images to claim legitimacy."}]},{"term":"Human sacrifice","def":"Mexica rulers used ritual killing of captives to show they could please the gods and keep cosmic balance.","hook":"Blood for the sun.","asks":[{"q":"How did Mexica rulers use religious ritual to support their authority?","right":"Sacrifice showed they had divine favor","wrong":[["They banned all temples in Tenochtitlan","They built temples such as the Templo Mayor."],["They adopted Christianity to win divine favor","That came after the Spanish conquest."],["They held Confucian exams to choose priests","That was China."]],"exp":"Rulers appeared as mediators between gods and people."},{"q":"Mexica human sacrifice and the Inca sun temples both show rulers","right":"using religion to support their power","wrong":[["using trade to pay for armies that could conquer neighboring peoples","Both are religious legitimacy."],["rejecting religion","Both used it."],["copying Europe","No."]],"exp":"Both tied the ruler's authority to the gods."}]},{"term":"Coricancha","def":"The Inca Temple of the Sun in Cusco, once covered in gold, honoring the sun god Inti.","hook":"Gold walls for the sun.","asks":[{"q":"How did sun temples support the Sapa Inca's rule?","right":"They showed him as child of the sun","wrong":[["They stored the empire's gunpowder","The Inca did not use gunpowder."],["They housed the civil service exam","That was China."],["They served as a Christian cathedral","They honored Inti."]],"exp":"Religion and architecture reinforced the Sapa Inca's divine status."},{"q":"The gold-covered Coricancha honoring Inti supported the Sapa Inca's rule by","right":"linking him to the sun god","wrong":[["showing he had defeated the Mexica in battle and taken their gold","Not on your card."],["holding the tribute lists","That's the Codex Mendoza (Mexica)."],["training officials","Not its role."]],"exp":"The Temple of the Sun honored Inti, tying the ruler to the sun god."}]},{"term":"Taj Mahal","def":"Mausoleum Shah Jahan built for his wife in Agra.","hook":"Love and power in marble.","asks":[{"q":"Which structure is an example of Mughal monumental architecture used to show wealth and authority?","right":"The tomb Shah Jahan built in Agra","wrong":[["The Suleymaniye Mosque in Istanbul","That is Ottoman, in Istanbul."],["The Winter Palace in St. Petersburg","That is Russian, in St. Petersburg."],["The Coricancha, the temple in Cusco","That is Inca, in Cusco."]],"exp":"Shah Jahan's tomb showed Mughal grandeur."},{"q":"Who built the Taj Mahal, and for whom?","right":"Shah Jahan, for his wife","wrong":[["Akbar, as a temple that blended Islam and Hinduism into one new faith","Shah Jahan built it as a mausoleum."],["Aurangzeb, for himself","No."],["Babur, for Timur","No."]],"exp":"Shah Jahan built it for his wife in Agra."}]},{"term":"Topkapi Palace","def":"The royal residence of the Ottoman sultans in Istanbul, begun by Mehmed II.","hook":"The sultans' home.","asks":[{"q":"Which building was the home of the Ottoman sultans?","right":"Topkapi Palace","wrong":[["Versailles","Versailles was French."],["The Red Fort","The Red Fort was Mughal."],["The Forbidden City","The Forbidden City was Chinese."]],"exp":"Topkapi was begun by Mehmed II."},{"q":"Which pair are both Ottoman buildings in Istanbul?","right":"Topkapi Palace and the Suleymaniye Mosque","wrong":[["The Taj Mahal and the Coricancha, which both show off a ruler's great wealth","Mughal and Inca."],["Versailles and St. Petersburg","French and Russian."],["Isfahan and Agra","Safavid and Mughal cities."]],"exp":"Topkapi (begun by Mehmed II) and the Suleymaniye (Suleiman)."}]},{"term":"Suleymaniye Mosque","def":"The great house of worship Suleiman I ordered built in Istanbul.","hook":"Suleiman's mosque.","asks":[{"q":"Which structure shows an Ottoman sultan using religious architecture to display power?","right":"The mosque Suleiman built in Istanbul","wrong":[["The Taj Mahal, the tomb in Agra","That is a Mughal tomb."],["The Coricancha, the temple in Cusco","That is an Inca temple."],["The Mosque of Isfahan, built by the shahs","That is Safavid."]],"exp":"Suleiman built mosques, forts and other great buildings."},{"q":"Building the Suleymaniye Mosque is most similar to which act?","right":"Mehmed II turning Hagia Sophia into a mosque","wrong":[["Peter the Great building St. Petersburg in a European grid on the Baltic coast","That shows westernizing, not Islamic legitimacy."],["Akbar's land grants to Sikhs","Tolerance."],["The Codex Mendoza","A record."]],"exp":"Both used Islamic religious buildings to display the sultan's power."}]},{"term":"St. Petersburg","def":"Peter the Great's new capital on the Baltic, laid out in a grid and built in a European style.","hook":"Russia's window on Europe.","asks":[{"q":"Peter the Great built his new capital in a European style. What did this show?","right":"His admiration for Western Europe","wrong":[["His loyalty to Byzantine traditions","He chose European over Byzantine style."],["His conversion to Islam","Peter was Orthodox."],["His defeat by Sweden","He won Baltic lands from Sweden."]],"exp":"The capital was a statement of westernization and power."},{"q":"What message did St. Petersburg send about Peter's goals?","right":"Russia would look to Western Europe","wrong":[["Russia would cut itself off from Europe and turn toward Asia instead","It was built in a European style on the Baltic."],["Russia would become Muslim","No."],["Russia would end expansion","No."]],"exp":"A European-style capital on the Baltic showed westernization."}]},{"term":"Askia the Great","def":"Songhai ruler from 1493 who made Islam the official religion, went on pilgrimage to Mecca and built an efficient bureaucracy.","hook":"Islam unites Songhai.","asks":[{"q":"How did this Songhai ruler legitimize his power?","right":"By promoting Islam as the state faith","wrong":[["By claiming the Mandate of Heaven like Chinese emperors","That is Chinese."],["By building a palace like Versailles","That is French."],["By converting to Christianity to win European allies","He promoted Islam."]],"exp":"Askia used Islam, like Mansa Musa of Mali before him."},{"q":"Askia the Great's methods are most similar to those of which ruler?","right":"An Ottoman sultan claiming to be caliph","wrong":[["Louis XIV, who kept his nobles at Versailles so they could not plot against him","Not religious legitimacy."],["Peter the Great","Westernizer."],["Tokugawa Ieyasu","Not Islamic legitimacy."]],"exp":"Both used Islam to legitimize rule."}]}],"intro":["Legitimacy means people accept that the ruler has the right to rule. Rulers earned it in two main ways. The first is religion: European kings claimed divine right (power from God), Ottoman sultans called themselves caliphs, Chinese emperors held the Mandate of Heaven, and Mexica rulers performed human sacrifice to keep the gods pleased. The second is monuments that showed off power: Versailles, the Taj Mahal, Topkapi Palace, the Suleymaniye Mosque, Peter the Great's St. Petersburg and the Inca Temple of the Sun. Louis XIV of France is the model absolute ruler: \"I am the state.\""]},{"name":"Revenue","cards":[{"term":"Tax farming","def":"The state sold the right to collect taxes in a region to private collectors, who paid a fixed sum and kept the surplus.","hook":"Pay first, collect later.","asks":[{"q":"Why did the Ottomans let private collectors gather taxes?","right":"It raised money with less bureaucracy","wrong":[["It guaranteed honest and fair collectors","Your textbook says many grew corrupt."],["It ended taxes on peasants in the villages","Peasants still paid."],["It was required by Christian law in the Balkans","The Ottomans were a Muslim state."]],"exp":"Cheap for the state, but it invited corruption."},{"q":"What was a risk of tax farming for peasants?","right":"Collectors could take extra to keep the surplus","wrong":[["The state set very low taxes, so collectors lost money every single year","Collectors kept the surplus."],["Peasants paid no tax","They paid."],["Taxes went to the Church","To private collectors."]],"exp":"Collectors paid a fixed sum and kept whatever more they collected."}]},{"term":"Zamindars","def":"Mughal officials, often local landholders, who collected land taxes from peasants and kept a share.","hook":"The Mughal tax collectors.","asks":[{"q":"Why did the Mughal system give tax collectors a share of what they collected?","right":"To give them a reason to collect well","wrong":[["To fund the Janissaries of the Ottoman army","Janissaries were Ottoman."],["To pay tribute to the Safavid shahs in Persia","The Mughals did not pay the Safavids."],["To support the Confucian exam system","That was China."]],"exp":"A share made collection efficient, but later collectors kept more and built private armies."},{"q":"Zamindars and Ottoman tax farmers had what in common?","right":"Both collected taxes and kept a share","wrong":[["Both were enslaved soldiers who served only the emperor and had no land","Those are slave soldiers."],["Both were Christian","No."],["Both were European","No."]],"exp":"Both systems let collectors keep part of what they gathered."}]},{"term":"Tribute","def":"Goods or services that conquered or weaker states had to send to an empire as a sign of submission.","hook":"Pay to show respect.","asks":[{"q":"Korea sent regular gifts to the Chinese court as a sign of respect. What system is this?","right":"A tribute system","wrong":[["Tax farming","Tax farming is internal tax collection."],["Armed trade","Armed trade is trade backed by force."],["Alternate attendance","That is a Japanese control policy."]],"exp":"Tribute showed submission to a stronger power."},{"q":"Which is an example of a tribute system?","right":"Provinces sending goods to Tenochtitlan","wrong":[["Peter the Great taxing each person in Russia after replacing the land tax in 1718","That's a head tax."],["Tax farming","Private collection."],["Single Whip","A tax reform."]],"exp":"Tribute is goods sent by weaker states as a sign of submission."}]},{"term":"Codex Mendoza","def":"A record made around 1541 that copied Mexica tribute lists of goods owed by 38 provinces to Tenochtitlan.","hook":"The tribute ledger.","asks":[{"q":"A historian studying how the Mexica funded their state would find which source most useful?","right":"A copied list of provincial tribute","wrong":[["Luther's Ninety-Five Theses from 1517","That is about the Catholic Church."],["A Qing imperial portrait of the emperor","That shows legitimacy, not revenue."],["The Edict of Nantes granting toleration","That is about French religious toleration."]],"exp":"It lists textiles, feathers and stones owed to Tenochtitlan."},{"q":"Why is the Codex Mendoza useful evidence?","right":"It lists what 38 provinces owed the Mexica","wrong":[["It records the Inca decimal system of provinces run by loyal nobles","That's the Inca."],["It was written by Moctezuma","Made around 1541, copying lists."],["It describes Ottoman taxes","Mexica."]],"exp":"It copied Mexica tribute lists of 38 provinces."}]},{"term":"Single Whip reform","def":"A Ming change around 1580 that combined land taxes and labor duties into one payment in silver.","hook":"One payment, in silver.","asks":[{"q":"Combining land taxes and labor duties into a single payment in silver mainly","right":"linked China's economy to global trade","wrong":[["ended Chinese demand for silver from abroad","It increased demand for silver."],["replaced the civil service exam with a tax test","It was a tax reform."],["created the banner system of the Manchus","Banners were Manchu."]],"exp":"Demand for silver drew metal from Japan and the Americas."},{"q":"How did the Single Whip reform connect China to the wider world?","right":"Silver payments drew silver from abroad","wrong":[["It banned foreign trade, so China grew its own silver and stopped buying it","China drew silver from abroad."],["It created the Mandate of Heaven","Much older idea."],["It ended taxes","It combined them."]],"exp":"Paying in silver created huge demand for Japanese and American silver."}]},{"term":"Ming demand for silver","def":"China's need for the metal to pay taxes drew huge amounts from Japan and the Americas, especially the mines of Potosí.","hook":"China's silver magnet.","asks":[{"q":"Why did silver mined in South America end up in China?","right":"Chinese taxes had to be paid in silver","wrong":[["China had no money economy before 1500","China had long used money."],["The Mughals forced China to trade for it","The Mughals did not control the silver trade."],["Silver had been banned from use in Europe","There was no such ban."]],"exp":"This connects Unit 3 to Unit 4's global trade."},{"q":"Which link best explains silver flowing from Potosí to China?","right":"Chinese taxes were paid in silver","wrong":[["Chinese merchants owned the mines at Potosí and shipped silver home themselves","Not on your card."],["Silver was worthless in America","Not the reason."],["Europe banned silver","No."]],"exp":"China's need for silver to pay taxes drew it from Japan and the Americas."}]},{"term":"Head tax (Russia, 1718)","def":"Peter the Great replaced the land tax with a tax on each person, burdening peasants further.","hook":"Count heads, not acres.","asks":[{"q":"What was one effect of Peter's 1718 tax change?","right":"Peasants became more oppressed","wrong":[["Serfdom ended","Serfdom continued and worsened."],["The nobles paid most taxes","Peasants bore the burden."],["Russia stopped funding its army","The taxes paid for his military."]],"exp":"Taxing every person squeezed the peasants."},{"q":"Who was most burdened by Peter's head tax?","right":"Peasants","wrong":[["The boyars, who had to pay a large share for every servant they kept","Your card says peasants."],["Foreign merchants","Not on your card."],["The clergy","Not on your card."]],"exp":"The head tax burdened peasants further."}]},{"term":"Serfdom","def":"Peasants bound to a noble's land in return for a plot and protection, with little personal freedom.","hook":"Tied to the soil.","asks":[{"q":"In Russia, when land changed hands, what happened to the peasants on it?","right":"Control over them passed with the land","wrong":[["They became free farmers who owned the land","Serfs were bound, not freed."],["They were drafted into Ivan IV's oprichnina","The oprichnina came from officials and merchants."],["They were all moved to build St. Petersburg","Some were forced to build it, but control passed with the land."]],"exp":"Serfs were bound to the land and to its owner."},{"q":"How did serfdom fit Peter the Great's reforms?","right":"It continued while he westernized","wrong":[["Peter ended serfdom completely so that peasants could work in the new factories","Serfdom continued; his tax burdened peasants."],["Serfdom was a Western invention he copied","Not on your card."],["Serfdom ended in 1547","No."]],"exp":"Westernization didn't free the peasants; the head tax burdened them more."}]}],"intro":["Empires need money for armies and palaces. Each one had its own way of getting it. The Ottomans sold the right to collect taxes to tax farmers, who paid up front and kept the extra. The Mughals used zamindars, local tax collectors who kept a share. The Mexica (Aztecs) demanded tribute from conquered peoples, and the Codex Mendoza lists it. Ming China made everyone pay taxes in silver, which pulled in silver from Japan and the Americas. Peter the Great taxed each person, which made life harder for Russia's serfs."]},{"name":"England and Russia","cards":[{"term":"English Bill of Rights (1689)","def":"Required Parliament's agreement for taxes and an army and guaranteed legal process before arrest.","hook":"Limits on the crown.","asks":[{"q":"How did England's government in 1689 differ from absolutism in France?","right":"Parliament checked the monarch","wrong":[["The king ruled by divine right alone","That describes France."],["The king abolished Parliament","Parliament grew stronger."],["The Pope approved English taxes","England had broken with the Pope."]],"exp":"England moved toward limited monarchy while France became absolute."},{"q":"Which power did the Bill of Rights take from the English monarch alone?","right":"Raising taxes or an army","wrong":[["Choosing the official religion of England, which now belonged to the pope","Not on your card."],["Being crowned","No."],["Naming officials","Not on your card."]],"exp":"Parliament's agreement was required for taxes and an army."}]},{"term":"Peter the Great","def":"Russian tsar (r. 1682–1725) who westernized Russia, modernized the army and moved the capital to a new city on the Baltic.","hook":"Westernizer.","asks":[{"q":"Which ruler is the best example of a land-based ruler copying Western Europe to strengthen his state?","right":"Peter the Great","wrong":[["Aurangzeb","Aurangzeb enforced strict Sunni rule, not western models."],["Shah Abbas I","Abbas imported European weapons, but did not westernize his state."],["Kangxi of the Qing","Kangxi kept Confucian traditions."]],"exp":"Peter modernized the army, built St. Petersburg and paid officials salaries."},{"q":"Which of Peter's actions best shows westernization?","right":"Modernizing the army on Western models","wrong":[["Taking Kazan and Astrakhan from the heirs of the Golden Horde in the 1500s","That was Ivan IV."],["Hiring Cossacks","That was the Stroganovs."],["Creating the oprichnina","Ivan IV."]],"exp":"Peter westernized Russia and modernized the army."}]},{"term":"Streltsy","def":"A noble-led elite military corps that backed Peter's half-sister and later rebelled against him.","hook":"The tsar's rebels.","asks":[{"q":"How did Peter deal with the military corps that rebelled against him?","right":"He disbanded and absorbed it","wrong":[["He made it his secret police","That was closer to Ivan's oprichnina."],["He sent it to fight in India","Russia did not fight in India."],["He let it elect the next tsar","Peter consolidated his own power."]],"exp":"Peter disbanded the Streltsy and folded them into the regular army."},{"q":"The streltsy rebellion is an example of which problem for rulers?","right":"Elite military corps threatening the ruler","wrong":[["Merchants refusing to pay customs on goods traded at the ports of the empire","Not on your card."],["Religious reformers","Not their role."],["Foreign invasion","They were Russian."]],"exp":"A noble-led corps backed Peter's half-sister and later rebelled."}]}],"intro":["In these years England and Russia went in opposite directions. In England, Parliament limited the king: the Bill of Rights of 1689 said the monarch needed Parliament's consent to raise taxes or an army. In Russia, Peter the Great grew stronger, not weaker. He put down the Streltsy, a guard corps that rebelled against him, modernized the army on Western lines, and built a new capital on the Baltic. Limited monarchy versus absolute monarchy is a classic comparison."]}],"intro":["Conquering land is one thing; holding it is another. This deck is about the tools rulers used to stay in power: loyal officials who owed everything to the ruler, claims that God or Heaven backed them, giant buildings that showed off their power, and ways to collect taxes. The AP test loves to ask you to compare these tools across empires."]},{"id":5,"name":"Belief Systems (3.3)","optional":false,"sections":[{"name":"Protestant Reformation","cards":[{"term":"Indulgences","def":"Payments to the Church that were said to reduce punishment for sins.","hook":"Paying off sin.","asks":[{"q":"Luther's attack on this Church practice sparked the Reformation. Which practice?","right":"Selling pardons for sin","wrong":[["Translating the Bible into English","That was Wycliffe's work, not what Luther attacked."],["Holding the Council of Trent","Trent came later, in response."],["Building the Hagia Sophia","That was a Byzantine church."]],"exp":"Luther objected to selling indulgences."},{"q":"Why did selling indulgences anger reformers?","right":"Salvation seemed for sale","wrong":[["Indulgences were too cheap, so the Church could not pay for its new buildings","The objection was selling salvation."],["Indulgences were Protestant","They were Catholic."],["Indulgences were a tax","Payments to the Church."]],"exp":"Payments said to reduce punishment for sins looked like buying salvation."}]},{"term":"Simony","def":"Selling church offices.","hook":"Offices for sale.","asks":[{"q":"Luther objected to the Church charging money for positions such as bishop. What is this called?","right":"Simony","wrong":[["Tax farming","Tax farming is a state revenue system."],["Predestination","Predestination is a Calvinist belief."],["Excommunication","Excommunication is expelling someone from the Church."]],"exp":"Simony and indulgences were two of Luther's targets."},{"q":"Simony and indulgences were both criticized because they","right":"mixed money with holy things","wrong":[["were Protestant inventions that the Catholic Church later adopted as its own","They were Catholic practices."],["ended the papacy","No."],["were taxes on peasants","Not exactly."]],"exp":"Selling offices and selling forgiveness both tied money to the sacred."}]},{"term":"Ninety-Five Theses (1517)","def":"Martin Luther's list of charges against Church practices, which started the Reformation.","hook":"Nailed to a church door.","asks":[{"q":"Which document is most directly linked to the break in Western Christianity?","right":"Luther's list of charges of 1517","wrong":[["The Peace of Westphalia signed in 1648","That ended the Thirty Years' War in 1648."],["The Catholic Index of Prohibited Books","That was a Catholic response."],["The Edict of Nantes issued by Henry IV","That granted toleration in France in 1598."]],"exp":"1517 is the start date of the Protestant Reformation."},{"q":"Which was the most direct long-term result of the Ninety-Five Theses?","right":"Western Christianity split","wrong":[["The Catholic Church immediately ended indulgences and Luther rejoined it","Luther was excommunicated in 1521."],["Islam spread to Europe","No."],["The Ottomans took Vienna","They failed."]],"exp":"The theses started the Reformation."}]},{"term":"Martin Luther","def":"German monk in Wittenberg who challenged the Church and was excommunicated in 1521.","hook":"The monk who said no.","asks":[{"q":"Why did some German princes support this monk against the Pope?","right":"To free themselves from papal power","wrong":[["Because he promised them the Pope's lands","The princes saw an opportunity; Luther did not promise lands."],["Because he supported peasant revolts","Luther did not support the peasants."],["Because the Ottomans ordered it","The Ottomans had no say."]],"exp":"Politics and religion combined: the princes wanted independence from the Pope."},{"q":"Why did Luther's ideas spread despite his excommunication?","right":"Some German princes protected and backed him","wrong":[["The pope approved them after the Council of Trent reaffirmed his teachings","Trent rejected them."],["The Ottomans spread them","No."],["They were secret","They spread widely."]],"exp":"Some princes supported Luther against the pope."}]},{"term":"Sola fide","def":"Luther's teaching that salvation comes through faith alone, not good works or payments.","hook":"Faith alone.","asks":[{"q":"Which belief most directly undercut the sale of indulgences?","right":"Salvation by faith alone","wrong":[["The authority of the Pope","Papal authority supported indulgences."],["The Mandate of Heaven","That is Chinese."],["Predestination of the elect","That is Calvinist and came later."]],"exp":"If faith alone saves, paying for pardons is pointless."},{"q":"How does sola fide differ from Calvin's predestination?","right":"Faith saves vs. God already chose the saved","wrong":[["Faith alone saves vs. good works alone save, which Calvin taught in Geneva","Calvin taught predestination."],["They are the same","Different teachings."],["Both reject God","No."]],"exp":"Luther: faith alone. Calvin: God already chose the elect."}]},{"term":"John Calvin","def":"French theologian who broke with the Church around 1530 and reformed the religious community of Geneva.","hook":"Geneva's reformer.","asks":[{"q":"Which reformer's followers included the Huguenots and the Puritans?","right":"John Calvin","wrong":[["Martin Luther","Luther's followers were Lutherans."],["Henry VIII","Henry founded the Anglican Church."],["Ignatius of Loyola","He founded the Catholic Jesuits."]],"exp":"Calvinist branches included the Huguenots and Puritans."},{"q":"Which city did Calvin reform?","right":"Geneva","wrong":[["Wittenberg, the German city where Luther first posted his Ninety-Five Theses","That's Luther."],["Rome","No."],["Paris","No."]],"exp":"Calvin reformed the religious community of Geneva."}]},{"term":"Predestination","def":"Calvin's teaching that God has already chosen who will be saved (the elect).","hook":"Chosen in advance.","asks":[{"q":"A community believes God chose its members for salvation before birth. Which tradition?","right":"Calvinism","wrong":[["Lutheranism","Lutherans stressed faith alone."],["Sikhism","Sikhism rejects caste and teaches devotion to one God."],["Shi'a Islam","Shi'a Islam is about leadership through Ali's descendants."]],"exp":"Calvinists called the chosen 'the elect.'"},{"q":"Predestination is most directly linked to which later idea?","right":"The Protestant work ethic","wrong":[["The sale of indulgences, which let people buy a lighter punishment for sins","Calvinists rejected that."],["The Mandate of Heaven","Chinese."],["The millet system","Ottoman."]],"exp":"Calvinists worked hard and reinvested as a sign of God's favor (Weber)."}]},{"term":"Huguenots","def":"French Calvinists.","hook":"France's Protestants.","asks":[{"q":"Which group did the Edict of Nantes protect?","right":"French Calvinists","wrong":[["English Puritans in Boston","Puritans were in England."],["German Lutherans in Saxony","The Peace of Augsburg dealt with Lutherans."],["Spanish Jesuits in the Americas","Jesuits were Catholic."]],"exp":"Henry IV granted toleration to the Huguenots in 1598."},{"q":"Which pair of events affected the Huguenots in opposite ways?","right":"Edict of Nantes and its revocation","wrong":[["The Peace of Augsburg and the Council of Trent, which both protected them","Neither was about the Huguenots."],["Lepanto and Vienna","Ottoman wars."],["Chaldiran and Tabriz","Safavid wars."]],"exp":"1598 protected them; 1685 ended their toleration."}]},{"term":"Protestant work ethic","def":"The idea, from the historian Max Weber, that Calvinists labored hard and reinvested profits as a sign of God's favor.","hook":"Hard work as holiness.","asks":[{"q":"Which social effect has been linked to Calvinism?","right":"Valuing hard work and reinvestment","wrong":[["Rejecting all trade and commerce","Calvinists were encouraged to prosper."],["Ending literacy for women","Protestantism promoted literacy."],["Restoring the authority of the Pope","Calvinists rejected the Pope."]],"exp":"Weber linked Calvinism to hard work and reinvestment."},{"q":"Who proposed the idea of the Protestant work ethic?","right":"Max Weber","wrong":[["John Calvin, who wrote it into the rules of the religious community in Geneva","Your card credits the historian Max Weber."],["Martin Luther","No."],["Francis Bacon","No."]],"exp":"The idea comes from the historian Max Weber."}]},{"term":"Anglican Church","def":"England's national faith, set up by Henry VIII with Parliament's approval and independent of the Pope.","hook":"The king's church.","asks":[{"q":"Why did Henry VIII break with the Pope?","right":"The Pope refused to annul his marriage","wrong":[["The Pope sold him too many indulgences","The break was over an annulment."],["He wanted to join the new Jesuit order","He broke with Rome."],["He had converted to Calvinism in Geneva","He made himself head of a new church."]],"exp":"Henry wanted a male heir and a new marriage."},{"q":"Henry VIII's Anglican Church is most similar to which later reform?","right":"Peter the Great's Holy Synod","wrong":[["The Council of Trent, which reaffirmed the pope's authority over the Church","That strengthened Rome."],["Calvin's Geneva","Not state-controlled the same way."],["Sikhism","No."]],"exp":"Both put the church under the ruler's control."}]}],"intro":["In 1517 a German monk, Martin Luther, protested Church practices such as selling indulgences (payments said to reduce punishment for sins). His Ninety-Five Theses started the Protestant Reformation. He taught sola fide, salvation by faith alone, and the Church expelled him in 1521. John Calvin started a second Protestant movement in Geneva and taught predestination; French Calvinists were called Huguenots. In England, Henry VIII broke from the Pope and made the Anglican Church. Result: Western Christianity split for good."]},{"name":"Catholic response","cards":[{"term":"Counter-Reformation","def":"The Catholic Church's effort to fight Protestantism and reform itself.","hook":"Rome strikes back.","asks":[{"q":"Which statement best describes the Catholic Church's response to the Reformation?","right":"It reformed itself and fought back","wrong":[["It accepted Protestant teachings","Trent reaffirmed Catholic doctrine."],["It dissolved itself after the Reformation","It remains the largest Christian denomination."],["It moved its headquarters from Rome to Istanbul","It stayed in Rome."]],"exp":"Inquisition, Jesuits and the Council of Trent were its three prongs."},{"q":"Which tool of the Counter-Reformation relied on persuasion and teaching?","right":"Jesuit schools and missions","wrong":[["The Inquisition, which used church courts to punish nonbelievers, sometimes with torture","That relied on force."],["The Index","Banning books is control."],["The Spanish Armada","Military."]],"exp":"Jesuits spread Catholicism through missions and schools."}]},{"term":"Council of Trent (1545–1563)","def":"Catholic meeting that reaffirmed Church teachings, corrected some abuses and improved the training of priests.","hook":"Reaffirm and reform.","asks":[{"q":"Which event kept Southern Europe Catholic by reaffirming doctrine and fixing some abuses?","right":"The council held from 1545 to 1563","wrong":[["The Peace of Augsburg signed in 1555","That let German rulers choose Lutheranism."],["Luther's Ninety-Five Theses of 1517","That started the Reformation."],["The Thirty Years' War of 1618 to 1648","That was a war, not a council."]],"exp":"Trent was the center of the Catholic Reformation."},{"q":"Which was NOT an action of the Council of Trent?","right":"Letting rulers choose Lutheranism","wrong":[["Reaffirming Church teachings that the Protestant reformers had attacked","Trent did this."],["Correcting some abuses","Trent did this."],["Improving priests' training","Trent did this."]],"exp":"Choosing Lutheranism was the Peace of Augsburg."}]},{"term":"Jesuits","def":"The Society of Jesus, a Catholic order founded by Ignatius of Loyola and approved in 1540, which spread Catholicism through missions and schools.","hook":"Missionaries and teachers.","asks":[{"q":"How did the Catholic Reformation help Christianity grow outside Europe?","right":"Through missionaries in Asia and the Americas","wrong":[["Through the Peace of Westphalia","That settled Europe's wars."],["Through the Edict of Nantes in France","That was French toleration of Protestants."],["Through Lutheran princes who sent missions abroad","They were Protestant."]],"exp":"Jesuits went to India, Japan and the Spanish Empire."},{"q":"Where did the Jesuits spread Catholicism, as shown by Francis Xavier?","right":"India and Japan","wrong":[["Only within Germany, where they converted the Lutheran princes back to Rome","Your cards show Asia."],["Only in Rome","No."],["Mecca","No."]],"exp":"Francis Xavier reached Goa (1542) and Japan (1549)."}]},{"term":"Francis Xavier","def":"Jesuit missionary who reached Goa, India, in 1542 and Japan in 1549.","hook":"To Goa and Japan.","asks":[{"q":"Which person best shows the Catholic Reformation reaching Asia?","right":"A Jesuit missionary who landed in Japan in 1549","wrong":[["A Lutheran prince who protected Luther in Germany","That is the Protestant Reformation in Europe."],["An Ottoman tax farmer collecting from Christian villages","That is unrelated to Christianity."],["A Huguenot craftsman who left France after 1685","That is about France in 1685."]],"exp":"Xavier founded Catholic communities in India and Japan."},{"q":"Xavier reaching Japan in 1549 helps explain which later Tokugawa policy?","right":"Banning Christianity","wrong":[["Alternate attendance, which made the lords keep homes in Edo and their lands","Not about Christianity."],["Salaried samurai","Not related."],["Buying Portuguese muskets","That was Nobunaga."]],"exp":"Christian missions came to Japan; the Tokugawa later banned Christianity."}]},{"term":"Inquisition","def":"Church courts used to find and punish nonbelievers, sometimes with torture.","hook":"Hunting heresy.","asks":[{"q":"Which Counter-Reformation tool relied on force rather than persuasion?","right":"The Inquisition","wrong":[["Jesuit schools","Schools persuaded through teaching."],["Better training of priests","Training is reform, not force."],["Missions to Japan","Missions tried to convert."]],"exp":"The Inquisition punished those it judged heretics."},{"q":"The Inquisition and the Index of Prohibited Books both aimed to","right":"stop ideas the Chu
