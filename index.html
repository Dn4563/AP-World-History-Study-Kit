onghai rulers converted to Islam; the Aztecs (Mexica) used human sacrifice"],["Art","Portraits of Qing emperors; miniature paintings in the Ottoman Empire; financial support of artists by European rulers"],["Monumental architecture","Mausolea such as the Taj Mahal and mosques in the Mughal Empire; European palaces such as Versailles and El Escorial"]]},"P9":{"title":"Settling Europe's religious wars","attr":"Summary based on AMSCO Topic 3.3.","label":"Practice source (written for practice from your class materials; not a verbatim quotation).","text":"In 1555 the Peace of Augsburg allowed each German prince to decide whether his state would be Catholic or Lutheran; subjects who disagreed could move. Nearly a century later, after the Thirty Years' War had brought famine and disease to much of Central Europe, the Peace of Westphalia (1648) added Calvinism as a third choice. Afterward France, Spain and Italy were mostly Catholic, northern Europe was Lutheran or Calvinist, and England had its own Protestant state church."}},"questions":[{"id":"SAQ1","type":"saq","lead":"Using the passage, answer (A), (B) and (C).","parts":[{"k":"A","prompt":"Identify one military factor that helped the Ottomans win at Chaldiran, according to the passage.","skill":"Identifying a claim from a source","model":"One military factor was the Ottomans' gunpowder weapons. The passage says 'Ottoman cannons and Janissary musketeers cut down the Safavid cavalry.' Firearms let the Ottoman army beat an enemy that still relied on horsemen.","tea":["One military factor was the Ottomans' gunpowder weapons.","The passage says 'Ottoman cannons and Janissary musketeers cut down the Safavid cavalry.'","Firearms let the Ottoman army beat an enemy that still relied on horsemen."],"earns":"You name cannons, artillery, firearms or the Janissaries, tied to the passage.","weak":"\"The Ottomans were stronger.\" Too general; name the weapons or the troops."},{"k":"B","prompt":"Explain one way religion shaped the conflict between the Ottoman and Safavid Empires.","skill":"Explaining a cause","model":"Religion deepened the rivalry because the Ottomans were Sunni and the Safavids were Shi'a. Ismail I made Shi'a Islam the Safavid state religion in 1501 and denied legitimacy to Sunnis. Because each side saw the other's Islam as heresy, border disputes became religious wars, which made the rivalry long and bitter.","tea":["Religion deepened the rivalry because the Ottomans were Sunni and the Safavids were Shi'a.","Ismail I made Shi'a Islam the Safavid state religion in 1501 and denied legitimacy to Sunnis.","Because each side saw the other's Islam as heresy, border disputes became religious wars, which made the rivalry long and bitter."],"earns":"You identify Sunni Ottomans versus Shi'a Safavids and explain how that difference fueled or intensified the conflict.","weak":"\"They had different religions.\" Name the branches and explain the effect."},{"k":"C","prompt":"Explain one way the Safavid Empire changed after Chaldiran.","skill":"Explaining change over time","model":"After Chaldiran, the Safavids rebuilt their army around gunpowder weapons. Shah Abbas I (r. 1588–1629) added muskets, artillery and loyal ghulam soldiers. This change let the Safavids reach their height and defend themselves against the Ottomans.","tea":["After Chaldiran, the Safavids rebuilt their army around gunpowder weapons.","Shah Abbas I (r. 1588–1629) added muskets, artillery and loyal ghulam soldiers.","This change let the Safavids reach their height and defend themselves against the Ottomans."],"earns":"You describe a specific change (Abbas I's military reforms, ghulams, Isfahan as capital) and explain why it followed the defeat.","weak":"\"They got better.\" Say what changed and who changed it."}],"src":"P7"},{"id":"SAQ2","type":"saq","lead":"Answer (A), (B) and (C).","parts":[{"k":"A","prompt":"Identify one method a ruler used to legitimize power in a land-based empire between 1450 and 1750.","skill":"Identifying a historical development","model":"One method was monumental architecture. The Mughal emperor Shah Jahan built the Taj Mahal in Agra. Its size and beauty displayed Mughal wealth and reinforced the ruler's authority.","tea":["One method was monumental architecture.","The Mughal emperor Shah Jahan built the Taj Mahal in Agra.","Its size and beauty displayed Mughal wealth and reinforced the ruler's authority."],"earns":"Any accurate method with an example: divine right, caliph claim, Mandate of Heaven, human sacrifice, sun temples, imperial portraits, Versailles, Taj Mahal, Askia promoting Islam.","weak":"\"Rulers built things.\" Name the building and the ruler."},{"k":"B","prompt":"Explain one similarity in how two land-based empires legitimized their rule.","skill":"Comparison: similarity","model":"Both France and the Ottoman Empire used religion to justify their rulers' power. Louis XIV claimed divine right, and Ottoman sultans claimed to be caliphs, successors to the Prophet. In both cases, linking the ruler to God made opposing him look like opposing the faith, which strengthened central authority.","tea":["Both France and the Ottoman Empire used religion to justify their rulers' power.","Louis XIV claimed divine right, and Ottoman sultans claimed to be caliphs, successors to the Prophet.","In both cases, linking the ruler to God made opposing him look like opposing the faith, which strengthened central authority."],"earns":"Two empires, one shared method, and a reason the method worked.","weak":"Listing two examples without saying how they are alike."},{"k":"C","prompt":"Explain one difference in how two land-based empires collected revenue.","skill":"Comparison: difference","model":"The Ottomans and the Mexica collected revenue in different ways. The Ottomans used tax farming, where private collectors paid a fixed sum and kept the surplus, while the Mexica demanded tribute from conquered provinces, recorded in lists like the Codex Mendoza. The Ottoman system taxed the empire's own subjects through a market in collection rights, while the Mexica relied on force and fear over peoples they had conquered.","tea":["The Ottomans and the Mexica collected revenue in different ways.","The Ottomans used tax farming, where private collectors paid a fixed sum and kept the surplus, while the Mexica demanded tribute from conquered provinces, recorded in lists like the Codex Mendoza.","The Ottoman system taxed the empire's own subjects through a market in collection rights, while the Mexica relied on force and fear over peoples they had conquered."],"earns":"Two specific systems from two empires and an explanation of the difference.","weak":"Describing only one empire."}]},{"id":"SAQ3","type":"saq","lead":"Using the table, answer (A), (B) and (C).","parts":[{"k":"A","prompt":"Identify one example from the table of a ruler using religion to legitimize power.","skill":"Identifying evidence from a source","model":"One example is European monarchs claiming divine right. The table lists 'European monarchs claimed divine right.' By saying their power came from God, kings like Louis XIV and James I placed themselves above earthly challenge.","tea":["One example is European monarchs claiming divine right.","The table lists 'European monarchs claimed divine right.'","By saying their power came from God, kings like Louis XIV and James I placed themselves above earthly challenge."],"earns":"Any religion example from the table, correctly described.","weak":"Choosing an art or architecture example for a religion question."},{"k":"B","prompt":"Explain why rulers of empires with diverse populations needed methods like those in the table.","skill":"Explaining a cause","model":"Rulers needed these methods because they governed many ethnic and religious groups who did not share one loyalty. For example, the Manchu Qing were a minority ruling Han Chinese, so they used imperial portraits and the Mandate of Heaven. Religion, art and architecture gave diverse subjects a reason to accept the ruler beyond military force.","tea":["Rulers needed these methods because they governed many ethnic and religious groups who did not share one loyalty.","For example, the Manchu Qing were a minority ruling Han Chinese, so they used imperial portraits and the Mandate of Heaven.","Religion, art and architecture gave diverse subjects a reason to accept the ruler beyond military force."],"earns":"You connect diversity or conquest to the need for legitimacy, with a specific example.","weak":"Restating the table without explaining why."},{"k":"C","prompt":"Explain one way a ruler's religious policy weakened an empire between 1450 and 1750.","skill":"Explaining an effect","model":"Aurangzeb's religious policy weakened the Mughal Empire. He restored the jizya on non-Muslims and enforced strict Sunni rule. This angered Hindus, Sikhs and others, sparking rebellions that, along with costly wars, drained the empire.","tea":["Aurangzeb's religious policy weakened the Mughal Empire.","He restored the jizya on non-Muslims and enforced strict Sunni rule.","This angered Hindus, Sikhs and others, sparking rebellions that, along with costly wars, drained the empire."],"earns":"A specific policy and how it weakened a state (Aurangzeb; Louis XIV's revocation of the Edict of Nantes driving out skilled Huguenots; Jahangir's execution of Guru Arjan).","weak":"\"Religion caused problems.\" Name the ruler, the policy and the effect."}],"src":"T3"},{"id":"SAQ4","type":"saq","lead":"Using the passage, answer (A), (B) and (C).","parts":[{"k":"A","prompt":"Describe one change in the religious settlement of Europe between 1555 and 1648, according to the passage.","skill":"Describing change from a source","model":"One change was that Calvinism became an accepted choice. The Peace of Augsburg (1555) allowed only Catholicism or Lutheranism, but the Peace of Westphalia (1648) added Calvinism. This shows that the religious split had widened and that rulers had to accept more diversity.","tea":["One change was that Calvinism became an accepted choice.","The Peace of Augsburg (1555) allowed only Catholicism or Lutheranism, but the Peace of Westphalia (1648) added Calvinism.","This shows that the religious split had widened and that rulers had to accept more diversity."],"earns":"You state the addition of Calvinism (or a correct change) and ground it in the passage.","weak":"Describing only one treaty."},{"k":"B","prompt":"Explain one cause of the religious divisions described in the passage.","skill":"Explaining a cause","model":"The religious divisions began with the Protestant Reformation. In 1517 Martin Luther attacked the sale of indulgences in his Ninety-Five Theses, and German princes backed him to escape the Pope's power. As Lutheran, Calvinist and Anglican churches formed, Europe split into rival states that fought over religion.","tea":["The religious divisions began with the Protestant Reformation.","In 1517 Martin Luther attacked the sale of indulgences in his Ninety-Five Theses, and German princes backed him to escape the Pope's power.","As Lutheran, Calvinist and Anglican churches formed, Europe split into rival states that fought over religion."],"earns":"Luther, Calvin, Henry VIII or Church corruption, with an explanation of how it divided Europe.","weak":"Naming Luther with no explanation."},{"k":"C","prompt":"Explain one way the Catholic Church responded to the developments in the passage.","skill":"Explaining a response","model":"The Catholic Church responded with the Counter-Reformation. The Council of Trent (1545–1563) reaffirmed Catholic doctrine and corrected some abuses, and the Jesuits spread Catholicism through schools and missions. These efforts kept southern Europe Catholic and spread Catholicism to Asia and the Americas.","tea":["The Catholic Church responded with the Counter-Reformation.","The Council of Trent (1545–1563) reaffirmed Catholic doctrine and corrected some abuses, and the Jesuits spread Catholicism through schools and missions.","These efforts kept southern Europe Catholic and spread Catholicism to Asia and the Americas."],"earns":"Trent, the Jesuits, the Inquisition or the Index, with its effect.","weak":"Saying the Church 'fought back' with no specifics."}],"src":"P9"}]},{"name":"Mock MCQs","mode":"exam","exam":"Mock test","examTips":["Treat this like the real test: turn the Timer on, leave Shuffle off, and do all 13 questions without looking anything up.","Aim for about one minute per question. Flag hard ones and come back.","When you finish, do the Mock SAQs tab (choose 2 of the 3, about 13 minutes each), then use Retest Missed Questions."],"tips":["Read the attribution line first: who wrote it, when, and why. A Tokugawa decree, an ambassador and a modern historian each have a different purpose.","Find the main idea of each paragraph before you look at the choices. Many questions ask about one paragraph only.","For \"best used as evidence of\" or \"best illustrates\" questions, first name the bigger development the source shows (gunpowder expansion, loyal elites, legitimacy, revenue, religious change), then pick the choice that matches it.","The wrong choices are usually true-but-not-in-the-source, from the wrong empire or century, or too extreme. Cross them out with the X button.","\"Practice passage\" sources were written for this kit from your class materials. They are not real quotations, so don't quote them on the test."],"sources":{"M1":{"title":"At the sultan's court","attr":"Practice passage in the voice of a European ambassador at the court of Suleiman the Magnificent, mid-1500s.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["In all that great assembly, no man owed his rank to anything but his own merit and the will of the sultan. There was no distinction attached to birth. The sultan himself chooses his ministers and officials, and he looks at their ability, not their family or wealth. Many of the men who now hold the highest offices were born the sons of shepherds and herdsmen and were taken into the sultan's service as boys.","Among us in Europe it is very different. A man's birth decides everything, and offices and commands go to those of noble family whether or not they deserve them.","This is why the Turks succeed in all that they attempt and are a ruling race, while we in our countries quarrel among ourselves. If we do not change, I fear for what will come when their armies, with their great guns and disciplined infantry, march against us again."]},"M2":{"title":"Two emperors, one empire","attr":"Practice passage written in the style of a modern historian of Mughal India.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["Akbar understood that a Muslim dynasty could not rule India's Hindu majority by force alone. He abolished the jizya, the tax on non-Muslims, married Hindu wives, and gave Hindu nobles high posts in his government. He even sponsored a blended faith, the Din-i Ilahi, though it attracted few followers. During his long reign the empire expanded across northern India while keeping the loyalty of many Hindu nobles.","His great-grandson Aurangzeb took a different course. He pushed the empire to its largest size, but he restored the jizya, enforced strict Sunni practice and opposed Hindu influences at court. In the Deccan, Hindu Maratha fighters led by Shivaji waged a long guerrilla war against him, and other groups rose in revolt.","The contrast suggests that the empire's strength depended less on the size of its armies than on the cooperation of its diverse subjects. When that cooperation was withdrawn, even the largest Mughal army could not hold the empire together."]},"M3":{"title":"Rivals of the faith","attr":"Practice passage written in the style of a modern historian of the Middle East.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["When Ismail I founded the Safavid state in 1501, he made Shi'a Islam its official religion and required his Sunni subjects to convert. To the Sunni Ottomans next door, this was both a religious challenge and a political threat, since Shi'a sympathizers lived inside Ottoman Anatolia.","The two empires met at Chaldiran in 1514. The Safavid cavalry was famous for its courage, but Ottoman artillery and Janissary musketeers cut it down. The Ottomans followed their victory with an embargo against Safavid silk merchants, trying to starve the shah's treasury of trade.","For more than a century the frontier between the empires remained a line between Sunni and Shi'a lands, marked by places such as Tabriz, where the Ottomans stopped Safavid forces in 1541. Only after the Safavids rebuilt their army with firearms under Shah Abbas I, and after religious fervor had faded at court, did the two states conclude a lasting peace in 1639."]},"M4":{"title":"Paris and the Huguenots","attr":"Practice passage in the voice of a French Protestant (Huguenot) looking back from the late 1680s. The words of Henry IV are as quoted in your textbook (AMSCO 3.3).","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["Our fathers fought long wars for the right to worship as Calvin taught, and France was torn apart by them. Henry of Navarre, raised in our faith, became king only by taking the Catholic Mass in 1593. \"Paris is well worth a Mass,\" he is reported to have said. Some of us called him a traitor, but in 1598 he gave us the Edict of Nantes, and for the first time we could worship openly in our towns.","Now King Louis has revoked the edict. Our churches are torn down, our pastors are banished, and our children must be raised Catholic. Weavers, goldsmiths and merchants are leaving for Holland, England and the German lands, taking their skills with them, and France is poorer for it."]},"M5":{"title":"Gold, salt and guns","attr":"Practice passage written in the style of a modern historian of West Africa.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["By the late 1400s, Songhai controlled the great cities of the middle Niger, Gao and Timbuktu, and the caravan trade that carried West African gold north across the Sahara in exchange for salt. Sunni Ali had built this state in the 1460s and 1470s, using swift cavalry and control of the Niger River to conquer Timbuktu and Jenne. His successors, especially Askia the Great, made Islam the official religion and staffed their government with scholars trained in the madrasas of Timbuktu.","That wealth drew the attention of Morocco. In 1591 a Moroccan army crossed the desert carrying firearms, still rare south of the Sahara. At Tondibi, near Gao, it defeated a much larger Songhai army that had no such weapons. Morocco had come for the gold routes, and with this victory Songhai's control of them was broken."]}},"questions":[{"id":"MK-1","type":"mcq","skill":"Claim in a source","topic":"Ruling","stem":"Which of the following best describes the ambassador's main claim in the first paragraph?","options":["Ottoman officials rose by ability, not birth","Ottoman officials were chosen from the empire's wealthiest noble families","The sultan allowed his officials to elect his ministers","The sons of shepherds were barred from the sultan's service"],"ans":0,"exp":"\"No man owed his rank to anything but his own merit and the will of the sultan.\"","why":["","He says the opposite: birth brings no distinction.","He says the sultan himself chooses them.","He says many high officials were shepherds' sons."],"src":"M1"},{"id":"MK-2","type":"mcq","skill":"Context","topic":"Ruling","stem":"The pattern the ambassador describes was made possible most directly by","options":["the devshirme, which recruited boys regardless of family","the Ottoman adoption of the Confucian civil service examination","the Ottoman practice of tax farming, which sold the right to collect taxes","the millet system, which let each religious group run its own affairs"],"ans":0,"exp":"Boys \"taken into the sultan's service\" = the devshirme.","why":["","The exams were Chinese.","Tax farming was about revenue, not choosing officials.","The millet system was about religious communities, not recruitment."],"src":"M1"},{"id":"MK-3","type":"mcq","skill":"Purpose / point of view","topic":"Ruling","stem":"The ambassador's comparison in the second and third paragraphs is most likely intended to","options":["persuade the sultan to adopt European customs of inheritance","show that European armies were stronger than Ottoman armies","warn Europeans that rank by birth left them weaker","argue that the Ottomans would soon decline because of their system"],"ans":2,"exp":"He contrasts Ottoman merit with European birth and fears what Ottoman armies will do next.","why":["He is writing for Europeans, praising the Ottoman system.","He fears the Ottoman armies.","","He says their system is why they succeed."],"src":"M1"},{"id":"MK-4","type":"mcq","skill":"Historian's argument","topic":"Comparison","stem":"Which of the following best states the historian's argument?","options":["Aurangzeb's larger army made the empire more stable than it had been under Akbar","Akbar's Din-i Ilahi converted most of India to a new religion","Religious policy had little effect on the stability of the Mughal Empire","Mughal power rested on subjects' cooperation more than on armies"],"ans":3,"exp":"Final paragraph: strength depended on cooperation, not army size.","why":["The historian says the largest army could not hold the empire together.","The passage says it attracted few followers.","The whole passage links religious policy to peace or revolt.",""],"src":"M2"},{"id":"MK-5","type":"mcq","skill":"Cause","topic":"Comparison","stem":"According to the passage, which most directly contributed to the rebellions described in the second paragraph?","options":["Akbar's decision to give Hindu nobles high positions in government","The popularity of the Din-i Ilahi among Hindu nobles","A Safavid invasion that drew the Mughal army out of the Deccan","Aurangzeb's return of the jizya and strict Sunni rule"],"ans":3,"exp":"Aurangzeb restored the jizya and enforced strict Sunni rule; the Marathas and others revolted.","why":["That built cooperation; the revolts came under Aurangzeb.","It attracted few followers.","The passage mentions no Safavid invasion.",""],"src":"M2"},{"id":"MK-6","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Akbar's approach in the first paragraph is most similar to which of the following?","options":["Ismail I's demand that Sunnis in Persia convert to Shi'a Islam","Louis XIV's revocation of the Edict of Nantes","The Ottoman millet system for religious communities","The Tokugawa ban on Christianity in Japan"],"ans":2,"exp":"Both accepted religious diversity to keep a large empire stable.","why":["That is forced conformity, closer to Aurangzeb.","That ended toleration.","","That is restriction, not tolerance."],"src":"M2"},{"id":"MK-7","type":"mcq","skill":"Cause","topic":"Rivalries","stem":"According to the passage, the Ottomans saw the Safavid state as a threat mainly because","options":["the Safavids had a stronger navy that threatened Ottoman ports","its Shi'a identity was both a religious and a political threat","the Safavids had allied with European Christians against the sultan","the Safavids controlled Mecca and Medina"],"ans":1,"exp":"Paragraph 1: a religious challenge and a political threat, since Shi'a sympathizers lived in Anatolia.","why":["The Safavids had no significant navy, and the passage never mentions one.","","No alliance is mentioned.","The holy cities were under Ottoman, not Safavid, protection."],"src":"M3"},{"id":"MK-8","type":"mcq","skill":"Best used as evidence","topic":"Rivalries","stem":"The second paragraph can best be used as evidence that","options":["gunpowder weapons could defeat famous cavalry armies","religious belief decided the outcome of battles in this period","the Safavids were the stronger military power in 1514","trade had no role in the conflict between the two empires"],"ans":0,"exp":"Artillery and Janissary muskets cut down the famous Safavid cavalry.","why":["","The paragraph credits artillery and muskets.","They lost at Chaldiran.","The Ottomans used a silk embargo as a weapon."],"src":"M3"},{"id":"MK-9","type":"mcq","skill":"Continuity and change","topic":"Rivalries","stem":"Which of the following best describes the change the historian identifies in the final paragraph?","options":["Religious fervor faded and a lasting peace followed","A shift from peaceful trade to constant warfare after 1639","The Ottoman conversion to Shi'a Islam, which ended the conflict","The Safavid conquest of Istanbul under Shah Abbas I"],"ans":0,"exp":"Religious fervor faded at court, and a lasting peace came in 1639.","why":["","The order is reversed: war first, peace in 1639.","The Ottomans remained Sunni.","There was no such conquest."],"src":"M3"},{"id":"MK-10","type":"mcq","skill":"Point of view","topic":"Belief systems","stem":"The author's description of Henry IV in the first paragraph suggests that Henry","options":["was a devout Catholic from birth who wanted to destroy the Huguenots completely","refused to change his religion even to become king","was forced out of France by the Catholic nobility","valued peace and the throne over one faith, then protected Protestants"],"ans":3,"exp":"\"Paris is well worth a Mass\": he converted to win the throne, then protected the Huguenots in 1598.","why":["He was raised Protestant and gave them the Edict of Nantes.","He took the Mass in 1593.","He became king and issued the edict.",""],"src":"M4"},{"id":"MK-11","type":"mcq","skill":"Effect","topic":"Belief systems","stem":"The second paragraph can best be used as evidence that the revocation of the Edict of Nantes","options":["ended religious conflict in France by uniting all French people in one faith","weakened France economically by driving skilled Protestant workers abroad","strengthened the Huguenot churches by forcing them to organize","was a response to a Huguenot attempt to seize the French throne"],"ans":1,"exp":"Weavers, goldsmiths and merchants left, \"and France is poorer for it.\"","why":["It caused flight and suffering, not unity.","","Their churches were torn down and pastors banished.","The passage gives no such cause."],"src":"M4"},{"id":"MK-12","type":"mcq","skill":"Context","topic":"Expansion","stem":"The Moroccan victory described in the passage best illustrates which broader development of the period 1450–1750?","options":["The European takeover of the trans-Saharan gold trade","Gunpowder driving state expansion beyond Eurasia","The spread of Shi'a Islam from Persia into West Africa","The success of cavalry armies against early firearms"],"ans":1,"exp":"Firearms beat a larger army at Tondibi: gunpowder expansion reached Africa too.","why":["The invaders were Moroccan, not European.","","The passage mentions no Shi'a influence.","The firearms won."],"src":"M5"},{"id":"MK-13","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Askia the Great's methods of rule, as described in the first paragraph, were most similar to those of","options":["Tokugawa shoguns who banned foreign religions and closed most of Japan's ports","English monarchs whose power was limited by the Bill of Rights","Ottoman sultans who claimed to be caliph and used trained officials","Russian tsars who expanded by hiring Cossacks to fight in Siberia"],"ans":2,"exp":"Both used Islam for legitimacy and educated officials to govern.","why":["Askia promoted a world religion; he did not close off trade.","Nothing limited Askia's power in this way.","","That is expansion, not Islamic legitimacy and educated officials."],"src":"M5"}]},{"name":"Mock SAQs","mode":"exam","exam":"Mock test","examTips":["Like the real test: choose TWO of the three SAQs. Turn the Timer on and give yourself about 13 minutes each.","Write complete sentences for A, B and C, and only then check your answers."],"tips":["Use TEA for every part: T = Topic sentence (answer the question directly, restating its words), E = Evidence (a specific person, place, term or date), A = Analysis (explain how the evidence proves your point, using \"which led to,\" \"because\" or \"this allowed\").","Label your answers A, B and C and write in complete sentences. No introduction or thesis.","\"Identify\" or \"describe\" means give accurate details. \"Explain\" means show how or why.","Stay inside 1450 to 1750 unless the question says otherwise.","Aim for about 13 minutes per SAQ: about 1 to plan and 12 to write.","Self-check: Did I give a specific example? Did I explain the connection? Right empire, right century?"],"sources":{"R5":{"title":"The oath of an English justice of the peace","attr":"Oath of office under the Tudor monarchs, as quoted in AMSCO Topic 3.2.","label":"","text":"[You shall] swear that as Justices of the Peace . . . in all articles in the King's Commission to you directed, ye shall do equal right to the poor and to the rich after your cunning wit, and power, and after the laws and customs of the realm and statutes thereof made."},"P6":{"title":"The teachings of Guru Nanak","attr":"Summary based on your 3.3 slides and AMSCO Topic 3.3.","label":"Practice source (written for practice from your class materials; not a verbatim quotation).","text":"Guru Nanak, who lived in the Punjab in the late 1400s, taught that there is one God, who can be reached through personal devotion, meditation and honest living rather than through ritual. He welcomed followers from Hindu and Muslim families alike and rejected the caste system, teaching that all people are equal before God."}},"questions":[{"id":"MSAQ1","type":"saq","lead":"Using the excerpt, answer (A), (B) and (C).","parts":[{"k":"A","prompt":"Describe one duty of a justice of the peace, according to the excerpt.","skill":"Describing a claim from a source","model":"One duty was to give equal justice to all people. The oath says justices must 'do equal right to the poor and to the rich' according to 'the laws and customs of the realm.' This shows they enforced the monarch's law fairly in the counties.","tea":["One duty was to give equal justice to all people.","The oath says justices must 'do equal right to the poor and to the rich' according to 'the laws and customs of the realm.'","This shows they enforced the monarch's law fairly in the counties."],"earns":"You describe enforcing the king's law, treating rich and poor equally, or carrying out the King's Commission.","weak":"\"They were officials.\" Describe what they had to do."},{"k":"B","prompt":"Explain how officials like those in the excerpt helped English monarchs centralize power.","skill":"Explaining a cause","model":"Justices of the peace helped centralize power by carrying the monarch's authority into every county. Under the Tudors (1485–1603) their numbers and responsibilities grew, while feudal lords lost power. Because local order now depended on officials enforcing royal law, the crown no longer needed to rely on independent nobles.","tea":["Justices of the peace helped centralize power by carrying the monarch's authority into every county.","Under the Tudors (1485–1603) their numbers and responsibilities grew, while feudal lords lost power.","Because local order now depended on officials enforcing royal law, the crown no longer needed to rely on independent nobles."],"earns":"You connect the justices to weaker nobles or stronger royal control with a specific detail.","weak":"Repeating part A."},{"k":"C","prompt":"Explain one difference between how England and France were governed by about 1700.","skill":"Comparison: difference","model":"England developed a limited monarchy while France became an absolute monarchy. In England the Bill of Rights of 1689 required Parliament's agreement for taxes and an army, while Louis XIV of France ruled by divine right and said, 'I am the state.' So English kings were checked by Parliament, while the French king held complete authority.","tea":["England developed a limited monarchy while France became an absolute monarchy.","In England the Bill of Rights of 1689 required Parliament's agreement for taxes and an army, while Louis XIV of France ruled by divine right and said, 'I am the state.'","So English kings were checked by Parliament, while the French king held complete authority."],"earns":"England (Parliament, Bill of Rights) versus France (absolutism, Louis XIV, intendants, Versailles), with an explanation.","weak":"Describing only France."}],"src":"R5"},{"id":"MSAQ2","type":"saq","lead":"Answer (A), (B) and (C).","parts":[{"k":"A","prompt":"Identify one way gunpowder helped a land-based empire expand between 1450 and 1750.","skill":"Identifying a historical development","model":"Gunpowder helped the Ottoman Empire take fortified cities. In 1453 Mehmed II's huge bronze cannons broke the walls of Constantinople. Taking the city ended the Byzantine Empire and gave the Ottomans a capital that controlled the Bosporus.","tea":["Gunpowder helped the Ottoman Empire take fortified cities.","In 1453 Mehmed II's huge bronze cannons broke the walls of Constantinople.","Taking the city ended the Byzantine Empire and gave the Ottomans a capital that controlled the Bosporus."],"earns":"Any accurate example: Constantinople, Chaldiran, Panipat, Tondibi, Cossacks in Siberia, Manchu banners.","weak":"\"They had guns.\" Name the empire and the event."},{"k":"B","prompt":"Explain one similarity in how two empires expanded in this period.","skill":"Comparison: similarity","model":"The Mughals and Morocco both used firearms to defeat larger armies. Babur's cannons and matchlocks won at Panipat in 1526, and Moroccan musketeers beat a bigger Songhai army at Tondibi in 1591. In both cases gunpowder gave smaller forces an advantage over armies using older tactics, which let them take new territory.","tea":["The Mughals and Morocco both used firearms to defeat larger armies.","Babur's cannons and matchlocks won at Panipat in 1526, and Moroccan musketeers beat a bigger Songhai army at Tondibi in 1591.","In both cases gunpowder gave smaller forces an advantage over armies using older tactics, which let them take new territory."],"earns":"Two empires, one shared method, and why it worked.","weak":"Two separate descriptions with no comparison."},{"k":"C","prompt":"Explain one reason a land-based empire declined by the 1700s.","skill":"Explaining a cause","model":"One reason was the cost of maintaining large armies. Aurangzeb's long wars in the Deccan against the Marathas drained the Mughal treasury. Without money and with revolts spreading, the empire weakened, letting Britain and France gain power in India.","tea":["One reason was the cost of maintaining large armies.","Aurangzeb's long wars in the Deccan against the Marathas drained the Mughal treasury.","Without money and with revolts spreading, the empire weakened, letting Britain and France gain power in India."],"earns":"A specific cause (costly wars, weak heirs and harem politics, failure to modernize, high taxes, rebellions) for a named empire.","weak":"\"It got weak.\" Explain why."}]},{"id":"MSAQ3","type":"saq","lead":"Using the passage, answer (A), (B) and (C).","parts":[{"k":"A","prompt":"Describe one teaching of Guru Nanak, according to the passage.","skill":"Describing a claim from a source","model":"One teaching was that all people are equal before God. The passage says Nanak 'rejected the caste system.' This challenged the Hindu social order that ranked people by birth.","tea":["One teaching was that all people are equal before God.","The passage says function unitProgress(u) {
  const data = UNITDATA[u.id],
    saved = readJSON(keyOf(u, "kit")) || {},
    known = saved.known || {};
  const ids = [];
  data.decks.forEach((dk) => {
    if (dk.optional) return;
    dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => ids.push(dk.id + "." + si + "." + ci)));
  });
  let answered = 0,
    total = 0;
  const pt = readJSON(keyOf(u, "pt"));
  data.practice.sections.forEach((s) => {
    const st = pt && pt.secs ? (pt.secs.find((x) => x.name === s.name) || {}).st || {} : {};
    s.questions.forEach((q) => {
      total++;
      const x = st[q.id];
      if (x && (x.checked || x.mark != null || Object.keys(x.pm || {}).length)) answered++;
    });
  });
  return { got: ids.filter((id) => known[id]).length, tot: ids.length, answered: answered, total: total };
}

function loadSave() {
  SAVE = { settings: Object.assign({}, DEF), known: {}, trouble: {}, done: {}, li: 0, revHist: [], secRev: {}, star: {} };
  const o = readJSON(LSK);
  if (!o) return;
  SAVE.known = o.known || {};
  SAVE.trouble = o.trouble || {};
  SAVE.done = o.done || {};
  SAVE.li = o.li || 0;
  SAVE.ui = o.ui || null;
  SAVE.revHist = o.revHist || [];
  SAVE.secRev = o.secRev || {};
  SAVE.star = o.star || {};
  const s = o.settings || {};
  /* Older kits kept theme and size per kit; carry them over once. */
  if (!readJSON(PREFK) && (s.theme || s.size !== undefined)) {
    if (s.theme) PREFS.theme = s.theme;
    if (typeof s.size === "number") PREFS.size = s.size;
    writeJSON(PREFK, PREFS);
    applyPrefs();
  }
  delete s.theme;
  delete s.size;
  SAVE.settings = Object.assign({}, DEF, s);
}
function save() {
  writeJSON(LSK, SAVE);
}

function indexCards() {
  BYID = {};
  D.allDecks = D.allDecks || D.decks;
  D.allDecks.forEach((dk, di) => {
    dk.tone = di % 8;
    dk.sections.forEach((sc, si) =>
      sc.cards.forEach((c, ci) => {
        c.id = dk.id + "." + si + "." + ci;
        c.deck = dk.id;
        c.sec = dk.id + "." + si;
        BYID[c.id] = c;
      }),
    );
  });
}
/* Optional decks stay out of "All decks", the meter and the mixed quiz unless turned on in Settings. */
function rebuild() {
  D.decks = D.allDecks.filter((d) => !d.optional || SAVE.settings.optDeck);
  ALL = [];
  LESSONS = [];
  D.decks.forEach((dk) =>
    dk.sections.forEach((sc, si) => {
      sc.cards.forEach((c) => ALL.push(c));
      const n = sc.cards.length,
        parts = Math.max(1, Math.ceil(n / 5)),
        base = Math.floor(n / parts),
        extra = n % parts;
      let i = 0;
      for (let p = 0; p < parts; p++) {
        const sz = base + (p < extra ? 1 : 0);
        LESSONS.push({
          id: dk.id + "." + si + "." + p,
          deck: dk.id,
          sec: dk.id + "." + si,
          secName: sc.name,
          part: p,
          parts: parts,
          title: sc.name + (parts > 1 ? " (part " + (p + 1) + " of " + parts + ")" : ""),
          cards: sc.cards.slice(i, i + sz),
        });
        i += sz;
      }
    }),
  );
}

/* Answer choices shared by Learn, Quiz and the Practice Test: cross-off, Lock in, and per-choice explanations.
   Explanations name the choice by its text, never by letter, because choices are shuffled. */
function whyHTML(opts, picked, okTxt) {
  const ci = opts.findIndex((o) => o.ok);
  const quote = (o) => '<span class="qt">' + esc(o.t) + "</span>";
  let h = "";
  if (picked >= 0 && !opts[picked].ok)
    h +=
      '<div class="why bad"><div class="wh">Why your answer is wrong</div>' +
      quote(opts[picked]) +
      (opts[picked].why ? "<p>" + esc(opts[picked].why) + "</p>" : "") +
      "</div>";
  if (ci >= 0 && okTxt) h += '<div class="why good"><div class="wh">Why the correct answer is right</div>' + quote(opts[ci]) + "<p>" + okTxt + "</p></div>";
  if (opts.some((o) => o.why))
    h +=
      '<details class="whyall"><summary>Every choice explained</summary><ul>' +
      opts
        .map(
          (o) =>
            "<li>" +
            quote(o) +
            (o.ok ? '<span class="tag ok">Correct</span>' + (okTxt ? "<p>" + okTxt + "</p>" : "") : '<span class="tag bad">Wrong</span><p>' + esc(o.why || "") + "</p>") +
            "</li>",
        )
        .join("") +
      "</ul></details>";
  return h;
}

      : '<button class="xoff" data-act="' +
        elimAct +
        '" data-k="' +
        k +

/* Question builders and the one-at-a-time runner used by Quiz, the final mixed quiz and retries. */
let FC = null,

function stopTM() {
  clearInterval(TM);

}
function pickDir() {
  const d = SAVE.settings.dir;

}
/* Distractors come from the same section first, then the same deck, then anywhere, preferring similar lengths
   so the right answer never stands out by length. */
function distractors(card, n, field) {
  const target = card[field];
  const fair = (c) => !MIX || field !== "def" || !hasTerm(c.def, card.term);
  const tiers = [
    ALL.filter((c) => c !== card && c.sec === card.sec),
    ALL.filter((c) => c !== card && c.deck === card.deck && c.sec !== card.sec),
    ALL.filter((c) => c.deck !== card.deck),
  ];
  const out = [];
  for (const tier of tiers) {
    const cand = shuf(tier);
    const close = cand.filter((c) => {
      const r = c[field].length / target.length;
      return r >= 0.7 && r <= 1.3;
    });
    const ord = close.concat(cand.filter((c) => close.indexOf(c) < 0));
    for (const c of ord) {
      if (out.length >= n) break;
      if (fair(c) && c[field] !== target && !out.some((o) => o[field] === c[field])) out.push(c);
    }
    if (out.length >= n) break;

}
/* Units with "learnMix" on (set per unit in course.json) hide the term inside definitions used as questions

const MIX = !!(UNIT && UNIT.learnMix);

  return (term.match(/[A-Za-z]{4,}/g) || []).filter((w) => !STOP.test(w)).map((w) => w.toLowerCase().slice(0, Math.max(4, w.length >= 8 ? w.length - 2 : w.length - 1)));

    kind: "tf",
    card: card,
    ask: "True or false: this definition matches the term.",
    prompt: "<b>" + esc(card.term) + "</b><br>" + esc(isTrue ? card.def : other.def),
    options: [
      { t: "True", ok: isTrue },

/* Every sort records enough to undo it exactly. */
function fcPush(id) {

  if (fcBrowse() || !FC.q.length) return;

  fcPush(id);
  FC.q.shift();

  if (FC.learning.indexOf(id) < 0 && FC.got.indexOf(id) < 0) FC.got.push(id);
  FC.flip = false;
  render();
};
ACT.fcnot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  delete SAVE.known[id];
  SAVE.trouble[id] = (SAVE.trouble[id] || 0) + 1;
  if (FC.learning.indexOf(id) < 0) FC.learning.push(id);

  FC.flip = false;
  save();
  render();
};
ACT.fcback = () => {
  const h = FC && FC.hist.pop();
  if (!h) return;
  FC.q = h.q;
  FC.got = h.got;
  FC.learning = h.learning;
  if (h.known) SAVE.known[h.id] = true;
  else delete SAVE.known[h.id];
  if (h.trouble === undefined) delete SAVE.trouble[h.id];
  else SAVE.trouble[h.id] = h.trouble;
  FC.flip = false;
  save();
  render();
};
ACT.fclearn = () => {

  render();
};
ACT.fcprev = () => {
  if (FC.i > 0) FC.i--;
  FC.flip = false;
  render();
};
ACT.fcnext = () => {
  if (FC.i < FC.list.length - 1) FC.i++;
  FC.flip = false;
  render();
};
ACT.fcswap = () => {
  SAVE.settings.fcFirst = SAVE.settings.fcFirst === "term" ? "def" : "term";
  FC.flip = false;
  save();
  render();
};
ACT.fcshuf = () => {
  if (fcBrowse()) {

ACT.fcstar = () => {

/* 70-quiz.js */
/* Quiz builder: decks, how many of each type, number of choices, feedback timing, order and an optional
   per-question timer. Results break down by type and topic, with retry-missed and rerun. */
function initQ() {
  if (!UI.q) UI.q = { decks: {}, mc: 10, tf: 5, sc: 6, nopt: 4, fb: "immediate", order: "shuffle", timer: SAVE.settings.timer };
  D.decks.forEach((d) => {
    if (UI.q.decks[d.id] === undefined) UI.q.decks[d.id] = true;
  });
}
function QSET(t) {
  initQ();
  if (t.dataset.qd !== undefined) {
    const d = D.decks.find((x) => String(x.id) === t.dataset.qd);
    if (d) UI.q.decks[d.id] = t.checked;
    clampQ();
    return render();
  }
  if (t.type === "number") {
    UI.q[t.dataset.q] = Math.max(0, Math.floor(Number(t.value) || 0));
    clampQ();
    return render();
  }
  UI.q[t.dataset.q] = t.value;
}
/* Real limits for the chosen decks. Multiple choice and true/false share the decks' terms (a term is asked
   once, one way or the other); applied questions are counted separately. */
function quizCaps() {
  const decks = quizDecks();
  return { terms: ALL.filter((c) => decks.indexOf(c.deck) >= 0).length, applied: appliedCount() };
}
function clampQ() {
  const c = quizCaps(),
    q = UI.q;
  q.mc = Math.min(Math.max(0, Number(q.mc) || 0), c.terms);
  q.tf = Math.min(Math.max(0, Number(q.tf) || 0), c.terms - q.mc);
  q.sc = Math.min(Math.max(0, Number(q.sc) || 0), c.applied);
}
/* Questions from the last quiz go to the back of the line next time, so a rerun starts with new ones. */
let QRECENT = new Set();
/* How many applied questions the chosen decks have: scenarios plus applied (asks.json) questions. */
function appliedPool(decks) {
  const pool = [];
  D.sq.forEach((s, i) => decks.indexOf(s.deck) >= 0 && pool.push({ key: "s" + i, make: () => scQ(s) }));
  ALL.filter((c) => decks.indexOf(c.deck) >= 0).forEach((c) => (c.asks || []).forEach((a, i) => pool.push({ key: "a" + c.id + ":" + i, make: () => askQ(c, a) })));
  return pool;
}
const quizDecks = () => D.decks.map((d) => d.id).filter((id) => !UI.q || UI.q.decks[id] !== false);
function appliedCount() {
  return appliedPool(quizDecks()).length;
}

    ]) +

    ]) +

    (UI.qmsg ? '<p class="msg">' + esc(UI.qmsg) + "</p>" : "") +

ACT.qstart = () => {
  initQ();
  const q = UI.q,
    decks = D.decks.map((d) => d.id).filter((id) => q.decks[id]);
  if (!decks.length) {
    UI.qmsg = "Pick at least one deck.";
    return render();
  }
  clampQ();
  /* Random order, then (stable sorts) the Settings focus first and last quiz's questions last. */
  const recentLast = (key) => (QRECENT.has(key) ? 1 : 0);
  let pool = shuf(ALL.filter((c) => decks.indexOf(c.deck) >= 0));
  pool.sort((a, b) => recentLast("c" + a.id) - recentLast("c" + b.id));
  const f = SAVE.settings.focus;
  if (f === "trouble") pool.sort((a, b) => (SAVE.trouble[b.id] || 0) - (SAVE.trouble[a.id] || 0));
  else if (f === "unknown") pool.sort((a, b) => (SAVE.known[a.id] ? 1 : 0) - (SAVE.known[b.id] ? 1 : 0));
  let nmc = Number(q.mc) || 0,
    ntf = Number(q.tf) || 0,
    nsc = Number(q.sc) || 0;
  const qt = SAVE.settings.qType;
  if (qt === "terms") nsc = 0;
  if (qt === "scen") nmc = ntf = 0;
  const qs = [],
    np = Number(q.nopt) || 4;
  /* Each term once: the first nmc as multiple choice, the next ntf as true or false. */
  nmc = Math.min(nmc, pool.length);
  ntf = Math.min(ntf, pool.length - nmc);
  const used = new Set();
  for (let i = 0; i < nmc; i++) {
    const mq = mcQ(pool[i], null, np);
    qs.push(mq);
    used.add("c" + pool[i].id);
    /* A card with no fair definition question is asked with its applied question; don't ask that one again below. */
    if (mq.kind === "ap") used.add("a" + pool[i].id + ":" + pool[i].asks.findIndex((a) => esc(a.q) === mq.prompt));
  }
  for (let i = nmc; i < nmc + ntf; i++) {
    qs.push(tfQ(pool[i]));
    used.add("c" + pool[i].id);
  }
  /* Applied pool: the decks' scenario questions plus every applied (asks.json) question, each at most once. */
  const ap = shuf(appliedPool(decks).filter((it) => !used.has(it.key)));
  ap.sort((a, b) => recentLast(a.key) - recentLast(b.key));
  ap.slice(0, nsc).forEach((it) => {
    qs.push(it.make());
    used.add(it.key);
  });
  QRECENT = used;
  if (!qs.length) {
    UI.qmsg = "Nothing to ask with those settings.";
    return render();
  }
  UI.qmsg = "";
  startRun({ title: "Quiz", qs: q.order === "shuffle" ? shuf(qs) : qs, immediate: q.fb === "immediate", timer: Number(q.timer) || 0, retry: false, breakdown: true, again: true });
};

/* 85-backup.js */
/* Whole-course backup on the course home page: one file with every unit's saved progress (and the course's
   theme and text size). Restore reads that file back. In a kit built with content/import-map.json (for example
   the Psych kit, whose content came from Phineas's kit), Restore also reads that other kit's backup file and
   carries over the cards marked known and the missed-term counts. */
let bkMsg = "";
const BK_PREFIX = "sk:" + COURSE.id + ":";
function backupData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(BK_PREFIX) === 0) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return { app: "study-kit", course: COURSE.id, saved: new Date().toISOString(), data: data };
}
function restoreData(o) {
  if (!o || o.app !== "study-kit" || typeof o.data !== "object") throw new Error("unreadable");
  if (o.course !== COURSE.id) throw new Error("other course");
  const keys = Object.keys(o.data).filter((k) => k.indexOf(BK_PREFIX) === 0 && typeof o.data[k] === "string");
  if (!keys.length) throw new Error("empty");
  keys.forEach((k) => {
    try {
      localStorage.setItem(k, o.data[k]);
    } catch (e) {}
  });
  return "Restored your progress for " + plural(new Set(keys.map((k) => k.split(":")[2])).size - (o.data[BK_PREFIX + "prefs"] ? 1 : 0), "unit") + ".";
}
/* Every card in a unit, optional decks included, keyed by term. */
function termIds(u) {
  const out = {};
  UNITDATA[u.id].decks.forEach((dk) => dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => (out[c.term] = dk.id + "." + si + "." + ci))));
  return out;
}
function importForeign(o) {
  const M = IMPORT_MAP;
  const parse = (k) => {
    try {
      return JSON.parse((o.data || {})[k] || "null") || {};
    } catch (e) {
      return {};
    }
  };
  const known = parse(M.known),
    miss = parse(M.miss);
  const per = {};
  const ids = {};
  const touch = (hisId) => {
    const m = M.cards[hisId];
    if (!m) return null;
    const u = COURSE.units.find((x) => x.id === m[0]);
    if (!u) return null;
    ids[u.id] = ids[u.id] || termIds(u);
    const id = ids[u.id][m[1]];
    if (!id) return null;
    if (!per[u.id]) per[u.id] = { u: u, saved: readJSON(keyOf(u, "kit")) || {}, known: 0, trouble: 0 };
    const p = per[u.id];
    p.saved.known = p.saved.known || {};
    p.saved.trouble = p.saved.trouble || {};
    return { p: p, id: id };
  };
  Object.keys(known).forEach((h) => {
    if (!known[h]) return;
    const t = touch(h);
    if (!t) return;
    if (!t.p.saved.known[t.id]) t.p.known++;
    t.p.saved.known[t.id] = true;
  });
  Object.keys(miss).forEach((h) => {
    const n = Number(miss[h]) || 0;
    if (n <= 0) return;
    const t = touch(h);
    if (!t) return;
    if (!((t.p.saved.trouble[t.id] || 0) > 0)) t.p.trouble++;
    t.p.saved.trouble[t.id] = Math.max(t.p.saved.trouble[t.id] || 0, n);
  });
  const parts = [];
  let nk = 0,
    nt = 0;
  COURSE.units.forEach((u) => {
    const p = per[u.id];
    if (!p) return;
    writeJSON(keyOf(u, "kit"), p.saved);
    nk += p.known;
    nt += p.trouble;
    parts.push(u.label + ": " + p.known + " known, " + p.trouble + " to practice");
  });
  if (!parts.length) throw new Error("nothing");
  return "Brought over " + plural(nk, "known card") + " and " + plural(nt, "missed term") + " from " + M.name + ". " + parts.join(" · ") + ".";
}
function readBackupFile(text) {
  const o = JSON.parse(text);
  if (IMPORT_MAP && o && o.app === IMPORT_MAP.app) return importForeign(o);
  return restoreData(o);
}
const BK_ERR = {
  "other course": "That backup is from a different course. Restore it in that course's study kit.",
  empty: "That backup has no saved progress in it.",
  nothing: "None of the cards in that backup match this kit.",
};
function backupHTML() {
  return (
    '<section class="panel backup"><h2>Backup</h2><p class="muted">Your progress saves in this browser. Download one file with every unit, then restore it on another device or browser.' +
    (IMPORT_MAP ? " Restore also accepts a backup file from " + esc(IMPORT_MAP.name) + "." : "") +
    '</p><div class="qnav"><button class="btn sec" data-act="bkdown">Download backup</button><button class="btn sec" data-act="bkup">Restore from backup</button></div>' +
    '<input type="file" id="bkfile" accept=".json,application/json" hidden>' +
    (bkMsg ? '<p class="bkmsg" role="status">' + esc(bkMsg) + "</p>" : "") +
    "</section>"
  );
}
ACT.bkdown = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(backupData(), null, 1)], { type: "application/json" }));
  a.download = COURSE.id + "-study-kit-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
};
ACT.bkup = () => document.getElementById("bkfile").click();
document.addEventListener("change", (e) => {
  if (!e.target || e.target.id !== "bkfile" || !e.target.files || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      bkMsg = readBackupFile(String(r.result));
    } catch (err) {
      bkMsg = BK_ERR[err.message] || "That file could not be read. Choose a backup file downloaded from a study kit.";
    }
    renderHome();
  };
  r.readAsText(e.target.files[0]);
});

/* 90-pt.js */
/* Practice Test and exams. Sections sit behind their own top tabs. One question at a time with a numbered
   palette (gray = not visited, outlined = visited, green = correct, red = incorrect, amber = partly right,
   ring = current, corner mark = flagged). Question types: mcq, tf, label, diagram, frq, saq. */
const PT = { sec: 0, secs: [], timerOn: false, elapsed: 0, iv: null, retest: null, msg: "", intro: {}, res: null };
const TYPE_NAME = { mcq: "Multiple choice", tf: "True or false", label: "Labeling", diagram: "Diagram labeling", frq: "Free response", saq: "Short answer" };
const newSt = () => ({ elim: [], visited: false, checked: false, sel: null, correct: null, flag: false, items: {}, work: "", abox: "", ans: {}, revealed: false, mark: null, pm: {} });
const isWritten = (q) => q.type === "frq" || q.type === "saq";
const itemsOf = (q) => (q.type === "diagram" ? q.pins.map((p, i) => Object.assign({ t: "Pin " + (i + 1) }, p)) : q.items);

function initPT() {
  D.practice.sections.forEach((s) => {
    const sec = { name: s.name, mode: s.mode || "practice", exam: s.exam || s.name, tips: s.tips || [], examTips: s.examTips || [], sources: s.sources || {}, qs: s.questions, byId: {}, cur: 0, st: {}, oo: {} };
    sec.qs.forEach((q) => {
      if (q.type === "tf") {
        q.options = ["True", "False"];
        q.ai = q.ans ? 0 : 1;
      } else if (q.type === "mcq") q.ai = q.ans;
      sec.byId[q.id] = q;
      sec.st[q.id] = newSt();
      if (q.type === "mcq") sec.oo[q.id] = q.options.map((o, i) => i);
    });
    sec.orig = sec.qs.map((q) => q.id);
    sec.order = sec.orig.slice();
    PT.secs.push(sec);
  });
  PTload(readJSON(PTK));
}

/* Points earned on one question, 0 to 1, or null if not answered yet. Multi-part items earn partial credit. */
function frac(q, s) {
  if (isWritten(q)) {
    const ks = q.parts.map((p) => p.k),
      pm = s.pm || {};
    if (ks.every((k) => pm[k] !== undefined)) return ks.filter((k) => pm[k]).length / ks.length;
    return null;
  }
  if (q.type === "label" || q.type === "diagram") {
    const it = itemsOf(q);
    return s.checked ? it.filter((x, i) => s.items[i] === x.ans).length / it.length : null;
  }
  return s.checked ? (s.correct ? 1 : 0) : null;
}
function status(q, s) {
  const f = frac(q, s);
  if (f !== null) return f === 1 ? "ok" : f === 0 ? "bad" : "partial";
  return s.visited ? "vis" : "new";
}
const ptMode = () => (UI.tab === "exam" ? "exam" : "practice");
function curView() {
  const sec = PT.secs[PT.sec],
    R = PT.retest && PT.retest.sec === PT.sec ? PT.retest : null;
  return { sec: sec, R: R, ids: R ? R.ids : sec.order, st: R ? R.st : sec.st, h: R || sec };
}
function cur3() {
  const v = curView(),
    id = v.ids[v.h.cur];
  return { v: v, id: id, q: v.sec.byId[id], s: v.st[id] };
}
function secScore(sec, ids, st) {
  let pts = 0,
    n = 0;
  ids.forEach((id) => {
    const f = frac(sec.byId[id], st[id]);
    if (f !== null) {
      n++;
      pts += f;
    }
  });
  return fmt1(pts) + " of " + plural(n, "point") + " so far";
}
const fmtT = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const ul = (a) => "<ol>" + a.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ol>";

function srcImg(key) {
  if (!key || !D.images) return "";
  return D.images[key] || D.images[String(key).replace(/^map_/, "")] || "";
}
function srcHTML(s) {
  if (!s) return "";
  let h = '<figure class="src"><figcaption><b>' + esc(s.title) + "</b>" + (s.attr ? '<span class="sattr">' + esc(s.attr) + "</span>" : "") + (s.label ? '<span class="slab">' + esc(s.label) + "</span>" : "") + "</figcaption>";
  const img = srcImg(s.img);
  if (img) h += '<img class="srcimg" alt="' + esc(s.alt || s.title) + '" src="' + img + '">';
  if (s.table) h += tableHTML({ rows: s.table });
  else if (s.paras) h += s.paras.map((p, i) => '<p class="stext"><span class="pn">Paragraph ' + (i + 1) + "</span> " + esc(p) + "</p>").join("");
  else if (s.text) h += '<p class="stext">' + esc(s.text) + "</p>";
  return h + "</figure>";
}
function introHTML(sec) {
  if (!sec.tips.length && !sec.examTips.length) return "";
  const open = !!PT.intro[sec.name];
  let h =
    '<div class="intro"><button class="lnk disclose" data-act="ptintro" aria-expanded="' +
    open +
    '">' +

    (sec.examTips.length ? "How to take this test" : "How to attack these questions") +
    "</button>";

    h += ul(sec.tips);
  }
  return h + "</div>";
}

/* ---------- one question ---------- */
function choiceQHTML(q, s, sec, id, nav, topic) {
  const order = q.type === "mcq" ? sec.oo[id] : [0, 1];
  let h = '<div class="stem">' + esc(q.stem) + '</div><div class="opts' + (q.type === "tf" ? " tf" : "") + '">';
  order.forEach((oi, pos) => {
    let c = "opt";
    const ex = s.elim.indexOf(oi) >= 0;
    if (s.checked) {
      if (oi === q.ai) c += " right";
      else if (oi === s.sel) c += " wrong";
    } else if (oi === s.sel && !ex) c += " sel";
    h += q.type === "mcq" ? optRow(c, "ptopt", oi, LET[pos], esc(q.options[oi]), "ptelim", ex, s.checked) : '<div class="optrow"><button class="' + c + '" data-act="ptopt" data-k="' + oi + '"' + (s.checked ? " disabled" : "") + '><span class="ot">' + q.options[oi] + "</span></button></div>";
  });
  h += '</div><div class="qnav">';
  if (!s.checked && SAVE.settings.confirm) h += '<button class="btn" data-act="ptcheck"' + (s.sel === null ? " disabled" : "") + ">Check Answer</button>";
  h += nav + "</div>";
  if (s.checked) {
    h += '<div class="fb ' + (s.correct ? "ok" : "bad") + '"><b>' + (s.correct ? "Correct." : "Incorrect.") + "</b>" + (q.type === "tf" ? " The statement is " + (q.ans ? "true." : "false.") : "") + topic + "</div>";
    if (q.type === "mcq") {
      const od = sec.oo[id].map((oi) => ({ t: q.options[oi], ok: oi === q.ai, why: oi === q.ai ? "" : (q.why && q.why[oi]) || "" }));
      h += whyHTML(od, sec.oo[id].indexOf(s.sel), esc(q.exp));
    } else h += '<div class="why good"><p>' + esc(q.exp) + "</p></div>";
  }
  return h;
}
function labelRowsHTML(q, s) {
  return (
    '<ol class="litems">' +
    itemsOf(q)
      .map((it, i) => {
        const sel = s.items[i],
          right = s.checked && sel === it.ans;
        return (
          '<li class="litem' +
          (q.type === "diagram" ? " pinrow" : "") +
          (s.checked ? (right ? " right" : " wrong") : "") +
          '"><span class="lt"><span class="ln">' +
          (i + 1) +
          "</span>" +
          esc(q.type === "diagram" ? "" : it.t) +
          '</span><span class="lbtns" role="group" aria-label="Label for item ' +
          (i + 1) +
          '">' +
          q.labels
            .map((lb, k) => {
              let c = "lb";
              if (s.checked) {

              } else if (k === sel) c += " sel";
              return '<button class="' + c + '" data-act="ptitem" data-i="' + i + '" data-v="' + k + '"' + (s.checked ? " disabled" : "") + ' aria-pressed="' + (k === sel) + '">' + esc(lb) + "</button>";
            })
            .join("") +
          "</span>" +
          (s.checked ? '<span class="lfb">' + (right ? "<b>Correct.</b> " : "<b>Answer: " + esc(q.labels[it.ans]) + ".</b> ") + esc(it.exp || "") + "</span>" : "") +
          "</li>"
        );
      })
      .join("") +
    "</ol>"
  );
}
function diagramHTML(q, s) {
  return (
    '<figure class="diagram"><div class="dimg"><img src="' +

    '" alt="' +

      .map((p, i) => {

      })

}
function writtenHTML(q, s, nav, topic) {
  let h = q.title ? '<h3 class="qhead">' + esc(q.title) + "</h3>" : "";
  if (q.stem) h += '<div class="stem">' + esc(q.stem) + "</div>";

  if (q.type === "frq") {
    h += '<ol class="fparts" type="a">' + q.parts.map((p) => "<li>" + esc(p.prompt) + "</li>").join("") + "</ol>";

    h += '<label class="part"><span class="pl">Answer box <small>Final answers, labeled a, b, c.</small></span><textarea rows="4" data-ans="abox">' + esc(s.abox) + "</textarea></label>";
  } else

  h += '<div class="qnav"><button class="btn" data-act="ptcheck"' + (s.revealed ? " disabled" : "") + ">Check Answer</button>" + nav + "</div>";

    h +=
      '<div class="selfmark" role="group" aria-label="Self-mark part ' +

  return h + "</div>";
}

function ptSectionHTML() {

    }

function ptControls(M) {

    '<div class="ptctl"><button class="btn ghost" data-act="pttimer" aria-pressed="' +
    PT.timerOn +

/* ---------- actions ---------- */
function PTinput(t) {
  const c = cur3(),
    k = t.dataset.ans;
  if (k === "work" || k === "abox") c.s[k] = t.value;
  else c.s.ans[k] = t.value;
  PTsave();
}
/* A right answer in a retest round also updates the main section. */
function syncMain() {
  const R = PT.retest;
  if (!R || R.sec !== PT.sec) return;
  const sec = PT.secs[R.sec],
    c = cur3(),
    m = sec.st[c.id],
    r = R.st[c.id];
  if (frac(c.q, r) === 1) {
    Object.assign(m, { checked: r.checked, correct: r.correct, sel: r.sel, revealed: r.revealed, mark: r.mark });
    m.items = Object.assign({}, r.items);
    m.pm = Object.assign({}, r.pm);
  }
}
function checkCur() {
  const c = cur3();
  if (isWritten(c.q)) c.s.revealed = true;
  else if (c.q.type === "label" || c.q.type === "diagram") {
    const it = itemsOf(c.q);
    if (c.s.checked || !it.every((x, i) => c.s.items[i] !== undefined)) return;
    c.s.checked = true;
    c.s.correct = it.every((x, i) => c.s.items[i] === x.ans);
  } else {
    if (c.s.sel === null || c.s.checked) return;
    c.s.checked = true;
    c.s.correct = c.s.sel === c.q.ai;
  }
  syncMain();
  render();
}
ACT.ptsec = (t) => {

  PT.sec = Number(t.dataset.i);

};
ACT.ptres = (t) => {

};
ACT.ptintro = () => {

};
ACT.ptjump = (t) => {

ACT.ptprev = () => {

ACT.ptnext = () => {

ACT.ptshuffle = () => {

ACT.ptunshuffle = () => {

function freshSec(sec) {

}
ACT.ptresetsec = () => {
  if (!ask("Clear every answer in " + PT.secs[PT.sec].name + "?")) return;

ACT.ptresetall = () => {

  if (!ask(M === "exam" ? "Clear every answer in every exam section?" : "Clear every answer in every practice section?")) return;
  PT.secs.forEach((x) => x.mode === M && freshSec(x));

ACT.ptretest = () => {
  const sec = PT.secs[PT.sec],
    ids = sec.order.filter((id) => ["bad", "partial"].indexOf(status(sec.byId[id], sec.st[id])) >= 0);
  if (!ids.length) {

  ids.forEach((id) => (st[id] = newSt()));

/* ---------- saving ---------- */
function PTpack() {
  return {
    sec: PT.sec,
    timerOn: PT.timerOn,
    elapsed: PT.elapsed,
    intro: PT.intro,
    secs: PT.secs.map((s) => ({ name: s.name, order: s.order, cur: s.cur, st: s.st, oo: s.oo, shuffled: !!s.shuffled })),
    retest: PT.retest ? { sec: PT.retest.sec, ids: PT.retest.ids, st: PT.retest.st, cur: PT.retest.cur } : null,
  };
}
function PTsave() {
  if (PTK) writeJSON(PTK, PTpack());
}
function PTload(o) {
  try {
    if (!o || !o.secs) return;
    o.secs.forEach((x) => {
      const s = PT.secs.find((y) => y.name === x.name);
      if (!s) return;
      if (Array.isArray(x.order) && x.order.length === s.orig.length && x.order.every((id) => s.byId[id])) s.order = x.order;
      if (typeof x.cur === "number") s.cur = Math.min(Math.max(0, x.cur), s.order.length - 1);
      s.shuffled = x.shuffled === undefined ? !!o.shuffled : !!x.shuffled;
      s.qs.forEach((q) => {
        const st = x.st && x.st[q.id];
        if (st && typeof st === "object") {
          const n = Object.assign(newSt(), st, { items: Object.assign({}, st.items || {}), pm: Object.assign({}, st.pm || {}), ans: Object.assign({}, st.ans || {}), elim: (st.elim || []).slice() });
          /* Old World SAQ saves kept per-part marks in "parts". */
          if (st.parts && q.type === "saq") Object.keys(st.parts).forEach((k) => st.parts[k] !== null && (n.pm[k] = st.parts[k]));
          if (st.ans && typeof st.ans === "object" && q.type === "saq") n.ans = Object.assign({}, st.ans);
          s.st[q.id] = n;
        }
        const oo = x.oo && x.oo[q.id];
        if (q.type === "mcq" && Array.isArray(oo) && oo.length === q.options.length) s.oo[q.id] = oo;
      });
    });
    if (typeof o.sec === "number" && PT.secs[o.sec]) PT.sec = o.sec;
    PT.intro = o.intro || {};
    PT.elapsed = Number(o.elapsed) || 0;
    PT.retest = null;
    if (o.retest && PT.secs[o.retest.sec] && Array.isArray(o.retest.ids)) {
      const rs = PT.secs[o.retest.sec];
      if (o.retest.ids.every((id) => rs.byId[id])) {
        PT.retest = { sec: o.retest.sec, ids: o.retest.ids, st: {}, cur: o.retest.cur || 0 };
        o.retest.ids.forEach((id) => (PT.retest.st[id] = Object.assign(newSt(), (o.retest.st || {})[id] || {})));
      }
    }
    if (o.timerOn && !PT.timerOn) {
      PT.timerOn = true;
      PT.iv = setInterval(tick, 1000);
    }
  } catch (e) {}
}
function PTreset() {
  PT.secs.forEach((s) => {
    s.qs.forEach((q) => {
      s.st[q.id] = newSt();
      if (q.type === "mcq") s.oo[q.id] = q.options.map((o, i) => i);
    });
    s.order = s.orig.slice();
    s.cur = 0;
    s.shuffled = false;
  });
  PT.retest = null;
  PT.elapsed = 0;
  PT.sec = 0;
  PTsave();
}

/* 95-results.js */
/* Per-exam results page (score with partial credit, by type, what to study next, question by question) and
   the Progress tab (every practice topic ranked weakest first). */
const topicOf = (q) => q.topic || q.skill || "Other";
function reviewDeck(topic) {
  const d = D.topicDeck && D.topicDeck[topic];
  return d === undefined ? null : D.allDecks.find((x) => x.id === d) || null;
}
const barHTML = (p) => '<span class="bar ' + (p < 60 ? "low" : p < 85 ? "mid" : "high") + '" aria-hidden="true"><i style="width:' + p + '%"></i></span>';
const jumpBtn = (si, q, label) => '<button class="lnk" data-act="progjump" data-s="' + si + '" data-id="' + esc(q.id) + '">' + esc(label) + "</button>";

function resDetail(q, s) {
  if (q.type === "mcq" || q.type === "tf")
    return "<p><b>Your answer:</b> " + (s.sel == null ? "none" : esc(q.options[s.sel])) + "</p><p><b>Correct answer:</b> " + esc(q.options[q.ai]) + '</p><p class="muted">' + esc(q.exp) + "</p>";
  if (q.type === "label" || q.type === "diagram")
    return (
      "<ul>" +
      itemsOf(q)
        .map((it, i) => {
          const sel = s.items[i],
            ok = sel === it.ans;
          return (
            "<li>" +
            esc(q.type === "diagram" ? "Pin " + (i + 1) : it.t) +
            ": " +
            (ok ? "<b>" + esc(q.labels[it.ans]) + "</b>, correct" : "you said " + (sel === undefined ? "nothing" : esc(q.labels[sel])) + ", correct is <b>" + esc(q.labels[it.ans]) + '</b>. <span class="muted">' + esc(it.exp || "") + "</span>") +
            "</li>"
          );
        })
        .join("") +
      "</ul>"
    );
  return (
    '<ol class="fparts" type="a">' +
    q.parts
      .map((p) => "<li><p><b>" + (s.pm[p.k] === true ? "Got it. " : s.pm[p.k] === false ? "Missed. " : "") + "</b>" + esc(p.prompt) + "</p><p>" + esc(p.tea ? p.tea.join(" ") : p.model) + "</p></li>")
      .join("") +
    "</ol>"
  );
}

function resHTML(group) {
  const secs = PT.secs.map((sec, si) => ({ sec: sec, si: si })).filter((x) => x.sec.mode === "exam" && x.sec.exam === group);
  let tot = 0,
    ok = 0,
    done = 0;
  const byType = {},
    byTopic = {},
    rows = [];
  secs.forEach((x) =>
    x.sec.orig.forEach((id, n) => {
      const q = x.sec.byId[id],
        s = x.sec.st[id],
        f0 = frac(q, s),
        f = f0 === null ? 0 : f0;
      tot++;
      ok += f;
      if (f0 !== null) done++;
      const T = (byType[TYPE_NAME[q.type]] = byType[TYPE_NAME[q.type]] || { ok: 0, tot: 0, n: 0 });
      T.tot++;
      T.ok += f;
      if (f0 !== null) T.n++;
      const P = (byTopic[topicOf(q)] = byTopic[topicOf(q)] || { ok: 0, tot: 0, bad: 0, none: 0 });
      P.tot++;
      P.ok += f;
      if (f0 === null) P.none++;
      else if (f0 < 1) P.bad++;
      rows.push({ x: x, q: q, s: s, f0: f0, n: n });
    }),
  );
  let h = '<section class="panel"><div class="rtop"><h2>' + esc(group) + " results</h2></div>";
  if (!done) return h + '<p class="muted">Nothing checked yet. Work through this exam, press Check Answer (or self-mark written answers), then come back. Each exam is scored on its own.</p></section>';
  const pct = Math.round((ok / tot) * 100);
  h +=
    '<div class="fb' +
    (pct >= 85 ? " ok" : pct < 60 ? " bad" : "") +
    '"><p class="big">' +
    fmt1(ok) +
    " of " +
    tot +
    " points (" +
    pct +
    "%)</p><p>Partial credit counts." +
    (done < tot ? " " + plural(tot - done, "question") + " not answered or self-marked yet, worth 0 points." : "") +
    " " +
    (pct >= 85 ? "Strong. Review the few misses below." : pct >= 70 ? "Solid, but the topics below still need work." : "Not there yet. Use the study list below, then retake this exam.") +
    "</p></div>";
  h +=
    '<h3>By question type</h3><div class="wk">' +
    Object.keys(byType)
      .map((k) => {
        const t = byType[k],
          p = Math.round((t.ok / t.tot) * 100);
        return '<div class="wkrow"><div class="wkhead"><b>' + esc(k) + "</b><span>" + fmt1(t.ok) + " of " + t.tot + " points" + (t.n < t.tot ? ", " + (t.tot - t.n) + " not answered" : "") + "</span></div>" + barHTML(p) + "</div>";
      })
      .join("") +
    "</div>";
  const need = Object.keys(byTopic)
    .filter((k) => byTopic[k].bad || byTopic[k].none)
    .sort((a, b) => byTopic[a].ok / byTopic[a].tot - byTopic[b].ok / byTopic[b].tot);
  h += "<h3>What to study next</h3>";
  if (!need.length) h += "<p>Nothing missed. Try the Practice Test sections for more.</p>";
  else
    h +=
      '<div class="wk">' +
      need
        .map((k) => {
          const t = byTopic[k],
            p = Math.round((t.ok / t.tot) * 100),
            dk = reviewDeck(k);
          const miss = rows.filter((r) => topicOf(r.q) === k && r.f0 !== 1);
          return (
            '<div class="wkrow"><div class="wkhead"><b>' +
            esc(k) +
            "</b><span>" +
            fmt1(t.ok) +
            " of " +
            t.tot +
            " points" +
            (t.none ? ", " + t.none + " not answered" : "") +
            "</span></div>" +
            barHTML(p) +
            '<p class="wkmiss">Go back to: ' +
            miss.map((r) => jumpBtn(r.x.si, r.q, r.x.sec.name + ", question " + (r.n + 1))).join(", ") +
            "</p>" +
            (dk ? '<p class="wkrev">Then review <b>' + esc(dk.name) + "</b> in the Study guide.</p>" : "") +
            "</div>"
          );
        })
        .join("") +
      "</div>";
  h += "<h3>Question by question</h3>";
  rows.forEach((r) => {
    const st = r.f0 === null ? "none" : r.f0 === 1 ? "ok" : r.f0 > 0 ? "partial" : "bad";
    const parts = isWritten(r.q) ? r.q.parts.length : r.q.type === "label" || r.q.type === "diagram" ? itemsOf(r.q).length : 1;
    const lbl = { ok: "Correct", bad: "Missed", none: "Not answered", partial: "Partly right, " + fmt1(r.f0 * parts) + " of " + parts }[st];
    const stem = r.q.title || r.q.stem || r.q.lead || "";
    h +=
      '<details class="resq ' +
      st +
      '"' +
      (st === "ok" ? "" : " open") +
      '><summary><span class="pal ' +
      st +
      '" aria-hidden="true">' +
      (r.n + 1) +
      "</span><span><b>" +
      lbl +
      "</b> " +
      esc(r.x.sec.name) +
      ", " +
      esc(TYPE_NAME[r.q.type]) +
      ' <span class="skill">' +
      esc(topicOf(r.q)) +
      "</span><br>" +
      esc(stem.length > 160 ? stem.slice(0, 160) + "..." : stem) +
      "</span></summary>" +
      (st === "ok"
        ? ""
        : '<div class="resd">' +
          (r.f0 !== null || isWritten(r.q) ? resDetail(r.q, r.s) : '<p class="muted">You did not check this question.</p>') +
          "<p>" +
          jumpBtn(r.x.si, r.q, "Go to this question") +
          "</p></div>") +
      "</details>";
  });
  return h + "</section>";
}

function progHTML() {
  const T = {};
  PT.secs.forEach((sec, si) =>
    sec.qs.forEach((q) => {
      const o = (T[topicOf(q)] = T[topicOf(q)] || { ok: 0, n: 0, miss: [], total: 0 });
      o.total++;
      const f = frac(q, sec.st[q.id]);
      if (f !== null) {
        o.n++;
        o.ok += f;
        if (f < 1) o.miss.push({ si: si, q: q });
      }
    }),
  );
  const rows = Object.keys(T)
    .map((n) => ({ n: n, o: T[n], pct: T[n].n ? T[n].ok / T[n].n : null }))
    .sort((a, b) => (a.pct === null) - (b.pct === null) || (a.pct || 0) - (b.pct || 0));
  let h = '<section class="panel"><h2>Weak topics</h2>';
  h += rows.some((r) => r.o.n)
    ? '<p class="muted">Every question you have checked or self-marked, ranked weakest first. Under 3 answers counts as an early number.</p>'
    : '<p class="muted">Answer some practice or exam questions and your topics show up here, weakest first.</p>';
  h += '<div class="wk">';
  rows.forEach((r) => {
    const p = r.pct === null ? 0 : Math.round(r.pct * 100),
      dk = reviewDeck(r.n);
    h +=
      '<div class="wkrow"><div class="wkhead"><b>' +
      esc(r.n) +
      "</b><span>" +
      (r.pct === null ? "Not started" : fmt1(r.o.ok) + " of " + r.o.n + " points (" + p + "%)" + (r.o.n < 3 ? ", early" : "")) +
      ", " +
      plural(r.o.total, "question") +
      " in the kit</span></div>" +
      barHTML(p);
    if (r.o.miss.length) h += '<p class="wkmiss">Missed: ' + r.o.miss.map((m) => jumpBtn(m.si, m.q, PT.secs[m.si].name + ", question " + (PT.secs[m.si].orig.indexOf(m.q.id) + 1))).join(", ") + "</p>";
    if (dk && (r.pct === null || r.pct < 0.85)) h += '<p class="wkrev">Review <b>' + esc(dk.name) + "</b> in the Study guide.</p>";
    h += "</div>";
  });
  h += "</div>";
  const tr = Object.keys(SAVE.trouble).filter((k) => SAVE.trouble[k] && !SAVE.known[k] && BYID[k]).length;
  if (tr) h += '<p class="muted">You also have ' + plural(tr, "trouble term") + " in the Flashcards pool.</p>";
  return h + "</section>";
}
ACT.progjump = (t) => {
  const si = Number(t.dataset.s),
    sec = PT.secs[si];
  UI.tab = sec.mode === "exam" ? "exam" : "pt";
  PT.res = null;
  PT.sec = si;
  PT.retest = null;
  const i = sec.order.indexOf(t.dataset.id);
  if (i >= 0) sec.cur = i;
  render();
  window.scrollTo(0, 0);
};

/* 99-boot.js */
/* Start: the course home page, or the unit named after # in the address. */
if (UNIT) {
  initShell();
  initPT();
  restoreL();
}
render();

</script>
