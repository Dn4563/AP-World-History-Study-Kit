"Customs revenue as East-West go-between","wrong":[["Gold mines that supplied the trans-Saharan caravans with gold for salt","That's West Africa."],["Silk factories","That's China."],["Conquest","Not on your card."]],"exp":"Gujarat's customs revenue was huge."},{"q":"Gujarat and Malacca both grew rich in what way?","right":"Taxing trade that passed through","wrong":[["Selling gold that they mined themselves to merchants from the north","Not their role."],["Raiding ships","Not on your cards."],["Making porcelain","That's China."]],"exp":"Both collected customs and fees from passing trade."}]},{"term":"Swahili city-states","def":"East African coastal trading cities (Kilwa, Mombasa, Mogadishu) that exchanged gold and ivory for Chinese porcelain and Indian cotton; \"Swahili\" means \"coasters,\" and the language blends Bantu and Arabic.","hook":"Coastal traders.","asks":[{"q":"What does the Swahili language show about East Africa's coast?","right":"Blending of Bantu and Arabic cultures","wrong":[["That East Africans refused contact with any outside traders or cultures","The blend shows heavy contact."],["That the coast was Chinese","Not on your card."],["That Swahili came from Persia","It blends Bantu and Arabic."]],"exp":"The Swahili language blends Bantu and Arabic, a result of trade contact."},{"q":"What did Swahili city-states trade for Chinese porcelain and Indian cotton?","right":"Gold and ivory","wrong":[["Silk and tea, which they made themselves for sale to merchants from China","Those were Chinese goods."],["Salt","Salt was a trans-Saharan good."],["Horses","From Southwest Asia."]],"exp":"Swahili cities exchanged gold and ivory for porcelain and cotton."}]},{"term":"Sultanate of Malacca","def":"Muslim city-state on the Strait of Malacca; grew rich from fees on passing ships and built a navy; fell to Portugal in 1511.","hook":"Toll booth with a navy.","asks":[{"q":"Why could Malacca grow rich without producing much itself?","right":"It charged ships passing the strait","wrong":[["It mined gold and sold it to Chinese merchants, who carried it home","Your card says fees on ships."],["It made silk","Not on your card."],["It had no navy","It built a navy."]],"exp":"Malacca grew rich from fees on ships passing the Strait of Malacca."},{"q":"Why did Malacca build a navy?","right":"To control the strait and its fees","wrong":[["To conquer China and replace the Ming as the strongest power in Asia","Not on your card."],["To fight the Mongols in Russia","Wrong region."],["To carry pilgrims","Not on your card."]],"exp":"A navy let Malacca control shipping through the strait (an example of centralization)."}]},{"term":"Customs duties","def":"Taxes on imported goods and port fees that gave states revenue from trade.","hook":"Tolls fund thrones.","asks":[{"q":"How did states benefit from Indian Ocean trade without trading themselves?","right":"Customs duties and port fees","wrong":[["By forcing merchants to give them their ships at the end of every voyage","Not on your card."],["By banning trade","That would end revenue."],["By raiding caravans","Not on your card."]],"exp":"Taxes on imports and port fees gave states revenue."},{"q":"Which card is the clearest example of customs duties?","right":"Gujarat's huge customs revenue","wrong":[["Mansa Musa's pilgrimage, which displayed Mali's wealth to the world","That's spending, not customs."],["The yam","Messengers."],["Champa rice","A crop."]],"exp":"Gujarat collected huge customs revenue."}]}],"intro":["Each region had a specialty: Indian cotton and pepper, Chinese silk and porcelain, Swahili gold and ivory, Southwest Asian horses. Port cities and states grew rich by hosting or taxing that trade: Calicut welcomed foreign merchants, Gujarat collected huge customs, the Swahili city-states traded gold for porcelain, and Malacca charged every ship passing its strait."]},{"name":"Effects","cards":[{"term":"Diaspora","def":"A settlement of people away from their homeland; settlers introduce their traditions into local cultures, which influence the settlers in turn.","hook":"Settle, share, swap.","asks":[{"q":"Arab merchants settled in Calicut and kept their customs while adopting some local ones. What is this?","right":"A diaspora","wrong":[["A caravanserai, a place where merchants stayed while trading in a city","That's an inn."],["A khanate","A Mongol kingdom."],["Proto-industrialization","That's production."]],"exp":"A diaspora is a community settled away from home that shares traditions both ways."},{"q":"How does a diaspora change BOTH the settlers and the locals?","right":"Traditions flow both ways","wrong":[["The settlers completely replace the local culture with their own culture","Influence goes both ways."],["Neither changes","Both are influenced."],["Only locals change","Settlers change too."]],"exp":"Settlers introduce traditions and are influenced in turn."}]},{"term":"Merchant intermarriage","def":"Arab and Persian merchants stayed in Indian and East African ports and married local women, spreading Islam through family ties rather than missionaries or conquest.","hook":"Marriage, not missionaries.","asks":[{"q":"How did Islam spread in many Indian Ocean ports?","right":"Through merchants marrying local women","wrong":[["Through armies that conquered each port and forced people to convert","Your card says family ties, not conquest."],["Through Mongol rule","Not on this card."],["Through Chinese admirals","Not on your card."]],"exp":"Arab and Persian merchants married locally, spreading Islam through family ties."},{"q":"Compare how Islam spread in Indian Ocean ports and in West Africa.","right":"Both spread peacefully through merchants","wrong":[["Both spread mainly through military conquest by Arab and Persian armies","Both cards stress peaceful spread."],["Only West Africa had Islam","Both did."],["Neither had Islam","Both did."]],"exp":"Indian Ocean: intermarriage. West Africa: merchants and rulers' conversions, not conquest."}]},{"term":"Zheng He","def":"Ming admiral who led seven voyages (1405–1433) with fleets of up to 300 ships to show Ming power, collect tribute, and open markets; reached Southeast Asia, India, Arabia, and East Africa.","hook":"Treasure fleet, tribute.","asks":[{"q":"What were Zheng He's voyages meant to do?","right":"Show Ming power and collect tribute","wrong":[["Conquer East Africa and set up Chinese colonies along the Swahili coast","Not on your card."],["Find the Americas","Not on your card."],["Spread Islam","Not on your card."]],"exp":"To show Ming power, collect tribute and open markets."},{"q":"How far did Zheng He's fleets reach?","right":"As far as East Africa","wrong":[["Only to Japan and Korea, since Ming ships couldn't cross the open ocean","They reached East Africa."],["Europe","Not on your card."],["The Americas","Not on your card."]],"exp":"Southeast Asia, India, Arabia and East Africa."}]},{"term":"End of the voyages","def":"Confucian scholars feared foreign contact and the cost; Yongle's successor ended the voyages and discouraged sailing abroad.","hook":"Cost plus Confucians equals stop.","asks":[{"q":"Why did China stop Zheng He's voyages?","right":"Cost and Confucian fear of foreign contact","wrong":[["Zheng He's fleets were destroyed by the Portuguese navy in the Indian Ocean","Not on your card."],["The voyages found nothing","Not on your card."],["The plague","Not on your card."]],"exp":"Confucian scholars feared foreign contact and the cost."},{"q":"What was a result of ending the voyages?","right":"China discouraged sailing abroad","wrong":[["China built an even bigger fleet to send to Africa and the Middle East","It discouraged sailing."],["China conquered Malacca","Not on your card."],["China joined the Crusades","No."]],"exp":"Yongle's successor ended the voyages and discouraged sailing abroad."}]},{"term":"Indian Ocean slave trade","def":"East Africans were enslaved and sold to North Africa, the Middle East, and India, often for urban labor, household work, or soldiering.","hook":"Different from the Atlantic.","asks":[{"q":"How did the Indian Ocean slave trade differ from the later Atlantic one?","right":"Mostly urban, household and military work","wrong":[["It sent enslaved people mainly to sugar plantations in the Americas","That's the later Atlantic trade."],["It didn't involve Africans","East Africans were enslaved."],["It was only in China","To North Africa, the Middle East and India."]],"exp":"Enslaved East Africans often did urban labor, household work or soldiering."},{"q":"Where were enslaved East Africans sold in this period?","right":"North Africa, the Middle East and India","wrong":[["The Americas, where they worked on sugar plantations owned by Europeans","That's a later period."],["Only China","Not on your card."],["Only Europe","Not on your card."]],"exp":"To North Africa, the Middle East and India."}]}],"intro":["Merchants who settled abroad formed diasporas, and Arab and Persian merchants who married local women spread Islam through family ties. China's Zheng He led huge fleets to show Ming power and collect tribute, until cost and Confucian distrust of foreign contact ended the voyages. The ocean also carried enslaved East Africans, mostly for urban, household and military work."]}],"intro":["The Indian Ocean was the biggest trade network of the period. This deck covers what made sea trade grow, which ports and states got rich from it, and how it spread people, religion and slavery around the ocean."]},{"id":4,"name":"Trans-Saharan Trade","optional":false,"sections":[{"name":"Desert logistics","cards":[{"term":"Sahara and oases","def":"Huge arid desert (about the size of China) where only small oases have water; caravans traveled oasis to oasis.","hook":"Oasis, the water stop.","asks":[{"q":"Why did trans-Saharan caravans travel from oasis to oasis?","right":"Only oases had water","wrong":[["Rulers required merchants to pay taxes at every oasis they came to","Your card says water."],["Oases had markets for silk","Not the reason."],["Camels couldn't walk far","Camels go long without water."]],"exp":"In the huge arid Sahara, only small oases had water."},{"q":"How big was the Sahara, according to your card?","right":"About the size of China","wrong":[["About the size of a single city like Timbuktu, so it was easy to cross","It was huge."],["About the size of Mali","Your card compares it to China."],["Smaller than Europe's smallest country","It's huge."]],"exp":"The Sahara is about the size of China."}]},{"term":"Camel","def":"Native to Arabia; drinks over 50 gallons quickly and travels long without water; replaced horses and donkeys in North Africa after 300 CE.","hook":"Built for the desert.","asks":[{"q":"Why did camels replace horses and donkeys in North Africa?","right":"They could go long without water","wrong":[["They were faster than horses over short distances on grass and roads","The desert advantage was water."],["They were cheaper to feed meat","Camels don't eat meat."],["The Mongols brought them","Not on your card."]],"exp":"Camels drink over 50 gallons quickly and travel long without water."},{"q":"When did camels replace horses and donkeys in North Africa?","right":"After 300 CE","wrong":[["After 1200 CE, when the Mongols united the trade routes across Asia","Your card says after 300 CE."],["After 1500 CE","Your card says after 300 CE."],["Never","They did."]],"exp":"After 300 CE."}]},{"term":"Camel saddle","def":"Riding gear developed by the Somalis to carry loads of up to 600 pounds; made heavy desert freight practical.","hook":"Saddle turns camel into cargo carrier.","asks":[{"q":"What made heavy camel freight practical across the Sahara?","right":"Somali saddles carrying up to 600 pounds","wrong":[["Wheeled carts that camels pulled across the sand from oasis to oasis","Not on your card."],["Paper money","Not about freight."],["Lateen sails","Those are for ships."]],"exp":"A saddle developed by the Somalis carried loads of up to 600 pounds."},{"q":"Who developed the camel saddle on the trans-Saharan card?","right":"The Somalis","wrong":[["The Chinese, who also invented the compass and the stern rudder","Your card credits the Somalis."],["The Mongols","Not on your card."],["The Venetians","Not on your card."]],"exp":"The Somalis developed it."}]},{"term":"Trans-Saharan caravan","def":"Large organized groups with guides, provisions, and thousands of camels; family partners, credit, and agents linked cities.","hook":"Safety, supplies, trust.","asks":[{"q":"Which helped merchants trust each other across distant cities?","right":"Family partners, credit and agents","wrong":[["Mongol law codes enforced by the khan's officials in every oasis town","Not on your card."],["Customs duties","Those are taxes."],["Monsoon winds","Those are for ships."]],"exp":"Family partners, credit and agents linked cities."},{"q":"Compare trans-Saharan caravans with Silk Road caravans.","right":"Both traveled in large groups for safety","wrong":[["Trans-Saharan caravans used ships while the Silk Road caravans used camels","Both used camels."],["Silk Road caravans had no animals","They did."],["Neither had guides","Both used guides."]],"exp":"Both moved in organized groups with guides and animals."}]}],"intro":["The Sahara is about the size of China, and only its oases have water. Camels, which go long without water, made crossing possible, and Somali saddles let them carry heavy loads. Large organized caravans with guides and supplies, linked by family partners, credit and agents, kept the trade going."]},{"name":"Goods","cards":[{"term":"Gold","def":"The most precious trans-Saharan good, from West Africa; it drew foreign traders.","hook":"Gold goes north.","asks":[{"q":"Why did foreign traders come to West Africa?","right":"Its gold","wrong":[["Its silk and porcelain, which were the finest available anywhere","Those came from China."],["Its salt","Salt came from North Africa."],["Its horses","Horses came from the north."]],"exp":"Gold was the most precious trans-Saharan good and drew foreign traders."},{"q":"Which direction did gold travel?","right":"North, from West Africa","wrong":[["South, from North Africa to the trading cities of West Africa","Salt went south; gold went north."],["East to China","Not on your card."],["It didn't move","It moved north."]],"exp":"Gold went north from West Africa."}]},{"term":"Salt","def":"Came from North Africa (for example the Taghaza oasis) and was traded south for gold.","hook":"Salt goes south.","asks":[{"q":"Why was salt traded south for gold?","right":"It came from North Africa","wrong":[["It was mined in West Africa and sent north to oasis towns such as Taghaza","Taghaza is in North Africa."],["It was used as paper money","Not on your card."],["It came from China","Not on your card."]],"exp":"Salt came from North Africa, such as the Taghaza oasis."},{"q":"Which pair names the core trans-Saharan exchange?","right":"Gold for salt","wrong":[["Silk for horses, which were traded between Chinese and Central Asian merchants","That's not trans-Saharan."],["Spices for cotton","Indian Ocean goods."],["Tea for porcelain","Chinese goods."]],"exp":"Gold went north; salt went south."}]},{"term":"Trans-Saharan goods","def":"South to north: gold, ivory, slaves, kola nuts. North to south: salt, textiles, horses, copper and brass.","hook":"Gold up, salt down.","asks":[{"q":"Which good moved from north to south?","right":"Horses","wrong":[["Kola nuts, which were grown in the forests of West Africa for sale","Kola nuts went north."],["Ivory","Went north."],["Gold","Went north."]],"exp":"North to south: salt, textiles, horses, copper and brass."},{"q":"Which good moved from south to north?","right":"Kola nuts","wrong":[["Copper and brass, which were made in the north and sold in West Africa","Those went south."],["Salt","Went south."],["Textiles","Went south."]],"exp":"South to north: gold, ivory, slaves, kola nuts."}]},{"term":"Cowrie shells","def":"Small seashells used as currency in West African trading cities.","hook":"Shells as cash.","asks":[{"q":"What were cowrie shells used for in West African cities?","right":"As currency","wrong":[["As decoration for mosques and schools built by Mansa Musa in Timbuktu","Your card says currency."],["As ship ballast","Not on your card."],["As tools","Not on your card."]],"exp":"Cowrie shells were used as currency."},{"q":"Cowrie shells and Chinese flying cash appear on the same card. Which?","right":"Currencies","wrong":[["Indian Ocean profile, which lists the goods carried on dhows and junks","That card lists ships and tools."],["Proto-industrialization","That's production."],["Syncretism","That's religion."]],"exp":"The Currencies card lists silk and tin ingots, cowrie shells, coins and flying cash."}]}],"intro":["The core trade was gold for salt: gold from West Africa went north, salt from North Africa went south. Ivory, slaves and kola nuts also went north; textiles, horses, copper and brass went south. West African cities used cowrie shells as money."]},{"name":"Mali and Islam","cards":[{"term":"Mali Empire","def":"West African empire that rose in the early 1200s; taxed and protected trade and became richer than Ghana.","hook":"Mali, the gold taxman.","asks":[{"q":"How did Mali become richer than Ghana?","right":"It taxed and protected trade","wrong":[["It conquered China and took control of the Silk Roads' silk trade","Not on your card."],["It discovered oil","No."],["It ended trade","It protected trade."]],"exp":"Mali taxed and protected trade."},{"q":"Mali and the Mongols both grew rich partly by doing what?","right":"Protecting trade routes","wrong":[["Banning merchants from crossing their land without first converting","Both protected merchants."],["Building ships","Neither is known for that here."],["Avoiding taxes","Mali taxed trade."]],"exp":"Stable states that protected trade grew rich (see the Stable states card)."}]},{"term":"Sundiata","def":"Founder of Mali, the \"Lion Prince,\" who returned from exile in 1235 and defeated his rivals; likely Muslim; built the gold trade.","hook":"Lion Prince, 1235.","asks":[{"q":"Who founded Mali?","right":"Sundiata","wrong":[["Mansa Musa, the ruler famous for his lavish pilgrimage to Mecca in 1324","He ruled later."],["Ibn Battuta","A traveler."],["Zheng He","A Chinese admiral."]],"exp":"Sundiata, the \"Lion Prince,\" founded Mali."},{"q":"What did Sundiata do in 1235?","right":"Returned from exile and defeated his rivals","wrong":[["Made a lavish pilgrimage to Mecca that displayed Mali's wealth to the world","That's Mansa Musa in 1324."],["Founded Timbuktu's schools","That's Mansa Musa."],["Lost to Songhai","That's later."]],"exp":"Sundiata returned from exile in 1235 and defeated his rivals."}]},{"term":"Mansa Musa","def":"Mali ruler whose lavish 1324 pilgrimage to Mecca displayed Mali's wealth; afterward built mosques and schools in Timbuktu.","hook":"Gold to Mecca.","asks":[{"q":"What did Mansa Musa's 1324 pilgrimage show the world?","right":"Mali's wealth","wrong":[["Mali's military power, which it used to conquer Mecca on the journey","Your card says wealth."],["Mali's poverty","It showed wealth."],["That Mali was Christian","He went to Mecca."]],"exp":"His lavish pilgrimage displayed Mali's wealth."},{"q":"What did Mansa Musa do after his pilgrimage?","right":"Built mosques and schools in Timbuktu","wrong":[["Moved Mali's capital to Mecca so he could be closer to the holy city","Not on your card."],["Ended trade","Not on your card."],["Converted to Buddhism","Not on your card."]],"exp":"He built mosques and schools in Timbuktu."}]},{"term":"Timbuktu","def":"Mali city that became a world-renowned center of Islamic learning.","hook":"Timbuktu: books and gold.","asks":[{"q":"What was Timbuktu famous for?","right":"Islamic learning","wrong":[["Building the largest ships in Africa for trade across the Indian Ocean","Timbuktu is inland."],["Silk production","That's China."],["Being the Mongol capital","No."]],"exp":"Timbuktu became a world-renowned center of Islamic learning."},{"q":"Timbuktu and Samarkand were both what?","right":"Trade cities that became centers of learning","wrong":[["Ports on the Indian Ocean where monsoon ships unloaded their goods","Both are inland."],["Mongol capitals","Not on your cards."],["Buddhist cities","Both are tied to Islamic learning."]],"exp":"Both were trade \"knots\" and centers of learning."}]},{"term":"Songhai","def":"Kingdom that replaced Mali as the West African powerhouse in the late 1400s.","hook":"Songhai follows Mali.","asks":[{"q":"Which kingdom replaced Mali?","right":"Songhai","wrong":[["Ghana, which Mali had already surpassed in wealth during the 1200s","Ghana came before Mali."],["Gujarat","That's in India."],["Malacca","That's in Southeast Asia."]],"exp":"Songhai replaced Mali in the late 1400s."},{"q":"In what order did these West African powers rise?","right":"Ghana, Mali, Songhai","wrong":[["Songhai, Mali and then Ghana, which became the richest of the three","Reverse order."],["Mali, Ghana, Songhai","Mali followed Ghana."],["Mali, Songhai, Ghana","Ghana came first."]],"exp":"Mali became richer than Ghana; Songhai replaced Mali."}]},{"term":"Spread of Islam in West Africa","def":"Spread by merchants and rulers' conversions rather than conquest; most West Africans kept traditional beliefs.","hook":"Merchants carried Islam.","asks":[{"q":"How did Islam spread in West Africa?","right":"Through merchants and rulers' conversions","wrong":[["Through conquest by Arab armies that forced everyone in the region to convert","Your card says not conquest."],["Through Mongol rule","Not in West Africa."],["Through Chinese fleets","No."]],"exp":"Merchants and rulers' conversions, not conquest."},{"q":"What does \"most West Africans kept traditional beliefs\" suggest?","right":"Islam spread mainly among rulers and merchants","wrong":[["Islam was banned in West Africa and only practiced in secret by traders","Rulers converted."],["Everyone converted","Most kept traditional beliefs."],["Islam never arrived","It did."]],"exp":"Islam spread through merchants and rulers, while most people kept traditional beliefs."}]}],"intro":["Mali grew rich by taxing and protecting the gold trade. Sundiata founded it in 1235; Mansa Musa's 1324 pilgrimage to Mecca showed off its wealth, and he then built mosques and schools in Timbuktu. Islam spread through merchants and rulers' conversions, not conquest, though most people kept their traditional beliefs. Songhai later replaced Mali."]}],"intro":["Across the Sahara, camel caravans linked West Africa to the Mediterranean world. This deck covers how merchants crossed the desert, what they traded, and how the trade built the empire of Mali and spread Islam."]},{"id":5,"name":"Culture, Cities, and Travelers","optional":false,"sections":[{"name":"Religion and language","cards":[{"term":"Buddhism in East Asia","def":"Came from India along the Silk Roads; the monk Xuanzang helped popularize it in China; Korea and Japan adopted it too.","hook":"India to China to Korea and Japan.","asks":[{"q":"Which path did Buddhism follow into East Asia?","right":"India → China → Korea and Japan","wrong":[["China → India → Persia, carried west by Mongol armies after 1200","It started in India and moved east."],["Japan → Korea → China","Reverse direction."],["Arabia → Mali","That's Islam's route."]],"exp":"Buddhism came from India along the Silk Roads, then reached Korea and Japan."},{"q":"What role did the monk Xuanzang play?","right":"He helped popularize Buddhism in China","wrong":[["He founded the Ming dynasty after leading a peasant revolt against the Yuan","That's Zhu Yuanzhang."],["He translated Greek works","That's Islamic scholars."],["He sailed to Africa","That's Zheng He."]],"exp":"Xuanzang helped popularize Buddhism in China."}]},{"term":"Chan (Zen) Buddhism","def":"Syncretic faith blending Buddhism with Daoist ideas; popular with ordinary Chinese.","hook":"Buddhism plus Daoism.","asks":[{"q":"Chan Buddhism blends Buddhism with which tradition?","right":"Daoism","wrong":[["Islam, which reached China along the same Silk Road routes as Buddhism","Your card says Daoist ideas."],["Christianity","Not on your card."],["Hinduism","Not on your card."]],"exp":"Chan (Zen) blends Buddhism with Daoist ideas."},{"q":"Chan Buddhism is an example of which process?","right":"Syncretism","wrong":[["Diaspora, a community of settlers living away from their original homeland","Diaspora is about people settling."],["Intensification","That's about trade volume."],["Proto-industrialization","That's production."]],"exp":"Blending religions into a new faith is syncretism."}]},{"term":"Neo-Confucianism","def":"Syncretic faith blending rational Confucian thought with Daoist and Buddhist ideas; Korea's state ideology; spread to Japan and Vietnam.","hook":"Confucius gets a remix.","asks":[{"q":"Which country made Neo-Confucianism its state ideology?","right":"Korea","wrong":[["Mali, which adopted it after merchants brought it across the Sahara","Not on your card."],["Persia","Not on your card."],["Russia","Not on your card."]],"exp":"Korea made Neo-Confucianism its state ideology."},{"q":"Compare Chan Buddhism and Neo-Confucianism.","right":"Both blended Chinese traditions","wrong":[["Both were brought to China from Europe by merchants such as Marco Polo","Both formed in East Asia."],["Neither blended anything","Both are syncretic."],["Both rejected Daoism","Both drew on Daoism."]],"exp":"Both are syncretic: Chan mixes Buddhism and Daoism; Neo-Confucianism mixes Confucian, Daoist and Buddhist ideas."}]},{"term":"Syncretism","def":"The blending of beliefs from different religions into a new faith.","hook":"Blend, don't replace.","asks":[{"q":"Which is an example of syncretism?","right":"Chan Buddhism blending Buddhism with Daoism","wrong":[["Mongols destroying Baghdad and killing the caliph in the year 1258","That's destruction."],["Mansa Musa's pilgrimage","That's practice of one faith."],["Zheng He's voyages","Those were naval."]],"exp":"Chan Buddhism blends Buddhism with Daoist ideas: syncretism."},{"q":"How does syncretism differ from conversion?","right":"It blends faiths instead of replacing one","wrong":[["It forces people to give up their old religion and accept a new one","That's replacement, not blending."],["It ends religion","No."],["It's the same thing","Blending differs from replacing."]],"exp":"Syncretism blends beliefs into a new faith."}]},{"term":"Hinduism and Buddhism in Southeast Asia","def":"Spread by trade; the Khmer Empire's Angkor monuments show both Hindu and Buddhist influences.","hook":"Angkor shows both.","asks":[{"q":"What do Angkor's monuments show?","right":"Both Hindu and Buddhist influences","wrong":[["That Islam was the main religion of the Khmer Empire in this period","Your card says Hindu and Buddhist."],["Only Chinese influence","Not on your card."],["No religious influence","They show both."]],"exp":"The Khmer Empire's Angkor monuments show both Hindu and Buddhist influences."},{"q":"How did Hinduism and Buddhism reach Southeast Asia?","right":"Through trade","wrong":[["Through conquest by Mongol armies sent south by Kublai Khan from China","Your card says trade."],["Through Zheng He","Not on your card."],["Through European missionaries","Not on your card."]],"exp":"They spread by trade."}]},{"term":"Islam in Africa and Asia","def":"Spread by merchants, missionaries, and conquest; shaped Swahili culture, Timbuktu's learning, and South Asian architecture and language.","hook":"Islam rides the trade routes.","asks":[{"q":"Which ways did Islam spread, according to this card?","right":"Merchants, missionaries and conquest","wrong":[["Only through the Mongols, who forced every conquered people to convert","The Mongols were tolerant."],["Only through conquest","Merchants and missionaries too."],["Only through marriage","That's one way in the Indian Ocean."]],"exp":"Islam spread by merchants, missionaries and conquest."},{"q":"Which is an effect of Islam's spread named on your card?","right":"Timbuktu's learning","wrong":[["The founding of the Yuan dynasty in China by Kublai Khan in 1271","Unrelated."],["Champa rice","A crop."],["The yam","Mongol messengers."]],"exp":"Islam shaped Swahili culture, Timbuktu's learning and South Asian architecture and language."}]},{"term":"Urdu","def":"Language blending Hindi with Arabic and Persian influences after Islam reached South Asia.","hook":"Hindi plus Persian plus Arabic.","asks":[{"q":"Urdu blends Hindi with which influences?","right":"Arabic and Persian","wrong":[["Chinese and Mongol, from the Yuan officials who governed northern India","Not on your card."],["Greek and Latin","Not on your card."],["Bantu and Arabic","That's Swahili."]],"exp":"Urdu blends Hindi with Arabic and Persian."},{"q":"Urdu and Swahili are both examples of what?","right":"Languages blended through contact","wrong":[["Languages invented by rulers to keep their governments secret","They came from contact."],["Dead languages","Not on your cards."],["Chinese dialects","No."]],"exp":"Urdu (Hindi + Persian + Arabic) and Swahili (Bantu + Arabic) came from contact."}]}],"intro":["Religions spread along the routes and often blended with local beliefs (syncretism). Buddhism moved from India to China, Korea and Japan, and mixed with Daoism as Chan (Zen); Neo-Confucianism mixed Confucian, Daoist and Buddhist ideas. Hinduism and Buddhism reached Southeast Asia by trade, Islam spread across Africa and Asia, and contact produced blended languages like Urdu."]},{"name":"Technology and learning","cards":[{"term":"Gunpowder","def":"Chinese invention (used for weapons) that spread west and changed warfare.","hook":"China's boom.","asks":[{"q":"How did gunpowder change the world after it spread west?","right":"It changed warfare","wrong":[["It changed farming, since it was used to clear forests for new crops","Your card says warfare."],["It ended trade","Not on your card."],["It spread Buddhism","Not on your card."]],"exp":"Gunpowder spread west and changed warfare."},{"q":"Gunpowder and papermaking share which origin?","right":"Both were Chinese","wrong":[["Both were invented by Islamic scholars and carried to China by merchants","Both are Chinese."],["Both were Mongol","Not on your cards."],["Both came from India","Not on your cards."]],"exp":"Both are Chinese inventions that spread west."}]},{"term":"Papermaking","def":"Chinese technique that reached Europe in the 13th century; made books cheaper and raised literacy and record-keeping.","hook":"Paper makes books cheap.","asks":[{"q":"How did papermaking change Europe after the 13th century?","right":"Books got cheaper and literacy rose","wrong":[["Paper money replaced all coins in Europe within a few years of its arrival","Not on your card."],["It ended record-keeping","It improved it."],["It started the Crusades","No."]],"exp":"Paper made books cheaper and raised literacy and record-keeping."},{"q":"When did papermaking reach Europe?","right":"The 13th century","wrong":[["The 8th century, when Arab merchants revived the old Silk Road routes","Your card says 13th."],["The 18th century","Your card says 13th."],["Never","It did."]],"exp":"Papermaking reached Europe in the 13th century."}]},{"term":"Islamic scholars as translators","def":"Translated Greek classics into Arabic, saving works by Aristotle and others, and added mathematics from India and advances in medicine.","hook":"Translators saved the Greeks.","asks":[{"q":"Why do historians say Islamic scholars \"saved the Greeks\"?","right":"They translated Greek classics into Arabic","wrong":[["They protected Greece from Mongol invasion by sending armies to defend it","Your card is about translation."],["They destroyed Greek books","They saved them."],["They ignored Greek works","They translated them."]],"exp":"They translated works by Aristotle and others into Arabic."},{"q":"What did Islamic scholars add besides Greek works?","right":"Mathematics from India and medicine","wrong":[["Silk-making and porcelain techniques that they brought from China","Not on your card."],["Gunpowder","Chinese."],["Lateen sails","Not on this card."]],"exp":"They added mathematics from India and advances in medicine."}]}],"intro":["Chinese inventions like gunpowder and papermaking spread west and changed warfare and literacy. Islamic scholars translated Greek classics into Arabic, saving them, and added Indian mathematics and new medicine."]},{"name":"Cities","cards":[{"term":"Hangzhou","def":"Chinese city of about a million at the southern end of the Grand Canal; a center of culture and trade with a thriving Arab community; described by Marco Polo.","hook":"Hangzhou, Polo's wow.","asks":[{"q":"What made Hangzhou important?","right":"Size and its place on the Grand Canal","wrong":[["It was the capital of the Mongol Empire and home of the kuriltai","Not on your card."],["It was in Persia","It's Chinese."],["It was a desert oasis","It's on the Grand Canal."]],"exp":"Hangzhou had about a million people at the southern end of the Grand Canal."},{"q":"Hangzhou had a thriving Arab community. What does this show?","right":"Foreign merchants settled in Chinese cities","wrong":[["China banned all foreigners from entering its cities during this time","Arabs lived there."],["Arabs conquered Hangzhou","Not on your card."],["Hangzhou was in Arabia","It's in China."]],"exp":"An Arab community shows a merchant diaspora in China."}]},{"term":"Why cities grew","def":"Political stability, safe transport, commerce, plentiful labor, and more farm output.","hook":"Safe, busy, fed.","asks":[{"q":"Which factor would MOST help a city grow?","right":"Political stability and safe transport","wrong":[["Invasion by a foreign army that destroys the walls and markets of the city","That causes decline."],["Disease","Causes decline."],["Falling farm output","Causes decline."]],"exp":"Stability, safe transport, commerce, labor and farm output helped cities grow."},{"q":"More farm output helped cities grow. Why?","right":"It fed more people","wrong":[["It made people leave the cities to go back and work on the farms","It supported city populations."],["It ended trade","No."],["It caused disease","No."]],"exp":"Plentiful food supports larger city populations."}]},{"term":"Why cities declined","def":"Political instability and invasion, disease, and falling farm productivity.","hook":"Fights, fever, famine.","asks":[{"q":"Which card shows a city declining for reasons on the \"Why cities declined\" card?","right":"Constantinople","wrong":[["Hangzhou, which grew to about a million people on the Grand Canal","That's growth."],["Samarkand","That's growth."],["Timbuktu","That's growth."]],"exp":"Constantinople was weakened by crusade, plague and invasion."},{"q":"Which pair of causes of decline are opposites of causes of growth?","right":"Instability vs. stability; falling vs. more farm output","wrong":[["Safe transport vs. commerce, since both of them helped the city to grow","Both are growth causes."],["Plague vs. labor","Not opposites."],["Invasion vs. disease","Both cause decline."]],"exp":"Stability and farm output build cities; instability and falling output weaken them."}]},{"term":"Constantinople","def":"Walled city weakened by the Fourth Crusade (1204) and plague (1346 and 1349), then fell to the Ottomans in 1453.","hook":"Constantinople crumbles.","asks":[{"q":"Which events weakened Constantinople before 1453?","right":"The Fourth Crusade and plague","wrong":[["The Mongol conquest of the city and the founding of the Golden Horde there","Not on your card."],["Zheng He's voyages","Unrelated."],["The rise of Mali","Unrelated."]],"exp":"The Fourth Crusade (1204) and plague (1346 and 1349) weakened it."},{"q":"Who took Constantinople in 1453?","right":"The Ottomans","wrong":[["The Mongols of the Golden Horde, who had already conquered Kiev in 1240","Your card says Ottomans."],["The Ming","No."],["The Crusaders","They weakened it in 1204."]],"exp":"Constantinople fell to the Ottomans in 1453."}]}],"intro":["Cities grew when there was stability, safe transport, trade, labor and food, as in Hangzhou, a city of about a million on the Grand Canal. They declined with war, disease and falling harvests, as Constantinople did after the Fourth Crusade and the plague, before the Ottomans took it in 1453."]},{"name":"Travelers","cards":[{"term":"Marco Polo","def":"Venetian merchant who visited Kublai Khan's court and wrote about China (back in Italy by 1295); focused on trade and cities; many Europeans doubted him.","hook":"A merchant's eye.","asks":[{"q":"What did Marco Polo's account focus on?","right":"Trade and cities","wrong":[["Religious pilgrimages to Jerusalem, Rome and Spain made by Christians","That's Margery Kempe."],["Muslim lands and law","That's Ibn Battuta."],["The plague","That's Boccaccio."]],"exp":"Marco Polo focused on trade and cities."},{"q":"Why would a historian check Marco Polo against other sources?","right":"Many Europeans doubted him; his view was a merchant's","wrong":[["He wrote in Chinese, so Europeans could never read what he had written","Not on your card."],["He never left Venice","He visited Kublai's court."],["He was a Muslim scholar","That's Ibn Battuta."]],"exp":"His point of view was a merchant's, and many Europeans doubted him."}]},{"term":"Ibn Battuta","def":"Moroccan Muslim scholar who began traveling at 21 (1325) and spent about 30 years visiting mostly Muslim lands, including Mali and China; Muslim point of view.","hook":"A scholar's eye.","asks":[{"q":"Why did Ibn Battuta mostly visit Muslim lands?","right":"He was a Muslim scholar","wrong":[["He was a Venetian merchant looking for spices and silk to sell at home","That's Marco Polo."],["Non-Muslim lands were closed to all travelers","Not on your card."],["He was a Christian pilgrim","That's Margery Kempe."]],"exp":"A Moroccan Muslim scholar who visited mostly Muslim lands."},{"q":"Compare Ibn Battuta and Marco Polo as sources.","right":"A scholar's eye vs. a merchant's eye","wrong":[["Both wrote from a Christian point of view about pilgrimages to holy sites","That's Margery Kempe."],["Both were Chinese","No."],["Neither traveled","Both traveled."]],"exp":"Ibn Battuta wrote as a Muslim scholar; Polo as a merchant."}]},{"term":"Margery Kempe","def":"English Christian mystic (c. 1373–c. 1440) who dictated a book about pilgrimages to Jerusalem, Rome, and Spain; a middle-class woman's life.","hook":"A pilgrim's eye.","asks":[{"q":"What does Margery Kempe's book offer that Polo's and Ibn Battuta's don't?","right":"A middle-class Christian woman's view","wrong":[["A description of China written by someone who served in Kublai's court","That's Polo."],["A view of Mali","That's Ibn Battuta."],["A view of Mongol warfare","Not on your card."]],"exp":"Kempe shows a middle-class woman's life and Christian pilgrimages."},{"q":"Where did Margery Kempe make pilgrimages?","right":"Jerusalem, Rome and Spain","wrong":[["Mecca, Cairo and Timbuktu, following the route Mansa Musa had taken","Those are Muslim sites."],["China and India","Not on your card."],["Mali","Not on your card."]],"exp":"Jerusalem, Rome and Spain."}]},{"term":"Reading travel accounts","def":"Travel accounts are primary sources shaped by the writer's religion, culture, and purpose, so always note the point of view.","hook":"Who wrote it and why?","asks":[{"q":"Before using a travel account as evidence, what should you note first?","right":"The writer's point of view","wrong":[["Whether the writer used paper or parchment, since that proves it is genuine","Not on your card."],["Only the date","Point of view matters most."],["How long the book is","Not the point."]],"exp":"Travel accounts are shaped by the writer's religion, culture and purpose."},{"q":"Ibn Battuta criticizes customs in a non-Muslim town. How should you read that?","right":"As shaped by his Muslim point of view","wrong":[["As a completely neutral report, since travelers always describe things fairly","Accounts are shaped by the writer."],["As false","Point of view doesn't make it false."],["As Marco Polo's view","Different writer."]],"exp":"Always note the writer's religion, culture and purpose."}]}],"intro":["Travel accounts are key sources for this period, but each writer had a point of view. Marco Polo wrote as a Venetian merchant, Ibn Battuta as a Muslim scholar, and Margery Kempe as a Christian pilgrim. Always ask who wrote it, and why."]}],"intro":["Trade moved more than goods. This deck covers the religions, languages, inventions and learning that traveled the routes, why cities rose and fell, and the travelers whose accounts we use as sources."]},{"id":6,"name":"Environmental Effects","optional":false,"sections":[{"name":"Crops","cards":[{"term":"Champa rice","def":"Quick-ripening, drought- and flood-resistant rice that yielded two crops a year; came from Champa (central Vietnam), was offered to China as tribute, and fed population growth.","hook":"Fast rice, more people.","asks":[{"q":"Why did Champa rice lead to population growth in China?","right":"Two crops a year, even in drought or flood","wrong":[["It was a luxury good that elites bought at high prices from Champa","It was a staple that fed people."],["It replaced trade","No."],["It came from India","It came from Champa."]],"exp":"Quick-ripening, drought- and flood-resistant rice yielded two crops a year."},{"q":"How did Champa rice reach China?","right":"As tribute from Champa (central Vietnam)","wrong":[["Through the trans-Saharan caravans that carried goods from West Africa","Wrong network."],["From Zheng He's voyages","Not on your card."],["From the Americas","No."]],"exp":"It came from Champa and was offered to China as tribute."}]},{"term":"Bananas","def":"Indonesian seafarers brought bananas to Sub-Saharan Africa; the nutritious food boosted population and let Bantu-speaking peoples settle where yams did not grow.","hook":"Bananas, Bantu boom.","asks":[{"q":"How did bananas change Sub-Saharan Africa?","right":"Population grew; Bantu-speakers settled new areas","wrong":[["Bananas replaced gold as the main good traded north across the Sahara","Not on your card."],["They caused famine","They boosted population."],["They ended the Bantu migration","They helped it."]],"exp":"Bananas boosted population and let Bantu speakers settle where yams didn't grow."},{"q":"Who brought bananas to Sub-Saharan Africa?","right":"Indonesian seafarers","wrong":[["Chinese admirals on Zheng He's voyages, who also brought porcelain","Your card says Indonesian seafarers."],["Mongol armies","No."],["Arab caravans","Not on your card."]],"exp":"Indonesian seafarers brought bananas."}]},{"term":"Citrus crops","def":"Spread through Muslim lands and markets (such as Samarkand) into the Mediterranean.","hook":"Citrus follows Islam.","asks":[{"q":"How did citrus crops reach the Mediterranean?","right":"Through Muslim lands and markets","wrong":[["Through Chinese junks that sailed directly from China to the Mediterranean","Not on your card."],["Through the Mongol yam","Messengers."],["Through Mali","Not on your card."]],"exp":"Citrus spread through Muslim lands and markets such as Samarkand."},{"q":"Champa rice, bananas and citrus all show what?","right":"Trade networks spread crops","wrong":[["Crops never moved between regions before the Europeans arrived","They moved along trade networks."],["Crops only moved by conquest","Trade moved them too."],["Crops spread disease","Not the point."]],"exp":"Crops moved along trade networks and changed diets and populations."}]},{"term":"Sugar and cotton","def":"Caliphs' conquests spread their cultivation; later European demand for sugar fueled mass use of enslaved labor in the Americas.","hook":"Sweet, with a dark future.","asks":[{"q":"How did sugar and cotton first spread, according to your card?","right":"Through caliphs' conquests","wrong":[["Through Mongol rule, which planted them along the roads of Central Asia","Your card says caliphs' conquests."],["Through Zheng He","No."],["Through Mali","No."]],"exp":"Caliphs' conquests spread their cultivation."},{"q":"What later effect of sugar does your card warn about?","right":"European demand fueled enslaved labor","wrong":[["Sugar caused the Black Death by attracting rats into the trading ports","Not on your card."],["Sugar ended trade","No."],["Sugar replaced rice","No."]],"exp":"Later European demand for sugar fueled mass use of enslaved labor in the Americas."}]}],"intro":["New crops traveled the routes and changed populations. Champa rice gave China two harvests a year; Indonesian seafarers brought bananas to Africa, helping Bantu speakers settle new areas; citrus spread through Muslim lands; and sugar and cotton spread with the caliphs' conquests."]},{"name":"Degradation","cards":[{"term":"Environmental degradation","def":"Larger populations strained the land: overgrazing, deforestation, and soil erosion cut farm output.","hook":"More people, thinner soil.","asks":[{"q":"Why did growing populations lead to environmental degradation?","right":"More people strained the land","wrong":[["More people planted forests, which blocked sunlight from reaching the crops","Deforestation, not planting."],["Fewer people farmed","More people strained it."],["Trade stopped","Not the reason."]],"exp":"Larger populations caused overgrazing, deforestation and soil erosion."},{"q":"Which result of environmental degradation is on your card?","right":"Farm output fell","wrong":[["Trade grew much faster because there was more land available for farming","Degradation cut output."],["Population rose","It's caused by population rise."],["Forests grew","Deforestation."]],"exp":"Overgrazing, deforestation and erosion cut farm output."}]},{"term":"Overgrazing and soil erosion","def":"Overgrazing near Great Zimbabwe forced people to abandon the city in the late 1400s; deforestation and soil erosion hurt feudal Europe.","hook":"Land wears out.","asks":[{"q":"Why was Great Zimbabwe abandoned in the late 1400s?","right":"Overgrazing wore out the land","wrong":[["The Mongols invaded and destroyed the city's walls with siege weapons","Not on your card."],["The plague","Your card says overgrazing."],["A flood","Not on your card."]],"exp":"Overgrazing near Great Zimbabwe forced people to abandon the city."},{"q":"Which region does your card say was hurt by deforestation and soil erosion?","right":"Feudal Europe","wrong":[["Ming China, which cut down forests to build Zheng He's huge ships","Not on your card."],["Mali","Not on your card."],["Malacca","Not on your card."]],"exp":"Deforestation and soil erosion hurt feudal Europe."}]}],"intro":["More people meant more strain on the land: overgrazing, deforestation and soil erosion cut farm output. Overgrazing forced people to abandon Great Zimbabwe, and erosion hurt feudal Europe."]},{"name":"Plague","cards":[{"term":"Bubonic plague (Black Death)","def":"Disease that spread along trade routes from Central Asia, reaching Europe in 1347 and peaking 1347–1351; killed about a third of Europe and many millions in Asia.","hook":"Trade carried it.","asks":[{"q":"How did the Black Death reach Europe?","right":"Along trade routes from Central Asia","wrong":[["From the Americas, carried back by European ships after the voyages","Not on your card; it came from Central Asia."],["From Africa only","Your card says Central Asia."],["It started in Europe","It came along trade routes."]],"exp":"The plague spread along trade routes from Central Asia."},{"q":"About what share of Europe's people did the plague kill?","right":"About a third","wrong":[["Almost all of them, leaving only a few towns standing across Europe","Your card says about a third."],["About one in a hundred","Far more."],["None","It killed many."]],"exp":"About a third of Europe, and many millions in Asia."}]},{"term":"How the plague spread","def":"Fleas on rats and other animals traveled on ships and caravans; Mongol conquests helped transmit it.","hook":"Fleas ride the caravans.","asks":[{"q":"Why did trade help spread the plague?","right":"Fleas on rats rode ships and caravans","wrong":[["Merchants spread it on purpose to weaken their rivals in other cities","Not on your card."],["Silk carried the disease","Fleas on animals carried it."],["It spread through money","Not on your card."]],"exp":"Fleas on rats and other animals traveled on ships and caravans."},{"q":"How did Mongol conquests relate to the plague?","right":"They helped transmit it","wrong":[["They stopped it from spreading by closing the roads between their khanates","They helped spread it."],["They caused it on purpose","Not on your card."],["They had no link","They helped transmit it."]],"exp":"Mongol conquests helped transmit the plague."}]},{"term":"Effects of the plague","def":"Labor shortages raised wages and weakened feudalism; trade and cities suffered.","hook":"Fewer workers, higher wages.","asks":[{"q":"Why did wages rise after the Black Death?","right":"Fewer workers were left","wrong":[["Rulers ordered higher pay to celebrate the end of the plague in Europe","Not on your card."],["Trade boomed","Trade suffered."],["More people were born","Fewer people were left."]],"exp":"Labor shortages raised wages."},{"q":"How did the plague weaken feudalism?","right":"Higher wages gave peasants leverage","wrong":[["Feudal lords grew stronger because they owned more land per person","Your card says it weakened feudalism."],["It ended farming","No."],["It made cities grow","Cities suffered."]],"exp":"Labor shortages raised wages and weakened feudalism."}]},{"term":"Boccaccio","def":"Italian writer who lived through the plague; his Decameron was inspired by it.","hook":"Boccaccio witnessed it.","asks":[{"q":"What inspired Boccaccio's Decameron?","right":"Living through the plague","wrong":[["His travels to Kublai Khan's court with his father and uncle","That's Marco Polo."],["A pilgrimage to Jerusalem","That's Margery Kempe."],["Mansa Musa's journey","Not on your card."]],"exp":"Boccaccio lived through the plague; it inspired the Decameron."},{"q":"Why is the Decameron useful to historians of the plague?","right":"It comes from someone who lived through it","wrong":[["It is a scientific study that proved fleas on rats carried the disease","It's a literary work."],["It was written in China","He was Italian."],["It was written centuries later","He lived through it."]],"exp":"Boccaccio witnessed the plague."}]}],"intro":["The same routes that carried goods carried the Black Death. Fleas on rats rode ships and caravans from Central Asia, helped along by Mongol conquests, and the plague killed about a third of Europe. With fewer workers, wages rose and feudalism weakened. Boccaccio's Decameron came out of living through it."]}],"intro":["Trade also moved crops and diseases, and growing populations put pressure on the land. This deck covers the crops that fed growth, the damage that followed, and the Black Death."]},{"id":7,"name":"Comparing the Networks","optional":false,"sections":[{"name":"Similarities","cards":[{"term":"Shared origins","def":"All the networks built on routes older than 1200 and grew as states and empires expanded.","hook":"Old routes, new traffic.","asks":[{"q":"Which statement is true of ALL the networks?","right":"They built on routes older than 1200","wrong":[["They were all created by the Mongols after the 1206 kuriltai elected Temujin","Only the Silk Roads were united by the Mongols."],["They all used ships","Two were overland."],["They all traded gold for salt","That's trans-Saharan."]],"exp":"All built on older routes and grew as states expanded."},{"q":"How did state expansion relate to the networks' growth?","right":"Networks grew as states expanded","wrong":[["Networks shrank as states grew, because rulers banned trade with outsiders","They grew together."],["They were unrelated","They grew together."],["States ended networks","No."]],"exp":"The networks grew as states and empires expanded."}]},{"term":"Stable states","def":"Kingdoms, caliphates, city-states, and empires protected merchants and routes and funded upgrades such as compasses, lateen sails, saddles, and high-yield crops.","hook":"Safe trade needs strong rulers.","asks":[{"q":"Which pair shows stable states protecting trade?","right":"Mongols policing roads; Mali protecting trade","wrong":[["The Black Death and overgrazing, which both disrupted the trade networks","Those disrupted trade."],["Champa rice and bananas","Crops."],["Boccaccio and Kempe","Writers."]],"exp":"Strong states protected merchants and routes."},{"q":"What did stable states pay for, according to your card?","right":"Upgrades like compasses and saddles","wrong":[["Armies that closed the trade routes to merchants from rival states","They protected routes."],["The plague","No."],["The Crusades","Not on your card."]],"exp":"They funded compasses, lateen sails, saddles and high-yield crops."}]},{"term":"Trading cities as \"knots\"","def":"Each network produced trading cities that held it together: Samarkand (Silk Roads), Calicut and Malacca (Indian Ocean), Timbuktu and Gao (trans-Saharan).","hook":"Cities tie the net.","asks":[{"q":"Which city was a knot of the Indian Ocean network?","right":"Malacca","wrong":[["Samarkand, the trading city in present-day Uzbekistan known for artisans","That's Silk Roads."],["Timbuktu","Trans-Saharan."],["Gao","Trans-Saharan."]],"exp":"Calicut and Malacca held the Indian Ocean network together."},{"q":"Timbuktu and Gao were knots of which network?","right":"Trans-Saharan","wrong":[["The Indian Ocean network, which connected East Africa to India and China","They're West African inland cities."],["Silk Roads","That's Samarkand."],["Mongol yam","That's messengers."]],"exp":"Timbuktu and Gao held the trans-Saharan network together."}]},{"term":"Centralization","def":"Trade wealth encouraged centralized planning, such as Malacca's navy and standardized currencies.","hook":"Wealth builds government.","asks":[{"q":"How did trade wealth encourage centralization?","right":"It paid for planning like navies and currency","wrong":[["It made rulers weaker, since merchants took over all the government jobs","Your card says the opposite."],["It ended governments","No."],["It caused the plague","No."]],"exp":"Trade wealth funded centralized planning such as Malacca's navy and standard currencies."},{"q":"Which example from your cards shows centralization?","right":"Malacca's navy","wrong":[["Margery Kempe's book about pilgrimages to Jerusalem, Rome and Spain","A travel account."],["Champa rice","A crop."],["Feigned retreats","A tactic."]],"exp":"Malacca's navy is centralized planning funded by trade."}]},{"term":"Beyond goods","def":"Merchants, diplomats, and missionaries exchanged ways of life as well as products.","hook":"Goods plus ideas.","asks":[{"q":"Besides products, what did merchants, diplomats and missionaries exchange?","right":"Ways of life","wrong":[["Only silver coins, since goods were too heavy to carry on the long routes","Not on your card."],["Nothing else","They exchanged ideas too."],["Only weapons","Not on your card."]],"exp":"They exchanged ways of life as well as products."},{"q":"Which example shows exchange \"beyond goods\"?","right":"Hindu-Arabic numerals reaching Europe","wrong":[["Gold going north and salt going south across the Sahara Desert","Those are goods."],["Spices from Calicut","Goods."],["Porcelain from China","Goods."]],"exp":"Ideas, like numerals, moved along with goods."}]}],"intro":["All three networks built on old routes and grew as states expanded. Stable states protected merchants and paid for new tools, trading cities held each network together, trade wealth encouraged centralized government, and ideas and ways of life moved along with goods."]},{"name":"Differences","cards":[{"term":"Silk Roads profile","def":"Overland; luxury goods (silk, tea, porcelain, spices); horses, camels, and caravanserai; spread Buddhism, Neo-Confucianism, and Islam.","hook":"Land and luxuries.","asks":[{"q":"Which network carried mainly luxury goods overland?","right":"Silk Roads","wrong":[["Indian Ocean, which carried goods too heavy to move by land on dhows","That's maritime and bulk."],["Trans-Saharan","Gold and salt across the desert."],["None","The Silk Roads did."]],"exp":"Silk Roads: overland, luxury goods."},{"q":"Which religions spread along the Silk Roads, according to the profile?","right":"Buddhism, Neo-Confucianism and Islam","wrong":[["Hinduism and Christianity, carried by merchants traveling on camels","Not the profile's list."],["Only Islam","Buddhism and Neo-Confucianism too."],["No religions","Several spread."]],"exp":"Buddhism, Neo-Confucianism and Islam spread along the Silk Roads."}]},{"term":"Indian Ocean profile","def":"Maritime; monsoon-dependent; goods too heavy to move by land; dhows and junks; compass, lateen sail, astrolabe, rudder.","hook":"Sea, bulk, monsoon.","asks":[{"q":"Why could the Indian Ocean carry goods the Silk Roads couldn't?","right":"Ships moved goods too heavy for land","wrong":[["The ocean was safer from bandits because the Mongols patrolled it","Not on your card."],["Ships were faster than camels in every season","Monsoons limited timing."],["Only the ocean had luxury goods","Silk Roads had luxuries."]],"exp":"Indian Ocean trade moved goods too heavy to move by land."},{"q":"Which tools belong to the Indian Ocean profile?","right":"Compass, lateen sail, astrolabe, rudder","wrong":[["Caravanserai, camel saddles and the yam relay system of the Mongols","Those are land tools."],["Siege towers and catapults","Warfare."],["Cowries and salt","Currencies and goods."]],"exp":"Compass, lateen sail, astrolabe and rudder."}]},{"term":"Trans-Saharan profile","def":"Desert; camel caravans; gold traded for salt; load-bearing saddles; spread Islam into Sub-Saharan Africa.","hook":"Desert, gold and salt.","asks":[{"q":"Which feature belongs only to the trans-Saharan profile?","right":"Gold traded for salt","wrong":[["Monsoon winds, which decided when merchants could set out on their voyages","Indian Ocean."],["Caravanserai","Silk Roads."],["Junks","Indian Ocean."]],"exp":"Trans-Saharan: desert, camels, gold for salt."},{"q":"Which religion did trans-Saharan trade spread into Sub-Saharan Africa?","right":"Islam","wrong":[["Buddhism, which came along the same routes that carried salt to the south","Not on your card."],["Neo-Confucianism","East Asia."],["Hinduism","Southeast Asia."]],"exp":"Trans-Saharan trade spread Islam into Sub-Saharan Africa."}]},{"term":"Currencies","def":"Silk and tin ingots, cowrie shells, then metal coins and Chinese flying cash.","hook":"Each region, its own money.","asks":[{"q":"Which currencies appear on your card?","right":"Cowrie shells, coins and flying cash","wrong":[["Only gold coins, which every network used in exactly the same way","Each region had its own money."],["Credit cards","No."],["Only salt","Not the card's list."]],"exp":"Silk and tin ingots, cowrie shells, metal coins and Chinese flying cash."},{"q":"What does the currencies card show about the networks?","right":"Each region used its own money","wrong":[["All regions used one shared currency set by the Mongol Great Khan","Each region had its own."],["No one used money","Many currencies existed."],["Only China used money","Many did."]],"exp":"Each region had its own money."}]},{"term":"Maritime versus overland","def":"As production rose, maritime trade volume began to exceed overland routes, requiring larger ships and better navigation.","hook":"Ships carry more.","asks":[{"q":"As production rose, which trade began to carry more?","right":"Maritime trade","wrong":[["Overland trade, because camels could carry much more than ships could","Ships carried more."],["Neither","Maritime grew more."],["Both stopped","No."]],"exp":"Maritime trade volume began to exceed overland routes."},{"q":"What did rising maritime trade require?","right":"Larger ships and better navigation","wrong":[["More caravanserai and stronger camel saddles for the long desert routes","Those are overland."],["Fewer merchants","No."],["Ending the monsoon","Impossible."]],"exp":"Larger ships and better navigation."}]}],"intro":["The Silk Roads were overland and carried luxuries; the Indian Ocean was maritime, ran on the monsoon and carried bulk goods; the trans-Saharan routes crossed the desert by camel and traded gold for salt. Each region had its own currencies, and over time sea trade came to carry more than land trade."]},{"name":"Society","cards":[{"term":"Labor","def":"Free peasants, artisans, debt labor, and enslaved people; trade in enslaved people was common along Indian Ocean and trans-Saharan routes.","hook":"Old labor, bigger demand.","asks":[{"q":"Which form of labor was common along Indian Ocean and trans-Saharan routes?","right":"Trade in enslaved people","wrong":[["Factory work in large mills, which employed most of the people in each city","Not on your card."],["Only free peasants","Not only."],["Robots","No."]],"exp":"Trade in enslaved people was common along those routes."},{"q":"Which shows continuity in labor during this period?","right":"Old labor forms continued with more demand","wrong":[["Free labor replaced all slavery everywhere in the world after 1200","Not on your card."],["No one worked","No."],["Debt labor disappeared","It continued."]],"exp":"Free peasants, artisans, debt labor and enslaved people continued; demand grew."}]},{"term":"Gender","def":"Societies remained patriarchal; exceptions included Mongol women, Southeast Asian marketplace women, and European guild women.","hook":"Mostly patriarchal, some exceptions.","asks":[{"q":"Which is an exception to patriarchy named on your card?","right":"Mongol women","wrong":[["Chinese scholar-gentry women, who ran the civil service exams for the Yuan","Not on your card."],["Mali's kings","Not an exception."],["Venetian merchants","Not on your card."]],"exp":"Exceptions included Mongol women, Southeast Asian marketplace women and European guild women."},{"q":"Which best describes gender roles in this period?","right":"Mostly patriarchal, with some exceptions","wrong":[["Mostly equal, with women holding most of the power in trade cities","Societies remained patriarchal."],["Women ruled everywhere","No."],["No exceptions at all","Your card names exceptions."]],"exp":"Societies remained patriarchal, with some exceptions."}]},{"term":"Centers of learning","def":"Trade cities such as Canton, Samarkand, Timbuktu, Cairo, and Venice became educational centers.","hook":"Trade cities study too.","asks":[{"q":"Which list are all trade cities that became centers of learning?","right":"Canton, Samarkand, Timbuktu, Cairo, Venice","wrong":[["Kiev, Baghdad and Kashgar, which were all destroyed by conquerors","Not this card's list."],["Great Zimbabwe only","Not on this card."],["Dadu only","Not on this card."]],"exp":"Canton, Samarkand, Timbuktu, Cairo and Venice."},{"q":"Why did trade cities also become centers of learning?","right":"Wealth and people from many places gathered there","wrong":[["Rulers banned trade there so that people would have time to study instead","Trade continued."],["They were far from trade","They were trade hubs."],["Only monks lived there","Merchants did too."]],"exp":"Trade brought wealth, people and ideas together."}]},{"term":"Environmental processes","def":"Plague outbreaks and environmental strain (deforestation, overgrazing) accompanied growth.","hook":"Growth has costs.","asks":[{"q":"Which costs accompanied the growth of trade?","right":"Plague and environmental strain","wrong":[["Falling populations everywhere and the end of all long-distance trade","Growth continued in many places."],["More forests","Deforestation."],["Fewer diseases","Plague spread."]],"exp":"Plague outbreaks and environmental strain accompanied growth."},{"q":"Which pair connects trade growth to an environmental cost?","right":"Bigger populations → overgrazing","wrong":[["Mongol stability → more forests growing back along the Silk Roads","Not on your cards."],["Plague → more workers","Plague meant fewer workers."],["Champa rice → fewer people","It raised population."]],"exp":"Growth strained the land through overgrazing and deforestation."}]}],"intro":["Growth didn't change everything. Labor still included peasants, artisans, debt labor and enslaved people, and most societies stayed patriarchal, with some exceptions. Trade cities became centers of learning, and growth brought costs: plague and environmental strain."]}],"intro":["AP questions ask you to compare. This deck lines up the Silk Roads, the Indian Ocean and the trans-Saharan routes: what they shared, how they differed, and what their societies looked like."]}],"sq":[{"id":"SQ1","deck":1,"q":"A classmate claims, \"The Silk Roads were created after 1200 when the Mongols and merchants built brand-new routes.\" Which reply is most accurate?","opts":["Mongols laid out the first overland routes, and merchants later added caravanserai and credit along them.","They vanished after the Han and Rome fell, so the post-1200 network had no earlier trade behind it.","They were revived by Arab merchants in the 8th–9th centuries; after 1200 they carried more goods farther.","Merchants opened them to reach Europe, since Chinese demand for gold and silver was already strong."],"ans":2,"exp":"The Unit 2 rule is growth and intensification of existing routes. The wrong answers either credit the Mongols with creating the routes or treat the network as new or disconnected from earlier trade.","why":["The Mongols did not lay out the first overland routes; the routes already existed and the Mongols united them.","The routes were not dead after the Han and Rome fell; they were revived by Arab merchants before 1200.","","This invents a reason for opening the routes; the textbook describes revival and growth of existing routes."]},{"id":"SQ2","deck":1,"q":"Why did Chinese authorities develop flying cash for merchants?","opts":["Mongol rulers demanded that customs duties be paid in paper to fund the caravanserai network.","Bulky copper coins hampered large trades, so deposits in one city could be redeemed in another.","China lacked a money economy, so paper credit was introduced to replace barter along the routes.","European banking houses insisted on a Chinese credit system before buying silk and porcelain."],"ans":1,"exp":"China already had a money economy, so the idea that paper credit replaced barter is wrong; the problem was that copper coins were too heavy to carry for big trades. Nothing in the textbook ties flying cash to Mongol duties or European demands.","why":["The text does not say Mongol rulers required duties to be paid in paper to fund caravanserai.","","China already had a money economy; flying cash solved the problem of carrying heavy copper coins.","Nothing says European banking houses demanded a Chinese credit system."]},{"id":"SQ3","deck":1,"q":"A student building a causal chain for Silk Road growth wants to open with the cause the textbook treats as most significant. Which should come first?","opts":["Crusaders returning to Europe with a taste for eastern spices.","Chinese artisans expanding porcelain production for export.","The Mongol Empire uniting the routes under one authority.","Improved camel saddles raising the loads caravans could carry."],"ans":2,"exp":"The textbook says no other cause had as much impact as the rise of the Mongol Empire. The other choices are real but secondary causes.","why":["The Crusades are a real cause but secondary; they did not unite the routes the way the Mongols did.","Expanded porcelain production is a real cause but not the one the textbook calls most significant.","","Better camel saddles helped, but the textbook ranks the Mongol Empire above them."]},{"id":"SQ4","deck":2,"q":"In 1250, a Russian prince keeps ruling his own city but sends regular tribute to the Golden Horde. This arrangement best illustrates the Mongols'","opts":["insistence on replacing local officials with Mongol governors.","use of forced conversion to unify conquered peoples.","habit of destroying every city that surrendered to them.","reliance on indirect rule through existing local rulers."],"ans":3,"exp":"The Mongols ruled northern Russia through existing princes who paid tribute; they chose indirect rule partly because they did not want to live in the forests. Surrendering cities were often spared, and the Mongols tolerated religions.","why":["The Mongols kept local princes in place; they did not replace them with Mongol governors.","The Mongols tolerated religions and did not force conversion.","Cities that surrendered were often spared; the Mongols did not destroy every one.",""]},{"id":"SQ5","deck":2,"q":"A Chinese scholar in the 1340s complains that foreigners fill government posts and the civil service exams have been abandoned. Which result most directly followed from this kind of resentment?","opts":["A revolt led by Zhu Yuanzhang that ended the Yuan and founded the Ming in 1368.","A Mongol retreat to Karakorum after Kublai Khan lost the title of Great Khan in 1260.","A Yuan conquest of Japan and Java that restored the dynasty's prestige among scholars.","A merger of the Yuan with the Il-khanate to counter the rising White Lotus Society."],"ans":0,"exp":"Hiring foreigners and dismantling the exams alienated the scholar-gentry; with the White Lotus Society organizing and Yuan military failures (including Japan and Java), Zhu Yuanzhang overthrew the Yuan in 1368.","why":["","The Mongols did not retreat to Karakorum because of resentment among Chinese scholars; this event is unrelated.","Yuan campaigns against Japan and Java failed and hurt the dynasty; they did not restore its prestige.","The Yuan did not merge with the Il-khanate; the White Lotus Society opposed them."]},{"id":"SQ6","deck":2,"q":"A student writes that the Mongols invented the gunpowder weapons that reshaped warfare. Which revision is most accurate?","opts":["Mongols developed gunpowder in Central Asia and carried it east into China during the Yuan.","Mongols spread and adapted Chinese gunpowder and siege technology picked up from conquered peoples.","Mongols acquired gunpowder only after the Ming, when Zheng He's fleets carried it west.","Mongols avoided new weapons, relying only on horse archery until the Black Death."],"ans":1,"exp":"Unit 2 stresses that the Mongols facilitated the transfer of technologies they did not invent. Gunpowder came from China, and the Mongols borrowed siege weapons from conquered engineers.","why":["Gunpowder was developed in China, not in Central Asia.","","The Mongols used gunpowder weapons long before the Ming and Zheng He.","The Mongols did not avoid new weapons; they borrowed siege technology from conquered peoples."]},{"id":"SQ7","deck":3,"q":"In summer, a Swahili merchant reaches Calicut with ivory and gold and wants to return to East Africa. Why would he most likely wait in port for months?","opts":["Chinese law barred foreign ships from the Indian coast until the next trading season began.","Lateen sails could not catch the wind during the summer months, so ships stayed in harbor.","The astrolabe could only fix a ship's latitude in winter, so navigators refused summer voyages.","Sailing home depended on the winds reversing, so he waited for the northeast winter monsoon."],"ans":3,"exp":"Monsoon knowledge was essential: summer winds from the southwest carried ships toward India, and the winter winds from the northeast carried them back. Merchants often stayed in port for months waiting for favorable winds.","why":["No Chinese law barred foreign ships from the Indian coast; the delay was caused by the winds.","Lateen sails could catch the wind; the problem was that the monsoon winds blew the wrong way until they reversed.","The astrolabe worked in any season; it is not what kept ships in port.",""]},{"id":"SQ8","deck":3,"q":"Malacca grew wealthy even though it had little farmland or mining. Which explanation is best supported by the textbook?","opts":["It charged fees on ships using the strait and used the revenue to build a navy.","It sold surplus rice from large farms to the fleets of Zheng He.","It mined tin and gold on the peninsula for export to Arabia and India.","It manufactured porcelain for Muslim buyers using imported Persian cobalt."],"ans":0,"exp":"Malacca's prosperity rested on trade, not agriculture, mining, or manufacturing: fees on passing ships funded a navy that kept the strait safe.","why":["","Malacca had little farmland and did not sell rice to Zheng He's fleets as its source of wealth.","The scenario says Malacca had little mining, so mining tin and gold cannot explain its wealth.","Malacca grew rich from trade fees, not from manufacturing porcelain."]},{"id":"SQ9","deck":3,"q":"Arab and Persian merchants settled in western Indian ports and married local women, raising their children as Muslims. This best shows that Islam often spread in South Asia through","opts":["state-run conversion programs organized by the Abbasid caliphs across the coast.","the forced migration of Muslim artisans ordered by Mongol rulers.","merchant settlement and intermarriage, not only through missionaries or armies.","Chinese tribute missions that required local rulers to convert."],"ans":2,"exp":"The textbook says Dar al-Islam merchants brought Islam to southern Asia through intermarriage, not missionary work or conquest alone. The other choices describe mechanisms the text does not support.","why":["The Abbasid caliphs did not run conversion programs across the coast; merchants spread Islam by settling and marrying.","The Mongols did not order Muslim artisans to migrate to spread Islam.","","Chinese tribute missions did not require local rulers to convert."]},{"id":"SQ10","deck":4,"q":"Which description of exchange across the Sahara is accurate?","opts":["Gold moved north and salt moved south, with horses also flowing from the north.","Salt moved north from the Sahel to pay for gold produced in North African mines.","Camels carried silk south while West Africans sent porcelain north across the desert.","Gold and salt both traveled south from the Mediterranean to pay for horses."],"ans":0,"exp":"Gold, ivory, slaves, and kola nuts went north; salt, textiles, horses, and metals went south. The wrong answers reverse the directions or import goods from other networks.","why":["","This reverses the direction: salt moved south and gold moved north.","Silk and porcelain belong to the Silk Roads and Indian Ocean, not to Sahara trade.","Gold traveled north, not south; this reverses the direction of exchange."]},{"id":"SQ11","deck":4,"q":"A student writes, \"Mali created the trans-Saharan trade in the 1200s.\" Which revision best fits the evidence?","opts":["Mali built the first caravan routes after Ghana weakened and then invited Muslim merchants to use them.","Mali grew rich taxing and protecting a trade that already existed before its rise.","Mali began the gold trade when Sundiata learned of Saharan salt mines while in exile.","Mali expanded an older trade, but only after Songhai conquests opened routes to North Africa."],"ans":1,"exp":"Trans-Saharan trade grew with Muslim merchants in the 7th–8th centuries and was already famous by the 8th century; Mali taxed and protected it. Songhai replaced Mali later, so the claim that Songhai conquests came first is out of order.","why":["The trade already existed before Mali; Mali did not build the first routes.","","This invents a story about Sundiata and salt mines; the trade began far earlier.","Songhai replaced Mali later, so Songhai conquests could not have opened the routes first."]},{"id":"SQ12","deck":4,"q":"Camels were in North Africa by the 3rd century B.C.E., yet heavy cargo trade across the Sahara boomed much later. Which development best explains the shift?","opts":["The introduction of the horse, which was better suited to long stretches without water.","Caravanserai networks across the Sahara that housed traders and animals like Silk Road inns.","The use of cowrie shells as currency, which made payment for heavy goods easier.","A saddle developed by the Somalis that let camels carry loads of roughly 600 pounds."],"ans":3,"exp":"Without a load-bearing saddle, camels could not carry heavy trade goods. Camels replaced horses in the desert, so the claim that horses were introduced to solve the problem reverses the story.","why":["Horses are not better suited to deserts; camels replaced horses there, so this reverses the story.","Caravanserai are a Silk Road feature, not what explained the boom in Sahara trade.","Cowrie shells are a currency; they do not allow camels to carry heavier loads.",""]},{"id":"SQ13","deck":5,"q":"A Chinese monk explains Buddhist ideas using Daoist concepts his listeners already know. This best illustrates","opts":["conquest, in which a ruler imposes one religion over local traditions.","isolation, in which Chinese scholars rejected all foreign religious ideas.","syncretism, in which beliefs blend to form new faiths such as Chan Buddhism.","replacement, in which Buddhism fully displaced Daoism among ordinary Chinese."],"ans":2,"exp":"Monks related Buddhism to Daoist principles, and the blend became Chan (Zen) Buddhism. Religions usually blended with local beliefs rather than replacing them.","why":["Conquest imposes a religion; here the monk blends ideas, which is the opposite.","Isolation means rejecting foreign ideas; the Chinese here accepted and blended Buddhism.","","Replacement means Buddhism displaced Daoism, but the two blended instead."]},{"id":"SQ14","deck":5,"q":"A historian reads Marco Polo's description of Hangzhou, which stresses silk production and paper money. What is the most reasonable inference about the source?","opts":["It reflects a Muslim scholar's view, so it likely stresses religious learning and sacred law.","It reflects a merchant's view, so it likely stresses trade and should be cross-checked.","It reflects a Chinese official's view, so it likely downplays foreign trade and commerce.","It reflects a pilgrim's view, so it likely stresses sacred sites and spiritual visions."],"ans":1,"exp":"Polo was a Venetian merchant whose point of view kept him focused on trade-related matters. Ibn Battuta wrote as a Muslim scholar; Margery Kempe wrote as a pilgrim.","why":["Polo was a Venetian merchant, not a Muslim scholar; Ibn Battuta wrote as a Muslim scholar.","","Polo was a foreigner, not a Chinese official.","Polo was a merchant, not a pilgrim; Margery Kempe wrote as a pilgrim."]},{"id":"SQ15","deck":5,"q":"A student wants a city whose history shows that trade prosperity was not permanent. Which evidence about Constantinople fits best?","opts":["Founded by Mongol khans, it was abandoned when the Ming ended their rule in 1368.","Its Silk Road markets collapsed when Tamerlane ravaged it in 1389–90.","It lost its trade when monsoon patterns shifted away from the Bosporus in the 1300s.","The Fourth Crusade in 1204 and plague in the 1340s weakened it before 1453."],"ans":3,"exp":"Constantinople was weakened by the 1204 Fourth Crusade, and plague in 1346 and 1349 killed about half its people, before the Ottomans took it in 1453. Tamerlane ravaged Kashgar, not Constantinople.","why":["Constantinople was not founded by Mongol khans and was not abandoned in 1368.","Tamerlane ravaged Kashgar, not Constantinople.","Monsoon patterns did not shift away from the Bosporus; monsoons are an Indian Ocean feature.",""]},{"id":"SQ16","deck":6,"q":"How did Champa rice most directly contribute to the growth of Chinese cities?","opts":["Quick ripening and two crops a year fed more people, spurring migration and city growth.","Its tribute value led the Chinese court to move its capital to Champa
