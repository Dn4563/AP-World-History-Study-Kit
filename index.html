rch saw as heresy","wrong":[["spread Protestant Bibles to Catholic regions in Southern Europe","The Index banned them."],["train priests","That was Trent's reforms."],["start the Reformation","They opposed it."]],"exp":"Both suppressed Protestant and other banned ideas."}]},{"term":"Index of Prohibited Books","def":"The Catholic list of banned writings, including Protestant Bibles and Copernicus.","hook":"The banned list.","asks":[{"q":"Which Council of Trent action tried to control ideas?","right":"Publishing a list of banned books","wrong":[["Approving the sale of indulgences","Trent corrected abuses rather than expanding them."],["Founding the Anglican Church","Henry VIII did that."],["Signing the Peace of Westphalia with Protestant states","That ended a war in 1648."]],"exp":"The Index banned Protestant Bibles and some scientific works."},{"q":"Copernicus on the Index shows the Church opposing what?","right":"Ideas that challenged Church teaching, even in science","wrong":[["Only Protestant Bibles, since scientific books were always allowed by the Church","Copernicus was banned too."],["Islamic law","No."],["The Jesuits","Jesuits were Catholic."]],"exp":"The list included Protestant Bibles and Copernicus."}]}],"intro":["The Catholic Church fought back with the Counter-Reformation. The Council of Trent restated Catholic teachings and fixed some abuses. The Jesuits, a new order, spread Catholicism through schools and missions as far as India and Japan. The Inquisition hunted heresy, and the Index banned books, including Protestant Bibles."]},{"name":"Wars and settlements","cards":[{"term":"Peace of Augsburg (1555)","def":"Let each German ruler choose whether his state would be Catholic or Lutheran.","hook":"The ruler picks the faith.","asks":[{"q":"Under this agreement, what could a Lutheran living in a Catholic German state do?","right":"Move to a Lutheran state","wrong":[["Vote to change the state religion","The ruler chose, not the people."],["Practice openly where he was","Residents had to follow the state religion."],["Join the Calvinist option","Calvinism was added later, in 1648."]],"exp":"People who refused the ruler's choice could move."},{"q":"Under the Peace of Augsburg, who chose a German state's religion?","right":"The ruler","wrong":[["Each person, who could freely choose Catholic, Lutheran or Calvinist belief","Rulers chose, and Calvinism wasn't included."],["The pope","No."],["The emperor alone","Each ruler chose."]],"exp":"Each ruler chose Catholic or Lutheran for his state."}]},{"term":"Henry IV of France","def":"Protestant-raised king who became Catholic in 1593, reportedly saying 'Paris is well worth a Mass.'","hook":"Faith for peace.","asks":[{"q":"What does 'Paris is well worth a Mass' suggest about Henry IV?","right":"He put political peace ahead of doctrine","wrong":[["He wanted to destroy the Catholic Church","He converted to Catholicism."],["He refused to compromise on matters of faith","He compromised."],["He was a Jesuit missionary sent to convert Paris","He was a king."]],"exp":"He converted to unify France, then granted toleration."},{"q":"Henry IV's conversion and the Edict of Nantes together show","right":"putting peace and power above one faith","wrong":[["a determined effort to destroy Protestantism in France by any means","He protected Huguenots."],["loyalty to Calvinism above the throne","He converted."],["support for the Counter-Reformation's Inquisition","Not on your cards."]],"exp":"He converted for the throne, then granted the Huguenots toleration."}]},{"term":"Edict of Nantes (1598)","def":"Henry IV's order allowing the Huguenots to practice their faith in France.","hook":"Toleration in France.","asks":[{"q":"Which act brought religious toleration to France for 87 years?","right":"Henry IV's order of 1598","wrong":[["The Peace of Augsburg","That applied to the Holy Roman Empire."],["The Council of Trent","Trent was a Catholic council."],["The English Bill of Rights","That was English."]],"exp":"It lasted until Louis XIV revoked it."},{"q":"How long did the Edict of Nantes last?","right":"Until 1685, about 87 years","wrong":[["Until 1648, when the Peace of Westphalia replaced it across all of Europe","Louis XIV revoked it in 1685."],["Forever","It was revoked."],["One year","No."]],"exp":"1598 to 1685."}]},{"term":"Revocation of the Edict of Nantes (1685)","def":"Louis XIV ended toleration for the Huguenots, and many skilled craftsmen left France.","hook":"Toleration ends, talent leaves.","asks":[{"q":"What was one economic effect of Louis XIV ending toleration in 1685?","right":"Skilled craftsmen left France","wrong":[["France became a Protestant kingdom","France stayed Catholic."],["The Thirty Years' War broke out in Germany","That began in 1618."],["The Pope lost control of the Church in Spain","That is unrelated."]],"exp":"Losing the Huguenots cost France skills and industry."},{"q":"The revocation is best used as evidence that absolutism could","right":"hurt the economy by driving out skilled people","wrong":[["strengthen the economy by uniting the whole country under one single faith","Skilled craftsmen left."],["protect minorities","It ended protection."],["weaken the king","Louis acted alone."]],"exp":"Many skilled Huguenot craftsmen left France."}]},{"term":"Thirty Years' War (1618–1648)","def":"A war that began over religion inside the Holy Roman Empire and grew into a general European conflict with famine and disease.","hook":"Religion becomes politics.","asks":[{"q":"Why is this war a good example of religion and politics mixing?","right":"It began over faith but drew in rival powers","wrong":[["It was fought only by clergy and monks","Armies of many states fought."],["It was a war between Sunni and Shi'a Muslims","It was Catholic versus Protestant."],["It ended the Protestant Reformation for good and all","Protestantism survived and was recognized."]],"exp":"It started as a religious conflict and became a general European war."},{"q":"What made the Thirty Years' War so destructive?","right":"It spread across Europe with famine and disease","wrong":[["It was fought only by small armies inside one city in the Holy Roman Empire","It became a general European war."],["It used no gunpowder","Not on your card."],["It ended in a week","Thirty years."]],"exp":"It grew into a general conflict with famine and disease."}]},{"term":"Peace of Westphalia (1648)","def":"Ended the Thirty Years' War and let areas of the Holy Roman Empire choose Catholicism, Lutheranism or Calvinism.","hook":"Three choices.","asks":[{"q":"What changed between the Peace of Augsburg and the Peace of Westphalia?","right":"Calvinism became an accepted choice","wrong":[["Lutheranism was banned","Lutheranism stayed an option."],["The Pope regained control of Germany","German states gained autonomy."],["All states had to be Catholic","Three options were allowed."]],"exp":"Augsburg: Catholic or Lutheran. Westphalia: Calvinist added."},{"q":"Which religion did Westphalia add to the choices Augsburg allowed?","right":"Calvinism","wrong":[["Lutheranism, which the Peace of Augsburg had not allowed in any German state","Augsburg allowed Lutheranism."],["Islam","No."],["Anglicanism","No."]],"exp":"Augsburg: Catholic or Lutheran. Westphalia added Calvinism."}]},{"term":"Spanish Armada (1588)","def":"Philip II's fleet sent to conquer and convert England, defeated by English naval power.","hook":"Catholic crusade at sea.","asks":[{"q":"Philip II's attempt to conquer England best shows","right":"religion driving war between states","wrong":[["Ottoman expansion into western Europe","Philip II was the Spanish king."],["a Protestant attack on Catholic Spain","Spain was the Catholic attacker."],["Peter the Great's push to westernize Russia","That is Russia."]],"exp":"Philip took the Catholic cause to England in 1588."},{"q":"The Armada is evidence of which pattern?","right":"Religious and political goals mixed in war","wrong":[["Religious peace in Europe after the Council of Trent ended the Reformation","It was a war."],["Spain allying with England","Spain attacked."],["Ottoman sea power","Spanish and English."]],"exp":"Philip II sent it to conquer and convert England."}]},{"term":"Holy Synod","def":"Council of clergymen overseen by a state official that Peter the Great created to run the Orthodox Church after abolishing the patriarch.","hook":"Church under the tsar.","asks":[{"q":"How did Peter the Great's church reform resemble Henry VIII's?","right":"The ruler placed the church under the state","wrong":[["Both made their countries Roman Catholic","Russia was Orthodox; England became Anglican."],["Both obeyed the Pope's orders on church matters","Both acted against outside church authority."],["Both ended Christianity in their countries","Both kept Christianity."]],"exp":"Both rulers brought the church under their control."},{"q":"What did Peter abolish when he created the Holy Synod?","right":"The office of patriarch","wrong":[["Serfdom, so that peasants could choose their own church and priests freely","Not on your card."],["The Orthodox Church entirely","The Synod ran it."],["The tsar's title","No."]],"exp":"He abolished the patriarch and put a state-overseen council in charge."}]}],"intro":["The split led to wars, which ended in compromises. The Peace of Augsburg (1555) let each German prince choose Catholic or Lutheran for his state. In France, Henry IV became Catholic to end the fighting and then protected Protestants with the Edict of Nantes (1598); Louis XIV later cancelled it, and many skilled Huguenots fled. The Thirty Years' War began over religion and grew into a Europe-wide war. The Peace of Westphalia (1648) ended it and added Calvinism as a third choice. Pattern: religious wars ended with rulers choosing the faith."]},{"name":"Islam","cards":[{"term":"Sunni Islam","def":"The larger branch of the Muslim faith, which holds the caliph should be chosen from Muhammad's companions; followed by the Ottomans and Mughals.","hook":"Choose the leader.","asks":[{"q":"Which empires followed the larger branch of Islam?","right":"The Ottomans and the Mughals","wrong":[["The Safavids and the Mughals","The Safavids were Shi'a."],["The Safavids and the Ottomans","The Safavids were Shi'a."],["The Qing and the Ottomans","The Qing were not Muslim."]],"exp":"Ottomans and Mughals: Sunni. Safavids: Shi'a."},{"q":"Which pair of empires were both Sunni?","right":"Ottomans and Mughals","wrong":[["Safavids and Ottomans, who fought each other over territory and trade routes","Safavids were Shi'a."],["Safavids and Mughals","Safavids were Shi'a."],["Qing and Safavids","Qing weren't Muslim."]],"exp":"The Ottomans and Mughals followed Sunni Islam."}]},{"term":"Shi'a Islam","def":"The branch of the Muslim faith that holds leadership should pass through Ali's descendants (imams); the Safavid state religion.","hook":"Follow Ali's line.","asks":[{"q":"Which belief separated the Safavids from their neighbors?","right":"Leadership through Ali's descendants","wrong":[["Rejecting the caste system","That is Sikhism."],["Salvation by faith alone","That is Lutheran."],["The Mandate of Heaven from the Chinese emperors","That is Chinese."]],"exp":"The split dates to a dispute over who should succeed Muhammad in 632."},{"q":"What do Shi'a Muslims believe about leadership?","right":"It passes through Ali's descendants","wrong":[["It goes to whoever wins a vote among Muhammad's companions after his death","That's closer to the Sunni view."],["It belongs to the Ottoman sultan","No."],["It belongs to the pope","No."]],"exp":"Leadership passes through Ali's descendants (imams)."}]},{"term":"Forced conversion in Safavid Persia","def":"Ismail I required the Sunni population to adopt Shi'a beliefs.","hook":"No room for Sunnis.","asks":[{"q":"How did Safavid religious policy differ from Akbar's?","right":"The Safavids forced their subjects to convert","wrong":[["The Safavids tolerated all religions equally","That describes Akbar."],["The Safavid rulers were Hindu","They were Shi'a Muslim."],["The Safavids abolished the tax on all non-Muslim subjects","Akbar abolished it."]],"exp":"Safavid: no tolerance. Akbar: tolerance."},{"q":"Ismail I's forced conversion is most similar to which European policy?","right":"Louis XIV revoking the Edict of Nantes","wrong":[["Henry IV's Edict of Nantes, which let Huguenots practice their faith in France","That was toleration."],["Akbar's tolerance","Tolerance."],["The millet system","Tolerance."]],"exp":"Both rulers forced religious uniformity on a minority."}]},{"term":"Shariah","def":"Islamic law covering all parts of life; it replaced Byzantine law in Ottoman lands after 1453.","hook":"Islamic law.","asks":[{"q":"After 1453, what legal change came to the former Byzantine lands?","right":"Islamic law replaced Byzantine law","wrong":[["Confucian law replaced Islamic law","Confucian law is Chinese."],["An elected parliament began writing the laws","That is English."],["The Pope's canon law took over the courts","The city became Muslim-ruled."]],"exp":"A sultan replaced the emperor, and shariah replaced Justinian's law."},{"q":"Shariah replacing Byzantine law after 1453 shows","right":"Ottoman rule changing the legal system","wrong":[["Byzantine law spreading into the Islamic world after the Ottoman conquest","The reverse."],["the end of the Ottoman Empire","Its rise."],["Christian law spreading","No."]],"exp":"Islamic law replaced Byzantine law in Ottoman lands."}]}],"intro":["Islam's two branches split over who should lead after Muhammad. Sunnis, the majority, said leaders should be chosen; Shi'a said leadership belonged to Ali's descendants. The Ottomans and Mughals were Sunni, and the Safavids made Shi'a Islam their state religion and forced Sunnis to convert. That is why Ottoman–Safavid wars were partly religious. In Ottoman lands, Islamic law (shariah) replaced Byzantine law after 1453."]},{"name":"Sikhism and syncretism","cards":[{"term":"Sikhism","def":"A faith founded by Guru Nanak in Punjab in the late 1400s, growing out of contact between Hindus and Muslims; it teaches one God, equality and rejection of caste.","hook":"One God, no caste.","asks":[{"q":"A new faith in Punjab teaches devotion to one God and rejects caste. What context explains its rise?","right":"Contact between Hindus and Muslims","wrong":[["The Protestant Reformation in Europe","That was in Europe."],["The wars between the Ottomans and the Safavids","Those were in the Middle East."],["Jesuit missions arriving in India in 1542","Sikhism began before the Jesuits arrived in 1542."]],"exp":"Sikhism grew from Hindu and Muslim interaction."},{"q":"Sikhism is best understood as a result of which context?","right":"Contact between Hindus and Muslims in Punjab","wrong":[["European missionaries arriving in India with the Jesuits and Francis Xavier","Your card says Hindu-Muslim contact."],["Mongol rule","No."],["Ottoman conquest","No."]],"exp":"It grew out of contact between Hindus and Muslims."}]},{"term":"Guru Nanak","def":"Founder of Sikhism in the late 1400s.","hook":"The first guru.","asks":[{"q":"Who founded the faith whose holy city is Amritsar?","right":"Guru Nanak","wrong":[["Akbar","Akbar promoted Din-i Ilahi."],["Ismail I","Ismail founded the Safavid Empire."],["Guru Gobind Singh","He was the tenth Guru, who founded the Khalsa."]],"exp":"Nanak was the first Guru."},{"q":"When did Guru Nanak found Sikhism?","right":"The late 1400s","wrong":[["1699, when the Khalsa community of initiated Sikhs was founded in Punjab","That was Guru Gobind Singh."],["1604","That's the Adi Granth."],["1526","Panipat."]],"exp":"Late 1400s."}]},{"term":"Adi Granth","def":"The first edition of the Sikh scripture, compiled by Guru Arjan and installed in the Golden Temple in 1604.","hook":"The holy book.","asks":[{"q":"What did the fifth Guru install at Amritsar in 1604?","right":"The first Sikh scripture","wrong":[["A statue of the emperor Akbar","Sikhs did not install a statue of Akbar."],["Luther's Ninety-Five Theses","That is Luther's."],["A Safavid royal decree on Shi'a Islam","That is unrelated."]],"exp":"Guru Arjan compiled the scripture."},{"q":"Where was the Adi Granth installed in 1604?","right":"The Golden Temple","wrong":[["The Taj Mahal, the mausoleum that Shah Jahan built for his wife in Agra","Not a Sikh site."],["Topkapi Palace","Ottoman."],["The Suleymaniye","Ottoman."]],"exp":"Guru Arjan installed it in the Golden Temple."}]},{"term":"Execution of Guru Arjan (1606)","def":"The Mughal emperor Jahangir had the fifth Sikh leader imprisoned and killed, pushing Sikhs toward armed self-defense.","hook":"Persecution breeds resistance.","asks":[{"q":"Which event pushed Sikhs toward armed self-defense?","right":"A Mughal emperor's execution of their Guru","wrong":[["Akbar's grants of land to the Sikh community","Grants were friendly."],["The Battle of Chaldiran between two Muslim empires","That was Ottoman versus Safavid."],["The Peace of Augsburg signed in Germany in 1555","That was in Germany."]],"exp":"Jahangir's execution of Guru Arjan in 1606 was a turning point."},{"q":"Which emperor ordered Guru Arjan's execution?","right":"Jahangir","wrong":[["Akbar, who changed his policy toward the Sikhs late in his long reign","Akbar granted Sikhs land."],["Babur","Too early."],["Aurangzeb","Later."]],"exp":"Jahangir had the fifth Sikh leader imprisoned and killed."}]},{"term":"Khalsa","def":"A community of initiated Sikhs committed to defending their faith, founded by Guru Gobind Singh in 1699.","hook":"Faith in arms.","asks":[{"q":"How did Sikhism change between its founding and 1699?","right":"It became organized to defend itself","wrong":[["It merged into Shi'a Islam","It stayed separate."],["It adopted the Hindu caste system","It kept rejecting caste."],["It became the official religion of the Mughal state","The Mughals were Muslim."]],"exp":"Persecution led to the Khalsa."},{"q":"The founding of the Khalsa was most directly a response to","right":"Mughal persecution","wrong":[["Akbar's land grants, which gave the Sikhs property under his policy of tolerance","That was support, not a threat."],["Portuguese missionaries","Not on your card."],["Safavid conquest","No."]],"exp":"After Arjan's execution, Sikhs turned toward armed self-defense."}]},{"term":"Din-i Ilahi","def":"Akbar's 'divine faith,' which blended Islam, Hinduism and other faiths; it did not catch on.","hook":"Akbar's blended faith.","asks":[{"q":"Akbar's attempt to blend religions into one faith is an example of","right":"syncretism that failed to spread","wrong":[["a Protestant reform of the Church","It was in India, not Europe."],["a Shi'a revival led by the Safavids","It was a blend, not a revival."],["forced conversion of all Hindus to Islam","Akbar was tolerant and did not force it."]],"exp":"Din-i Ilahi was syncretic but unpopular."},{"q":"How did Din-i Ilahi turn out?","right":"It did not catch on","wrong":[["It became the official religion of the Mughal Empire for the next two centuries","Your card says it did not catch on."],["It replaced Islam in India","No."],["It spread to Persia","No."]],"exp":"Akbar's blended faith did not catch on."}]},{"term":"Syncretism","def":"The blending of beliefs from different religions into something new.","hook":"Mix and match faith.","asks":[{"q":"Which example best shows contact between religions creating a new tradition?","right":"Sikhism in Punjab","wrong":[["The Inquisition in Spain","That punished differences."],["Shi'a Islam in Safavid Persia","That was imposed, not blended."],["The Peace of Westphalia","That allowed choices; it did not blend faiths."]],"exp":"Sikhism is your teacher's key example of syncretism."},{"q":"Which pair are both examples of syncretism?","right":"Sikhism and Din-i Ilahi","wrong":[["The Council of Trent and the Inquisition, which both defended Catholic teaching","Those defended one faith."],["Jizya and millet","Policies, not blends."],["Lepanto and Vienna","Battles."]],"exp":"Both blended beliefs from different religions."}]},{"term":"Akbar's land grants to Sikhs","def":"Akbar gave property to the new faith founded by Guru Nanak as part of his tolerance of all religions.","hook":"Tolerance in practice.","asks":[{"q":"How did Mughal policy toward the Sikhs change between Akbar and Jahangir?","right":"From support to persecution","wrong":[["From persecution to support","It went the other way."],["From Hindu to Christian rule","The Mughals were Muslim."],["No change occurred","Jahangir executed Guru Arjan."]],"exp":"Akbar granted land; Jahangir executed Guru Arjan."},{"q":"Akbar's grants and Jahangir's execution of Guru Arjan show what change?","right":"From tolerance to persecution","wrong":[["From persecution to tolerance, as the Mughals came to accept Sikh beliefs","Reversed."],["No change at all","Policy changed."],["From Sunni to Shi'a rule","No."]],"exp":"Akbar gave land; Jahangir had Arjan killed."}]}],"intro":["Syncretism means blending religions into something new. Sikhism began in Punjab in the late 1400s with Guru Nanak, out of contact between Hindus and Muslims. It teaches one God, equality and rejection of caste. Akbar tolerated it and gave it land, and his own blended faith, the Din-i Ilahi, never caught on. Under later Mughal rulers the relationship turned hostile: the emperor Jahangir had Guru Arjan executed in 1606, and in 1699 the Sikhs formed the Khalsa to defend their faith."]}],"intro":["Religion split Europe and the Islamic world in these years. In Europe, Martin Luther's protest broke the Catholic Church into Catholic and Protestant camps and led to wars. In the Islamic world, the Sunni and Shi'a split hardened into a rivalry between empires. In India, a new faith, Sikhism, grew out of contact between Hindus and Muslims."]},{"id":6,"name":"Comparing Empires (3.4)","optional":false,"sections":[{"name":"Ruling diverse peoples","cards":[{"term":"Millet system","def":"Ottoman arrangement letting each religious community run its own affairs.","hook":"Self-rule by faith.","asks":[{"q":"How did a Sunni state govern Christians and Jews without constant revolt?","right":"Religious communities governed themselves","wrong":[["It forced every subject to convert to Islam","That was the Safavid approach."],["It ended all taxes on non-Muslim subjects","Non-Muslims paid the jizya."],["It banned Christian and Jewish worship in public","Millets kept their own religious life."]],"exp":"The millet system let the Ottomans rule a diverse empire."},{"q":"The millet system is most similar to which Qing policy?","right":"Sharing offices with Han officials","wrong":[["Requiring Han men to wear the queue as a sign of loyalty to the Manchus","That forced conformity."],["The banner system","Military."],["Tribute","Revenue."]],"exp":"Both gave subject groups a place to reduce resistance."}]},{"term":"Queue","def":"The Manchu hairstyle that Han Chinese men were required to wear after 1644.","hook":"Haircut of loyalty.","asks":[{"q":"Requiring Han men to wear the Manchu hairstyle shows the Qing","right":"forcing visible signs of loyalty","wrong":[["tolerating every local custom equally","It forced a custom."],["adopting Han Chinese traditions completely","The queue was Manchu."],["ending the civil service exam for Han Chinese","The exam continued."]],"exp":"The Qing looked Chinese in some ways but stayed Manchu in others."},{"q":"The queue and the millet system show two different approaches. Which pairing is right?","right":"Queue: conformity; millet: self-rule","wrong":[["Queue: religious freedom; millet: forced conversion of every Christian and Jew","Reversed sense."],["Both: self-rule","The queue was required."],["Both: conformity","The millet let communities run themselves."]],"exp":"The Qing required a sign of loyalty; the Ottomans let communities run their own affairs."}]},{"term":"Jizya","def":"A tax that Muslim rulers charged non-Muslim subjects.","hook":"Tax on difference.","asks":[{"q":"Akbar ended it; Aurangzeb restored it. What does this tax show about each ruler?","right":"Their attitude toward non-Muslims","wrong":[["Their success at sea","It is a tax policy, not naval."],["Their relations with the Qing emperors","It concerns their own subjects."],["Their use of gunpowder weapons in battle","It is not military."]],"exp":"It is the clearest test of tolerance versus intolerance."},{"q":"Who paid the jizya?","right":"Non-Muslim subjects of Muslim rulers","wrong":[["Muslim subjects who wanted to avoid serving in the sultan's or emperor's army","It was charged to non-Muslims."],["Christian kings","No."],["Merchants only","Non-Muslims generally."]],"exp":"A tax Muslim rulers charged non-Muslims."}]},{"term":"Akbar's Hindu policy","def":"Akbar gave members of the majority faith government posts, married wives from it and exempted them from taxes on non-Muslims.","hook":"Partners, not subjects.","asks":[{"q":"Which result best explains why Akbar's reign was stable?","right":"Hindu elites supported his rule","wrong":[["He forced Hindus to convert to Islam","He did not."],["He won Kandahar from the Safavids for good","The Safavids kept Kandahar."],["He ended all trade with European merchants","Trade flourished."]],"exp":"Including Hindus won their loyalty."},{"q":"Which result of Akbar's Hindu policy is best supported?","right":"A stable reign with Hindu support","wrong":[["Constant revolts by Hindu nobles who rejected his rule throughout his reign","His policy won support."],["The founding of Sikhism","Guru Nanak founded it."],["The fall of the Mughals","Much later."]],"exp":"Posts, marriages and no jizya won Hindu loyalty."}]},{"term":"Aurangzeb's religious policy","def":"He brought back the jizya, enforced strict Sunni rule and opposed Hindu influences, which fueled rebellions.","hook":"Strictness breeds revolt.","asks":[{"q":"Compared with Akbar, Aurangzeb's religious policy led to","right":"more revolts by non-Muslims","wrong":[["greater loyalty from Hindu nobles","It reduced Hindu loyalty."],["the conversion of the Sikhs to Islam","Sikhs resisted."],["the founding of a new blended faith at court","That was Akbar's."]],"exp":"Intolerance plus costly wars weakened the empire."},{"q":"Aurangzeb's policy contributed to which development?","right":"Rebellions like the Marathas'","wrong":[["A long peace in which Hindus and Sikhs supported the Mughal state completely","It fueled rebellions."],["The Khalsa's end","No."],["A smaller empire","He made it largest."]],"exp":"Restoring the jizya and strict Sunni rule fueled rebellions."}]},{"term":"Qing legitimacy","def":"As outsiders ruling a Han majority, the Manchus adopted Confucian traditions and the Mandate of Heaven while keeping some Manchu customs.","hook":"Look Chinese, stay Manchu.","asks":[{"q":"Which pair shows the Qing both adapting to and standing apart from Chinese culture?","right":"Confucian exams and the queue","wrong":[["Tax farming and the devshirme","Those are Ottoman."],["Divine right and the Palace of Versailles","Those are French."],["Sikhism and Akbar's blended faith","Those are South Asian."]],"exp":"Exams and the Mandate looked Chinese; the queue kept Manchu control."},{"q":"Which policy is an example of the Qing keeping Manchu customs?","right":"Requiring the queue","wrong":[["Keeping the Confucian civil service exams to choose officials for the empire","That's adapting."],["Claiming the Mandate of Heaven","Adapting."],["Confucian portraits","Adapting."]],"exp":"The Qing adopted Confucian traditions but kept Manchu customs like the queue."}]}],"intro":["Every empire ruled people of other religions or ethnic groups. Some leaned on tolerance. The Ottoman millet system let each religious community run its own affairs, and Akbar gave Hindus government posts and ended the jizya, the tax on non-Muslims. Others demanded conformity. Aurangzeb brought the jizya back and enforced strict Sunni rule, which sparked revolts. The Qing did both: they adopted Chinese traditions like Confucianism to look legitimate, but forced Han men to wear the Manchu queue hairstyle as a sign of loyalty."]},{"name":"Comparing systems","cards":[{"term":"Slave soldiers","def":"Both the Ottoman sultan and the Safavid shah used enslaved troops to offset fighters loyal to tribes or local leaders.","hook":"Loyal because dependent.","asks":[{"q":"Why did both the Ottomans and Safavids recruit soldiers from minority groups?","right":"To get soldiers loyal only to the ruler","wrong":[["Because minorities paid no taxes at all","The goal was loyalty, not taxes."],["Because Islamic law required minority soldiers","It was a political choice."],["To prepare for a war against the Qing emperors","Neither fought the Qing."]],"exp":"Janissaries and ghulams had no local power base."},{"q":"Why did both the sultan and the shah prefer enslaved troops?","right":"They had no ties to tribes or local leaders","wrong":[["They were cheaper because they received no training and carried no weapons","Janissaries were elite."],["They were all Persian","No."],["They chose the ruler","No."]],"exp":"Enslaved troops offset fighters loyal to tribes or local leaders."}]},{"term":"Aztec tributary empire","def":"The Mexica ruled through force, fear and payments from conquered peoples rather than a centralized bureaucracy.","hook":"Pay or be punished.","asks":[{"q":"How did the Aztec Empire differ from the Ottoman Empire in governing?","right":"It relied on tribute and fear","wrong":[["It chose officials with a Confucian exam","That is China."],["It controlled the region with a strong navy","The Aztecs did not have a navy like the Ottomans."],["It used a forced levy of Christian boys","That is Ottoman."]],"exp":"The Aztecs were less centralized than the Eurasian empires."},{"q":"Compared with the Ottomans, the Aztecs relied more on","right":"force, fear and tribute","wrong":[["a large trained bureaucracy recruited from Christian boys in the provinces","That's the Ottoman devshirme."],["the millet system","Ottoman."],["Confucian exams","Chinese."]],"exp":"The Mexica ruled through force, fear and payments, not a central bureaucracy."}]},{"term":"Inca provinces","def":"The Sapa's realm in the Andes was divided into regions headed by nobles loyal to him, organized on a decimal system.","hook":"Counted in tens.","asks":[{"q":"Which statement about Inca government is supported by your textbook?","right":"Loyal nobles ran provinces organized by tens","wrong":[["Scholars passed written exams to become rulers","The Inca had no exam system."],["Christian boys were trained as provincial officials","That is the devshirme."],["Tax farmers bid for the right to govern provinces","That is Ottoman."]],"exp":"The Inca were organized and centralized, unlike the Aztecs."},{"q":"How were Inca provinces organized?","right":"On a decimal system under loyal nobles","wrong":[["Through tribute lists like the Codex Mendoza, collected by Mexica officials","That's the Mexica."],["By religious communities","That's millet."],["Through tax farmers","Ottoman."]],"exp":"Regions headed by loyal nobles, on a decimal system."}]},{"term":"Songhai scholar-officials","def":"The West African empire's rulers employed bureaucrats educated in the madrasas of Timbuktu.","hook":"Timbuktu trains the state.","asks":[{"q":"Where did Songhai find educated officials?","right":"In Timbuktu's Islamic schools","wrong":[["In the Forbidden City in Beijing","That is China."],["Through the Ottoman devshirme","That is Ottoman."],["At the court of Versailles in France","That is France."]],"exp":"Like the Chinese exam, it tied education to government."},{"q":"Songhai scholar-officials are most similar to which group?","right":"Qing officials chosen by Confucian exams","wrong":[["Cossacks hired by the Stroganovs to push Russian control into Siberia","Warriors, not educated officials."],["Janissaries","Soldiers."],["Daimyo","Lords."]],"exp":"Both states used educated bureaucrats."}]},{"term":"Safavid–Mughal war over trade","def":"Your textbook says religion mattered less in this rivalry than control of resources and commercial routes in present-day Afghanistan.","hook":"Follow the routes.","asks":[{"q":"According to your textbook, what was the core cause of war between the Safavids and the Mughals?","right":"Control of resources and trade routes","wrong":[["A Sunni versus Shi'a holy war and nothing else","The textbook says religion mattered less here."],["A fight over the gold mines and markets of Timbuktu","That was Morocco and Songhai."],["Competing claims to the city of Constantinople","That was the Ottomans."]],"exp":"Compare: Ottoman–Safavid had a strong religious cause; Safavid–Mughal less so."},{"q":"According to your textbook, what mattered most in the Safavid–Mughal rivalry?","right":"Resources and trade routes in Afghanistan","wrong":[["The Sunni–Shi'a split, which was the only reason the two empires ever fought","Your textbook says religion mattered less here."],["Control of Vienna","Ottoman."],["Silver from Potosí","No."]],"exp":"Your study guide stresses religion; AMSCO says resources and routes (see Watch out)."}]},{"term":"Gunpowder empires' decline","def":"They fell behind European trading companies and military technology, suffered weak leaders and succession fights, and overtaxed their peasants.","hook":"Many causes, one result.","asks":[{"q":"Which factor appears in your textbook's list of causes for the decline of the gunpowder empires?","right":"Heavy taxes to pay for large armies","wrong":[["Adopting Western military models too quickly","That is why Russia survived."],["Converting to Christianity under European pressure","They remained Muslim."],["Losing all access to gunpowder after 1600","They still had gunpowder."]],"exp":"Expensive armies burdened peasants and villages."},{"q":"Which pair of causes of decline came from inside the empires?","right":"Weak leaders and overtaxed peasants","wrong":[["European trading companies and new European military technology","Those came from outside."],["Silver and furs","Not causes."],["Lepanto and Tondibi","Battles."]],"exp":"Weak leaders, succession fights and overtaxation were internal."}]}],"intro":["These cards are ready-made comparisons. Similarity: the Ottomans and Safavids both used enslaved soldiers who were loyal only to the ruler. Difference: the Aztecs ruled loosely through force and tribute, the Incas through a tightly organized system of provinces, and Songhai through scholar-officials trained in Timbuktu. Your textbook says the Safavid–Mughal war was more about trade routes than religion. The gunpowder empires eventually declined for many reasons at once: European competition, weak rulers and heavy taxes."]}],"intro":["Every empire in this unit ruled people of many religions and ethnic groups. This deck compares how each one handled that: some tolerated differences to keep the peace, others forced people to conform. Expect questions that ask for one similarity or one difference between two empires."]},{"id":7,"name":"Scientific Revolution","optional":true,"sections":[{"name":"Reason and evidence","cards":[{"term":"Empiricism","def":"Francis Bacon's method of collecting data to support a hypothesis.","hook":"Show me the data.","asks":[{"q":"Which approach best describes the method Francis Bacon promoted in 1620?","right":"Testing ideas with collected evidence","wrong":[["Accepting church teaching on the natural world","Bacon challenged traditional ideas."],["Relying on a ruler's divine right to decide truth","That is a political claim."],["Blending different religions into one new faith","That is syncretism."]],"exp":"Empiricism relies on data, not tradition."},{"q":"Which is an example of empiricism?","right":"Collecting data to test a hypothesis","wrong":[["Accepting an idea because an ancient authority or church council said it was true","That's the opposite."],["Praying for an answer","Not empiricism."],["Guessing","Not empiricism."]],"exp":"Bacon's method: collect data to support a hypothesis."}]},{"term":"Principia (1687)","def":"Isaac Newton's book on gravity, combining Galileo's and Kepler's laws of motion.","hook":"Gravity explained.","asks":[{"q":"How did Newton's 1687 book influence later thinkers?","right":"They saw the world as orderly and rational","wrong":[["They rejected science in favor of tradition","The book advanced science."],["They restored the power of the Inquisition","That is a Church institution."],["They used it to end the Thirty Years' War","That war ended in 1648."]],"exp":"This leads into the Enlightenment (Topic 5.1)."},{"q":"Newton's Principia combined whose laws?","right":"Galileo's and Kepler's","wrong":[["Copernicus's and Bacon's, the two other scientists named in your unit cards","Your card says Galileo and Kepler."],["Luther's and Calvin's","Religious reformers."],["Aristotle's alone","No."]],"exp":"Newton combined Galileo's and Kepler's laws of motion."}]}],"intro":["Scientists began testing ideas with evidence. Francis Bacon pushed collecting data to support a hypothesis (empiricism). Isaac Newton's Principia (1687) explained gravity and motion with mathematical laws."]}],"intro":["This optional deck is a short preview of a European change in thinking: answers should come from evidence and experiments, not only from tradition or the Church."]}],"sq":[{"id":"SQ1","deck":1,"q":"A classmate writes: \"The Unit 3 empires rose because the Mongols handed them their lands.\" Which correction is most accurate?","opts":["The Mongols were still the strongest power in all of Asia in 1500","The Mongol breakup left a vacuum new states filled","The Unit 3 empires were all founded by Mongol khans","The Unit 3 empires conquered the Mongols at their peak"],"ans":1,"exp":"Contextualization: collapse, vacuum, gunpowder.","why":["Mongol power had collapsed by then.","","Only the Mughals had Mongol ancestry, through Babur.","They rose after the Mongols fell apart."]},{"id":"SQ2","deck":2,"q":"A sultan's army breaks through city walls that had stood for centuries by firing massive bronze cannons. Which development does this show?","opts":["Gunpowder drove imperial expansion","Religious tolerance won over conquered peoples","Tribute systems funded imperial armies","Maritime empires replaced land empires in Asia"],"ans":0,"exp":"Constantinople, 1453.","why":["","Cannons are military, not religious policy.","This is about weapons, not revenue.","This is a land siege, not a sea empire."]},{"id":"SQ3","deck":2,"q":"A North African army crosses the Sahara in 1591 and defeats a larger West African army with firearms. What best explains the invasion?","opts":["The invaders wanted to spread Shi'a Islam","The invaders were fleeing the Ottoman army","The invaders wanted the gold trade routes","The West Africans had attacked Spain first"],"ans":2,"exp":"Morocco took on Songhai to control the gold trade.","why":["Both states were Sunni Muslim.","The goal was gold, not escape.","","No such attack happened."]},{"id":"SQ4","deck":3,"q":"Two Muslim empires, one Sunni and one Shi'a, fight a major battle in 1514 in northwestern Iran. Which statement is most accurate?","opts":["The Safavids beat the Ottomans at Panipat","The Mughals beat the Safavids at Kandahar","The Ottomans beat the Mamluks at Chaldiran","Ottomans beat Safavids at Chaldiran"],"ans":3,"exp":"Chaldiran: Sunni Ottomans versus Shi'a Safavids.","why":["Panipat was Babur's battle in India in 1526.","Kandahar changed hands later, in the 1600s.","The Mamluks fell in 1516–1517 in Egypt and Syria.",""]},{"id":"SQ5","deck":3,"q":"Which statement best compares the two rivalries of the Safavid Empire, according to your textbook?","opts":["Religion mattered more in the Ottoman war","Religion caused both rivalries equally and nothing else mattered","Neither rivalry involved any religious disagreement","The Safavids fought both rivals mainly over the gold of Timbuktu"],"ans":0,"exp":"Watch-out: the Safavid–Mughal war centered on Kandahar and trade.","why":["","AMSCO says the Mughal war was mainly about resources and trade routes.","The Ottoman–Safavid rivalry was strongly religious.","Timbuktu was in West Africa."]},{"id":"SQ6","deck":4,"q":"An emperor lets local landholders collect taxes from peasants and keep a share as payment. Which empire and system?","opts":["Mughal zamindars","Ottoman tax farming","Mexica tribute lists","The Ming Single Whip"],"ans":0,"exp":"Zamindars kept a share of the land tax.","why":["","Ottoman tax farmers bid for the right to collect and paid a fixed sum up front.","Tribute came from conquered provinces.","That combined taxes into one silver payment."]},{"id":"SQ7","deck":4,"q":"A government orders that land taxes and labor duties be combined and paid in silver. Which state?","opts":["Ming China","Safavid Persia under Shah Abbas I","Tokugawa Japan under the shoguns","Russia under Peter the Great"],"ans":0,"exp":"The Single Whip reform, around 1580.","why":["","The Safavids are not linked to this reform.","Japan supplied silver; the reform was Chinese.","Peter introduced a head tax in 1718."]},{"id":"SQ8","deck":4,"q":"A French king builds an enormous palace, decorates it with sun imagery and makes his court revolve around him. What is he doing?","opts":["Using tax farming to raise money","Using the devshirme to train officials","Using religious tolerance to win support","Using architecture to legitimize rule"],"ans":3,"exp":"Versailles: monumental architecture plus control of nobles.","why":["The palace is about display and control.","That is Ottoman.","This is about the king's glory, not tolerance.",""]},{"id":"SQ9","deck":4,"q":"A shogun requires every regional lord to keep a home in the capital and leave his family there when he is away. What is the main goal?","opts":["Encouraging trade with Portugal","Training lords as Christian priests","Preventing lords from rebelling","Collecting tribute from China"],"ans":2,"exp":"Alternate attendance kept the daimyo under control.","why":["The policy is about lords, not foreign trade.","The Tokugawa banned Christianity.","","Japan did not collect tribute from China."]},{"id":"SQ10","deck":4,"q":"Which pair shows two rulers creating elites loyal only to themselves rather than to nobles?","opts":["The Taj Mahal and Versailles","The devshirme and the oprichnina","The Peace of Augsburg and Westphalia","The jizya and the head tax"],"ans":1,"exp":"Ottoman and Russian rulers bypassed the nobility.","why":["Those are buildings, not elites.","","Those are religious settlements.","Those are taxes."]},{"id":"SQ11","deck":5,"q":"A monk criticizes the sale of indulgences and argues that Scripture outranks Church hierarchy. What movement does he start?","opts":["The Protestant break","The Counter-Reformation","Sikhism in the Punjab region of South Asia","The Scientific Revolution"],"ans":0,"exp":"Martin Luther, 1517.","why":["","That was the Catholic response.","Sikhism grew in the Punjab.","That was based on reason and evidence, not Scripture."]},{"id":"SQ12","deck":5,"q":"A Catholic council meets from 1545 to 1563 to reaffirm Church doctrine. Which statement about it is accurate?","opts":["It started the Protestant Reformation","It ended the Thirty Years' War in Germany","It made Calvinism a legal choice","It was part of the Catholic response"],"ans":3,"exp":"The Council of Trent.","why":["Luther started that in 1517.","Westphalia ended that war in 1648.","Westphalia did that.",""]},{"id":"SQ13","deck":5,"q":"A faith in the Punjab rejects caste, teaches devotion to one God and grows amid Hindu–Muslim interaction. Which statement is accurate?","opts":["It was imposed by the Safavid shahs","It is an example of syncretism","It began as a branch of Shi'a Islam","It was founded by Akbar as Din-i Ilahi"],"ans":1,"exp":"Sikhism, founded by Guru Nanak.","why":["It grew from contact, not imposition.","","It is a separate faith.","Akbar's faith was different and unpopular."]},{"id":"SQ14","deck":5,"q":"A new Iranian dynasty makes Twelver Shi'ism the official faith, alarming its powerful Sunni neighbor. Name both empires.","opts":["Mughals of India and Ottomans","Ottomans and Mamluks","Safavids and Ottomans","Safavids and Qing"],"ans":2,"exp":"Ismail I, 1501.","why":["The Mughals ruled India, not Iran.","Neither is the Iranian dynasty.","","The Qing were not the Sunni neighbor of Iran."]},{"id":"SQ15","deck":6,"q":"Akbar ended the tax on non-Muslims; Aurangzeb restored it. Which theme does this comparison best show?","opts":["Change in religious policy within one empire","Continuity in Mughal tolerance across 150 years","The spread of Christianity into India by force","Competition between land and sea empires"],"ans":0,"exp":"Akbar vs. Aurangzeb: tolerance vs. strict Sunni rule.","why":["","The policy reversed; that is change.","The tax concerned Hindus and other non-Muslims.","This is internal religious policy."]},{"id":"SQ16","deck":6,"q":"Foreign rulers kept China's Confucian exam but required Han men to wear their own hairstyle. What does this show?","opts":["They rejected all Chinese traditions","They fully assimilated into Han culture","They ruled through religious tolerance only","They adapted while asserting control"],"ans":3,"exp":"Qing: look Chinese, stay Manchu.","why":["They kept the exam and the Mandate of Heaven.","The queue kept a Manchu marker of control.","The queue was imposed.",""]},{"id":"SQ17","deck":6,"q":"Which empire was LEAST centralized, according to your textbook?","opts":["The Ottoman Empire, with its devshirme officials","The Aztecs, who relied on tribute and fear","The Qing Empire, with its exam-chosen officials","The Inca Empire, with its decimal provinces"],"ans":1,"exp":"The Aztecs controlled Mesoamerica through force rather than bureaucracy.","why":["The devshirme created a centralized bureaucracy.","","The exam supported a strong bureaucracy.","AMSCO calls the Inca very organized."]},{"id":"SQ18","deck":3,"q":"Your textbook explains why Russia outlasted the three Islamic gunpowder empires. Which explanation fits it best?","opts":["Russia avoided war with its neighbors","Russia converted to Islam to unify its people","Russia modernized its army on Western models","Russia had no need for firearms in Siberia"],"ans":2,"exp":"Military modernization was the difference.","why":["Russia fought often.","Russia stayed Orthodox Christian.","","Cossacks used firearms in Siberia."]}],"flows":[{"id":"FC1","title":"From the Mongols to Unit 3","deck":1,"steps":["Mongol Empire splits into rival khanates","Black Death and revolts weaken Mongol power (1340s–1368)","Power vacuum across Asia","Turkic and other new states use gunpowder to fill it","Ottoman, Safavid, Mughal, Qing and Russian empires expand"]},{"id":"FC2","title":"How a land empire works (the Unit 3 pattern)","deck":4,"steps":["Gunpowder conquest","Many peoples and religions to rule","Loyal elites and professional armies","Legitimacy through religion, art and architecture","Revenue through taxes, tax farming and tribute","Overspending, weak heirs and revolts lead to decline"]},{"id":"FC3","title":"Chaldiran and its effects","deck":3,"steps":["1501: Ismail I makes Shi'a Islam the Safavid state religion","1514: Ottoman guns beat Safavid cavalry at Chaldiran","Safavid expansion west stops","Abbas I rebuilds the army with muskets, artillery and ghulams","Sunni–Shi'a divide hardens between the two empires"]},{"id":"FC4","title":"The Reformation and its wars","deck":5,"steps":["1517: Luther attacks indulgences","1521: Luther excommunicated; German princes back him","1540–1563: Jesuits approved; Council of Trent","1555: Peace of Augsburg (Catholic or Lutheran)","1618–1648: Thirty Years' War","1648: Peace of Westphalia (Calvinism added)"]},{"id":"FC5","title":"Mughal rise and decline","deck":6,"steps":["1526: Babur wins at Panipat with cannons","Akbar: tolerance, ends jizya, Hindus in government","Shah Jahan builds the Taj Mahal","Aurangzeb: restores jizya, wars in the Deccan","Revolts and an empty treasury; Britain and France gain ground"]},{"id":"FC6","title":"Sikhism: from teaching to self-defense","deck":5,"steps":["Late 1400s: Guru Nanak founds Sikhism in Punjab","Akbar grants land to Sikhs","1604: Adi Granth installed at Amritsar","1606: Jahangir executes Guru Arjan","1699: Guru Gobind Singh founds the Khalsa"]}],"trees":["AFTER THE MONGOLS: WHO FILLED THE VACUUM\n├─ Anatolia ......... Ottomans (Osman c. 1300; Mongols had broken the Seljuks)\n├─ Persia ........... Safavids (Ismail I, 1501)\n├─ India ............ Mughals (Babur, 1526; descended from Timur and Genghis Khan)\n├─ China ............ Ming (1368), then Qing (Manchus, 1644)\n├─ Russia ........... Ivan IV takes khanates of the Golden Horde's heirs (1550s)\n└─ West Africa ...... Songhai (same region and routes as Mali)","LAND-BASED EMPIRES, 1450–1750\n├─ Islamic gunpowder empires\n│  ├─ Ottoman ...... Sunni · sultan · Istanbul · Janissaries · tax farming\n│  ├─ Safavid ...... Shi'a · shah · Isfahan · ghulams · no real navy\n│  └─ Mughal ....... Sunni rulers, Hindu majority · Delhi/Agra · zamindars\n├─ Qing (Manchu) .... banners · civil service exam · Mandate of Heaven · queue\n├─ Russia ........... tsar · Cossacks · boyars · serfdom\n├─ Songhai .......... Gao, Timbuktu · Askia the Great · fell to Morocco 1591\n├─ Tokugawa Japan ... shogun · daimyo · salaried samurai · alternate attendance\n└─ Americas ......... Mexica (tribute, human sacrifice) · Inca (sun temples, provinces)","CHRISTIANITY SPLITS, 1517–1648\n├─ Roman Catholic → Catholic (Counter-) Reformation: Trent, Jesuits, Inquisition\n└─ Protestant\n   ├─ Lutheran ..... Luther, 1517 · faith alone\n   ├─ Calvinist .... Calvin, Geneva · predestination · Huguenots, Puritans\n   └─ Anglican ..... Henry VIII · Church of England","TIMELINE\n1453  Ottomans take Constantinople\n1501  Ismail I founds the Safavid Empire\n1514  Chaldiran: Ottomans beat Safavids\n1517  Luther's Ninety-Five Theses\n1526  Panipat (Mughal Empire founded) · Mohács (Ottomans take Hungary)\n1529  First siege of Vienna fails\n1540  Jesuits approved\n1545–1563  Council of Trent\n1555  Peace of Augsburg\n1571  Lepanto: Ottoman navy defeated\n1591  Tondibi: Morocco defeats Songhai\n1598  Edict of Nantes · Isfahan becomes the Safavid capital\n1603  Tokugawa shogunate begins\n1606  Guru Arjan executed by Jahangir\n1618–1648  Thirty Years' War → Peace of Westphalia\n1644  Manchus take Beijing (Qing)\n1683  Second siege of Vienna fails\n1685  Edict of Nantes revoked\n1689  English Bill of Rights\n1699  Khalsa founded\n1722  Afghan rebels sack Isfahan"],"tables":[{"title":"The land empires at a glance","rows":[["Empire","Where","How it expanded","Legitimacy","Revenue"],["Ottoman","SE Europe, Middle East, N. Africa","Cannons, Janissaries, navy","Sultan as caliph; Topkapi, Suleymaniye","Tax farming; jizya"],["Safavid","Persia (Iran)","Gunpowder army, ghulams","Shi'a Islam as state religion; Isfahan","Taxes used to push Shi'a Islam"],["Mughal","South Asia","Artillery at Panipat, alliances","Akbar's tolerance; Taj Mahal","Zamindars; jizya (ended, then restored)"],["Qing (Manchu)","China, Central and East Asia","Banner armies; conquest of Ming","Mandate of Heaven, Confucian exam, portraits","Land tax, tribute"],["Russia","Siberia to the Pacific","Cossacks with firearms","Tsar as Orthodox ruler; St. Petersburg","Serfdom; head tax (1718)"],["Songhai","West Africa (Gao, Timbuktu)","Control of trans-Saharan trade","Askia promotes Islam","Tributary states; trade"]]},{"title":"Loyal elites compared","rows":[["Empire","Elite","Where they came from","Why it worked"],["Ottoman","Janissaries and officials (devshirme)","Christian boys from the Balkans","No family ties; loyal only to the sultan"],["Safavid","Ghulams; 'men of the pen'","Georgians, Armenians, Circassians; Persians","Offset clan-loyal Qizilbash warriors"],["Qing","Scholar-officials","Confucian civil service exam","Educated, loyal; made the Manchus look Chinese"],["Tokugawa Japan","Salaried samurai","Former warriors","Paid by the shogun, not by feudal lords"],["Russia","Oprichnina; Table of Ranks","Lower officials and merchants; promotion by service","Weakened the boyars"],["France","Intendants","Royal appointees","Carried out the king's orders in the provinces"]]},{"title":"Akbar vs. Aurangzeb","rows":[["","Akbar (r. 1556–1605)","Aurangzeb (r. 1658–1707)"],["Jizya","Abolished","Restored"],["Religious policy","Tolerance; Din-i Ilahi; land grants to Sikhs","Strict Sunni rule; opposed Hindu influences"],["Hindus","Government posts, Hindu wives","Revolts by Hindus, Sikhs, Marathas"],["Result","Stable, well-governed empire","Largest size, but empty treasury and decline"]]},{"title":"Religion in the three Islamic empires (AMSCO)","rows":[["","Ottoman","Safavid","Mughal"],["Branch","Mostly Sunni","Mostly Shi'a","Sunni rulers, Hindu majority"],["Tolerance","Some under Suleiman; millet system","None; Ismail I forced Sunnis to convert","Tolerance under Akbar; less later"],["Military","Janissaries; strong navy","Qizilbash, then ghulams; no significant navy","Warriors granted villages; small navy"]]},{"title":"Legitimacy: religion, art, architecture","rows":[["Method","Examples"],["Religion","Divine right (Europe); caliph claim (Ottoman); Mandate of Heaven (Qing); Mexica human sacrifice; Askia promotes Islam (Songhai); Sapa Inca as child of the sun"],["Art","Qing imperial portraits; Ottoman miniature paintings; Mughal miniatures; European royal patronage"],["Architecture","Taj Mahal; Versailles; Topkapi and Suleymaniye; Coricancha in Cusco; St. Petersburg; Isfahan"]]},{"title":"Revenue systems","rows":[["System","Empire","How it worked"],["Tax farming","Ottoman","Private collectors pay a fixed sum and keep any surplus"],["Zamindars","Mughal","Local collectors take land taxes and keep a share"],["Tribute lists","Mexica","Conquered provinces send goods (Codex Mendoza: 38 provinces)"],["Single Whip / silver","Ming China","Land tax and labor combined into one silver payment (c. 1580)"],["Head tax","Russia","1718: tax on each person replaces land tax"]]},{"title":"Christianity splits","rows":[["","Lutheran","Calvinist","Anglican","Catholic Reformation"],["Leader","Martin Luther","John Calvin","Henry VIII","Popes; Council of Trent; Ignatius of Loyola"],["Key idea","Faith alone; Bible over Church hierarchy","Predestination; the elect","King, not Pope, heads the church","Reaffirm doctrine; fix abuses; missions"],["Where","Northern Germany, Scandinavia","Geneva, Huguenots in France, Scotland, Puritans","England","Southern Europe; missions to Asia and the Americas"]]}],"watch":[{"deck":3,"text":"Safavid–Mughal rivalry: your study guide and the 3.1 slides say religion (Shi'a Safavids vs. Sunni Mughals) sharpened it. AMSCO 3.4 says religion mattered less there than in the Ottoman–Safavid war; the core was control of resources and trade routes in present-day Afghanistan (Kandahar). Safe answer: Ottoman–Safavid = religion and territory; Safavid–Mughal = mainly territory and trade, with some religious tension."},{"deck":2,"text":"Which states are \"gunpowder empires\": your study guide groups three (Ottoman, Safavid, Mughal). The Pocket Dictionary and the 3.1 organizer add the Qing. AMSCO counts the three Islamic empires plus Russia. All of them used firearms to expand; if a question names \"the gunpowder empires\" without a list, it usually means the three Islamic ones."},{"deck":2,"text":"The Qing ended in 1911 (AMSCO: the revolution) or 1912 (your cheat sheets: the last emperor stepped down). Both are right about different events."},{"deck":3,"text":"Vienna was besieged twice. 1529 (Suleiman) = the farthest Ottoman push. 1683 = the failure that marked the turning point of Ottoman decline in Europe."},{"deck":4,"text":"Zamindars: your slides call them local landholding elites who collected taxes; AMSCO calls them paid officials under Akbar who later got land grants and, under later emperors, kept more of the taxes and built private armies. Both agree on the key point: they collected taxes and kept a share."},{"deck":4,"text":"Tax farming vs. zamindars: both let someone other than the central government collect taxes and keep part. Tax farming = Ottoman, collectors pay a fixed sum up front. Zamindars = Mughal, local collectors keep a share."},{"deck":4,"text":"Ghulams (Safavid) and Janissaries (Ottoman) are parallel: both enslaved, both from minority groups, both loyal only to the ruler. Don't mix up which empire each belongs to."},{"deck":4,"text":"Divine right (Europe) and the Mandate of Heaven (China) both tie rule to the divine, but the Mandate can be lost through bad rule, disaster or revolt."},{"deck":4,"text":"Your study guide mentions the Mughal \"mansabdar system\" in a table but no source explains it. Don't rely on it; use zamindars for Mughal administration."},{"deck":2,"text":"Same names, different spellings: Zunghars = Dzungars; Cuzco = Cusco; AMSCO prints the Qing emperor as \"Quinlong\" in one quote; it is Qianlong."},{"deck":2,"text":"Your class's practice handout spells it \"Songhay\" and \"Safavi\"; the kit uses Songhai and Safavid. Same empires."},{"deck":2,"text":"Unit 3 is about LAND-based empires. Sea empires (Portugal, Spain in the Americas) are Unit 4. Your 3.1 organizer says Europeans built ocean empires \"in the same years.\""},{"deck":5,"text":"Peace of Augsburg (1555): ruler chooses Catholic or Lutheran. Peace of Westphalia (1648): Calvinism added as a third choice."},{"deck":5,"text":"Luther = indulgences, faith alone (1517). Calvin = predestination, Geneva, Huguenots and Puritans. Henry VIII = Anglican Church, over an annulment."}],"practice":{"sections":[{"name":"MCQ Set A","mode":"practice","tips":["Read the attribution line first: who wrote it, when, and why. A Tokugawa decree, an ambassador and a modern historian each have a different purpose.","Find the main idea of each paragraph before you look at the choices. Many questions ask about one paragraph only.","For \"best used as evidence of\" or \"best illustrates\" questions, first name the bigger development the source shows (gunpowder expansion, loyal elites, legitimacy, revenue, religious change), then pick the choice that matches it.","The wrong choices are usually true-but-not-in-the-source, from the wrong empire or century, or too extreme. Cross them out with the X button.","\"Practice passage\" sources were written for this kit from your class materials. They are not real quotations, so don't quote them on the test."],"sources":{"A1":{"title":"The fall of Constantinople, 1453","attr":"Practice passage in the voice of an Ottoman court chronicler writing soon after 1453.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["Our sultan, Mehmed, son of Murad, lay before the city of the Romans. Its triple walls had turned back army after army, and the emperor of the Romans trusted in them. But the sultan had ordered cannons cast larger than any seen before, and day and night their stones struck the walls. Where the walls fell, the Janissaries of the sultan's household rushed in, and the empire of the Romans came to its end.","When the city was taken, the sultan rode to the great church of the Romans and ordered that it become a mosque, so that the call to prayer would sound where the bells had rung. He did not leave the city empty. He made it his own capital and filled its markets on the strait between the two seas, and the Christians and Jews who lived there were allowed to keep their own communities under their own leaders.","Thus the city became the seat of the sultan, and from it his armies and his ships could reach both the lands of the Franks and the lands of the Arabs."]},"A2":{"title":"The sultan's servants","attr":"Practice passage written in the style of a modern historian of the Ottoman Empire.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["The Ottoman sultans faced a problem common to rulers of large empires: the great landholding families of the provinces had their own followers and their own interests. The sultans' answer was the devshirme, a levy that took boys, usually between the ages of 8 and 20, from Christian villages in the Balkans. The boys were converted to Islam and given a demanding education in politics, the arts and warfare.","The most able were trained as scribes, tax collectors and governors; many others became Janissaries, the elite infantry who carried firearms. Although they were legally the sultan's slaves, some rose to the highest offices in the empire, positions closed to most freeborn subjects.","Because they had been cut off from their families and had no ties to local nobles, these men owed their positions to the sultan alone. In this sense the devshirme was less a form of punishment than a tool of state building, one that turned outsiders into the empire's most dependable servants."]},"A3":{"title":"Outsiders on the dragon throne","attr":"Practice passage written in the style of a modern historian of Qing China.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["When rebels seized Beijing in 1644, the Manchus of the northeast saw their chance. Already organized by Nurhaci into military units called banners, they allied with a Ming general, took the capital and proclaimed a new dynasty, the Qing. Yet conquest created a new problem. The Manchus were a small minority ruling a vast Han Chinese population that had long seen northern peoples as outsiders.","The Qing emperors answered with a careful mix of adaptation and control. They kept the Confucian civil service examinations, claimed the Mandate of Heaven, and commissioned portraits showing the emperor as a model of Confucian virtue. Important offices were shared between Manchu and Han officials.","At the same time, the Manchus did not disappear into Chinese society. Han men were required to wear the queue, the Manchu hairstyle, as a sign of loyalty, and the banners remained a separate Manchu military force. Under emperors such as Kangxi and Qianlong, this combination held together a vast and growing empire."]},"A4":{"title":"Taxes and the military in the Islamic empires","attr":"Your textbook, AMSCO Topic 3.4.","label":"Adapted from a table in your textbook (AMSCO).","table":[["","Ottoman Empire","Safavid Empire","Mughal Empire"],["Taxes","Taxes on non-Muslims; taxes on peasants","Taxation policies used to encourage adherence to Shi'a Islam","Taxes on unbelievers abolished by Akbar but reinstated later; taxes on peasants"],["Military","Warriors (often trained Janissaries) granted villages; strong navy","Qizilbash warriors helped establish the empire; no significant navy","Warriors granted villages; small navy"]]},"A5":{"title":"Beyond the Urals","attr":"Practice passage in the voice of a Russian official reporting to Moscow in the early 1600s.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["Since the great tsar Ivan took the khanates of Kazan and Astrakhan from the heirs of the Horde, the whole length of the Volga has been ours. Our merchants now sail it down to the Caspian Sea and trade with the Persians and the Turks without paying any khan for the right.","Beyond the stone mountains, the merchant family of the Stroganovs hired bands of Cossacks to go into Siberia. The native peoples there have few or no firearms; the Cossacks carry them, and so a small band can hold a whole river valley. Wherever they go they require the local peoples to pay tribute in furs, which bring great profit in Moscow.","If the sovereign continues to send men and powder, there is no river in that land that cannot be brought under his hand, as far as the sea at the eastern edge of the world."]}},"questions":[{"id":"A-1","type":"mcq","skill":"Claim in a source","topic":"Expansion","stem":"Which of the following best describes a claim made in the first paragraph?","options":["The city surrendered peacefully after the emperor negotiated with the sultan","The sultan won mainly because his navy blockaded the strait between the two seas","Cannons broke the city's long-trusted walls, letting the Janissaries in","The Janissaries dug tunnels under the walls that the Byzantine defenders could not detect"],"ans":2,"exp":"Paragraph 1: giant cannons struck the walls, and where they fell the Janissaries attacked.","why":["The passage describes cannons breaking the walls and Janissaries rushing in.","The navy is never credited; the cannons are.","","There is nothing about tunnels; the walls fell to cannon fire."],"src":"A1"},{"id":"A-2","type":"mcq","skill":"Best used as evidence","topic":"Expansion","stem":"The second paragraph can best be used as evidence that the Ottomans","options":["forced every Christian and Jew in the city to convert to Islam","made Istanbul a trading capital where non-Muslims kept their communities","planned to abandon the city once its treasures had been carried away","feared that the Byzantine Empire would soon recover and take the city back from them"],"ans":1,"exp":"He made the city his capital, filled its markets, and let Christians and Jews keep their own communities: an early form of the millet system.","why":["The passage says Christians and Jews kept their own communities.","","He repopulated it and made it his seat.","Nothing in the paragraph suggests fear of a Byzantine return."],"src":"A1"},{"id":"A-3","type":"mcq","skill":"Context / effect","topic":"Expansion","stem":"The development described in the passage most directly contributed to which of the following?","options":["The Ottoman rise as a power linking Europe and Southwest Asia","The end of Ottoman expansion, since the empire now focused only on holding the city","The spread of Shi'a Islam across Anatolia and the Balkans","A lasting alliance between the Ottomans and the Christian states of Europe"],"ans":0,"exp":"Istanbul controlled the Bosporus, and from it the Ottomans could reach both Europe and the Arab lands, as the last paragraph says.","why":["","Ottoman expansion continued for another century, under Selim I and Suleiman.","The Ottomans were Sunni; the Shi'a state was the Safavids.","The Ottomans went on to fight European states, for example at Vienna."],"src":"A1"},{"id":"A-4","type":"mcq","skill":"Historian's argument","topic":"Ruling","stem":"Which of the following best states the historian's argument?","options":["The devshirme was mainly a punishment for Christian villages that resisted Ottoman rule","The devshirme weakened the sultan by giving power to provincial landholding families","The devshirme built servants who were loyal to the sultan alone","The devshirme failed because few of the boys ever rose above the rank of soldier"],"ans":2,"exp":"Final paragraph: cut off from family and local nobles, they owed everything to the sultan.","why":["The historian says it was less a punishment than a tool of state building.","It was designed to balance those families.","","The historian says some rose to the highest offices."],"src":"A2"},{"id":"A-5","type":"mcq","skill":"Evidence for an argument","topic":"Ruling","stem":"Which evidence does the historian use to support the claim that the system offered some upward mobility?","options":["The boys were taken from Christian villages in the Balkans","Some recruits rose to the empire's highest offices","The boys were usually between the ages of 8 and 20 when taken","Janissaries were elite infantry who carried firearms"],"ans":1,"exp":"Rising from a Balkan village to the highest offices is the upward-mobility evidence (paragraph 2).","why":["Where they came from does not show that they rose.","","Their age does not show advancement.","This describes their role, not a rise in status."],"src":"A2"},{"id":"A-6","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The purpose of the system described in the passage was most similar to the purpose of","options":["the Safavid shahs' use of enslaved ghulams to offset the Qizilbash","the Mughal zamindars, who collected land taxes and kept a share for themselves","the Mexica practice of human sacrifice to show that the ruler pleased the gods","Luther's Ninety-Five Theses, which challenged the authority of the Catholic Church"],"ans":0,"exp":"Both the devshirme and the ghulams created servants who depended on the ruler alone.","why":["","Zamindars were a revenue system, not a loyal military elite.","That was about religious legitimacy.","That was a religious protest, not a way to build loyal officials."],"src":"A2"},{"id":"A-7","type":"mcq","skill":"Historian's argument","topic":"Comparison","stem":"Which of the following best states the main argument of the passage?","options":["The Qing gave up Manchu customs completely and became indistinguishable from the Ming","The Qing ruled by adopting Chinese traditions while keeping Manchu ones","The Qing ruled only by military force and ignored Confucian traditions","The Qing failed to win acceptance and lost power soon after the death of Kangxi"],"ans":1,"exp":"Adaptation (exams, Mandate, shared offices) plus control (queue, banners).","why":["The third paragraph says the Manchus did not disappear into Chinese society.","","The second paragraph lists the exams, the Mandate of Heaven and Confucian portraits.","The passage says the combination held the empire together under Kangxi and Qianlong."],"src":"A3"},{"id":"A-8","type":"mcq","skill":"Cause","topic":"Ruling","stem":"According to the passage, the Qing policies in the second paragraph developed most directly because","options":["the Ming general who helped them demanded that Confucian traditions be preserved","the banner armies had been defeated and could no longer control China","Han Chinese officials refused to wear the queue until the exams were restored","the Manchus were a small minority seen as outsiders by the Han"],"ans":3,"exp":"The end of paragraph 1 states the problem: a small minority ruling a vast population that saw them as outsiders.","why":["The passage does not say the general made any demands.","The banners remained a separate Manchu force.","The passage does not link the queue to the exams.",""],"src":"A3"},{"id":"A-9","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The Qing requirement that Han men wear the queue is most similar to which of the following?","options":["Akbar's abolition of the jizya, which removed a burden from his Hindu subjects","The Peace of Augsburg, which let German princes choose the faith of their lands","The Safavid use of the title shah, the Persian word for king","Tokugawa alternate attendance, a visible test of the lords' loyalty"],"ans":3,"exp":"Both were visible demands that showed and enforced loyalty to the ruling group.","why":["That was tolerance, not a required sign of loyalty.","That gave rulers a choice; it did not demand a loyalty sign.","A title is not a demand placed on subjects.",""],"src":"A3"},{"id":"A-10","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"Which of the following conclusions is best supported by the table?","options":["All three empires had strong navies that matched their land armies","All three empires taxed non-Muslims at the same rate throughout the period","The empires used similar tools but with different priorities","The Safavid Empire relied on the same Janissary system as the Ottomans"],"ans":2,"exp":"Same tools (taxes, warriors), different uses: Safavid taxes pushed Shi'a Islam, and only the Ottomans had a strong navy.","why":["Only the Ottomans had a strong navy; the Safavids had none to speak of.","The Mughal column shows the tax abolished and later brought back.","","The Safavid row lists Qizilbash warriors, not Janissaries."],"src":"A4"},{"id":"A-11","type":"mcq","skill":"Continuity and change","topic":"Comparison","stem":"The Mughal entry under \"Taxes\" best illustrates which of the following?","options":["A change from Akbar's tolerance to stricter rule under his successors","A continuity in Mughal policy, since the tax on unbelievers never changed","Mughal efforts to spread Shi'a Islam through the tax system","The Mughal adoption of Ottoman tax farming in South Asia"],"ans":0,"exp":"Abolished by Akbar, reinstated later (by Aurangzeb): a change in religious policy.","why":["","The table says it was abolished and then reinstated.","That describes the Safavids, not the Mughals.","The table does not mention tax farming."],"src":"A4"},{"id":"A-12","type":"mcq","skill":"Context","topic":"Expansion","stem":"The expansion described in the passage was made possible most directly by","options":["Ivan IV's conquests and firearms used against peoples without them","an alliance between the tsar and the Qing emperor to divide Central Asia","the Russian navy's control of the Pacific coast","Peter the Great's westernization of the Russian army"],"ans":0,"exp":"Paragraph 1 credits Ivan's conquests; paragraph 2 says the Cossacks' firearms let a small band control peoples without them.","why":["","No alliance is mentioned; the Cossacks acted for Moscow.","The passage describes Cossacks moving overland, not a navy.","Peter ruled later; this report is from the early 1600s."],"src":"A5"},{"id":"A-13","type":"mcq","skill":"Best used as evidence","topic":"Expansion","stem":"The passage can best be used as evidence that Russian expansion in this period was driven partly by","options":["religious motives, especially spreading Orthodox Christianity to Siberia","the need to escape Mongol rule, which still controlled Moscow","rivalry with the Ottomans for control of Siberia","economic motives such as trade routes and furs"],"ans":3,"exp":"Volga trade with Persia and the Turks, and furs that \"bring great profit in Moscow.\"","why":["Religion is never mentioned.","The passage says Russia had already taken the Horde's lands.","The Ottomans appear only as trading partners.",""],"src":"A5"}]},{"name":"MCQ Set B","mode":"practice","tips":["Read the attribution line first: who wrote it, when, and why. A Tokugawa decree, an ambassador and a modern historian each have a different purpose.","Find the main idea of each paragraph before you look at the choices. Many questions ask about one paragraph only.","For \"best used as evidence of\" or \"best illustrates\" questions, first name the bigger development the source shows (gunpowder expansion, loyal elites, legitimacy, revenue, religious change), then pick the choice that matches it.","The wrong choices are usually true-but-not-in-the-source, from the wrong empire or century, or too extreme. Cross them out with the X button.","\"Practice passage\" sources were written for this kit from your class materials. They are not real quotations, so don't quote them on the test."],"sources":{"B1":{"title":"Rules for the great lords","attr":"Practice passage in the voice of a Tokugawa shogunate decree to the daimyo, early 1600s.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["The lords of the provinces shall come to Edo and serve the shogun in alternate years, so that each lord keeps a house in Edo and a house in his own domain. When a lord returns to his domain, his wife and children shall remain in Edo. Any lord who fails to come at the appointed time shall be judged disloyal, and his domain may be taken from him.","The samurai of each domain shall no longer live by the sword alone. They shall serve as officials of local government and receive a fixed salary, keeping the peace and seeing that what is owed is collected.","The teaching of the Christians is forbidden throughout the realm, and dealings with foreigners shall be strictly limited, so that no outside power may stir up the domains against the shogun."]},"B2":{"title":"Kings above the law?","attr":"Practice passage written in the style of a modern historian of early modern Europe. The quotation from James I is as printed in your textbook (AMSCO 3.2).","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["King James I of England put it plainly: \"The state of monarchy is the supremest thing upon earth: for kings are not only God's lieutenants upon earth, and sit upon God's throne, but even by God himself they are called gods.\" Across Europe, monarchs used this idea of divine right to claim that resisting the king meant resisting God.","In France the idea reached its height under Louis XIV, who is said to have declared, \"I am the state.\" He sent royal officials called intendants into the provinces to carry out his orders and collect taxes, and he built the palace of Versailles, where the great nobles were expected to live under his eye.","England followed a different path. After decades of conflict between kings and Parliament, the Bill of Rights of 1689 required Parliament's agreement for taxes and a standing army and guaranteed legal process before arrest. By 1700, the two kingdoms that had both been ruled by divine-right monarchs had moved in opposite directions."]},"B3":{"title":"A preacher in Wittenberg","attr":"Practice passage in the voice of a German townsman writing in the 1520s.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["When I was young, the preachers came to our town selling letters of indulgence. They said that a coin in the box would shorten a soul's time of punishment, and many poor people gave what they could not spare. Bishops' offices, too, were bought and sold, and no one dared to speak against it.","Then Doctor Martin, a monk of Wittenberg, posted his theses against these practices. He taught that a person is made right with God by faith alone, not by payments or by works, and that the Scriptures stand above the word of the pope. The pope cast him out of the Church, but his words spread from town to town, and many of my neighbors came to agree with him.","Now our church is no longer the pope's. Our neighbors in the next territory still hear the Mass in Latin, and each prince decides which faith his lands will follow."]},"B4":{"title":"A new faith in Punjab","attr":"Practice passage written in the style of a modern historian of South Asia.","label":"Practice passage written from your class materials (textbook, study guide, slides); not a real quotation.","paras":["In the late 1400s, Punjab was a meeting ground of Hindu and Muslim communities. There a teacher named Guru Nanak began to preach that there is one God and that people are equal before God, whatever their caste. His followers, the Sikhs, became a community open to people of every background.","At first the new community grew under Mughal tolerance. Akbar granted it land, and in 1604 Guru Arjan installed the first edition of the Sikh scripture, the Adi Granth, in the Golden Temple. But under Akbar's successors relations soured. In 1606 the emperor Jahangir had Guru Arjan imprisoned and executed.","The Sikhs responded by organizing to defend themselves. In 1699 Guru Gobind Singh founded the Khalsa, a community of initiated Sikhs committed to protecting their faith. A movement that began as a message of unity had become, by necessity, an armed community."]},"B5":{"title":"Sources of legitimacy","attr":"Your textbook, AMSCO Topic 3.4.","label":"Adapted from a table in your textbook (AMSCO).","table":[["Source of legitimacy","Examples"],["Religion","Rulers in Islamic empires used the title \"caliph\"; European monarchs claimed divine right; Songhai rulers converted to Islam; the Aztecs (Mexica) used human sacrifice"],["Art","Portraits of Qing emperors; min
