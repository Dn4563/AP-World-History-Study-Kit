<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP World History Study Kit</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
/* Design tokens shared by the Study Hub and every kit. The course accent comes from course.json
   (set at runtime as --accent-l / --accent-d). */
:root {
  --ground: #E9EBEE; --sheet: #FFFFFF; --sunk: #F3F4F6; --ink: #1A1D21; --ink-2: #555C65; --rule: #D6DAE0;
  --ok: #23774A; --ok-wash: #E3F2E9; --bad: #B3261E; --bad-wash: #FBE9E7; --mid: #9A5B00; --mid-wash: #FCF0DC;
  --t0: #3E6FB0; --t1: #B5552F; --t2: #3D8A5F; --t3: #7A5BB5; --t4: #A8862A; --t5: #3B8C99; --t6: #A54C79; --t7: #6B7280;
  --accent: var(--accent-l, #2C5AA0); --on-accent: #FFFFFF;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 8px; --r-sm: 6px; --fast: 120ms; --mid-t: 180ms;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
  --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
  --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
  --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
    --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
    --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
    --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
  }
}
:root { --accent-wash: color-mix(in srgb, var(--accent) 10%, var(--sheet)); }

/* Study kit layout and components. Uses tokens.css only. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1rem/1.55 var(--sans); }
#app { max-width: 60rem; margin: 0 auto; padding: 0 16px 72px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font: 600 clamp(2rem, 5vw, 2.8rem)/1.05 var(--serif); letter-spacing: -.01em; }
h2 { font: 600 1.55rem/1.2 var(--serif); }
h3 { font-size: 1.05rem; font-weight: 600; margin: 22px 0 8px; }
h4 { font-size: .95rem; font-weight: 600; margin: 14px 0 6px; }
p { margin: 8px 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted, .hint { color: var(--ink-2); }
.hint { font-size: .9rem; }
.big { font-size: 1.25rem; font-weight: 600; }

/* header */
.top { padding: 22px 0 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
.hublink { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .95rem; }
.hublink:hover { color: var(--accent); }
.credit { margin: 40px 0 8px; text-align: center; font-size: .85rem; color: var(--ink-2); }
.credit a { color: inherit; }
.credit a:hover { color: var(--accent); }
.kicker { margin: 0 0 6px; color: var(--accent); font-weight: 600; }
.lede { color: var(--ink-2); max-width: 60ch; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; color: var(--ink-2); font-size: .95rem; }
.meter .bar { flex: 1 1 160px; }
.bar { display: block; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width var(--mid-t); }
.bar.low i { background: var(--bad); } .bar.mid i { background: var(--mid); } .bar.high i { background: var(--ok); }

/* tabs and chips */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); margin: 0 -16px; padding: 0 16px; }
.tabrow { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 12px 10px; color: var(--ink-2); font-weight: 600; }
.tab:hover { color: var(--ink); }
.tab[aria-current] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 13px; font-size: .92rem; }
.chip small { color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.t0 { background: var(--t0); } .dot.t1 { background: var(--t1); } .dot.t2 { background: var(--t2); } .dot.t3 { background: var(--t3); }
.dot.t4 { background: var(--t4); } .dot.t5 { background: var(--t5); } .dot.t6 { background: var(--t6); } .dot.t7 { background: var(--t7); }
main { padding-top: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 18px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; transition: background-color var(--fast), border-color var(--fast); }
.btn:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn.sec { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn.sec:hover { border-color: var(--ink-2); background: var(--sheet); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: transparent; padding: 8px 10px; min-height: 38px; font-weight: 500; }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.ghost[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:not(.ghost).danger { background: var(--sheet); border-color: var(--bad); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }

/* panels */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 24px; margin-bottom: 18px; }
.rtop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
.rtop h2 { margin-right: auto; }
.msg { color: var(--bad); font-weight: 600; }
.kbd { color: var(--ink-2); font-size: .85rem; margin-top: -6px; }

/* questions and choices */
.lockt { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-2); margin-bottom: 4px; }
.qask { color: var(--ink-2); font-weight: 600; margin: 14px 0 4px; }
.qprompt, .stem { font-size: 1.12rem; line-height: 1.5; margin: 6px 0 16px; max-width: 70ch; }
.opts { display: grid; gap: 10px; }
.opts.tf { grid-template-columns: repeat(2, minmax(0, 12rem)); }
.optrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; transition: border-color var(--fast), background-color var(--fast); }
.opt:not(:disabled):hover { border-color: var(--ink-2); }
.opt .k { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--rule); font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.opt .ot { padding-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-wash); }
.opt.sel .k { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-wash); }
.opt.right .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
.opt.wrong .k { border-color: var(--bad); background: var(--bad); color: var(--sheet); }
.opt:disabled { cursor: default; color: var(--ink); }
.crossed .opt .ot { text-decoration: line-through; color: var(--ink-2); }
.crossed .opt { opacity: .7; }
.xoff { width: 40px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--ink-2); border-radius: var(--r-sm); }
.xoff:hover { background: var(--sunk); color: var(--ink); }
.xoff[aria-pressed="true"] { color: var(--accent); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--ink-2); }
.fb.ok { background: var(--ok-wash); border-left-color: var(--ok); }
.fb.bad { background: var(--bad-wash); border-left-color: var(--bad); }
.fb p:first-child { margin-top: 0; } .fb p:last-child { margin-bottom: 0; }
.why { margin-top: 10px; padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--rule); }
.why .wh { font-size: .85rem; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.why.bad .wh { color: var(--bad); } .why.good .wh { color: var(--ok); }
.why p { margin: 6px 0 0; }
.qt { display: block; font-weight: 600; }
.whyall { margin-top: 10px; }
.whyall summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.whyall ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; }
.whyall li { padding: 10px 14px; background: var(--sunk); border-radius: var(--r-sm); }
.whyall li p { margin: 4px 0 0; }
.tag { display: inline-block; margin-top: 4px; font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.tag.ok { background: var(--ok-wash); color: var(--ok); } .tag.bad { background: var(--bad-wash); color: var(--bad); }
.hook { display: block; margin-top: 6px; color: var(--ink-2); font-size: .94rem; }
.hook b { color: var(--accent); font-weight: 600; margin-right: 4px; }
.skill { display: inline-block; font-size: .8rem; font-weight: 600; color: var(--ink-2); background: var(--sunk); border: 1px solid var(--rule); padding: 0 8px; border-radius: 999px; vertical-align: 1px; }

/* learn */
.lessonbar { margin-bottom: 14px; }
.lessonbar .rtop { margin-bottom: 8px; }
.lmap { margin-top: 14px; display: grid; gap: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; }
.lmdeck h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.lmlist { display: flex; flex-wrap: wrap; gap: 6px; }
.lm { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 10px; font-size: .9rem; }
.lm.done { color: var(--ok); }
.lm[aria-current] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; color: var(--ink); }
.deckname { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 600; font-size: .92rem; margin: 0 0 4px; }
.terms { margin: 16px 0 0; display: grid; gap: 0; }
.terms > div { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 4px 20px; padding: 13px 0; border-top: 1px solid var(--rule); }
.terms > div:first-child { border-top: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; }
.terms.guide > div { grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) auto; }
.know { align-self: start; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 4px 10px; font-size: .85rem; color: var(--ink-2); white-space: nowrap; }
.know[aria-pressed="true"] { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); font-weight: 600; }
.chain { margin: 18px 0; }
.chain figcaption { font-weight: 600; font-size: .92rem; color: var(--ink-2); margin-bottom: 8px; }
.chain ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; counter-reset: c; }
.chain li { position: relative; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: var(--r-sm); padding: 7px 12px; font-size: .95rem; }
.chain li + li { margin-left: 22px; }
.chain li + li::before { content: ""; position: absolute; left: -20px; top: 50%; width: 14px; height: 2px; background: var(--ink-2); }
.chain li + li::after { content: ""; position: absolute; left: -10px; top: calc(50% - 4px); border: 5px solid transparent; border-left-color: var(--ink-2); border-right: 0; }
.watch { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--mid); background: var(--mid-wash); border-radius: var(--r-sm); }
.watch b { display: block; color: var(--mid); margin-bottom: 2px; }
.scorebig { font: 600 2.6rem/1 var(--serif); margin: 14px 0 0; }
.missed { padding-left: 20px; }
.missed li { margin: 6px 0; }

/* study guide */
.deckblock { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 24px; margin-bottom: 18px; }
.deckblock > h2 { display: flex; align-items: center; gap: 10px; }
.tree { background: var(--sunk); border-radius: var(--r-sm); padding: 14px 16px; overflow-x: auto; font: .92rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.tablewrap { margin: 16px 0; }
.tablewrap figcaption { font-weight: 600; margin-bottom: 8px; }
.scrollx { overflow-x: auto; }
.gt { border-collapse: collapse; width: 100%; font-size: .95rem; }
.gt th, .gt td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
.gt th { background: var(--sunk); font-weight: 600; }
.breakdown { max-width: 34rem; margin: 14px 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 16px 24px; }
.cblock h3 { margin-top: 6px; }
.cblock ul { padding-left: 18px; margin: 0; }

/* flashcards */
.ctl { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 16px; }
.ctl label, .grp label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .95rem; }
select, input[type="number"] { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 6px 8px; color: var(--ink); }
input[type="number"] { width: 4.5rem; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.fcard { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; width: 100%; min-height: 15rem; padding: 32px; background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: var(--r); text-align: center; }
.fterm { font: 600 2rem/1.15 var(--serif); }
.fdef { font-size: 1.15rem; max-width: 50ch; }
.fcard small { color: var(--ink-2); }
.fcnav .btn { flex: 1 1 8rem; }
.fctools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.fctools [aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.fcprog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
.fcprog .muted { flex: none; font-size: .92rem; }
.fcprog .bar { flex: 1 1 140px; }
.srb { margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: .8rem; font-weight: 600; white-space: nowrap; }

/* forms */
.form fieldset { border: 0; padding: 0; margin: 18px 0 0; }
.form legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.grp { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.chk { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0; }
.chk input { margin-top: 3px; }
textarea { width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 10px 12px; line-height: 1.5; resize: vertical; margin-top: 12px; }

/* practice test */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stab { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 7px 13px; font-size: .92rem; color: var(--ink-2); }
.stab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; }
.stab.res { border-style: dashed; }
.ptctl { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 -10px 10px; }
.score { color: var(--ink-2); font-weight: 600; font-size: .95rem; }
.banner { background: var(--accent-wash); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; }
.intro { margin-bottom: 12px; }
.disclose { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.disclose .ic { transition: transform var(--fast); }
.disclose[aria-expanded="true"] .ic { transform: rotate(90deg); }
.intro ol { margin: 8px 0; padding-left: 22px; }
.intro li { margin: 4px 0; }
.pals { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.pal { position: relative; width: 38px; height: 38px; border-radius: var(--r-sm); border: 1.5px solid var(--rule); background: var(--sunk); color: var(--ink-2); font-weight: 600; font-size: .9rem; }
.pal.vis { background: var(--sheet); border-color: var(--mid); color: var(--ink); }
.pal.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.pal.bad { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.pal.partial { background: var(--mid-wash); border-color: var(--mid); color: var(--mid); }
.pal.none { background: var(--sunk); }
.pal[aria-current] { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.pal.flag::after { content: ""; position: absolute; top: -1px; right: -1px; border: 7px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); border-top-right-radius: var(--r-sm); }
.qtitle { color: var(--ink-2); font-size: .9rem; font-weight: 600; margin: 0 0 6px; }
.qhead { font: 600 1.25rem/1.25 var(--serif); margin: 4px 0 8px; }
.src { margin: 0 0 16px; padding: 16px 18px; background: var(--sunk); border: 1px solid var(--rule); border-radius: var(--r-sm); }
.src figcaption b { display: block; }
.sattr, .slab { display: block; font-size: .88rem; color: var(--ink-2); }
.srcimg { display: block; max-width: 100%; height: auto; margin: 12px 0; border-radius: 4px; }
.stext { font-family: var(--serif); font-size: 1.08rem; line-height: 1.6; max-width: 68ch; }
.pn { font-family: var(--sans); font-size: .8rem; font-weight: 600; color: var(--ink-2); margin-right: 6px; }
.litems { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.litem { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 8px 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.litem.pinrow { grid-template-columns: auto minmax(0, 1fr); }
.litem.right { border-color: var(--ok); background: var(--ok-wash); }
.litem.wrong { border-color: var(--bad); background: var(--bad-wash); }
.lt { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.ln { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--sheet); font-size: .8rem; }
.lbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.lb { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 12px; font-size: .92rem; }
.lb.sel { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.lb.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.lb.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.lb:disabled { cursor: default; }
.lfb { grid-column: 1 / -1; font-size: .93rem; }
.diagram { margin: 0 0 16px; }
.dimg { position: relative; display: inline-block; max-width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.dimg img { display: block; max-width: 100%; max-height: 34rem; width: auto; height: auto; border-radius: var(--r-sm); }
.pin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #1A1D21; color: #fff; font-size: .85rem; font-weight: 700; border: 2px solid #fff; box-shadow: 0 0 0 1px #1A1D21; }
.pin.set { background: var(--accent-l, #2C5AA0); }
.pin.right { background: #23774A; } .pin.wrong { background: #B3261E; }
.credit { font-size: .82rem; color: var(--ink-2); margin-top: 6px; }
.fparts { padding-left: 22px; }
.fparts li { margin: 6px 0; }
.part { display: block; margin-top: 16px; }
.pl { display: block; font-weight: 600; }
.pl small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.model { margin-top: 20px; padding: 18px; background: var(--accent-wash); border-radius: var(--r-sm); }
.model h4 { margin-top: 0; font-size: 1rem; }
.mpart { padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--accent) 25%, var(--rule)); }
.mpart:first-of-type { border-top: 0; }
.tea { margin: 8px 0; display: grid; gap: 6px; }
.tea > div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; }
.tea dt { font-weight: 600; color: var(--accent); }
.tea dd { margin: 0; }
.earns, .weak { font-size: .95rem; }
.weak { color: var(--ink-2); }
.selfmark { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.selfmark > span { font-weight: 600; font-size: .9rem; margin-right: 4px; }
.mk { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 6px 12px; font-size: .9rem; }
.mk.on.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.mk.on.wrong { border-color: var(--bad); background: var(--bad); color: var(--sheet); }

/* results and progress */
.wk { display: grid; gap: 14px; }
.wkhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; }
.wkhead span { color: var(--ink-2); font-size: .92rem; }
.wkmiss, .wkrev { font-size: .92rem; margin: 6px 0 0; }
.resq { border: 1px solid var(--rule); border-radius: var(--r-sm); margin: 8px 0; }
.resq summary { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; list-style: none; }
.resq summary::-webkit-details-marker { display: none; }
.resq .pal { flex: none; }
.resd { padding: 0 14px 12px 62px; }

/* course home */
.course { margin-bottom: 4px; }
.unitlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.unitrow { display: grid; grid-template-columns: 7rem minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px 24px; background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: var(--r); color: inherit; text-decoration: none; transition: border-color var(--fast); }
.unitrow:hover { border-color: var(--accent); }
.ulabel { font-weight: 600; color: var(--accent); }
.ubody { display: grid; gap: 4px; }
.utitle { font: 600 1.35rem/1.2 var(--serif); }
.ublurb { color: var(--ink-2); }
.ustat { font-size: .9rem; color: var(--ink-2); }
.ugo { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); }

@media (max-width: 640px) {
  .panel, .deckblock { padding: 18px 16px; }
  .terms > div, .terms.guide > div { grid-template-columns: minmax(0, 1fr); }
  .terms.guide .know { justify-self: start; }
  .litem:not(.pinrow) { grid-template-columns: minmax(0, 1fr); }
  .tea > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .unitrow { grid-template-columns: minmax(0, 1fr) auto; padding: 16px; }
  .ulabel { grid-column: 1 / -1; }
  .resd { padding-left: 14px; }
  .opts.tf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  body { background: #fff; }
  .tabs, .chips, .topbar, .meter, .noprint, .qnav, .ptctl { display: none !important; }
  .panel, .deckblock { border: 0; padding: 0; }
}

/* Plain-language intros (deck big picture, section story) */
.intro { margin: 12px 0 16px; padding: 12px 16px; border-left: 4px solid var(--accent); background: var(--sunk); border-radius: var(--r-sm); }
.intro p { margin: 0 0 8px; line-height: 1.6; }
.intro p:last-child { margin-bottom: 0; }
.intro .introhead { font-weight: 700; font-size: .92rem; color: var(--accent); margin-bottom: 6px; }
.intro.bigpic { background: transparent; border: 1px solid var(--rule); border-left: 4px solid var(--accent); }
.introfold { margin: 8px 0 12px; }
.introfold summary { cursor: pointer; font-weight: 600; color: var(--accent); }

/* Course home: whole-course backup */
.backup { margin-top: 24px; }
.bkmsg { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--accent); }

</style></head>

/svTv8Anwtv+/K/4Uf2Xp3/AD4W3/flf8KP7L07/nwtv+/K/wCFH9l6d/z4W3/flf8ACj+y9O/58Lb/AL8r/hR/Zenf8+Ft/wB+V/wo/svTv+fC2/78r/hR/Zenf8+Ft/35X/Cj+y9O/wCfC2/78r/hR/Zenf8APhbf9+V/wo/svTv+fC2/78r/AIUf2Xp3/Phbf9+V/wAKP7L07/nwtv8Avyv+FH9l6d/z4W3/AH5X/Cj+y9O/58Lb/vyv+FH9l6d/z4W3/flf8KP7L07/AJ8Lb/vyv+FH9l6d/wA+Ft/35X/Cj+y9O/58Lb/vyv8AhR/Zenf8+Ft/35X/AAo/svTv+fC2/wC/K/4Uf2Xp3/Phbf8Aflf8KP7L07/nwtv+/K/4Uf2Xp3/Phbf9+V/wo/svTv8Anwtv+/K/4Uf2Xp3/AD4W3/flf8KP7L07/nwtv+/K/wCFH9l6d/z4W3/flf8ACj+y9O/58Lb/AL8r/hR/Zenf8+Ft/wB+V/wo/svTv+fC2/78r/hR/Zenf8+Ft/35X/ClXS9OLD/QLbr/AM8V/wAK6bwxa29vFIIII4hv6IgXt7Vv1//Z"},"decks":[{"id":1,"name":"Silk Roads and Commercial Growth","optional":false,"sections":[{"name":"Why trade grew","cards":[{"term":"Intensification","def":"After 1200, existing routes carried more trade over greater distances; the routes themselves were centuries old (revived by Arab merchants in the 8th and 9th centuries).","hook":"Same roads, bigger flow.","asks":[{"q":"A historian says the Silk Roads after 1200 were \"not new, but busier.\" Which term names that idea?","right":"Intensification","wrong":[["Proto-industrialization, the expansion of Chinese iron, steel and porcelain output","That is about production, not the routes."],["Diaspora","That is a community settled abroad."],["Syncretism","That is blending religions."]],"exp":"Intensification: the same old routes carried more trade over longer distances."},{"q":"Which evidence would best support the claim that Silk Road trade intensified after 1200?","right":"More goods moving farther on the old routes","wrong":[["Brand-new roads being built across Central Asia for the first time in history","The routes were centuries old; that would be invention, not intensification."],["Fewer merchants on the roads","That would show decline."],["Trade ending in China","That would show decline."]],"exp":"Intensification means more trade over greater distances on routes that already existed."}]},{"term":"Mongol stability","def":"The textbook's most significant cause of Silk Road growth: the Mongols united the routes under one authority that respected merchants, enforced laws, improved roads, and punished bandits.","hook":"Safe roads, more trade.","asks":[{"q":"According to the textbook, what was the MOST significant cause of Silk Road growth after 1200?","right":"Mongol rule uniting and protecting the routes","wrong":[["The Crusades, which made Europeans want silk and spices from the East","A cause of demand, but not the textbook's main cause."],["The invention of the caravanserai","Caravanserai already existed."],["The fall of Baghdad","That was destruction, not a cause of growth."]],"exp":"The Mongols united the routes under one authority that protected merchants."},{"q":"Why would a merchant in 1280 feel safer crossing Central Asia than one in 1150?","right":"One authority punished bandits and kept roads up","wrong":[["Camels had just been brought to Central Asia from Arabia, making travel faster","Camels were already in use."],["No one traded there in 1150","The routes were centuries old."],["Paper money had been invented","Paper money isn't about safety."]],"exp":"Under the Mongols one authority enforced laws, improved roads and punished bandits."}]},{"term":"Luxury goods demand","def":"Elites in Europe, Africa, and Asia wanted silk, porcelain, spices, and fine textiles, so artisans expanded production for export.","hook":"Status symbols drive supply.","asks":[{"q":"Why did artisans in China and Persia expand production for export after 1200?","right":"Elites abroad wanted luxury goods","wrong":[["Their own rulers banned them from selling any of their goods to local people","Not on your card; demand abroad drove it."],["Peasants demanded porcelain","Elites were the buyers."],["The Silk Roads had closed","The routes were busier, not closed."]],"exp":"Elite demand for silk, porcelain, spices and fine textiles pushed artisans to produce for export."},{"q":"Which best explains why silk and porcelain, not grain, traveled the Silk Roads?","right":"Light, valuable goods for elite buyers","wrong":[["Grain could not grow anywhere along the Silk Roads, so it had to stay home","The reason is value and weight, not growing conditions."],["Grain was illegal to trade","Not on your card."],["Silk was heavy","Silk is light."]],"exp":"The overland routes carried luxury goods that elites wanted."}]},{"term":"Crusades (effect on demand)","def":"Crusaders returned to Europe with eastern fabrics and spices, raising European demand for Asian luxury goods.","hook":"Knights came home wanting silk.","asks":[{"q":"How did the Crusades affect trade between Europe and Asia?","right":"They raised European demand for Asian goods","wrong":[["They cut Europe off from Asian goods, since the crusaders closed the trade routes","Your card says they raised demand."],["They had no effect on trade","Crusaders brought goods home."],["They ended the Silk Roads","Trade grew."]],"exp":"Crusaders came home with eastern fabrics and spices, raising European demand."},{"q":"A European noble in 1250 wants silk he first saw on a relative who went east to fight. Which link does this show?","right":"Crusades → European demand","wrong":[["Mongol conquest → Chinese demand for European wool and other goods","The demand ran from Europe for Asian goods."],["Black Death → demand","The plague came later and cut trade."],["Monsoon → demand","Monsoons drove sea voyages."]],"exp":"Returning crusaders spread a taste for Asian luxuries in Europe."}]},{"term":"Caravan","def":"A group of merchants and animals traveling together with guides; safer than traveling alone.","hook":"Safety in numbers.","asks":[{"q":"Why did Silk Road merchants travel in caravans instead of alone?","right":"Safety in numbers","wrong":[["Rulers required every merchant to pay a fee to join a group before leaving","Not on your card; the reason is safety."],["Camels refused to walk alone","Not the reason."],["Caravans were faster","Safety was the reason."]],"exp":"A caravan of merchants, animals and guides was safer than traveling alone."},{"q":"Which pair of innovations both made caravan travel safer or cheaper?","right":"Caravanserai and better camel saddles","wrong":[["Junks and lateen sails, which were used by traders all along the trade routes","Those are ships."],["Stern rudders and compasses","Those are sea tools."],["Champa rice and bananas","Those are crops."]],"exp":"Caravanserai gave shelter; better saddles raised loads."}]},{"term":"Camel saddle (Silk Roads)","def":"Travelers learned to design saddles that greatly increased the weight camels could carry.","hook":"Better saddle, bigger load.","asks":[{"q":"What was the main effect of better camel saddles on Silk Road trade?","right":"Each camel carried much more","wrong":[["Camels could now drink less water, so they crossed the desert without stopping","Saddles changed loads, not water needs."],["Horses replaced camels","Camels stayed central."],["Trade moved to the sea","Saddles helped land trade."]],"exp":"Saddle design greatly increased the weight camels could carry."},{"q":"Better saddles appear in both the Silk Road and trans-Saharan decks. What does that comparison show?","right":"Both land networks depended on camels","wrong":[["Both networks were mainly sea routes that used camels to load and unload ships","Both are land routes."],["Only the Silk Roads used camels","Trans-Saharan trade used camels too."],["Saddles were invented in 1200","They were improved."]],"exp":"Camel saddles raised loads on both overland networks."}]}],"intro":["The Silk Roads were centuries old by 1200. What changed was intensification: more goods moving farther on the same routes. The textbook's main cause is the Mongols, who united the routes and made them safe. Demand mattered too: elites everywhere wanted silk, porcelain and spices, and crusaders brought that taste home to Europe. Caravans and better camel saddles made the trip possible."]},{"name":"Commercial innovations","cards":[{"term":"Caravanserai","def":"A roadside inn (Persian for caravan plus palace) with stalls for animals and rooms and storage for travelers; made travel safer and cheaper.","hook":"Caravan plus palace.","asks":[{"q":"Why did caravanserai help trade grow?","right":"Travel became safer and cheaper","wrong":[["They let merchants skip the long journey by sending goods through the mail","They were inns along the route."],["They replaced money","That's credit or barter."],["They were warships","They were inns."]],"exp":"Roadside inns with animal stalls, rooms and storage made travel safer and cheaper."},{"q":"Caravanserai, credit and paper money existed before 1200. How should you describe their role after 1200?","right":"Improved and spread","wrong":[["Invented for the very first time to serve the Mongols' new trade routes","They existed before 1200."],["Banned by the Mongols","They spread."],["Forgotten","They spread."]],"exp":"Key point: improved and spread, not invented."}]},{"term":"Money economy","def":"A system of buying and selling with currency instead of bartering with goods like cowrie shells or salt; China had long had one.","hook":"Money, not barter.","asks":[{"q":"Why did a money economy make long-distance trade easier than barter?","right":"Trade didn't depend on swapping goods","wrong":[["Money could be eaten if the trip ran short of food, unlike barter goods","That isn't the advantage."],["Money was heavier than goods","Money is easier to move than goods."],["Barter was illegal","Not on your card."]],"exp":"With money, merchants didn't need someone who wanted their exact goods."},{"q":"Cowrie shells and salt appear on the money economy card. Why?","right":"They were goods used in barter","wrong":[["They were the first coins ever minted in China for long-distance trade","China used coins and paper."],["They were paper money","They are physical goods."],["They were taxes","Not on your card."]],"exp":"A money economy uses money instead of barter with goods like cowrie shells or salt."}]},{"term":"Flying cash","def":"Chinese credit system: deposit paper money in one place and withdraw the same amount elsewhere, because copper coins were too heavy to carry for big trades.","hook":"Cash that flies to another city.","asks":[{"q":"Why did China develop flying cash?","right":"Copper coins were too heavy for big trades","wrong":[["Merchants wanted to avoid paying taxes to the emperor on their goods","Not on your card; weight was the reason."],["Paper was cheaper than silk","Not the reason."],["Banks were banned","Not on your card."]],"exp":"Deposit in one place, withdraw elsewhere, because heavy coins were hard to carry."},{"q":"Which European tool did the same job as China's flying cash?","right":"The bill of exchange","wrong":[["The caravanserai, which stored goods so merchants didn't have to carry them","That's an inn."],["The astrolabe","A navigation tool."],["The kuriltai","A Mongol council."]],"exp":"Both let merchants move money without carrying coins."}]},{"term":"Paper money","def":"Printed currency, first used in China, which eased large transactions.","hook":"Light enough to carry.","asks":[{"q":"What problem did paper money solve?","right":"Large transactions with heavy coins","wrong":[["Bandits could no longer rob caravans because paper was worthless to them","Not on your card."],["It ended barter everywhere","Barter continued in places."],["It replaced trade","It eased trade."]],"exp":"Paper money, first used in China, eased large transactions."},{"q":"Paper money was first used where?","right":"China","wrong":[["Venice, where the first European banking houses opened in the 1300s","Banking houses came later in Europe."],["Mali","Mali used gold and cowries."],["Persia","Your card says China."]],"exp":"Paper money was first used in China."}]},{"term":"Bill of exchange","def":"A document promising payment of a set amount on a set date, letting merchants move money without carrying coins.","hook":"An IOU that travels.","asks":[{"q":"A Venetian merchant sells goods in Cairo and is promised a set payment on a set date. What document is this?","right":"A bill of exchange","wrong":[["Flying cash, the Chinese system of depositing paper money in one place","Flying cash is Chinese."],["A caravanserai","That's an inn."],["A customs duty","That's a tax."]],"exp":"A bill of exchange promises a set payment on a set date."},{"q":"Why would bills of exchange encourage merchants to travel farther?","right":"Less risk of carrying coins","wrong":[["Bills of exchange made it illegal for bandits to rob merchants on the road","They reduced risk by removing coins."],["Bills were worth more than gold","Not the point."],["Bills replaced ships","They moved money, not goods."]],"exp":"Merchants could move money without carrying coins."}]},{"term":"Banking house","def":"A business where bills and credit were handled, a precursor to today's banks; Europe's first ones appeared in the 1300s.","hook":"Where the IOU gets cashed.","asks":[{"q":"Where would a merchant with a bill of exchange go to have it cashed in the 1300s?","right":"A banking house","wrong":[["A caravanserai, the roadside inn where travelers kept their goods overnight","That's lodging."],["A kuriltai","A Mongol council."],["A mosque","Not where bills were handled."]],"exp":"Banking houses handled bills and credit."},{"q":"Banking houses in Europe were a precursor to what?","right":"Modern banks","wrong":[["Modern trading companies that hired their own armies to protect their trade","Not on your card."],["Caravanserai","Those are inns."],["Guilds","Not on your card."]],"exp":"Banking houses were a precursor to modern banks."}]},{"term":"Improved, not invented","def":"Caravanserai, credit, and paper money all existed before 1200; the key point is that they were improved and spread.","hook":"Upgrades, not inventions.","asks":[{"q":"A student writes, \"Caravanserai were invented during the Mongol era.\" What's the correction?","right":"They existed before 1200 and were improved","wrong":[["They were invented by the Ming dynasty after the Mongols had been overthrown","They existed before 1200."],["They never existed","They did."],["They were invented in Europe","Your card says they existed before 1200."]],"exp":"Caravanserai, credit and paper money existed before 1200; they were improved and spread."},{"q":"Which describes CONTINUITY in commercial practices from before 1200 to after?","right":"The same tools, used more and better","wrong":[["A complete break, with brand-new methods replacing the old ones everywhere","That's change, and not accurate."],["Trade disappeared","Trade grew."],["Only barter was used","Credit and paper money existed."]],"exp":"The tools continued; their use was improved and spread."}]}],"intro":["Merchants needed ways to travel and pay safely over long distances. Caravanserai gave them roadside shelter. Money replaced barter, and China's paper money and flying cash, like Europe's bills of exchange and banking houses, let merchants move value without hauling heavy coins. The key point: these tools existed before 1200; they were improved and spread."]},{"name":"Cities and production","cards":[{"term":"Kashgar","def":"Oasis city at the western edge of China where northern and southern Silk Road routes met; river water fed crops; once Buddhist, it became a center of Islamic scholarship; ravaged by Tamerlane in 1389–90.","hook":"Kashgar is the crossroads of China.","asks":[{"q":"Why did Kashgar become an important city?","right":"Northern and southern routes met there","wrong":[["It was the capital of the Mongol Empire and home to Kublai Khan's court","Kublai's capital was Dadu."],["It was a seaport","It's an oasis city."],["It was in Europe","It's at China's western edge."]],"exp":"Kashgar was an oasis where Silk Road routes met."},{"q":"Kashgar was once Buddhist and later a center of Islamic scholarship. What does this change show?","right":"Trade routes carried religions","wrong":[["The Mongols forced everyone in their empire to convert to the same religion","The Mongols were tolerant."],["Religion never changed there","It did change."],["Islam came by sea","Kashgar is inland."]],"exp":"Religions spread along the trade routes that met at Kashgar."}]},{"term":"Samarkand","def":"Trading city in present-day Uzbekistan between China and the Mediterranean; religiously diverse; known for artisans, mosques, and Islamic learning.","hook":"Stalls and scholars.","asks":[{"q":"What made Samarkand a \"knot\" of the Silk Roads?","right":"It sat between China and the Mediterranean","wrong":[["It was a port on the Indian Ocean where monsoon ships unloaded their cargo","Samarkand is inland."],["It was in West Africa","It's in Uzbekistan."],["It was a Chinese capital","It's in Central Asia."]],"exp":"Samarkand linked China and the Mediterranean."},{"q":"Samarkand was religiously diverse and known for scholars. What does this suggest about trade cities?","right":"They were also centers of ideas","wrong":[["They were closed to outsiders and only traded with people of one religion","Samarkand was diverse."],["They had no schools","It was known for learning."],["They only sold silk","Artisans made many goods."]],"exp":"Trade cities like Samarkand drew people, faiths and learning."}]},{"term":"Proto-industrialization","def":"Rising demand pushed China to expand iron, steel, and porcelain production for trade.","hook":"China's forges heat up.","asks":[{"q":"What caused proto-industrialization in China?","right":"Rising demand for its goods","wrong":[["The Mongols banned all farming, forcing peasants into factories in the cities","Not on your card."],["The Black Death","That came later and cut trade."],["Zheng He's voyages","Those came later."]],"exp":"Demand pushed China to expand iron, steel and porcelain production."},{"q":"Which is an example of proto-industrialization?","right":"China expanding porcelain output for trade","wrong":[["Mongols building relay stations for messengers across the empire","That's the yam."],["Monks translating Greek books","That's learning."],["Mansa Musa's pilgrimage","That's not production."]],"exp":"Expanding iron, steel and porcelain production for trade."}]},{"term":"Luxury production centers","def":"Chinese silk and porcelain and Persian and Indian textiles all expanded for export.","hook":"China, Persia, India supply.","asks":[{"q":"Which regions expanded luxury production for export?","right":"China, Persia and India","wrong":[["Mali, Russia and Japan, which made silk and porcelain for buyers in Europe","Your card names China, Persia and India."],["England and France","Not on your card."],["Mongolia only","Not on your card."]],"exp":"Chinese silk and porcelain and Persian and Indian textiles expanded for export."},{"q":"How were luxury production centers and elite demand connected?","right":"Demand drove production","wrong":[["Production came first, and it later created demand once the goods appeared","Your cards say demand pushed production."],["They were unrelated","They were linked."],["Demand fell","Demand rose."]],"exp":"Elite demand pushed artisans to expand production for export."}]}],"intro":["Busier routes built up the cities where they met, like Kashgar and Samarkand, which became centers of trade, religion and learning. Rising demand also pushed producers: China expanded iron, steel and porcelain output (proto-industrialization), and Persia and India expanded textile production for export."]}],"intro":["Unit 2 covers 1200 to 1450. The big question: why did trade across Afro-Eurasia grow so much, and what did that growth change? This deck starts with the overland Silk Roads and the new ways merchants handled money and travel."]},{"id":2,"name":"The Mongol Empire","optional":false,"sections":[{"name":"Rise and methods","cards":[{"term":"Temujin / Genghis Khan","def":"Mongol leader (born 1162) elected \"ruler of all\" at the 1206 kuriltai; united the clans and promoted talent over family. Also spelled Chinggis.","hook":"Temujin becomes \"ruler of all.\"","asks":[{"q":"Temujin promoted people for talent, not family ties. What did this help him do?","right":"Unite the rival Mongol clans","wrong":[["Win the support of Chinese scholars, who wanted the civil service exams kept","The Yuan later dismantled the exams."],["Avoid all warfare","The Mongols fought constantly."],["Convert to Islam","Not on your card."]],"exp":"He united the clans and promoted talent over family."},{"q":"What happened at the 1206 kuriltai?","right":"Temujin was elected \"ruler of all\"","wrong":[["Kublai Khan founded the Yuan dynasty and moved the capital to Dadu","That was decades later."],["The empire split into four khanates","That came later."],["Baghdad fell","That was 1258."]],"exp":"The 1206 kuriltai elected Temujin, who became Genghis Khan."}]},{"term":"Kuriltai","def":"A meeting of Mongol chieftains; the one in 1206 elected Temujin khan.","hook":"Council of chiefs.","asks":[{"q":"How did a new Mongol khan come to power, according to your cards?","right":"Chieftains elected him at a kuriltai","wrong":[["The oldest son always inherited the throne without any vote or meeting","Your card describes election by chiefs."],["Chinese scholars chose him","Not on your card."],["He was appointed by the caliph","Not on your card."]],"exp":"A kuriltai was a meeting of chieftains; the 1206 one elected Temujin."},{"q":"Which modern idea is the kuriltai closest to?","right":"A council that chooses a leader","wrong":[["A court that tries criminals and decides what punishment they should get","Your card says it elected a khan."],["A tax office","Not its role."],["A school","Not its role."]],"exp":"The kuriltai was a meeting of chiefs that elected the khan."}]},{"term":"Khan / khanate","def":"The first word means a Mongol king; the second means the kingdom he rules.","hook":"Khan king, khanate kingdom.","asks":[{"q":"The Golden Horde was ruled by a khan. What does that make the Golden Horde?","right":"A khanate","wrong":[["A caliphate, since it was ruled by the Mongols who later became Muslim","A caliphate is ruled by a caliph."],["A city-state","It was a large kingdom."],["A dynasty of China","That's the Yuan."]],"exp":"A khanate is the kingdom of a khan."},{"q":"Which pair matches correctly?","right":"Khan: ruler; khanate: his kingdom","wrong":[["Khan: the kingdom itself; khanate: the ruler who governs the kingdom","It's the other way around."],["Khan: a merchant; khanate: a caravan","Not the meaning."],["Khan: a priest; khanate: a temple","Not the meaning."]],"exp":"A khan is a king; a khanate is his kingdom."}]},{"term":"Mongol warfare","def":"Skilled horse archers, strict discipline, feigned retreats, terror, and terrain mapping; the Mongols also adopted conquered peoples' technology.","hook":"Fast, fierce, borrowed tech.","asks":[{"q":"Which tactic involved pretending to run away to draw enemies into a trap?","right":"Feigned retreat","wrong":[["Terrain mapping, studying the ground before an attack to plan the battle","That's mapping, not a fake retreat."],["Siege towers","Those attacked walls."],["The yam","That carried messages."]],"exp":"Feigned retreats were part of Mongol warfare."},{"q":"Why could the Mongols take walled cities, though they were steppe horsemen?","right":"They adopted conquered peoples' technology","wrong":[["They had always built stone cities of their own and knew how walls worked","They were nomads; they borrowed the know-how."],["The cities surrendered without fighting every time","Many fought."],["They used gunpowder they invented","Gunpowder was Chinese."]],"exp":"The Mongols adopted conquered peoples' technology."}]},{"term":"Siege weapons","def":"Portable towers and catapults used against walled fortifications, built with the help of captured Chinese and Persian engineers.","hook":"Walls fall to borrowed machines.","asks":[{"q":"Where did the Mongols get the skills to build catapults and siege towers?","right":"Captured Chinese and Persian engineers","wrong":[["Their own nomadic tradition of building wooden machines on the steppe","Your card credits captured engineers."],["European crusaders","Not on your card."],["Mali's armies","Not on your card."]],"exp":"Siege weapons were built with captured Chinese and Persian engineers."},{"q":"What does the Mongols' use of siege weapons show about their empire?","right":"They used conquered peoples' skills","wrong":[["They refused to use any ideas that came from outside the Mongol clans","The opposite is true."],["They avoided cities","They attacked walled cities."],["They only fought at sea","They fought on land."]],"exp":"Skilled captives helped the Mongols take walled cities."}]},{"term":"Mongol motive","def":"The Mongols coveted the wealth of neighbors nearer the Silk Roads (silk, gold) and recruited skilled captives such as craftworkers, miners, and scribes.","hook":"Follow the luxury.","asks":[{"q":"Why did the Mongols recruit miners, scribes and craftworkers from conquered lands?","right":"They wanted their skills","wrong":[["They wanted to convert them to the Mongol religion before sending them home","Your card is about skills."],["They had too many workers","They needed skills."],["To start the Black Death","Not on your card."]],"exp":"The Mongols recruited skilled captives."},{"q":"What drew the Mongols toward lands near the Silk Roads?","right":"The wealth there, like silk and gold","wrong":[["The religious sites they wanted to protect from attacks by crusaders","Your card says wealth."],["The cold weather","Not on your card."],["Empty land","Those lands were rich and populated."]],"exp":"The Mongols coveted the wealth of their neighbors."}]}],"intro":["Temujin united the Mongol clans by promoting talent over family, and the 1206 kuriltai elected him Genghis Khan. The Mongols won with fast horse archers, discipline, feigned retreats and terror, and they borrowed what they lacked, like siege weapons from captured Chinese and Persian engineers. They went after the wealth of the lands near the Silk Roads."]},{"name":"Four khanates","cards":[{"term":"Yuan Dynasty","def":"Kublai Khan's Chinese dynasty (1271–1368); more Chinese in style, rebuilt the capital as Dadu, tolerated many religions; ended by the Ming.","hook":"Yuan is China.","asks":[{"q":"How was the Yuan different from the Mongols' homeland style of rule?","right":"It was more Chinese in style","wrong":[["It was the most traditionally Mongol of all the khanates in the empire","That was the Chagatai Khanate."],["It banned all religions","It tolerated many."],["It was in Persia","That's the Il-khanate."]],"exp":"The Yuan was more Chinese in style and rebuilt the capital as Dadu."},{"q":"Which dynasty replaced the Yuan in 1368?","right":"The Ming","wrong":[["The Song, which had ruled China before the Mongols arrived in the 1200s","The Song came before the Yuan."],["The Qing","Not on your card."],["The Il-khanate","That's Persia."]],"exp":"The Yuan (1271–1368) was ended by the Ming."}]},{"term":"Il-khanate","def":"Mongol kingdom in Persia and Southwest Asia founded by Hulegu; Persians served as officials; the Mongols there later converted to Islam.","hook":"Il-khanate is Persia.","asks":[{"q":"Who ran the day-to-day government in the Il-khanate?","right":"Persian officials","wrong":[["Mongol warriors, who refused to let any conquered people work in government","Persians served as officials."],["Chinese scholars","That's not the Il-khanate."],["Russian princes","That's the Golden Horde."]],"exp":"Persians served as officials in the Il-khanate."},{"q":"The Mongols of the Il-khanate later converted to Islam. Which broader pattern does this show?","right":"Mongol rulers assimilating locally","wrong":[["Mongols forcing their own religion on the people they had conquered","The Mongols took on local faiths."],["Mongols staying fully traditional","That's the Chagatai."],["Islam disappearing from Persia","The rulers adopted it."]],"exp":"Assimilation into local cultures is one cause of Mongol decline."}]},{"term":"Golden Horde","def":"Western khanate under Batu that conquered Russia and destroyed Kiev in 1240; ruled through Russian princes who paid tribute; lasted longest.","hook":"Golden Horde is Russia.","asks":[{"q":"Which khanate lasted the longest?","right":"The Golden Horde","wrong":[["The Yuan dynasty, which ruled China until it was overthrown in the 1300s","Your card says the Golden Horde lasted longest."],["The Il-khanate","Not the longest."],["The Chagatai Khanate","Not the longest."]],"exp":"The Golden Horde lasted longest."},{"q":"How did the Golden Horde control Russia?","right":"Through Russian princes who paid tribute","wrong":[["By replacing all Russian leaders with Mongol governors from the steppe","It used existing princes."],["By converting Russians to Islam","Not on your card."],["Through Chinese officials","Not on your card."]],"exp":"The Golden Horde ruled through Russian princes who paid tribute."}]},{"term":"Chagatai Khanate","def":"Central Asian Mongol kingdom that kept the old steppe ways more than any other.","hook":"Chagatai is Central Asia.","asks":[{"q":"Which khanate kept the most traditional Mongol ways?","right":"The Chagatai Khanate","wrong":[["The Yuan dynasty, which kept Mongol customs in its capital at Dadu","The Yuan was more Chinese in style."],["The Il-khanate","It used Persians and converted to Islam."],["The Golden Horde","Not the most traditional."]],"exp":"The Chagatai Khanate in Central Asia stayed the most traditionally Mongol."},{"q":"Compare the Yuan and the Chagatai Khanate.","right":"The Yuan adapted; the Chagatai stayed Mongol","wrong":[["Both took on local customs and converted to Islam in the same way","The Yuan became Chinese-style; Chagatai stayed traditional."],["Both were in China","Chagatai was Central Asia."],["Neither tolerated religions","Not on your cards."]],"exp":"The Yuan was more Chinese in style; the Chagatai stayed the most traditionally Mongol."}]},{"term":"Kublai Khan","def":"Genghis Khan's grandson; Great Khan from 1260; founded the Yuan; welcomed foreigners such as Marco Polo.","hook":"Kublai, the Chinese-style khan.","asks":[{"q":"Marco Polo was welcomed at Kublai Khan's court. What does that show about Kublai?","right":"He welcomed foreigners","wrong":[["He banned outsiders from China to protect it from European ideas","He welcomed foreigners."],["He spoke Italian","Not on your card."],["He was a merchant","He was Great Khan."]],"exp":"Kublai welcomed foreigners such as Marco Polo."},{"q":"How was Kublai related to Hulegu?","right":"Both were Genghis Khan's grandsons","wrong":[["Kublai was Hulegu's father, who sent him west to conquer Persia","Both were grandsons of Genghis."],["They were enemies from different clans","Not on your cards."],["Hulegu was Kublai's grandson","Both were Genghis's grandsons."]],"exp":"Your cards call both Genghis Khan's grandsons."}]},{"term":"Hulegu","def":"Genghis Khan's grandson who destroyed Baghdad in 1258 and killed the caliph.","hook":"Hulegu equals Baghdad.","asks":[{"q":"Why was Hulegu's capture of Baghdad in 1258 a turning point?","right":"He destroyed the city and killed the caliph","wrong":[["He made Baghdad the new capital of the Yuan dynasty and moved there","The Yuan capital was Dadu."],["He converted to Christianity there","Not on your card."],["He signed a peace treaty","He destroyed it."]],"exp":"Hulegu destroyed Baghdad and killed the caliph."},{"q":"Which khanate did Hulegu found?","right":"The Il-khanate","wrong":[["The Golden Horde, which conquered Russia and destroyed Kiev in 1240","That was Batu."],["The Yuan","That was Kublai."],["The Chagatai","Not Hulegu."]],"exp":"Hulegu founded the Il-khanate in Persia."}]},{"term":"Indirect rule","def":"The Golden Horde ruled northern Russia through existing Russian princes who sent regular tribute.","hook":"Rule through locals.","asks":[{"q":"What was an advantage of the Golden Horde's indirect rule?","right":"Local princes did the governing","wrong":[["It let the Mongols replace the Russian language with their own across the land","Indirect rule kept local princes."],["It ended tribute","Princes paid tribute."],["It needed more Mongol officials","It needed fewer."]],"exp":"Existing Russian princes ruled and sent tribute."},{"q":"Which other example uses local elites to govern, like the Golden Horde did?","right":"Persians serving as Il-khanate officials","wrong":[["The Yuan hiring foreigners and keeping the Chinese out of government","That shut locals out."],["The yam","That's messengers."],["Feigned retreats","That's warfare."]],"exp":"Both relied on local people to govern."}]}],"intro":["After Genghis, the empire split into four khanates. Each adapted differently: the Yuan in China under Kublai became Chinese in style; the Il-khanate in Persia (founded by Hulegu, who destroyed Baghdad) used Persian officials and converted to Islam; the Golden Horde ruled Russia indirectly through local princes; and the Chagatai Khanate stayed the most traditionally Mongol."]},{"name":"Pax Mongolica and transfers","cards":[{"term":"Pax Mongolica","def":"\"Mongol Peace\" (c. 1250–1350): safer routes, maintained roads, punished banditry, and religious tolerance boosted trade.","hook":"Peace pays.","asks":[{"q":"Why did the Pax Mongolica boost trade?","right":"Safer routes and religious tolerance","wrong":[["It ended all trade between Europe and China to protect Mongol merchants","It boosted trade."],["It closed roads","Roads were maintained."],["It started the Crusades","Not on your card."]],"exp":"Safer routes, maintained roads, punished banditry and tolerance boosted trade."},{"q":"Which is a COST of the same Mongol connections that made the Pax Mongolica possible?","right":"Helping spread the plague","wrong":[["Ending Silk Road trade by closing every road through Mongol territory","Trade grew."],["Banning religions","They were tolerant."],["Ending paper money","Not on your cards."]],"exp":"Your cards say Mongol conquests helped transmit the plague."}]},{"term":"Yam","def":"Mongol relay messenger system that linked the far reaches of the empire.","hook":"Mongol pony express.","asks":[{"q":"What was the purpose of the yam?","right":"Carrying messages across the empire","wrong":[["Carrying trade goods from China to Europe for the Mongol khans","It was a messenger system."],["Collecting taxes","Not its purpose."],["Training soldiers","Not its purpose."]],"exp":"The yam was a relay messenger system."},{"q":"How did the yam help the Mongols hold a huge empire?","right":"It linked distant parts quickly","wrong":[["It let the Mongols move the capital to a new city every single year","It carried messages."],["It replaced the army","It carried messages."],["It ended trade","It helped communication."]],"exp":"The relay system linked the far reaches of the empire."}]},{"term":"Religious tolerance","def":"Genghis Khan and Kublai Khan allowed many religions, unusual in the 13th century and helpful to trade.","hook":"Tolerate and trade.","asks":[{"q":"Why was Mongol religious tolerance good for trade?","right":"Merchants of every faith could trade","wrong":[["It forced every merchant to adopt the same religion as the khan","Tolerance means the opposite."],["It ended trade","It helped trade."],["It was common everywhere","Your card says it was unusual."]],"exp":"Allowing many religions was unusual and helpful to trade."},{"q":"How was Mongol tolerance unusual for the 13th century?","right":"Many religions were allowed","wrong":[["They allowed only one official religion and punished anyone who refused it","That's the opposite."],["They banned all religions","They allowed many."],["They only allowed Buddhism","They allowed many."]],"exp":"Genghis and Kublai allowed many religions."}]},{"term":"Greco-Islamic medical knowledge","def":"Greek medicine, advanced by Islamic scholars such as Ibn Sina, reached Western Europe through Mongol-era contact.","hook":"Greek to Islamic to Europe.","asks":[{"q":"How did Greek medicine reach Western Europe?","right":"Through Islamic scholars and Mongol-era contact","wrong":[["Directly from Greece, without passing through any other cultures on the way","Your card traces it through Islamic scholars."],["From China","Not on your card."],["From Mali","Not on your card."]],"exp":"Greek medicine, advanced by scholars like Ibn Sina, reached Europe via Mongol-era contact."},{"q":"Which scholar advanced Greek medicine in the Islamic world?","right":"Ibn Sina","wrong":[["Ibn Battuta, the Moroccan scholar who traveled through Mali and China","He was a traveler."],["Marco Polo","A Venetian merchant."],["Boccaccio","An Italian writer."]],"exp":"Ibn Sina advanced Greek medicine."}]},{"term":"Numbering systems","def":"Hindu-Arabic numerals, which began in India, reached Europe.","hook":"\"Arabic\" numbers began in India.","asks":[{"q":"Where did the numbers Europeans call \"Arabic\" begin?","right":"India","wrong":[["Arabia, which is why Europeans named the numbers after the Arabs","They began in India."],["China","Not on your card."],["Greece","Not on your card."]],"exp":"Hindu-Arabic numerals began in India."},{"q":"Hindu-Arabic numerals reaching Europe is an example of what?","right":"Transfer of ideas along trade networks","wrong":[["Transfer of crops from one region to another along the trade routes","Numerals are ideas, not crops."],["Disease spread","Not disease."],["Military conquest","It's an idea transfer."]],"exp":"Ideas moved with trade during the Mongol era."}]},{"term":"Uyghur script","def":"Writing system adapted to represent the Mongol language and used to help run the empire.","hook":"Uyghur letters, Mongol words.","asks":[{"q":"Why did the Mongols adopt the Uyghur script?","right":"To write Mongol and run the empire","wrong":[["To replace Chinese writing everywhere in the Yuan dynasty with Uyghur","It was adapted for Mongol."],["To trade with Mali","Not on your card."],["To write Greek books","Not on your card."]],"exp":"The Uyghur script was adapted for the Mongol language to help run the empire."},{"q":"The Uyghur script and siege weapons have what in common?","right":"Both were borrowed from others","wrong":[["Both were invented by Genghis Khan himself to help him rule the clans","Both were borrowed."],["Both were Chinese","Uyghur script isn't Chinese."],["Both were for trade","Not quite."]],"exp":"The Mongols adopted tools from others."}]}],"intro":["Once the conquests ended, the Mongol Peace (about 1250 to 1350) made the routes safe, and religious tolerance welcomed merchants of every faith. The yam relay system linked the empire. Ideas moved too: Greek medicine through Islamic scholars, Hindu-Arabic numerals to Europe, and a script borrowed from the Uyghurs to write Mongol."]},{"name":"Decline","cards":[{"term":"Causes of Mongol decline","def":"Succession disputes, vast distances, assimilation into local cultures, the Black Death, failed expansion (Japan, Java, others), and revolts.","hook":"Too big, too split.","asks":[{"q":"Which cause of Mongol decline came from INSIDE the ruling family?","right":"Succession disputes","wrong":[["The Black Death, which killed many people along the empire's trade routes","That came from outside."],["Failed invasion of Japan","That's military."],["Revolts","Those came from subjects."]],"exp":"Succession disputes split the rulers."},{"q":"How did the empire's vast size contribute to decline?","right":"It was hard to hold together","wrong":[["It gave the Mongols too much trade, which made them stop fighting entirely","Not on your card."],["It made them stronger","It strained them."],["It had no effect","Distance is a listed cause."]],"exp":"Vast distances, along with other causes, weakened the empire."}]},{"term":"Foreign officials (Yuan grievance)","def":"Yuan rulers hired foreigners, dismantled the civil service exams, and stayed apart from the Chinese, angering the scholar-gentry.","hook":"Locals shut out.","asks":[{"q":"Why did Chinese scholar-gentry resent the Yuan?","right":"Foreigners took jobs; exams were dismantled","wrong":[["The Yuan forced every scholar to move to Mongolia and learn to ride horses","Not on your card."],["The Yuan raised them to power","They were shut out."],["The Yuan banned trade","Not on your card."]],"exp":"Yuan rulers hired foreigners and dismantled the civil service exams."},{"q":"Compare Yuan rule with the Il-khanate's.","right":"The Il-khanate used locals; the Yuan didn't","wrong":[["Both hired local people for government and both kept the old civil service","The Yuan shut the Chinese out."],["Both shut locals out","Persians served in the Il-khanate."],["Neither had officials","Both did."]],"exp":"Persians served as Il-khanate officials; the Yuan hired foreigners instead of Chinese."}]},{"term":"White Lotus Society","def":"Secret society that organized against Yuan rule in the 1350s.","hook":"White Lotus, rebel network.","asks":[{"q":"What role did the White Lotus Society play in the 1350s?","right":"It organized against Yuan rule","wrong":[["It supported the Yuan by collecting taxes from Chinese peasants for the khan","It opposed the Yuan."],["It built ships","Not on your card."],["It spread the plague","Not on your card."]],"exp":"A secret society organizing against the Yuan."},{"q":"Which event did the White Lotus Society help lead to?","right":"The fall of the Yuan and rise of the Ming","wrong":[["The founding of the Yuan dynasty under Kublai Khan in 1271","It opposed the Yuan."],["The fall of Baghdad","That was Hulegu."],["The Black Death","Not a political event."]],"exp":"Organized resistance helped end the Yuan in 1368."}]},{"term":"Zhu Yuanzhang","def":"Buddhist monk from a poor peasant family who led the revolt that overthrew the Yuan in 1368 and founded the Ming.","hook":"Peasant monk topples khan.","asks":[{"q":"What was unusual about the man who founded the Ming?","right":"He was a poor peasant's son and a monk","wrong":[["He was a Mongol prince who switched sides and joined the Chinese rebels","Not on your card."],["He was a merchant","He was a monk."],["He was Kublai's son","Not on your card."]],"exp":"Zhu Yuanzhang was a Buddhist monk from a poor peasant family."},{"q":"Which card shows the result of the Yuan's grievances?","right":"Zhu Yuanzhang founding the Ming","wrong":[["Kublai Khan welcoming Marco Polo and other foreigners to his court","That's before the fall."],["Hulegu destroying Baghdad","Different region."],["Batu destroying Kiev","Different region."]],"exp":"Resentment and revolt led to Zhu Yuanzhang overthrowing the Yuan in 1368."}]},{"term":"Tamerlane (Timur)","def":"Conqueror who took over Central Asian territories around 1369 and ravaged Kashgar in 1389–90.","hook":"Timur takes Central Asia.","asks":[{"q":"Which city did Tamerlane ravage in 1389–90?","right":"Kashgar","wrong":[["Baghdad, which the Mongols under Hulegu had already destroyed in 1258","That was Hulegu."],["Kiev","That was Batu."],["Hangzhou","Not on your card."]],"exp":"Tamerlane ravaged Kashgar in 1389–90."},{"q":"Tamerlane taking Central Asia around 1369 fits which larger story?","right":"New powers filling the Mongol gap","wrong":[["The Mongol Empire reaching its greatest size under a single Great Khan","By then it was declining."],["The rise of Mali","Different region."],["Zheng He's voyages","Different story."]],"exp":"As the Mongols declined, conquerors like Tamerlane took their lands."}]},{"term":"Mongol legacy","def":"Largest continuous land empire in history; both destructive and connecting; spread ideas of centralized government.","hook":"Destroyers AND connectors.","asks":[{"q":"Why does your card call the Mongols \"destroyers AND connectors\"?","right":"They wrecked cities but linked trade","wrong":[["They destroyed every trade route they found and connected nothing at all","They also connected Eurasia."],["They only built cities","They also destroyed many."],["They avoided war","They fought constantly."]],"exp":"The Mongols were both destructive and connecting."},{"q":"What is one lasting idea the Mongols spread?","right":"Centralized government","wrong":[["Democracy, with leaders chosen by every person in the empire through voting","Not on your card."],["Paper money","China had it before."],["Buddhism","Not their legacy on your card."]],"exp":"They spread ideas of centralized government."}]}],"intro":["The empire was too big and too divided to last: succession fights, huge distances, rulers blending into local cultures, the Black Death, failed invasions and revolts. In China, the Yuan angered the scholar-gentry by shutting them out of government; the White Lotus Society organized resistance, and Zhu Yuanzhang founded the Ming in 1368. The Mongols' legacy cuts both ways: destroyers and connectors."]}],"intro":["The Mongols built the largest land empire in history in a few decades. This deck covers how they conquered, how they split and ruled, how their peace boosted trade and moved ideas, and why the empire fell apart."]},{"id":3,"name":"The Indian Ocean","optional":false,"sections":[{"name":"Causes of growth","cards":[{"term":"Monsoon winds","def":"Seasonal winds that reverse direction: winter winds from the northeast, spring and summer winds from the southwest; merchants timed voyages and waited in port for months.","hook":"Wait for the wind.","asks":[{"q":"Why did Indian Ocean merchants often wait in port for months?","right":"For the winds to reverse direction","wrong":[["For the Ming emperor to give them permission to sail to the next port","Your card says the seasonal winds."],["For their ships to be rebuilt","Not on your card."],["For the plague to pass","Not on your card."]],"exp":"Merchants timed voyages to the monsoon and waited for it to reverse."},{"q":"A ship leaves India for East Africa. In which season would winds from the northeast carry it?","right":"Winter","wrong":[["Summer, when the monsoon blows from the southwest across the ocean","Summer winds blow from the southwest."],["Any season","The winds reverse by season."],["Never","Winter winds come from the northeast."]],"exp":"Winter monsoon winds come from the northeast."}]},{"term":"Lateen sail","def":"Triangular sail that catches wind from many directions; used by Arab sailors (its origin is debated).","hook":"Triangle turns with the wind.","asks":[{"q":"What advantage did the lateen sail give sailors?","right":"It caught wind from many directions","wrong":[["It let ships sail without any wind at all by using the force of ocean currents","It used wind."],["It made ships heavier","Not its purpose."],["It replaced the rudder","Different tool."]],"exp":"The triangular lateen sail catches wind from many directions."},{"q":"Your card says the lateen sail's origin is debated. How should you write about it?","right":"Say Arab sailors used it; don't claim who invented it","wrong":[["Say it was a Chinese invention, the same as the compass and the stern rudder","Your card doesn't say that."],["Say Europeans invented it","Not on your card."],["Leave it out","It's a key tool."]],"exp":"It was used by Arab sailors; its origin is debated."}]},{"term":"Stern rudder","def":"Chinese invention at the back of the ship that improved stability and steering.","hook":"Rudder at the rear.","asks":[{"q":"Which problem did the stern rudder solve?","right":"Steering and stability","wrong":[["Finding a ship's latitude by measuring the angle of the stars at night","That's the astrolabe."],["Finding north","That's the compass."],["Catching wind","That's the sail."]],"exp":"The stern rudder improved stability and steering."},{"q":"The stern rudder and magnetic compass share which origin?","right":"Both were Chinese inventions","wrong":[["Both were improved by Muslim navigators in the twelfth century for Arab ships","That's the astrolabe."],["Both came from Mali","Not on your cards."],["Both were Mongol","Not on your cards."]],"exp":"Both are Chinese inventions."}]},{"term":"Magnetic compass","def":"Chinese navigation tool that spread across the seas through trade.","hook":"Compass from China.","asks":[{"q":"How did the magnetic compass spread from China?","right":"Through trade across the seas","wrong":[["Through the Mongol yam, which carried it overland from China to Europe","Your card says through sea trade."],["Through the Crusades","Not on your card."],["It never spread","It did."]],"exp":"The compass spread across the seas through trade."},{"q":"Which tool let sailors keep a heading even when clouds hid the stars?","right":"The magnetic compass","wrong":[["The astrolabe, which measured how far north or south the ship had traveled","The astrolabe needs the stars."],["The lateen sail","That catches wind."],["The stern rudder","That steers."]],"exp":"A compass points the way without needing the sky."}]},{"term":"Astrolabe","def":"Tool improved by Muslim navigators in the 12th century that shows how far north or south of the equator a ship is.","hook":"Astro means stars.","asks":[{"q":"What did an astrolabe tell a sailor?","right":"How far north or south of the equator the ship was","wrong":[["How fast the ship was moving through the water compared to the wind","Not its job."],["Which way north was","That's the compass."],["When the monsoon would come","Not its job."]],"exp":"The astrolabe shows how far north or south of the equator a ship is."},{"q":"Who improved the astrolabe in the 12th century?","right":"Muslim navigators","wrong":[["Chinese admirals such as Zheng He, who led the Ming treasure fleets","Zheng He came later."],["Mongol khans","Not on your card."],["Venetian merchants","Not on your card."]],"exp":"Muslim navigators improved it."}]},{"term":"Dhow","def":"Small wooden ship with lateen sails used by Arab and Indian sailors; dominated the seas of this period.","hook":"Dhow: Arab and Indian.","asks":[{"q":"Compare a dhow and a junk.","right":"Dhow: small Arab/Indian; junk: large Chinese","wrong":[["Dhow: a large Chinese ship; junk: a small Arab ship with lateen sails","It's the reverse."],["Both were Chinese","Dhows were Arab and Indian."],["Both were the same size","Junks were much larger."]],"exp":"Dhows were small Arab and Indian ships; junks were large Chinese ships."},{"q":"Which sail did dhows use?","right":"Lateen sails","wrong":[["Square sails of woven silk, which the Chinese supplied to Arab merchants","Dhows used lateen sails."],["No sails at all","They were sailing ships."],["Paper sails","Not on your card."]],"exp":"Dhows used lateen sails."}]},{"term":"Junk","def":"Large Chinese ship with multiple sails and a compartmented hull, up to 400 feet long.","hook":"Junk: the Chinese giant.","asks":[{"q":"What feature made Chinese junks able to carry huge cargoes?","right":"Large size with a compartmented hull","wrong":[["A single small triangular sail that could catch the wind from any direction","That's a lateen sail; junks had several sails."],["Oars rowed by hundreds of slaves","Not on your card."],["Being pulled by camels","No."]],"exp":"Junks had multiple sails, compartmented hulls and could be up to 400 feet long."},{"q":"Which fleet would most likely have been made of junks?","right":"Zheng He's","wrong":[["The Swahili traders' fleets sailing between Kilwa and Mombasa","Swahili traders weren't Chinese."],["Arab merchants'","They used dhows."],["Malacca's navy","Not on your card."]],"exp":"Junks were Chinese ships, like those of the Ming fleets."}]}],"intro":["Sea trade ran on the monsoon winds, which reverse direction by season, so merchants timed their voyages and waited in port. New tools made sailing safer: the lateen sail, the stern rudder and compass from China, and the astrolabe improved by Muslim navigators. Arab and Indian dhows and huge Chinese junks carried the cargo."]},{"name":"Goods and states","cards":[{"term":"Specialized products","def":"Cotton, pepper, and steel from India; spices from the Spice Islands; gold, ivory, and slaves from the Swahili coast; silk and porcelain from China; horses and dates from Southwest Asia.","hook":"Every region had a specialty.","asks":[{"q":"Which region was known for gold and ivory?","right":"The Swahili coast","wrong":[["Southwest Asia, which sent horses and dates to other ports on the ocean","That's horses and dates."],["China","Silk and porcelain."],["India","Cotton, pepper and steel."]],"exp":"Gold, ivory and slaves came from the Swahili coast."},{"q":"Why did regional specialties make the Indian Ocean network grow?","right":"Each region had goods others wanted","wrong":[["Every region produced the same goods, so merchants traded only for money","The point is that regions differed."],["Specialties ended trade","They drove trade."],["Only China had goods","Every region had a specialty."]],"exp":"Different specialties gave every region something to trade."}]},{"term":"Calicut","def":"Southwest Indian port known as the \"City of Spices\"; Arab and Chinese merchants met here and local rulers welcomed them.","hook":"Calicut, spice central.","asks":[{"q":"Why was Calicut called the \"City of Spices\"?","right":"It was a major spice port","wrong":[["It was the only place in the world where pepper and spices could grow","Your card says it was a port known for spices."],["It made porcelain","That's China."],["It was in Africa","It's in southwest India."]],"exp":"Calicut was a southwest Indian port known for spices."},{"q":"Why did Arab and Chinese merchants both come to Calicut?","right":"Local rulers welcomed them","wrong":[["The Mongols forced merchants to trade there instead of at other ports","Not on your card."],["It was the capital of Mali","No."],["It had no rivals","Not on your card."]],"exp":"Calicut's rulers welcomed foreign merchants."}]},{"term":"Gujarat","def":"Kingdom in western India that served as the go-between for East-West trade; customs revenue was huge.","hook":"Gujarat, the go-between.","asks":[{"q":"What made Gujarat rich?","right":
