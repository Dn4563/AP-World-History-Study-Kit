iature paintings in the Ottoman Empire; financial support of artists by European rulers"],["Monumental architecture","Mausolea such as the Taj Mahal and mosques in the Mughal Empire; European palaces such as Versailles and El Escorial"]]}},"questions":[{"id":"B-1","type":"mcq","skill":"Purpose of a policy","topic":"Ruling","stem":"The rules in the first paragraph were most likely intended to","options":["encourage the lords to expand their domains by conquering neighboring provinces","allow the lords to elect a new shogun every other year","convert the lords and their families to Christianity","keep regional lords watched and unable to challenge the shogun"],"ans":3,"exp":"Living in Edo every other year, with families left there as hostages, kept the daimyo watched and unable to rebel.","why":["The rules restrain the lords; disloyal lords could lose their domains.","Alternate years refers to living in Edo, not elections.","The third paragraph bans Christianity.",""],"src":"B1"},{"id":"B-2","type":"mcq","skill":"Continuity and change","topic":"Ruling","stem":"The second paragraph best illustrates which change in Japanese society under the Tokugawa?","options":["Samurai were replaced by a standing army of Janissaries recruited from abroad","Samurai went from warriors to salaried officials","Samurai lost all their status and became ordinary merchants","Samurai gained the right to choose which lord they would serve"],"ans":1,"exp":"\"No longer live by the sword alone... serve as officials... receive a fixed salary\" = swords to salaries.","why":["Janissaries were Ottoman.","","The decree makes them officials, not merchants.","The decree assigns them fixed duties; it does not give them choices."],"src":"B1"},{"id":"B-3","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The Tokugawa policies described in the passage are most similar to which of the following?","options":["The English Bill of Rights, which required Parliament's consent for taxes","Louis XIV keeping the great nobles at Versailles","Akbar's tolerance toward Hindu subjects","The Ottoman millet system, which let religious communities run their own affairs"],"ans":1,"exp":"Both rulers kept powerful nobles close to the center so they could not build independent power.","why":["That limited the ruler; the Tokugawa rules limited the lords.","","Tolerance is the opposite of the Tokugawa ban on Christianity.","The decree bans a religion rather than letting it govern itself."],"src":"B1"},{"id":"B-4","type":"mcq","skill":"Historian's argument","topic":"Ruling","stem":"Which of the following best describes the historian's argument in the passage as a whole?","options":["France and England both moved toward limited monarchy by 1700","Divine right was a uniquely English idea that France rejected","Two divine-right kingdoms ended up with very different monarchies","Louis XIV and James I agreed that Parliament should approve all taxes"],"ans":2,"exp":"Last sentence: two divine-right kingdoms moved in opposite directions.","why":["France moved toward absolutism under Louis XIV.","The passage says the idea reached its height in France.","","That was the 1689 Bill of Rights, after James I's time."],"src":"B2"},{"id":"B-5","type":"mcq","skill":"Evidence for an argument","topic":"Ruling","stem":"Which evidence does the historian use to support the claim that Louis XIV was an absolute ruler?","options":["He signed the Bill of Rights to share power with an assembly","He described kings as God's lieutenants who sit upon God's throne","He used intendants and kept nobles at his palace","He allowed provincial nobles to collect taxes without royal officials"],"ans":2,"exp":"Intendants (central control of the provinces) and Versailles (control of the nobles).","why":["That was England, and it limited the crown.","Those are James I's words, not evidence about Louis.","","Intendants were royal officials sent to oversee taxes."],"src":"B2"},{"id":"B-6","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"James I's claim in the first paragraph is most similar to which of the following?","options":["The Chinese idea of the Mandate of Heaven","The Sikh teaching that all people are equal before God","The English Bill of Rights' limits on the monarch's power to tax","Luther's argument that the Scriptures stand above the pope"],"ans":0,"exp":"Both divine right and the Mandate of Heaven tie the ruler's power to a divine source. (Difference: the Mandate could be lost.)","why":["","That is about equality, not royal power.","That limits kings; James I exalts them.","That challenges authority rather than supporting a king's."],"src":"B2"},{"id":"B-7","type":"mcq","skill":"Claim in a source","topic":"Belief systems","stem":"Which of the following best describes a claim the author makes in the first paragraph?","options":["Indulgences were freely given to the poor by the bishops","The pope had already banned the sale of church offices","Most townspeople openly protested against indulgences before Luther","Church practices took money from the poor and sold offices"],"ans":3,"exp":"Paragraph 1 describes indulgences sold to the poor and simony (buying and selling offices).","why":["The author says preachers sold them and the poor paid.","The author says no one dared to speak against it.","He says no one dared to speak out.",""],"src":"B3"},{"id":"B-8","type":"mcq","skill":"Claim in a source","topic":"Belief systems","stem":"According to the second paragraph, Luther's teaching challenged the practices in the first paragraph mainly because he held that","options":["God has already chosen who will be saved, so the Church's sacraments are useless","only priests should be allowed to read and explain the Scriptures","people are saved by faith, so salvation cannot be bought with payments","the pope alone could forgive sins in exchange for good works"],"ans":2,"exp":"Faith alone (sola fide): if salvation comes through faith, indulgences cannot buy it.","why":["Predestination was Calvin's teaching, and the passage does not mention it.","He put the Scriptures above the pope; he did not limit them to priests.","","Luther rejected both payments and works as the way to be saved."],"src":"B3"},{"id":"B-9","type":"mcq","skill":"Effect","topic":"Belief systems","stem":"The situation in the last paragraph most directly reflects which of the following?","options":["The Edict of Nantes, which protected French Calvinists","The Peace of Westphalia's end of all religious differences in Europe","The Anglican Church, which Henry VIII founded independent of the pope","A settlement letting each German ruler choose the faith"],"ans":3,"exp":"\"Each prince decides which faith his lands will follow\" = the Peace of Augsburg (1555).","why":["That was France, and it was a royal edict, not a choice for princes.","Westphalia added Calvinism as a choice; it did not end differences.","That was England.",""],"src":"B3"},{"id":"B-10","type":"mcq","skill":"Continuity and change","topic":"Belief systems","stem":"Which of the following best describes the change in the Sikh community traced in the passage?","options":["It turned from a message of unity to armed self-defense","It moved from armed resistance toward full acceptance by the Mughal emperors","It gave up its rejection of caste in order to win Mughal support","It merged with Akbar's Din-i Ilahi and stopped being a separate faith"],"ans":0,"exp":"Last sentence: a message of unity became, by necessity, an armed community.","why":["","The order is reversed: tolerance came first, then persecution.","The passage says nothing about giving up equality.","Sikhism stayed separate and grew."],"src":"B4"},{"id":"B-11","type":"mcq","skill":"Cause","topic":"Belief systems","stem":"According to the passage, which development most directly led to the founding of the Khalsa?","options":["Akbar's grant of land to the Sikh community","Mughal persecution, including Guru Arjan's execution","The installation of the Adi Granth in the Golden Temple","Contact between Hindus and Muslims in Punjab"],"ans":1,"exp":"After Jahangir executed Guru Arjan, the Sikhs organized to defend themselves; the Khalsa followed.","why":["That was a sign of tolerance, before relations soured.","","That came during the peaceful period.","That explains Sikhism's origins, not the Khalsa."],"src":"B4"},{"id":"B-12","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"The table best supports which of the following conclusions?","options":["Rulers in many regions used similar tools to claim legitimacy","Only Islamic empires used religion to support their rulers' authority","European rulers relied on architecture but never on religion","Monumental architecture was found only in South Asia"],"ans":0,"exp":"Each row mixes regions: legitimacy tools were shared across the world, in local forms.","why":["","Divine right and Mexica sacrifice are on the same row.","The table lists divine right under religion.","Versailles and El Escorial are European."],"src":"B5"},{"id":"B-13","type":"mcq","skill":"Best used as evidence","topic":"Comparison","stem":"A historian could best use the \"Religion\" row of the table as evidence that","options":["many states tied a ruler's power to divine approval","all of these rulers followed the same religion","religion weakened rulers by giving power to the clergy","rulers stopped building monuments once they claimed religious authority"],"ans":0,"exp":"Caliph, divine right, Songhai Islam, Mexica sacrifice: different religions, same use.","why":["","They range from Muslim caliphs to Christian kings to the Mexica.","The row shows religion supporting rulers.","The architecture row shows they did both."],"src":"B5"}]},{"name":"MCQ Set C: Class practice questions","mode":"practice","tips":["These are the 9 questions from your class's Unit 3 practice handout. The stems and passages are the handout's; the choices are reordered.","The handout came without an answer key. These answers come from the passages and AMSCO 3.1–3.4. Check them against your class's key (VERIFY).","For \"best used as evidence of\" or \"best illustrates\" questions, first name the idea the source shows (expansion, legitimacy, administration, revenue, belief systems, continuity or change), then pick the option that matches it.","Eliminate options that are true in history but not shown by the source, or that belong to the wrong time, region or empire.","Watch for extreme words (\"only,\" \"all,\" \"never,\" \"completely\"): they are usually wrong."],"sources":{"C1":{"title":"A Catholic priest meets Shah Abbas I","attr":"Father Simon, a European Roman Catholic priest, in a report to the pope on meeting the Safavid Shah Abbas I, 1588. From your class's Unit 3 practice questions.","label":"","text":"He is very valiant and has a great liking for warfare and weapons of war, which he has constantly in his hands: we have been eye-witnesses of this because, whenever we were with him, he was adjusting his [swords], testing his [muskets], etc . . . This is the great experience, which he has obtained of warfare over so many years, that he makes it in person and from the first has made him a fine soldier and very skilled, and his men so dexterous that they are little behind our men in Europe. He has introduced into his militia the use of and esteem for [muskets], in which they are very practiced. Therefore it is that his realm has been so much extended on all sides. . . . All the above mentioned soldiers, who will total some 100,000, receive pay for the whole year."},"C2":{"title":"Sunni Ali and the Songhai state","attr":"J. Rotondo-McCord, \"Kingdoms of the Medieval Sudan,\" Xavier University. From your class's Unit 3 practice questions.","label":"","text":"Demonized as an enemy of the faith by the Muslim narrative sources, yet lionized as a warrior hero in the oral tradition, Sunni Ali, who reigned from 1464 to 1492, is one of the most controversial figures of the African Middle Ages. . . . Relying on a swift and mobile cavalry force as well as on naval control of the Niger River, Sunni Ali had conquered the agriculturally rich central Niger or 'inland delta,' including the wealthy and scholarly cities of Timbuktu and Jenne, by the 1470s. . . . He was well aware that a vast empire could not be held together by military conquests alone, but need[ed] an effective and efficient administrative structure as well. Indeed, the organization of Songhay [Songhai] government which was developed to a great degree under Sunni Ali differed substantially from previous Sudanic patterns of empire. These had been based more on alliances and relationships with tributary states than on the high degree of centralization characteristic of Songhay [Songhai]."},"C3":{"title":"The Safavids and the Ottomans","attr":"William H. McNeill, The Rise of the West, 1963. From your class's Unit 3 practice questions.","label":"","text":"Throughout the sixteenth century, the Safavi [Safavid] empire remained a profoundly disturbing force in the Moslem [Muslim] world, dedicated to the defense and propagation of Shi'a doctrines at home and abroad. This policy implied a normal state of hostility with the Ottoman empire, punctuated only briefly by periods of peace. By the seventeenth century, however, when the Safavi empire reached its apogee [peak] under Shah Abbas the Great (1587–1629), the fanaticism of the Shi'a revolution had faded, at least in court circles; and a lasting peace with the Ottomans was concluded in 1639."}},"questions":[{"id":"C1","type":"mcq","skill":"Purpose of a source","topic":"Expansion","stem":"Which claim about Father Simon's purpose for meeting Shah Abbas I is best supported by the above passage?","options":["Simon was impressed by the new technology used by the Safavids.","Simon wanted the pope to know of the Safavids' military power.","Simon hoped the pope would sell new weapons to the Safavids.","Simon thought the Safavids could teach Europeans about how to organize a military."],"ans":1,"exp":"The report to the pope stresses the shah's skill, 100,000 paid soldiers, muskets and an empire \"extended on all sides\": it is a briefing on Safavid military power.","why":["He mentions muskets, but the report is about the size, skill and pay of the whole army, not a new invention.","","Nothing in the report asks for or offers weapons; the Safavids already have muskets.","He says the Safavid soldiers are \"little behind our men in Europe\": close to Europe, not ahead of it."],"src":"C1"},{"id":"C2","type":"mcq","skill":"Cause","topic":"Rivalries","stem":"Which most strongly contributed to the historical development reflected in Father Simon's description of the Safavid military structure?","options":["The Mughal emperors' support for the Sikh religion","Ottoman development of shariah","Safavid intolerance for the Sunni population","The Thirty Years' War"],"ans":2,"exp":"The Shi'a Safavids forced conversion on Sunnis and fought the Sunni Ottomans over religion and territory, so they built a large gunpowder army.","why":["Mughal emperors did not support Sikhism; Jahangir executed Guru Arjan in 1606, and it has nothing to do with the Safavid army.","Islamic law did not cause a Safavid military build-up.","","That was a European war (1618–1648), decades after this 1588 report."],"src":"C1"},{"id":"C3","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"This source supports the claim that the Safavids were similar to the Ottomans and the Mughals in that all three","options":["threatened to attack regions of Europe","practiced identical religious beliefs","were ahead of the Europeans in military power","used gunpowder weapons"],"ans":3,"exp":"Simon describes Safavid muskets. The Ottomans, Safavids and Mughals all used firearms to expand: the gunpowder empires.","why":["Only the Ottomans pushed into Europe (Vienna); the Safavids and Mughals did not.","The Safavids were Shi'a; the Ottomans and Mughals were Sunni, and the Mughals ruled a Hindu majority.","Simon says the Safavid troops are \"little behind\" Europe's, which is not ahead.",""],"src":"C1"},{"id":"C4","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The Songhai Empire was like Japan under the Tokugawa shogunate because the Songhai","options":["created a strong central government","expanded its territory by creating distant colonies","was ruled by a Muslim","was the first empire in its region to trade gold extensively"],"ans":0,"exp":"The passage stresses Songhai's \"high degree of centralization.\" The Tokugawa also centralized power, for example with alternate attendance for the daimyo.","why":["","Songhai conquered nearby lands on the Niger; neither it nor Tokugawa Japan built distant colonies.","Tokugawa Japan was not ruled by Muslims, so this is not a similarity.","Gold is not part of the passage, and it is not something Songhai shares with Tokugawa Japan."],"src":"C2"},{"id":"C5","type":"mcq","skill":"Comparison","topic":"Ruling","stem":"The Songhai Empire under Sunni Ali was different from the empire under Askia the Great because","options":["Sunni Ali made a pilgrimage to Mecca","Sunni Ali made Songhai the largest kingdom in West Africa","Askia used religion to legitimize his control","Askia used zamindars to collect taxes"],"ans":2,"exp":"Sunni Ali relied on military conquest and was condemned by Muslim writers. Askia the Great was a devout Muslim who used Islam to legitimize his rule.","why":["The passage says Muslim sources called Sunni Ali an enemy of the faith; nothing ties him to a pilgrimage.","Both rulers expanded Songhai by conquest, so size is not what separates them; religion is.","","Zamindars were Mughal tax collectors in India, not part of Songhai."],"src":"C2"},{"id":"C6","type":"mcq","skill":"Ruling","topic":"Ruling","stem":"How did Askia the Great challenge Sunni Ali's legitimacy?","options":["He claimed Sunni Ali was a weak military commander.","He established strong tributary ties that had more allegiances to him than to Sunni Ali.","He reformed taxation policies throughout the kingdom.","He questioned Sunni Ali's faithfulness to the principles of Islam."],"ans":3,"exp":"Muslim sources \"demonized\" Sunni Ali \"as an enemy of the faith.\" Askia based his own right to rule on Islam and attacked Sunni Ali's faith.","why":["The passage calls Sunni Ali a warrior hero with a swift cavalry; his military record was his strength.","Tributary alliances were the older Sudanic pattern; Songhai stood out for centralization instead.","Tax reform is a way of running a state, not a challenge to a rival's right to rule.",""],"src":"C2"},{"id":"C7","type":"mcq","skill":"Best used as evidence","topic":"Rivalries","stem":"Which would be the most useful source of evidence to support McNeill's contention that \"the Safavi [Safavid] empire remained a profoundly disturbing force in the Moslem [Muslim] world\"?","options":["A biography written in 2018 by an anti-Shi'a leader","A private diary written by an Ottoman government official","A Hollywood movie script about Shah Abbas I","A campaign speech by Iran's current leader on his country's history"],"ans":1,"exp":"An Ottoman official was in the Muslim world at the time and saw the Safavid threat directly; a private diary has no audience to perform for.","why":["Written centuries later by someone biased against Shi'a Islam, it is weak evidence about the 1500s.","","A modern movie is made to entertain; it is not evidence from the period.","A modern political speech has a purpose (winning votes) and comes from long after the events."],"src":"C3"},{"id":"C8","type":"mcq","skill":"Continuity and change","topic":"Rivalries","stem":"Today, Iran and Turkey are often political rivals. This passage suggests that this rivalry is based on historical conflicts over","options":["how to practice Islam correctly","democracy and political extremism","control of the cities of Medina and Mecca","the role of leaders such as the shah and emperor"],"ans":0,"exp":"Iran was the Shi'a Safavid Empire and Turkey the Sunni Ottoman Empire. McNeill ties their \"normal state of hostility\" to the Safavids spreading \"Shi'a doctrines.\"","why":["","Democracy is not part of the passage; the conflict it describes is over Shi'a doctrine.","The passage never mentions the holy cities.","Both empires had rulers with similar power; the passage puts the conflict in religion, not titles."],"src":"C3"},{"id":"C9","type":"mcq","skill":"Cause","topic":"Rivalries","stem":"What brought an end to the \"normal state of hostility\" between the Safavids and Ottomans mentioned in the passage?","options":["Both sides united to fight against European Christian forces that threatened them.","The Ottomans slowly weakened until the Safavids no longer saw them as a threat.","Safavid fervor for its brand of Islam slowly declined until the two empires stopped fighting.","The constant fighting increased the respect of the empires for each other, which eventually led to peace between them."],"ans":2,"exp":"McNeill says that by Shah Abbas's time \"the fanaticism of the Shi'a revolution had faded,\" and a lasting peace followed in 1639.","why":["The passage mentions no alliance against Europe.","The passage explains the peace through Safavid change, not Ottoman weakness.","","McNeill says nothing about respect; he says the \"fanaticism\" faded."],"src":"C3"}]},{"name":"Guide quiz 3.1: Expansion","mode":"practice","tips":["Every source here was written only from your teacher's study guide, in the style of her test. Read the attribution line first.","Find the main idea of each paragraph before you look at the choices; many questions ask about one paragraph.","All four choices will sound possible. Cross out the ones that are true but not in the source, from the wrong empire, or too extreme (\"only,\" \"always,\" \"never\").","Use Retest missed questions at the end. The last item is the guide's \"Check yourself\": write your answer before opening the model."],"sources":{"g1a":{"title":"Guns and empires","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["Between 1450 and 1750, the Ottoman, Safavid, Mughal, Manchu (Qing) and Russian empires grew across connected stretches of land. Historians often group the first three as \"gunpowder empires,\" because cannons and firearms, and not cavalry alone, made their rapid growth possible.","The clearest example came in 1453. Mehmed II used massive cannons to break through the walls of Constantinople, a city that had protected the Byzantine Empire for centuries. Its fall ended that empire and handed the Ottomans one of the great trade centers of the world.","Gunpowder did not make the Ottomans unstoppable, however. In 1529 their siege of Vienna failed, and that city marked the farthest point of their push into Central Europe. Weapons explained much of the empires' growth, but political and religious rivalries also shaped where they expanded and where they stopped."]},"g1b":{"title":"Rivals in faith and land","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["In 1514 the Ottomans met the Safavids at Chaldiran. Ottoman artillery and Janissaries defeated the Safavid army, and the victory stopped Safavid expansion to the west. Because the Ottomans were Sunni and the Safavids were Shi'a, the battle also set up a long-running Sunni–Shi'a rivalry between the two states.","The Safavids had a second rival to the east. They and the Mughals fought again and again over territory, and the religious difference between Shi'a Safavids and Sunni Mughals sharpened the conflict.","The Mughals themselves owed their empire to gunpowder. Babur founded it after winning at Panipat in 1526 with artillery. His grandson Akbar expanded it across northern India, and Aurangzeb later pushed it to its largest size in the south."]},"g1c":{"title":"How the empires expanded, 1450–1750","attr":"Your teacher's Unit 3 study guide.","label":"From your teacher's Unit 3 study guide.","table":[["Empire","Where it expanded","How it expanded"],["Ottoman","Southeastern Europe, Middle East, North Africa","Cannons, Janissaries, navy"],["Safavid","Persia, parts of Central Asia","Gunpowder armies, Shi'a identity"],["Mughal","South Asia","Artillery (Panipat), alliances"],["Qing (Manchu)","China, Central and East Asia","Banner system, conquest of Ming China"],["Russian","Siberia, Central Asia","Cossacks, firearms against steppe peoples"]]},"g1d":{"title":"Beyond the Islamic empires","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["Gunpowder expansion was not only an Islamic or Eurasian story. In 1591 Morocco defeated the West African empire of Songhai using firearms, showing that the same weapons could reshape states across the Sahara.","In East Asia, the Manchus overthrew the Ming dynasty in 1644 and founded the Qing. They then expanded into Central and East Asia through both conquest and alliances, including long campaigns against the Zunghars, a Mongol group in Central Asia.","Russia grew in the opposite direction. In the 1550s Ivan IV, known as the Terrible, conquered Kazan and Astrakhan, opening the way east. Cossacks armed with firearms then pushed Russian control across Siberia, where the peoples of the steppe could not match their weapons."]}},"questions":[{"id":"GQ1-1","type":"mcq","skill":"Historian's argument","topic":"Expansion","stem":"Which of the following best describes the historian's argument in the passage as a whole?","options":["Gunpowder made the Ottomans unstoppable until the end of the period in 1750","Cavalry, not firearms, was the main reason these empires grew so quickly","Guns drove much of the growth, but rivalries also shaped its limits","Religion was the only factor that decided where the empires were able to expand"],"ans":2,"exp":"Paragraph 1 credits gunpowder; paragraph 3 adds that political and religious rivalries also shaped where empires expanded.","why":["The third paragraph says gunpowder did not make them unstoppable (Vienna, 1529).","The first paragraph says cannons and firearms, not cavalry alone, made growth possible.","","The historian names weapons first and adds rivalries; \"only\" is too extreme."],"src":"g1a"},{"id":"GQ1-2","type":"mcq","skill":"Evidence for an argument","topic":"Expansion","stem":"Which evidence from the passage best supports the claim that gunpowder could overcome old defenses?","options":["The Ottoman siege of Vienna in 1529 failed to take the Habsburg city","Five empires grew across connected stretches of land between 1450 and 1750","Cannons broke walls that had protected Constantinople for centuries","Historians group the Ottomans, Safavids and Mughals together under one label"],"ans":2,"exp":"Paragraph 2: Mehmed II's massive cannons broke through the walls of Constantinople.","why":["That shows a limit of gunpowder, not its power.","That describes where they grew, not how old defenses fell.","","A label is not evidence about breaking defenses."],"src":"g1a"},{"id":"GQ1-3","type":"mcq","skill":"Effect","topic":"Expansion","stem":"According to the passage, the fall of Constantinople most directly resulted in","options":["the farthest Ottoman advance into Central Europe, which later stopped at Vienna","the start of the Sunni–Shi'a rivalry between the Ottomans and the Safavid Empire","the end of the Byzantine Empire and a major trade center for the Ottomans","a lasting alliance between the Ottoman sultans and the Christian kings of Europe"],"ans":2,"exp":"The fall ended the Byzantine Empire and gave the Ottomans a major trade center.","why":["Vienna (1529) is the farthest push, not the result of 1453.","That rivalry was set up by Chaldiran in 1514.","","The passage describes no alliance."],"src":"g1a"},{"id":"GQ1-4","type":"mcq","skill":"Cause","topic":"Rivalries","stem":"According to the first paragraph, the conflict at Chaldiran became a long-running rivalry mainly because","options":["the Safavids defeated the Ottomans and took territory in the west","the two empires were divided by the Sunni–Shi'a split","the Mughals joined the Safavids in a war against the Ottoman Empire","the Ottomans had no artillery and could not win a final victory"],"ans":1,"exp":"Sunni Ottomans vs. Shi'a Safavids: the battle set up a long-running Sunni–Shi'a rivalry.","why":["The Ottomans won, and Safavid expansion westward stopped.","","The passage says the Safavids and Mughals were rivals.","Ottoman artillery won the battle."],"src":"g1b"},{"id":"GQ1-5","type":"mcq","skill":"Comparison","topic":"Rivalries","stem":"Which of the following best compares the Safavids' two rivalries described in the passage?","options":["Both mixed fights over land with religious difference","Both were fought only over trade routes, with religion playing no part","Both ended with Safavid victories that expanded the empire in every direction","Both rivals shared the Safavids' Shi'a faith but competed for its leadership"],"ans":0,"exp":"Ottoman–Safavid: territory plus Sunni vs. Shi'a. Safavid–Mughal: territory, sharpened by Shi'a vs. Sunni. (Your textbook adds that trade routes mattered more in the Mughal rivalry.)","why":["","The passage stresses religion in both rivalries.","Chaldiran was a Safavid defeat.","The Ottomans and Mughals were Sunni."],"src":"g1b"},{"id":"GQ1-6","type":"mcq","skill":"Continuity and change","topic":"Expansion","stem":"The third paragraph best illustrates which pattern in Mughal history?","options":["Steady decline from the moment Babur founded the empire at Panipat","Expansion that stopped after Babur because later rulers refused to use artillery","Conquest of the Safavid heartland in Persia by Akbar's armies","Growth begun by gunpowder and continued by later rulers"],"ans":3,"exp":"Babur (artillery at Panipat) → Akbar (northern India) → Aurangzeb (largest size, south).","why":["The empire grew under Akbar and reached its largest size under Aurangzeb.","Akbar and Aurangzeb kept expanding.","Akbar expanded across northern India, not Persia.",""],"src":"g1b"},{"id":"GQ1-7","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"Based on the table, which statement best compares how the five empires expanded?","options":["Most used gunpowder, combined with tools of their own","All five relied on navies more than on land armies to conquer territory","None of the five combined weapons with religion or alliances in their expansion","All five expanded into the same region of Central Asia and fought over it"],"ans":0,"exp":"Cannons, gunpowder armies, artillery and firearms appear in most rows, alongside banners, alliances, a navy or religion.","why":["","Only the Ottoman row lists a navy.","The Safavid row lists Shi'a identity; the Mughal row lists alliances.","The regions differ, from North Africa to Siberia."],"src":"g1c"},{"id":"GQ1-8","type":"mcq","skill":"Best used as evidence","topic":"Expansion","stem":"The Safavid row of the table can best be used as evidence that","options":["the Safavids expanded mainly by building a powerful navy in the Persian Gulf","the Safavids expanded into South Asia by forming alliances with local rulers","the Safavids conquered Ming China using the banner system","religious identity could be a tool of expansion as well as a belief"],"ans":3,"exp":"\"Gunpowder armies, Shi'a identity\": faith helped unite and drive the Safavid state.","why":["The row lists gunpowder armies and Shi'a identity, not a navy.","South Asia and alliances are the Mughal row.","That is the Qing row.",""],"src":"g1c"},{"id":"GQ1-9","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"According to the table, which two empires expanded against peoples of Central or East Asia?","options":["The Ottoman and the Mughal empires","The Qing and the Russian empires","The Safavid and the Ottoman empires","The Mughal and the Safavid empires, together with the Ottomans"],"ans":1,"exp":"Qing: China, Central and East Asia. Russian: Siberia, Central Asia.","why":["Their rows list Southeastern Europe, the Middle East, North Africa and South Asia.","","The Ottoman row does not list Central or East Asia.","The Mughal row lists only South Asia."],"src":"g1c"},{"id":"GQ1-10","type":"mcq","skill":"Claim in a source","topic":"Expansion","stem":"Which of the following best describes the claim made in the first paragraph?","options":["Gunpowder reshaped states beyond Eurasia too","Songhai used firearms to stop a Moroccan invasion of West Africa","Firearms were unknown in Africa until the nineteenth century","Morocco and Songhai were both part of the Ottoman Empire by 1591"],"ans":0,"exp":"Morocco's 1591 victory shows gunpowder expansion was not limited to Eurasia.","why":["","Morocco had the firearms and won.","Morocco used them in 1591.","The passage presents them as separate states."],"src":"g1d"},{"id":"GQ1-11","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The Qing and Russian expansion described in the passage were similar in that both","options":["began after the overthrow of the Ming dynasty in 1644","relied on Cossacks with firearms to cross Siberia","depended on alliances with the Mughal Empire to defeat steppe peoples","pushed into Central Asia using military power"],"ans":3,"exp":"The Qing fought the Zunghars in Central Asia; Russia expanded through Kazan, Astrakhan and Siberia.","why":["Russia's push east began in the 1550s.","Cossacks were Russian; the Qing used banners and alliances.","No Mughal alliance appears in the passage.",""],"src":"g1d"},{"id":"GQ1-12","type":"mcq","skill":"Cause","topic":"Expansion","stem":"According to the third paragraph, what most directly opened the way for Russian expansion east?","options":["The Manchu overthrow of the Ming dynasty in China in 1644","Ivan IV's conquest of Kazan and Astrakhan","Morocco's victory over the empire of Songhai in West Africa","Long Qing campaigns against the Zunghars in Central Asia"],"ans":1,"exp":"\"In the 1550s Ivan IV … conquered Kazan and Astrakhan, opening the way east.\"","why":["That is the Qing story, and it came later.","","That is unrelated to Russia.","Those were Qing campaigns, not Russian ones."],"src":"g1d"},{"id":"G1.CY","type":"saq","lead":"Check yourself (from your study guide). Write your answer, then compare it to the model.","parts":[{"k":"A","prompt":"Explain one way gunpowder helped an empire expand.","skill":"Explaining a cause","model":"Gunpowder let the Ottomans take cities that had resisted attack for centuries. In 1453 Mehmed II used massive cannons to break through the walls of Constantinople. This ended the Byzantine Empire and gave the Ottomans a major trade center, which made the empire richer and stronger.","tea":["Gunpowder let the Ottomans take cities that had resisted attack for centuries.","In 1453 Mehmed II used massive cannons to break through the walls of Constantinople.","This ended the Byzantine Empire and gave the Ottomans a major trade center, which made the empire richer and stronger."],"earns":"You name a specific empire and a specific gunpowder event, and explain how the weapons led to the gain.","weak":"\"Gunpowder made empires strong.\" Too general: name the empire, the event and how it helped."},{"k":"B","prompt":"Explain a second way gunpowder helped a different empire expand.","skill":"Explaining a cause","model":"Gunpowder let a smaller army beat a larger one and found a new empire. At Panipat in 1526, Babur used artillery to defeat the Sultan of Delhi. This victory founded the Mughal Empire, which Akbar then expanded across northern India.","tea":["Gunpowder let a smaller army beat a larger one and found a new empire.","At Panipat in 1526, Babur used artillery to defeat the Sultan of Delhi.","This victory founded the Mughal Empire, which Akbar then expanded across northern India."],"earns":"A different empire from part A, with its own event (Panipat, Chaldiran, Tondibi, Cossacks in Siberia).","weak":"Repeating the empire from part A, or naming a battle without saying what gunpowder did."}]}]},{"name":"Guide quiz 3.2: Governments","mode":"practice","tips":["Every source here was written only from your teacher's study guide, in the style of her test. Read the attribution line first.","Find the main idea of each paragraph before you look at the choices; many questions ask about one paragraph.","All four choices will sound possible. Cross out the ones that are true but not in the source, from the wrong empire, or too extreme (\"only,\" \"always,\" \"never\").","Use Retest missed questions at the end. The last item is the guide's \"Check yourself\": write your answer before opening the model."],"sources":{"g2a":{"title":"Holding an empire together","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["Military force alone could not hold a large empire together. Rulers also needed loyal officials, professional armies, a way to show their right to rule, and a steady flow of taxes.","The Ottomans found loyal servants through the devshirme. They took Christian boys from conquered lands, converted them to Islam and trained them as Janissaries or government officials. Because these men had no ties to local noble families, they were loyal to the sultan alone.","For revenue, the Ottomans used tax farming: the government sold or granted the right to collect taxes in a region to private individuals, who kept part of what they collected. The Mughals relied on zamindars, landholding elites who collected taxes from peasants and sent a share to the central government. In both empires, the people who actually gathered the taxes were not the central government's own officials."]},"g2b":{"title":"Orders to the great lords","attr":"Practice passage in the voice of a Tokugawa official in Japan, after 1603.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["By order of the shogun, each regional lord shall live in the capital every other year. In this way no lord may stay long in his own domain, gathering strength, without the shogun's knowledge.","The samurai shall no longer serve only as warriors. They shall become officials who receive a salary and carry out the business of government.","Contact with foreigners shall be sharply limited, and the Christian religion is banned throughout the land. These rules shall keep the peace that the shogun has brought after long years of war among the lords."]},"g2c":{"title":"Kings, tsars and emperors","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["Rulers in many regions faced the same problem: powerful nobles and officials who might act on their own. Louis XIV of France, the classic example of absolutism, made the great nobles live at his palace of Versailles, where he could watch them and keep them dependent on him.","Peter the Great took a different path in Russia. He westernized the country by modernizing the military and building St. Petersburg, and his Table of Ranks promoted officials by service rather than by birth. In China, the Qing kept the Confucian civil service exam and shared government posts between Manchu and Han officials to win acceptance.","Rulers also displayed their power. Grand buildings such as the Taj Mahal, Versailles and the Temple of the Sun in Cuzco showed off their wealth, while religion justified their rule: European kings claimed divine right, the Mexica used human sacrifice, and Songhai rulers promoted Islam."]},"g2d":{"title":"Ruling the empires","attr":"Your teacher's Unit 3 study guide.","label":"From your teacher's Unit 3 study guide.","table":[["Category","Ottoman","Mughal","Other examples"],["Bureaucratic/military elite","Devshirme, Janissaries","Mansabdar system","Salaried samurai (Japan), Table of Ranks (Russia)"],["Religious legitimacy","Sultan as caliph","Akbar's Din-i-Ilahi","Divine right of kings (Europe)"],["Monumental architecture","Topkapi Palace, mosques","Taj Mahal, Red Fort","Versailles (France)"],["Revenue system","Tax farming","Zamindars","Tribute (Mexica, Inca)"]]}},"questions":[{"id":"GQ2-1","type":"mcq","skill":"Claim in a source","topic":"Ruling","stem":"Which of the following best describes the claim made in the first paragraph?","options":["Conquest alone could not keep a large empire together","Professional armies were the only thing a ruler needed to keep control of an empire","Large empires were held together mainly by trade with their neighbors","Rulers could keep power without collecting any taxes from their subjects"],"ans":0,"exp":"\"Military force alone could not hold a large empire together\": rulers also needed officials, legitimacy and revenue.","why":["","The paragraph lists officials, legitimacy and taxes as well; \"only\" is too extreme.","Trade is not mentioned.","The paragraph says rulers needed steady taxes."],"src":"g2a"},{"id":"GQ2-2","type":"mcq","skill":"Evidence for an argument","topic":"Ruling","stem":"Which evidence from the second paragraph best explains why devshirme recruits were loyal to the sultan?","options":["They were taken from Christian families in lands the Ottomans had conquered","They were converted to Islam before they were trained","They served as Janissaries in the Ottoman army","They had no ties to local noble families"],"ans":3,"exp":"\"Because these men had no ties to local noble families, they were loyal to the sultan alone.\"","why":["Where they came from is not the reason the passage gives for loyalty.","Conversion is part of the process, but the passage ties loyalty to having no noble ties.","This is their role, not the reason for their loyalty.",""],"src":"g2a"},{"id":"GQ2-3","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The third paragraph best supports which comparison between Ottoman and Mughal revenue?","options":["Both relied on tribute from conquered states as their only source of revenue","The Mughals sold tax rights, while the Ottomans relied on landholding elites","Neither empire allowed tax collectors to keep any part of what they collected","Both had people outside the central government collect taxes"],"ans":3,"exp":"Tax farmers and zamindars both collected taxes and kept a share.","why":["Tribute is the Mexica and Inca example; neither empire relied only on it.","This swaps them: tax farming was Ottoman, zamindars were Mughal.","Both let collectors keep part.",""],"src":"g2a"},{"id":"GQ2-4","type":"mcq","skill":"Purpose of a policy","topic":"Ruling","stem":"The rule in the first paragraph was most likely intended to","options":["give regional lords more time to govern their own domains without interference","stop regional lords from building power the shogun could not see","train regional lords as salaried officials of the central government","encourage regional lords to make alliances with foreign traders"],"ans":1,"exp":"Living in the capital every other year meant no lord could gather strength unseen: alternate attendance.","why":["The rule takes lords away from their domains every other year.","","The salaried officials were the samurai.","The third paragraph sharply limits foreign contact."],"src":"g2b"},{"id":"GQ2-5","type":"mcq","skill":"Continuity and change","topic":"Ruling","stem":"The second paragraph best illustrates which change in Japanese society?","options":["Samurai were replaced by enslaved soldiers recruited from conquered lands","Samurai lost their place in society and were sent to work as farmers","Samurai went from warriors to salaried officials","Samurai gained the right to rule their own domains without the shogun"],"ans":2,"exp":"\"Officials who receive a salary\" = swords to salaries.","why":["That describes the Ottoman devshirme, not Japan.","They became salaried officials, not farmers.","","They became officials serving the government."],"src":"g2b"},{"id":"GQ2-6","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The Tokugawa policies in the passage are most similar to which of the following?","options":["Louis XIV keeping nobles at Versailles","Peter the Great's westernization of Russia's military and capital city","Ottoman tax farming, which let private individuals collect taxes","Akbar's tolerance of different religions in the Mughal Empire"],"ans":0,"exp":"Both kept powerful nobles close to the ruler so they could be watched.","why":["","Peter opened Russia to the West; the Tokugawa closed Japan off.","That is revenue, not control of nobles.","The Tokugawa banned Christianity."],"src":"g2b"},{"id":"GQ2-7","type":"mcq","skill":"Historian's argument","topic":"Ruling","stem":"Which of the following best describes the main idea of the first two paragraphs?","options":["Rulers in different regions used different ways to control elites","Every ruler in the period used the same Confucian exam system to choose officials","European rulers gave nobles more independence than Asian rulers did","Rulers chose officials only by birth, never by service or examination"],"ans":0,"exp":"Same problem (powerful elites), different solutions: Versailles, Table of Ranks, exams and shared posts.","why":["","Only the Qing kept the Confucian exam.","Louis XIV kept nobles dependent at Versailles.","Peter's Table of Ranks promoted by service."],"src":"g2c"},{"id":"GQ2-8","type":"mcq","skill":"Cause","topic":"Ruling","stem":"According to the passage, the Qing shared government posts between Manchu and Han officials in order to","options":["prepare the empire for a war against Peter the Great's Russia","replace the Confucian civil service exam with a new military test","copy the Table of Ranks that promoted Russian officials by service","win acceptance from the people they ruled"],"ans":3,"exp":"\"Shared government posts between Manchu and Han officials to win acceptance.\"","why":["No war is mentioned.","The Qing kept the Confucian exam.","The passage presents these as separate approaches.",""],"src":"g2c"},{"id":"GQ2-9","type":"mcq","skill":"Best used as evidence","topic":"Ruling","stem":"The third paragraph can best be used as evidence that rulers","options":["depended mainly on trade to pay for their armies and their palaces","used buildings and religion to justify their power","avoided religion so that their subjects of different faiths would stay loyal","built monuments only in Europe, where divine right was strongest"],"ans":1,"exp":"Monumental architecture and religious legitimacy: two ways to show the right to rule.","why":["The paragraph is about display and religion, not trade.","","It lists divine right, human sacrifice and Islam.","It lists the Taj Mahal and the Temple of the Sun."],"src":"g2c"},{"id":"GQ2-10","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"Based on the table, which statement best compares the Ottoman and Mughal empires?","options":["They used exactly the same systems in every category of the table","They used similar tools of rule, in different forms","The Mughals had no system for collecting revenue from their subjects","Only the Ottomans used religion to support their rulers' legitimacy"],"ans":1,"exp":"Same four categories, different forms: devshirme vs. mansabdars, caliph vs. Din-i-Ilahi, and so on.","why":["Each cell names a different system.","","The Mughal revenue cell lists zamindars.","The Mughal cell lists Akbar's Din-i-Ilahi."],"src":"g2d"},{"id":"GQ2-11","type":"mcq","skill":"Best used as evidence","topic":"Comparison","stem":"The \"Other examples\" column can best be used as evidence that","options":["European and Asian rulers copied the Ottoman devshirme directly","only European rulers built monuments to show their power","the tools of rule were not limited to Islamic empires","the Mexica and Inca collected taxes through tax farming"],"ans":2,"exp":"Japan, Russia, Europe and the Mexica and Inca used the same categories of tools.","why":["Salaried samurai and the Table of Ranks were different systems.","The Ottoman and Mughal columns list monuments too.","","Their cell says tribute."],"src":"g2d"},{"id":"GQ2-12","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"According to the table, which pair of examples belongs to the same category?","options":["Tax farming and Peter the Great's Table of Ranks","Topkapi Palace and the Mughal zamindars","Sultan as caliph and divine right of kings","The devshirme and the Taj Mahal"],"ans":2,"exp":"Both are in the \"Religious legitimacy\" row.","why":["Tax farming is revenue; the Table of Ranks is the bureaucratic elite.","Topkapi is architecture; zamindars are revenue.","","The devshirme is the elite; the Taj Mahal is architecture."],"src":"g2d"},{"id":"G2.CY","type":"saq","lead":"Check yourself (from your study guide). Name two examples from different empires for each category.","parts":[{"k":"A","prompt":"Administration: name two examples from different empires.","skill":"Comparison","model":"Two examples of administration are the devshirme and the Table of Ranks. The Ottomans trained Christian boys taken through the devshirme as Janissaries and officials, and Peter the Great's Table of Ranks promoted Russian officials by service rather than birth. Both built a class of officials who owed their position to the ruler, not to noble families.","tea":["Two examples of administration are the devshirme and the Table of Ranks.","The Ottomans trained Christian boys taken through the devshirme as Janissaries and officials, and Peter the Great's Table of Ranks promoted Russian officials by service rather than birth.","Both built a class of officials who owed their position to the ruler, not to noble families."],"earns":"Two different empires, each with a correct administration example.","weak":"Two examples from the same empire, or a revenue example like tax farming."},{"k":"B","prompt":"Legitimacy: name two examples from different empires.","skill":"Comparison","model":"Two examples of legitimacy are the sultan as caliph and the divine right of kings. Ottoman sultans claimed to be caliphs, and European kings like Louis XIV claimed their power came from God. Both used religion to make obeying the ruler a religious duty.","tea":["Two examples of legitimacy are the sultan as caliph and the divine right of kings.","Ottoman sultans claimed to be caliphs, and European kings like Louis XIV claimed their power came from God.","Both used religion to make obeying the ruler a religious duty."],"earns":"Two different empires or regions, each using religion or architecture to justify rule.","weak":"Naming a building without saying how it showed the ruler's power."},{"k":"C","prompt":"Revenue: name two examples from different empires.","skill":"Comparison","model":"Two examples of revenue are Ottoman tax farming and Mughal zamindars. Tax farmers bought the right to collect taxes in a region, and zamindars collected taxes from peasants and sent a share to the Mughal government. In both, someone other than the central government did the collecting and kept part.","tea":["Two examples of revenue are Ottoman tax farming and Mughal zamindars.","Tax farmers bought the right to collect taxes in a region, and zamindars collected taxes from peasants and sent a share to the Mughal government.","In both, someone other than the central government did the collecting and kept part."],"earns":"Two different empires' systems, such as tax farming, zamindars or tribute.","weak":"Mixing up which system belongs to which empire."}]}]},{"name":"Guide quiz 3.3: Belief systems","mode":"practice","tips":["Every source here was written only from your teacher's study guide, in the style of her test. Read the attribution line first.","Find the main idea of each paragraph before you look at the choices; many questions ask about one paragraph.","All four choices will sound possible. Cross out the ones that are true but not in the source, from the wrong empire, or too extreme (\"only,\" \"always,\" \"never\").","Use Retest missed questions at the end. The last item is the guide's \"Check yourself\": write your answer before opening the model."],"sources":{"g3a":{"title":"A monk's challenge","attr":"Practice passage in the voice of a German student in the 1520s.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["In 1517 a monk named Martin Luther posted his Ninety-Five Theses, challenging the authority of the Catholic Church. We had always been taught that the Church spoke for all Christians, and few had dared to question it.","Now new Protestant churches have formed in many towns. Some of my neighbors follow Luther, while others remain loyal to Rome, and the two sides no longer pray together. Western Europe, which once shared one Church, is divided."]},"g3b":{"title":"The Catholic response","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["The Catholic Church did not simply accept the Protestant challenge. It answered with reforms of its own, known as the Catholic or Counter Reformation. At the Council of Trent, Church leaders reaffirmed Catholic teachings and addressed corruption within the Church.","A new Catholic order, the Jesuits, spread the faith through missionaries and schools, carrying Catholicism far beyond Europe. Taken together, the two Reformations spread Christianity more widely and made it more diverse than it had been before.","The divisions also led to violence. The Thirty Years' War (1618–1648), one of the major wars of European history, was fought partly over Protestant and Catholic identity."]},"g3c":{"title":"Sunni and Shi'a","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["The split between Sunni and Shi'a Muslims was centuries old by 1450, but the rise of two rival empires gave it new force. The Ottomans were Sunni, and the Safavids were Shi'a.","As the two empires fought over land, their political rivalry deepened the religious divide. Each state used religious identity as a weapon in its conflict with the other, so that a war over territory became a struggle between two forms of Islam.","The result was a lasting religious border in Southwest Asia, drawn as much by politics as by belief."]},"g3d":{"title":"New faiths from old","attr":"Practice passage written in the style of a modern historian of South Asia.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["In the late 1400s, the Punjab region of South Asia was a place where Hindu and Muslim communities lived side by side. There Guru Nanak founded a new faith, Sikhism. It emphasized one God and the equality of all people, and it rejected the caste system.","A century later the Mughal emperor Akbar went further in blending traditions. His Din-i-Ilahi mixed elements of Islam, Hinduism and other faiths. Historians call this kind of mixing of religious traditions syncretism.","Both developments show that contact between religions in this period produced new beliefs, not only conflict."]}},"questions":[{"id":"GQ3-1","type":"mcq","skill":"Effect","topic":"Belief systems","stem":"The developments described in the second paragraph most directly resulted from","options":["the Council of Trent's decision to accept Protestant teachings","the Thirty Years' War, which had already divided the German towns","Luther's challenge to the Church's authority","the Jesuits' missions, which spread Protestant ideas to Europe's towns"],"ans":2,"exp":"Luther's 1517 theses led to new Protestant churches.","why":["Trent reaffirmed Catholic teachings.","That war began in 1618, a century after 1517.","","The Jesuits were a Catholic order."],"src":"g3a"},{"id":"GQ3-2","type":"mcq","skill":"Continuity and change","topic":"Belief systems","stem":"The passage best illustrates which change in Western Europe?","options":["The breakup of its religious unity","The spread of Sunni Islam into the German lands of Western Europe","The end of all religious disagreement after Luther's death","A return to one Church after the Protestants rejoined the Catholics"],"ans":0,"exp":"\"Western Europe, which once shared one Church, is divided.\"","why":["","The passage is about Christianity.","It describes growing division.","The two sides \"no longer pray together.\""],"src":"g3a"},{"id":"GQ3-3","type":"mcq","skill":"Point of view","topic":"Belief systems","stem":"The author's description is most useful to a historian studying","options":["how ordinary people felt the Reformation","how Catholic leaders planned their response at the Council of Trent","how the Jesuits carried Catholicism to places outside of Europe","how the Ottoman and Safavid empires fought over religion and land"],"ans":0,"exp":"A student's view of his neighbors shows the Reformation's effect on ordinary life.","why":["","The author describes neighbors and towns, not Church councils.","The passage does not mention missions.","That is a different region and religion."],"src":"g3a"},{"id":"GQ3-4","type":"mcq","skill":"Historian's argument","topic":"Belief systems","stem":"Which of the following best states the main idea of the second paragraph?","options":["The Jesuits ended the Protestant Reformation by converting all Protestants back","Christianity shrank and stayed inside Europe after the Reformations","Both Reformations spread Christianity and made it more diverse","The Catholic Church gave up its schools to focus on missionary work"],"ans":2,"exp":"\"The two Reformations spread Christianity more widely and made it more diverse.\"","why":["The paragraph says the result was more diversity, not reunion.","The Jesuits carried it beyond Europe.","","The Jesuits used both missions and schools."],"src":"g3b"},{"id":"GQ3-5","type":"mcq","skill":"Claim in a source","topic":"Belief systems","stem":"According to the first paragraph, the Council of Trent","options":["accepted Luther's teachings in order to end the conflict between Christians","ended the Thirty Years' War by letting rulers choose their region's faith","reaffirmed Catholic teaching and addressed corruption","founded the Jesuits to replace the bishops of the Catholic Church"],"ans":2,"exp":"Reaffirm and reform: the heart of the Counter-Reformation.","why":["It reaffirmed Catholic teachings.","That was a later peace, not Trent.","","The passage does not say this."],"src":"g3b"},{"id":"GQ3-6","type":"mcq","skill":"Cause","topic":"Belief systems","stem":"According to the third paragraph, the Thirty Years' War was fought","options":["entirely over trade routes between the Holy Roman Empire and the Ottomans","partly over Protestant and Catholic identity","between Sunni and Shi'a states fighting for control of Persia","to spread the Jesuit order into Asia and the Americas"],"ans":1,"exp":"\"Fought partly over Protestant and Catholic identity.\"","why":["The passage ties it to religious identity; \"entirely\" is too extreme.","","That was the Ottoman–Safavid rivalry.","The Jesuits spread through missions, not this war."],"src":"g3b"},{"id":"GQ3-7","type":"mcq","skill":"Historian's argument","topic":"Belief systems","stem":"Which of the following best describes the historian's argument?","options":["Religious differences between Sunnis and Shi'a disappeared once the wars ended","A political rivalry deepened a religious divide","The Ottomans and Safavids shared one form of Islam and fought only over land","The Sunni–Shi'a split began in 1450 with the rise of the two empires"],"ans":1,"exp":"\"Their political rivalry deepened the religious divide.\"","why":["The historian describes a lasting religious border.","","The Ottomans were Sunni and the Safavids Shi'a.","The split was already centuries old."],"src":"g3c"},{"id":"GQ3-8","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The conflict described in the passage is most similar to which development in Europe?","options":["The Thirty Years' War, fought partly over faith","The Council of Trent, which reaffirmed Catholic teachings and fought corruption","Guru Nanak's founding of Sikhism, which rejected the caste system","Akbar's Din-i-Ilahi, which blended several faiths into one new teaching"],"ans":0,"exp":"In both, religious identity was bound up with war between states.","why":["","Trent was a council, not a war between states.","That is a South Asian faith that emphasized unity.","Blending is the opposite of religious war."],"src":"g3c"},{"id":"GQ3-9","type":"mcq","skill":"Continuity and change","topic":"Belief systems","stem":"The passage best illustrates which combination of continuity and change?","options":["An old split ended because both empires adopted the same faith","An old split continued, but empires gave it new political force","A new split began when the Ottomans converted to Shi'a Islam","Religion stopped mattering in Southwest Asia once trade replaced war"],"ans":1,"exp":"Continuity: the centuries-old split. Change: two rival empires turned it into a weapon.","why":["They did not adopt the same faith.","","The Ottomans were Sunni.","The passage describes a lasting religious border."],"src":"g3c"},{"id":"GQ3-10","type":"mcq","skill":"Cause","topic":"Belief systems","stem":"According to the passage, Sikhism developed most directly out of","options":["Akbar's order that all of his subjects follow the Din-i-Ilahi","missionary schools that the Jesuits founded in South Asia","the Sunni–Shi'a rivalry between the Ottoman and Safavid empires","contact between Hindu and Muslim communities"],"ans":3,"exp":"Punjab, where Hindu and Muslim communities lived side by side.","why":["Sikhism came first, in the late 1400s.","The passage does not mention Jesuits.","Sikhism grew out of Hindu–Muslim contact in Punjab.",""],"src":"g3d"},{"id":"GQ3-11","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Which of the following best compares Sikhism and the Din-i-Ilahi as described in the passage?","options":["Both were founded by Mughal emperors to unify their empires","Both accepted the caste system as a basis of religious life","Both were brought to South Asia by missionaries from Europe","Both drew on more than one religious tradition"],"ans":3,"exp":"Both grew out of contact between faiths; the Din-i-Ilahi is the guide's example of syncretism.","why":["Guru Nanak, not an emperor, founded Sikhism.","Sikhism rejected the caste system.","Both developed in South Asia.",""],"src":"g3d"},{"id":"GQ3-12","type":"mcq","skill":"Best used as evidence","topic":"Belief systems","stem":"The passage can best be used as evidence that, in this period,","options":["religious contact always led to war between neighboring communities","South Asian rulers banned new faiths in order to keep the peace","Islam and Hinduism had no influence on each other in South Asia","contact between religions produced new beliefs, not only conflict"],"ans":3,"exp":"Last paragraph: contact produced new beliefs, not only conflict.","why":["The passage argues the opposite; \"always\" is too extreme.","Akbar created a blended faith himself.","Both new faiths drew on them.",""],"src":"g3d"},{"id":"G3.CY","type":"saq","lead":"Check yourself (from your study guide). Continuity and change in Christianity or Islam, 1450–1750.","parts":[{"k":"A","prompt":"Explain one continuity in Christianity or Islam during this period, with specific evidence.","skill":"Continuity","model":"One continuity is that the Catholic Church kept its core teachings. At the Council of Trent, the Church reaffirmed Catholic teachings instead of accepting Protestant ideas. This meant Catholic belief stayed the same even as the Church fixed corruption.","tea":["One continuity is that the Catholic Church kept its core teachings.","At the Council of Trent, the Church reaffirmed Catholic teachings instead of accepting Protestant ideas.","This meant Catholic belief stayed the same even as the Church fixed corruption."],"earns":"A specific thing that stayed the same, with evidence such as Trent or the Sunni Ottomans.","weak":"Saying \"religion stayed important\" with no evidence."},{"k":"B","prompt":"Explain one change in Christianity or Islam during this period, with specific evidence.","skill":"Change","model":"One change is that Western Christianity split into Catholic and Protestant churches. In 1517 Martin Luther's 95 Theses challenged the Church's authority and led to new Protestant churches. This broke Western Europe's religious unity and led to wars like the Thirty Years' War.","tea":["One change is that Western Christianity split into Catholic and Protestant churches.","In 1517 Martin Luther's 95 Theses challenged the Church's authority and led to new Protestant churches.","This broke Western Europe's religious unity and led to wars like the Thirty Years' War."],"earns":"A specific change with evidence (the 95 Theses, Jesuit missions, the Sunni–Shi'a rivalry).","weak":"Describing the change without saying what caused it or what it led to."}]}]},{"name":"Guide quiz 3.4: Comparison","mode":"practice","tips":["Every source here was written only from your teacher's study guide, in the style of her test. Read the attribution line first.","Find the main idea of each paragraph before you look at the choices; many questions ask about one paragraph.","All four choices will sound possible. Cross out the ones that are true but not in the source, from the wrong empire, or too extreme (\"only,\" \"always,\" \"never\").","Use Retest missed questions at the end. The last item is the guide's \"Check yourself\": write your answer before opening the model."],"sources":{"g4a":{"title":"Same tools, different forms","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["The land-based empires of this period used many of the same tools, but in different ways. All of them relied on gunpowder and professional armies. The Ottomans organized the Janissaries, the Qing relied on the banner system, and Russia sent Cossacks across the steppe.","Every empire also needed to explain why its rulers deserved to rule, and most turned to religion and grand buildings. European kings claimed divine right, Chinese emperors claimed the Mandate of Heaven, and Ottoman sultans claimed to be caliphs.","The point of comparing them is not to list these facts but to explain them: similar problems led empires to similar tools, while their different histories and religions shaped the form each tool took."]},"g4b":{"title":"Tolerance and its limits","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["Empires in this period took very different approaches to the religions of their subjects. The Mughal emperor Akbar practiced religious tolerance and abolished the jizya, the tax on non-Muslims. The Safavids, by contrast, imposed Shi'a Islam as the state religion, and European rulers fought wars over Protestant and Catholic identity.","The Mughal Empire offers a comparison within a single state. Akbar's successor Aurangzeb brought back the jizya and enforced stricter Sunni rule. His policies fueled rebellions across the empire.","The contrast between the two emperors suggests that religious policy could strengthen or weaken an empire as much as its armies could."]},"g4c":{"title":"Paying for empire, proving the right to rule","attr":"Practice passage written in the style of a modern historian.","label":"Practice passage written only from your teacher's Unit 3 study guide; not a real quotation.","paras":["As outsiders ruling a Han Chinese majority, the Manchus of the Qing dynasty had to work harder than earlier dynasties to justify their rule. They adopted Confucian traditions and claimed the Mandate of Heaven.","Every empire also needed money. The Ottomans used tax farming, the Mughals relied on zamindars, and the Mexica and Inca collected tribute. The methods differed, but each pulled wealth from subjects to fund the empire."]},"g4d":{"title":"Comparing the land-based empires","attr":"Your teacher's Unit 3 study guide.","label":"From your teacher's Unit 3 study guide.","table":[["Empire","Expansion","Legitimacy","Revenue"],["Ottoman","Janissaries, cannons","Sultan as caliph, mosques","Tax farming"],["Mughal","Artillery, alliances","Akbar's tolerance, Taj Mahal","Zamindars"],["Safavid","Gunpowder army","Shi'a Islam as state religion","Land grants to military"],["Qing (Manchu)","Banner system","Mandate of Heaven, Confucian rituals","Land tax, tribute"],["Russian","Cossacks, firearms","Tsar as Orthodox Christian ruler","Serfdom, tribute from Siberia"]]}},"questions":[{"id":"GQ4-1","type":"mcq","skill":"Historian's argument","topic":"Comparison","stem":"Which of the following best describes the historian's argument in the third paragraph?","options":["Shared problems led to shared tools, shaped by local history","Empires should be compared by listing as many facts about each as possible","The empires had nothing in common because their religions were different","All empires used exactly the same military and religious systems"],"ans":0,"exp":"Similar problems → similar tools; different histories → different forms.","why":["","The historian says the point is to explain, not to list.","The passage says they used many of the same tools.","The forms differed: Janissaries, banners, Cossacks."],"src":"g4a"},{"id":"GQ4-2","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Which statement best compares the military systems in the first paragraph?","options":["All three used the banner system that the Qing invented","None of the three relied on firearms or professional soldiers","All used gunpowder armies, organized differently","Each one copied the Janissary system from the Ottomans"],"ans":2,"exp":"Same tool (gunpowder armies), different forms (Janissaries, banners, Cossacks).","why":["Only the Qing used banners.","All relied on gunpowder and professional armies.","","The Qing and Russia had their own systems."],"src":"g4a"},{"id":"GQ4-3","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Which of the following correctly matches a ruler's claim of legitimacy from the second paragraph?","options":["European kings: claim to be the caliphs of all Muslims","Chinese emperors: the Mandate of Heaven","Ottoman sultans: the divine right of kings from God","Russian tsars: the Mandate of Heaven granted to China"],"ans":1,"exp":"Divine right (Europe), Mandate of Heaven (China), caliph (Ottomans).","why":["Caliph claims were Ottoman.","","Divine right was European.","The Mandate of Heaven was Chinese."],"src":"g4a"},{"id":"GQ4-4","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Which of the following best compares the religious policies in the first paragraph?","options":["Akbar tolerated other faiths; the Safavids imposed one","Akbar and the Safavids both imposed Shi'a Islam as their state religion","The Safavids abolished the jizya, while Akbar enforced Shi'a Islam","European rulers and Akbar both fought wars over Protestant identity"],"ans":0,"exp":"Tolerance (Akbar) vs. an imposed state religion (Safavids) vs. wars over identity (Europe).","why":["","Akbar practiced tolerance.","This swaps them.","Akbar ruled South Asia and practiced tolerance."],"src":"g4b"},{"id":"GQ4-5","type":"mcq","skill":"Cause","topic":"Comparison","stem":"According to the second paragraph, what most directly fueled rebellions in the Mughal Empire?","options":["Akbar's decision to abolish the jizya on non-Muslims across the empire","Aurangzeb's return of the jizya and strict Sunni rule","The Safavids' decision to impose Shi'a Islam inside the Mughal Empire","European wars over Protestant and Catholic identity in South Asia"],"ans":1,"exp":"\"His policies fueled rebellions.\"","why":["That was tolerance, under the earlier emperor.","","The Safavids ruled their own empire.","Those wars were in Europe."],"src":"g4b"},{"id":"GQ4-6","type":"mcq","skill":"Continuity and change","topic":"Comparison","stem":"The comparison of Akbar and Aurangzeb best illustrates","options":["a continuity in Mughal policy, since both emperors charged the jizya","a comparison between two different empires' religious policies","the Mughal adoption of Safavid Shi'a Islam as the state religion","a change in policy within one empire"],"ans":3,"exp":"\"A comparison within a single state\": tolerance, then strictness.","why":["Akbar abolished it; Aurangzeb brought it back.","Both ruled the same empire.","Aurangzeb enforced stricter Sunni rule.",""],"src":"g4b"},{"id":"GQ4-7","type":"mcq","skill":"Cause","topic":"Comparison","stem":"According to the first paragraph, why did the Qing have to work harder to justify their rule?","options":["They had lost the Mandate of Heaven in a war against the Mughals","They had no army and relied on tribute from neighboring states","They followed Shi'a Islam, which their Chinese subjects rejected","They were outsiders ruling a Han majority"],"ans":3,"exp":"\"As outsiders ruling a Han Chinese majority.\"","why":["No such war is mentioned.","The paragraph says nothing about lacking an army.","The Qing adopted Confucian traditions.",""],"src":"g4c"},{"id":"GQ4-8","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The second paragraph best supports which comparison of revenue systems?","options":["All of them used tax farming, which the Ottomans had invented","Different methods, same goal: wealth for the empire","Only the Mexica and Inca collected any wealth from their subjects","Zamindars and tribute were both religious taxes paid by non-Muslims"],"ans":1,"exp":"\"The methods differed, but each pulled wealth from subjects to fund the empire.\"","why":["Only the Ottomans used tax farming.","","Every empire listed pulled wealth from subjects.","That describes the jizya."],"src":"g4c"},{"id":"GQ4-9","type":"mcq","skill":"Best used as evidence","topic":"Comparison","stem":"The Qing example in the first paragraph can best be used as evidence that","options":["conquerors always forced their own religion on the people they ruled","the Mandate of Heaven was a Manchu idea brought into China","rulers adopted local traditions to win legitimacy","Han Chinese subjects ruled the Qing government after 1644"],"ans":2,"exp":"The Manchus adopted Confucian traditions and the Mandate of Heaven to look legitimate.","why":["The Qing adopted Chinese traditions; \"always\" is too extreme.","It was a Chinese tradition the Manchus adopted.","","The Manchus ruled."],"src":"g4c"},{"id":"GQ4-10","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"Based on the table, which empire's legitimacy rested on a Christian religious role?","options":["The Ottomans","The Safavids","Russia","The Qing"],"ans":2,"exp":"Russia: tsar as Orthodox Christian ruler.","why":["Sultan as caliph, a Muslim role.","Shi'a Islam as state religion.","","Mandate of Heaven and Confucian rituals."],"src":"g4d"},{"id":"GQ4-11","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"Which conclusion about revenue is best supported by the table?","options":["Every empire relied on tax farming to collect its revenue","No empire collected tribute from conquered or frontier peoples","The Mughals and the Ottomans used identical revenue systems","Several empires used tribute or land as a source of revenue"],"ans":3,"exp":"Tribute (Qing, Russia) and land grants or land tax (Safavid, Qing) appear in several rows.","why":["Only the Ottoman row lists tax farming.","The Qing and Russian rows list tribute.","Zamindars and tax farming are different systems.",""],"src":"g4d"},{"id":"GQ4-12","type":"mcq","skill":"Comparison from data","topic":"Comparison","stem":"According to the table, which pair of empires both expanded with firearms organized in different ways?","options":["The Ottomans and the Russians","The Qing and the Mughals, whose rows mention no gunpowder at all","The Safavids and the Qing, whose rows both list a banner system","The Mughals and the Safavids, whose rows both list Janissaries"],"ans":0,"exp":"Ottoman: Janissaries and cannons. Russian: Cossacks and firearms.","why":["","The Mughal row lists artillery.","Only the Qing row lists the banner system.","Janissaries appear only in the Ottoman row."],"src":"g4d"},{"id":"G4.CY","type":"saq","lead":"Check yourself (from your study guide). Write a comparison statement.","parts":[{"k":"A","prompt":"Give a similarity between two empires and explain why it existed.","skill":"Comparison","model":"Both the Ottomans and the Mughals used gunpowder to expand. The Ottomans used cannons and Janissaries, and Babur used artillery to win at Panipat in 1526. This similarity existed because gunpowder weapons, which had spread west from China, let armies beat cavalry and break city walls, so any empire that adopted them could grow quickly.","tea":["Both the Ottomans and the Mughals used gunpowder to expand.","The Ottomans used cannons and Janissaries, and Babur used artillery to win at Panipat in 1526.","This similarity existed because gunpowder weapons, which had spread west from China, let armies beat cavalry and break city walls, so any empire that adopted them could grow quickly."],"earns":"A real similarity, two named empires with evidence, and a reason why (not just what).","weak":"\"Both were big empires.\" Too general, and no explanation of why."}]}]},{"name":"SAQs","mode":"practice","tips":["Use TEA for every part: T = Topic sentence (answer the question directly, restating its words), E = Evidence (a specific person, place, term or date), A = Analysis (explain how the evidence proves your point, using \"which led to,\" \"because\" or \"this allowed\").","Label your answers A, B and C and write in complete sentences. No introduction or thesis.","\"Identify\" or \"describe\" means give accurate details. \"Explain\" means show how or why.","Stay inside 1450 to 1750 unless the question says otherwise.","Aim for about 13 minutes per SAQ: about 1 to plan and 12 to write.","Self-check: Did I give a specific example? Did I explain the connection? Right empire, right century?"],"sources":{"P7":{"title":"A historian on Chaldiran","attr":"Argument based on your 3.1 slides, Pocket Dictionary and AMSCO.","label":"Practice source (written for practice from your class materials; not a verbatim quotation).","text":"At Chaldiran in 1514, Ottoman cannons and Janissary musketeers cut down the Safavid cavalry. The defeat halted Safavid expansion to the west, and the Safavids spent the next century rebuilding their army with firearms. Yet the battle was never only about weapons or borders. The Sunni Ottomans and the Shi'a Safavids each regarded the other's Islam as a betrayal of the faith, and the war turned that religious divide into a frontier between two states."},"T3":{"title":"Sources of legitimacy","attr":"Your textbook, AMSCO Topic 3.4.","label":"Adapted from a table in your textbook (AMSCO).","table":[["Source of legitimacy","Examples"],["Religion","Rulers in Islamic empires used the title \"caliph\"; European monarchs claimed divine right; S
