lateen sail, the compass, and the astrolabe. These tools let ships use the winds and navigate open water out of sight of land, which made regular ocean crossings possible. (Another strong answer: in the Sahara, scarce water made camels and load-bearing saddles essential.)","tea":["One way geography shaped technology was that the monsoon winds of the Indian Ocean shaped sailing technology.","Seasonal monsoon winds led sailors to rely on the lateen sail, the compass, and the astrolabe.","These tools let ships use the winds and navigate open water out of sight of land, which made regular ocean crossings possible. (Another strong answer: in the Sahara, scarce water made camels and load-bearing saddles essential.)"],"earns":"You link a specific geographic feature (monsoon winds, open sea, desert, scarce water, mountains) to a specific technology and explain why the technology fit that geography.","weak":"\"Geography mattered a lot.\" This names no feature, technology, or link between them."}]},{"id":"SAQ6","type":"saq","src":"SQ6","lead":"Using the excerpt, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one likely audience for Margery Kempe's account of her pilgrimages.","skill":"Audience and purpose","model":"One likely audience for Kempe's account was fellow Christians interested in religious devotion and pilgrimage. She describes pilgrimages to Jerusalem, Rome, and Spain and says she was so overcome by her first sight of Jerusalem that she nearly fell off her donkey. This focus on holy places and emotional devotion suggests she meant it for religious readers who valued pilgrimage and spiritual experience.","tea":["One likely audience for Kempe's account was fellow Christians interested in religious devotion and pilgrimage.","She describes pilgrimages to Jerusalem, Rome, and Spain and says she was so overcome by her first sight of Jerusalem that she nearly fell off her donkey.","This focus on holy places and emotional devotion suggests she meant it for religious readers who valued pilgrimage and spiritual experience."],"earns":"You describe a plausible audience (such as Christian readers, other pilgrims, or members of her community) and tie it to the content of the account.","weak":"\"Many people.\" This names no audience and does not connect to the source."},{"k":"B","prompt":"Explain one way that established travel and trade routes in the period 1200 to 1450 made pilgrimages like Kempe's possible.","skill":"Explaining a cause with specific evidence","model":"Established travel and trade routes made pilgrimages like Kempe's possible. By the 1400s, Mediterranean sea routes and overland routes across Europe were active, and the Crusades had increased European contact with Byzantine and Islamic lands. Pilgrims could travel on the same routes, ports, and roads that merchants used, so reaching Jerusalem and Rome was practical.","tea":["Established travel and trade routes made pilgrimages like Kempe's possible.","By the 1400s, Mediterranean sea routes and overland routes across Europe were active, and the Crusades had increased European contact with Byzantine and Islamic lands.","Pilgrims could travel on the same routes, ports, and roads that merchants used, so reaching Jerusalem and Rome was practical."],"earns":"You name a specific route or development (Mediterranean sea routes, overland routes across Europe, merchant networks, or contact increased by the Crusades) and explain how it made travel possible.","weak":"\"Travel was easier then.\" This is vague and gives no specific route or development."},{"k":"C","prompt":"Explain one difference between Margery Kempe's account and Marco Polo's account of his travels, based on the point of view of each author.","skill":"Sourcing and point of view","model":"One difference is that Polo's account focuses on trade while Kempe's focuses on religious experience. Polo, a Venetian merchant, described wealth and cities in China, while Kempe, a Christian pilgrim, described visions and her emotional reaction to holy places. Their different identities and purposes shaped what each author chose to notice and record.","tea":["One difference is that Polo's account focuses on trade while Kempe's focuses on religious experience.","Polo, a Venetian merchant, described wealth and cities in China, while Kempe, a Christian pilgrim, described visions and her emotional reaction to holy places.","Their different identities and purposes shaped what each author chose to notice and record."],"earns":"You identify a specific difference in focus or purpose and tie it to each author's identity (merchant versus religious pilgrim).","weak":"\"They were different people.\" This does not explain how their points of view shaped their accounts."}]},{"id":"SAQ7","type":"saq","src":"SQ7","lead":"Using the map, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one way the map shows that the Mongol Empire was divided in the 13th century.","skill":"Describing evidence from a map","model":"The map shows the Mongol Empire was divided into separate regions in the 13th century. It labels four regions: the Empire of the Great Khans/Yuan Dynasty, the Chaghatai Khanate, the Ilkhan Empire, and the Batu Kipchak Empire (Golden Horde). Because each region has its own name and shading, the map shows the empire had split into separate khanates ruled by different branches of the family.","tea":["The map shows the Mongol Empire was divided into separate regions in the 13th century.","It labels four regions: the Empire of the Great Khans/Yuan Dynasty, the Chaghatai Khanate, the Ilkhan Empire, and the Batu Kipchak Empire (Golden Horde).","Because each region has its own name and shading, the map shows the empire had split into separate khanates ruled by different branches of the family."],"earns":"You accurately describe the division using a detail visible on the map (named khanates or regions), not just the idea that it was big.","weak":"\"The Mongols had a lot of land.\" This does not describe division or use a detail from the map."},{"k":"B","prompt":"Explain one way that Mongol rule across the lands shown on the map affected trade on the Silk Roads in the period 1200 to 1450.","skill":"Explaining a cause with specific evidence","model":"Mongol rule over the lands on the map made Silk Roads trade safer and bigger. One ruling family controlled most of the overland route from China to the Black Sea, and the Mongols improved roads, punished bandits, and protected merchants (the Pax Mongolica). With safer travel under one authority, merchants could move goods farther with less risk, increasing trade between East Asia, the Middle East, and Europe.","tea":["Mongol rule over the lands on the map made Silk Roads trade safer and bigger.","One ruling family controlled most of the overland route from China to the Black Sea, and the Mongols improved roads, punished bandits, and protected merchants (the Pax Mongolica).","With safer travel under one authority, merchants could move goods farther with less risk, increasing trade between East Asia, the Middle East, and Europe."],"earns":"You name a specific Mongol policy or condition (safer roads, protection of merchants, unified control of the routes, the Pax Mongolica) and explain how it increased or changed trade.","weak":"\"The Mongols helped trade.\" This gives no specific action and no explanation."},{"k":"C","prompt":"Explain one way the Mongol conquests shown on the map led to the spread of disease or technology between regions.","skill":"Explaining a development with specific evidence","model":"Mongol conquests spread technology between regions. Chinese technologies such as gunpowder and papermaking moved west along routes the Mongols controlled, and the bubonic plague spread the same way in the 14th century. Mongol control linked China, Southwest Asia, and Europe, so ideas, tools, and diseases traveled along the same connected routes.","tea":["Mongol conquests spread technology between regions.","Chinese technologies such as gunpowder and papermaking moved west along routes the Mongols controlled, and the bubonic plague spread the same way in the 14th century.","Mongol control linked China, Southwest Asia, and Europe, so ideas, tools, and diseases traveled along the same connected routes."],"earns":"You name a specific technology or disease (gunpowder, paper, printing, compass, bubonic plague) and explain how Mongol-linked routes carried it between regions.","weak":"\"Things spread because the empire was big.\" This names no technology or disease and no mechanism."}]},{"id":"SAQ8","type":"saq","src":"SQ8","lead":"Using the map, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one feature of the geography shown on the map that made the Strait of Malacca important to the Indian Ocean trade network.","skill":"Describing evidence from a map","model":"The Strait of Malacca mattered because it is a narrow passage linking two seas. The map shows it between the Malay Peninsula and Sumatra, connecting the Indian Ocean to the South China Sea, and the caption calls it the shortest route between East Asia and Southwest Asia. Because ships going between the two regions had to pass through it, whoever controlled the strait could profit from the trade.","tea":["The Strait of Malacca mattered because it is a narrow passage linking two seas.","The map shows it between the Malay Peninsula and Sumatra, connecting the Indian Ocean to the South China Sea, and the caption calls it the shortest route between East Asia and Southwest Asia.","Because ships going between the two regions had to pass through it, whoever controlled the strait could profit from the trade."],"earns":"You describe a geographic feature shown on the map (a narrow strait linking two seas, the shortest route between East and Southwest Asia) and tie it to trade.","weak":"\"It was near water.\" This is too vague and does not use the map."},{"k":"B","prompt":"Explain one way that the Indian Ocean trade network affected the development of a trading city or state in the period 1200 to 1450.","skill":"Explaining an effect with specific evidence","model":"Indian Ocean trade made the city-state of Malacca wealthy and more centralized. Malacca charged fees on the ships and cargoes passing through the strait and used that wealth to build a strong navy against pirates. Running a navy and collecting fees required centralized planning, so trade increased the power of Malacca's government.","tea":["Indian Ocean trade made the city-state of Malacca wealthy and more centralized.","Malacca charged fees on the ships and cargoes passing through the strait and used that wealth to build a strong navy against pirates.","Running a navy and collecting fees required centralized planning, so trade increased the power of Malacca's government."],"earns":"You name a specific city or state (Malacca, Gujarat, Swahili city-states such as Kilwa or Mombasa, Calicut) and explain how trade changed it (wealth, customs, centralization, growth).","weak":"\"Trade made cities rich.\" This names no city and gives no explanation."},{"k":"C","prompt":"Explain one way that technology or knowledge allowed merchants to sail the route shown on the map.","skill":"Explaining a cause with specific evidence","model":"Sailing technology and knowledge of the winds let merchants cross the Indian Ocean. Sailors used the lateen sail, the monsoon winds, and navigation tools such as the compass and the astrolabe. These let ships sail across open water on a predictable schedule and find their way to ports such as Malacca.","tea":["Sailing technology and knowledge of the winds let merchants cross the Indian Ocean.","Sailors used the lateen sail, the monsoon winds, and navigation tools such as the compass and the astrolabe.","These let ships sail across open water on a predictable schedule and find their way to ports such as Malacca."],"earns":"You name a specific technology or knowledge (lateen sail, monsoon wind knowledge, compass, astrolabe, dhow, junk) and explain how it made the voyage possible.","weak":"\"They had good ships.\" This names no technology and does not explain."}]}]},{"name":"Mock MCQs","mode":"exam","exam":"Mock test","examTips":["Treat this like the real test: turn the Timer on, leave Shuffle off, and work through all 13 questions without looking anything up.","Aim for about one minute per question. Mark hard ones with Flag for review and come back.","You can check answers as you go or at the end; checking only at the end is closer to real test conditions.","When you finish, do the \"Mock Test: SAQs\" tab (about 13 minutes per SAQ), then use Retest Missed Questions on each tab."],"tips":["Read the attribution line first: who wrote it, when, and why. A Ming official, a Muslim scholar and a modern historian each have a different purpose.","Find the main idea of each paragraph before you look at the choices. Many questions ask about one paragraph only.","For \"best used as evidence of\" or \"best illustrates\" questions, first name the bigger development the source shows (more trade, Mongol connections, spread of religion, crops and disease), then pick the choice that matches it.","The wrong choices are usually true-but-not-in-the-source, from the wrong network or region, or too extreme. Cross them out with the X button.","\"Practice passage\" sources were written for this kit from your class materials. Only words inside quotation marks that are labeled as real are real quotations, so don't quote the rest on the test."],"sources":{"M1":{"title":"Against the treasure fleets","attr":"Practice passage in the voice of a Confucian official at the Ming court, written after the death of the Yongle emperor.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["The treasure fleets of the admiral Zheng He have sailed seven times, as far as the coasts of Arabia and Africa. Hundreds of ships went out at a time, and each voyage cost the treasury sums that could have fed whole provinces. The fleets were sent to show the might of the Ming and to bring back tribute, and they returned with rare animals and spices.","But these are curiosities that add nothing to the strength of the empire. The foundation of the empire is the farmer and the family, as the sages taught. Sailors who spend years among foreign peoples learn foreign customs and forget their duties to their ancestors and their ruler.","The new emperor would do well to end these voyages, keep the people at home and forbid subjects to sail abroad, so that the empire may rest on its own fields."]},"M2":{"title":"The court of Kublai Khan","attr":"Practice passage written in the style of a modern historian of Yuan China.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["Kublai Khan, grandson of Genghis, became Great Khan in 1260 and founded the Yuan dynasty in China in 1271. In many ways his rule was more Chinese than Mongol: he rebuilt the capital as Dadu and took on the style of a Chinese emperor. He allowed the peoples of his empire to follow their own religions and consulted Buddhist monks, Daoist priests, Muslim scholars and Christian missionaries at his court. Foreigners such as the Venetian merchant Marco Polo were welcomed.","Yet Kublai and his successors did not trust the Chinese elite. They gave high office to foreigners, set aside the civil service examinations that had long opened government to educated Chinese, and kept themselves apart from the people they ruled. The scholar-gentry, shut out of the positions they believed were theirs, came to resent Mongol rule.","As the Black Death and revolts weakened Mongol power in the 1300s, that resentment fed rebellion. Secret groups such as the White Lotus Society organized against the Yuan, and in 1368 a former monk from a poor peasant family, Zhu Yuanzhang, drove the Mongols out and founded the Ming."]},"M3":{"title":"How Islam traveled","attr":"Practice passage written in the style of a modern historian of world religions.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["Islam spread across much of Afro-Eurasia between 1200 and 1450, but the sword was only one of its paths. Along the trade routes, merchants carried the faith as they carried goods. In West Africa, rulers such as the kings of Mali adopted Islam, and Mansa Musa's pilgrimage to Mecca in 1324 announced Mali's place in the Muslim world. Timbuktu became a center of Islamic learning. Yet most West Africans kept their traditional beliefs.","Around the Indian Ocean, Arab and Persian merchants settled in port cities, married local women and raised their children as Muslims. On the East African coast, this produced the Swahili culture and a language that blends Bantu and Arabic. In Southeast Asia, the rulers of Malacca, a city-state that grew rich from ships passing its strait, became Muslim.","In South Asia, contact between Muslims and Hindus produced new blends, such as the Urdu language, which joins Hindi with Arabic and Persian."]},"M4":{"title":"Why cities grew and declined","attr":"Your textbook (AMSCO).","label":"Adapted from a table in your textbook (AMSCO).","table":[["Factors contributing to the growth of cities","Factors contributing to the decline of cities"],["Political stability and decline of invasions","Political instability and invasions"],["Safe and reliable transportation","Disease"],["Rise of commerce","Decline of agricultural productivity"],["Plentiful labor supply",""],["Increased agricultural output",""]]},"M5":{"title":"Faiths that blended","attr":"Practice passage written in the style of a modern historian of Asia.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["When religions traveled along the trade routes, they rarely replaced what was already there. More often they blended with it. Buddhism came from India to China along the Silk Roads, and the monk Xuanzang helped make it popular. In China it mixed with Daoist ideas to form Chan Buddhism, known in Japan as Zen, which became popular with ordinary people.","Neo-Confucianism blended the rational thought of Confucius with Daoist and Buddhist ideas, and it became the state ideology of Korea and spread to Japan and Vietnam. In Southeast Asia, the Khmer Empire's monuments at Angkor show both Hindu and Buddhist influences: later Buddhist rulers added their own sculptures to buildings while keeping the Hindu artwork.","Historians call this process syncretism: the blending of beliefs from different traditions into something new."]}},"questions":[{"id":"MK-1","type":"mcq","skill":"Point of view","topic":"Indian Ocean","stem":"The author's argument against the voyages is most clearly shaped by","options":["a merchant's wish to sell more Chinese goods in the markets of Africa and Arabia","Confucian values that put farming and family first","Buddhist teachings about giving up wealth","fear of a Mongol invasion by sea"],"ans":1,"exp":"\"The foundation of the empire is the farmer and the family, as the sages taught.\"","why":["The author opposes contact abroad.","","He cites the sages and ancestors.","Not in the passage."],"src":"M1"},{"id":"MK-2","type":"mcq","skill":"Claim in a source","topic":"Indian Ocean","stem":"According to the first paragraph, the purpose of the voyages was to","options":["conquer Arabia and Africa and bring them under direct Ming rule as provinces","spread Confucianism abroad","find new lands to settle","show Ming power and collect tribute"],"ans":3,"exp":"The fleets were sent to show the might of the Ming and bring back tribute.","why":["The passage says show might and bring tribute.","Not in the passage.","Not in the passage.",""],"src":"M1"},{"id":"MK-3","type":"mcq","skill":"Effect","topic":"Indian Ocean","stem":"Arguments like the one in the passage most directly led to","options":["China ending the voyages and discouraging sailing abroad","China building larger fleets to compete with the Arab dhows across the ocean","the fall of the Ming dynasty","Zheng He's eighth voyage"],"ans":0,"exp":"Yongle's successor ended the voyages and discouraged sailing abroad.","why":["","The voyages ended.","Not on your cards.","There were seven."],"src":"M1"},{"id":"MK-4","type":"mcq","skill":"Historian's argument","topic":"Mongols","stem":"Which best describes the historian's argument about Kublai Khan's rule?","options":["It adopted Chinese style but shut out the Chinese elite","It was completely Mongol in style and rejected every Chinese custom and tradition","It gave the scholar-gentry more power than ever","It banned all religions but Buddhism"],"ans":0,"exp":"Chinese-style capital and court, but foreigners in office and no civil service exams.","why":["","Paragraph 1 says it was more Chinese than Mongol.","They were shut out.","He tolerated many."],"src":"M2"},{"id":"MK-5","type":"mcq","skill":"Evidence for an argument","topic":"Mongols","stem":"Which evidence from the passage best supports the claim that Yuan rule angered the scholar-gentry?","options":["Kublai consulted Buddhist monks, Daoist priests and Muslim scholars at court","Kublai rebuilt the capital as Dadu","The Yuan set aside the civil service examinations","Marco Polo was welcomed"],"ans":2,"exp":"Shut out of office, the scholar-gentry resented Mongol rule.","why":["That shows tolerance, not the grievance.","That shows Chinese style.","","That shows openness to foreigners."],"src":"M2"},{"id":"MK-6","type":"mcq","skill":"Cause","topic":"Mongols","stem":"The third paragraph suggests that the fall of the Yuan was caused by","options":["a foreign invasion by the Golden Horde, which wanted to rule China for itself","resentment combined with disasters and organized revolt","Kublai's conversion to Islam","the end of the Silk Roads"],"ans":1,"exp":"Resentment, disasters, the White Lotus Society and Zhu Yuanzhang's revolt.","why":["Not in the passage.","","Not in the passage.","Not in the passage."],"src":"M2"},{"id":"MK-7","type":"mcq","skill":"Historian's argument","topic":"Culture","stem":"Which best states the historian's main argument?","options":["Islam spread almost entirely through military conquest by Arab and Persian armies","Islam replaced all local beliefs wherever it went","Islam spread only in Africa","Islam spread mostly through trade, settlement and rulers"],"ans":3,"exp":"Merchants, intermarriage and rulers' conversions carried Islam.","why":["The historian says the sword was only one path.","Most West Africans kept traditional beliefs.","It also spread in Asia.",""],"src":"M3"},{"id":"MK-8","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Based on the passage, how did the spread of Islam in West Africa compare with its spread on the East African coast?","options":["Rulers led in West Africa; marriage did on the coast","Both regions converted completely because Arab armies conquered them at once","Neither region accepted Islam","Only the coast had Islamic learning"],"ans":0,"exp":"West Africa: kings like Mansa Musa adopted Islam. Coast: merchants married local families.","why":["","Neither is described as conquered.","Both did.","Timbuktu was a center of learning."],"src":"M3"},{"id":"MK-9","type":"mcq","skill":"Best used as evidence","topic":"Culture","stem":"The Swahili and Urdu languages mentioned in the passage can best be used as evidence of","options":["cultural blending through contact","the complete replacement of local languages by Arabic across Africa and Asia","the isolation of trading cities","Mongol rule"],"ans":0,"exp":"Swahili (Bantu + Arabic) and Urdu (Hindi + Arabic + Persian) are blends.","why":["","They are blends, not replacements.","They show contact.","Not related."],"src":"M3"},{"id":"MK-10","type":"mcq","skill":"Data","topic":"Cities","stem":"Which city's history best illustrates the factors in the right-hand column?","options":["Hangzhou, a city of about a million on the Grand Canal with a thriving trade","Samarkand","Constantinople","Timbuktu"],"ans":2,"exp":"Constantinople was hit by invasion (1204, 1453) and plague.","why":["That's growth.","Growth.","","Growth."],"src":"M4"},{"id":"MK-11","type":"mcq","skill":"Cause","topic":"Cities","stem":"Based on the table, which development would most likely cause a trading city to GROW?","options":["A plague arriving on ships from a distant port and killing many of its workers","Repeated invasions","Falling harvests","A strong state making the roads safe"],"ans":3,"exp":"Political stability and safe, reliable transportation help cities grow.","why":["Disease is a cause of decline.","Decline.","Decline.",""],"src":"M4"},{"id":"MK-12","type":"mcq","skill":"Historian's argument","topic":"Culture","stem":"Which best states the historian's main argument?","options":["Traveling religions destroyed the older beliefs of every place they reached","Traveling religions blended with local beliefs","Religions did not travel along trade routes","Buddhism began in China"],"ans":1,"exp":"Syncretism: blending beliefs into something new.","why":["The historian says they rarely replaced them.","","They did.","It came from India."],"src":"M5"},{"id":"MK-13","type":"mcq","skill":"Best used as evidence","topic":"Culture","stem":"The description of Angkor in the second paragraph can best be used as evidence that","options":["the Khmer rulers destroyed all Hindu art after they became Buddhist","Islam was the main faith of the Khmer","Hindu and Buddhist influences coexisted in Southeast Asia","Angkor was a Chinese city"],"ans":2,"exp":"Buddhist rulers added sculptures while keeping the Hindu artwork.","why":["They kept the Hindu artwork.","Not in the passage.","","It was Khmer."],"src":"M5"}]},{"name":"Mock SAQs","mode":"exam","exam":"Mock test","examTips":["Turn the Timer on and give yourself about 13 minutes per SAQ (1 to plan and 12 to write).","Write complete sentences for A, B, and C, and only then click Check Answer."],"tips":["Use TEA for every part: T = Topic sentence (answer the question directly, restating its words), E = Evidence (a specific person, place, term, date, or detail from the source or your knowledge), A = Analysis (explain how that evidence proves your topic sentence, using \"which led to,\" \"because,\" or \"this allowed\").","Label your answers A, B, and C and write in complete sentences. No introduction or thesis.","Each part is worth 1 point. Name a specific, accurate piece of evidence (a person, place, term, date, or technology), then explain how it connects to what the question asks.","\"Describe\" means give accurate details. \"Explain\" means show how or why, using a link such as \"which led to,\" \"because,\" or \"this allowed.\"","Stay inside 1200 to 1450 unless the question says otherwise.","Sentence frame: \"One way ___ was ___. For example, ___. This mattered because ___.\"","Aim for about 13 minutes per SAQ on the real test: about 1 to plan and 12 to write.","Self-check before you reveal the answer: Did I give a specific example, not just a general idea? Did I explain the connection? Is it the right time and place? Did I answer the exact verb (describe or explain)?"],"sources":{"MS1":{"title":"The Sultanate of Malacca","attr":"Adapted summary of a textbook account.","label":"Practice source (written for practice; not a verbatim quotation).","text":"The Sultanate of Malacca, a Muslim city-state on the Strait of Malacca, grew wealthy by charging fees on the ships that passed through the strait between India and China. Its sultans built a navy to keep the waters safe from pirates, and in the 1400s the state expanded into Sumatra and the southern Malay Peninsula. Merchants from Arabia, India, China, and Southeast Asia lived and traded in the city until the Portuguese conquered it in 1511."},"MS2":{"title":"Why cities grew and declined","attr":"Adapted from textbook tables.","label":"Practice source (adapted for practice).","table":[["Factors contributing to the growth of cities","Factors contributing to the decline of cities"],["Political stability and decline of invasions","Political instability and invasions"],["Safe and reliable transportation","Disease"],["Rise of commerce","Decline of agricultural productivity"],["Plentiful labor supply",""],["Increased agricultural output",""]]}},"questions":[{"id":"MSAQ1","type":"saq","src":"MS1","lead":"Using the excerpt, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one way Malacca's rulers used the city's location to gain wealth, according to the excerpt.","skill":"Describing a claim from a source","model":"Malacca's rulers used the city's location to gain wealth by charging fees on passing ships. The excerpt says the sultanate grew wealthy \"by charging fees on the ships that passed through the strait between India and China.\" Because ships traveling between India and China had to pass through the strait, the fees created a steady stream of income.","tea":["Malacca's rulers used the city's location to gain wealth by charging fees on passing ships.","The excerpt says the sultanate grew wealthy \"by charging fees on the ships that passed through the strait between India and China.\"","Because ships traveling between India and China had to pass through the strait, the fees created a steady stream of income."],"earns":"You accurately describe a way stated in the passage (fees on passing ships, or building a navy to keep the strait safe so trade would continue).","weak":"\"They traded a lot.\" This does not describe how the location produced wealth."},{"k":"B","prompt":"Explain one way that knowledge of the monsoon winds contributed to the growth of trading cities such as Malacca between 1200 and 1450.","skill":"Explaining a cause with specific evidence","model":"Knowledge of the monsoon winds helped trading cities grow by forcing merchants to stop and wait in port. Winter winds blew from the northeast and summer winds from the southwest, so merchants had to wait in cities such as Malacca for the winds to change. Waiting merchants bought, sold, and paid fees, so the city's population and wealth grew.","tea":["Knowledge of the monsoon winds helped trading cities grow by forcing merchants to stop and wait in port.","Winter winds blew from the northeast and summer winds from the southwest, so merchants had to wait in cities such as Malacca for the winds to change.","Waiting merchants bought, sold, and paid fees, so the city's population and wealth grew."],"earns":"You link monsoon timing to a specific consequence for trading cities (merchants waiting in port, ports becoming meeting points, more trade and wealth).","weak":"\"The wind helped them sail.\" This does not explain how the winds helped cities grow."},{"k":"C","prompt":"Explain one way diasporic merchant communities affected the cultures of Indian Ocean port cities.","skill":"Explaining an effect with specific evidence","model":"Diasporic merchant communities blended cultures in Indian Ocean port cities. Arab and Persian merchants settled in ports such as those on the Swahili coast and in western India, married local women, and introduced Islam and the Arabic language. Local cultures also influenced the merchants, producing blended cultures such as Swahili language and culture.","tea":["Diasporic merchant communities blended cultures in Indian Ocean port cities.","Arab and Persian merchants settled in ports such as those on the Swahili coast and in western India, married local women, and introduced Islam and the Arabic language.","Local cultures also influenced the merchants, producing blended cultures such as Swahili language and culture."],"earns":"You name a specific community or place and a specific cultural effect (the spread of Islam, a blended language, intermarriage, or two-way influence).","weak":"\"Different people lived together.\" This names no specific community or effect."}]},{"id":"MSAQ2","type":"saq","src":"MS2","lead":"Using the table, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one pattern shown in the table.","skill":"Describing a pattern in a source","model":"One pattern in the table is that the factors behind a city's growth are the opposite of the factors behind its decline. Growth is linked to political stability and strong farm output, while decline is linked to instability, invasions, and falling agricultural productivity. This shows a city's fortunes depended on political security and its food supply as well as on trade.","tea":["One pattern in the table is that the factors behind a city's growth are the opposite of the factors behind its decline.","Growth is linked to political stability and strong farm output, while decline is linked to instability, invasions, and falling agricultural productivity.","This shows a city's fortunes depended on political security and its food supply as well as on trade."],"earns":"You accurately describe a pattern in the table (growth and decline factors mirror each other, or stability, commerce, and farming matter in both lists).","weak":"\"There are many factors.\" This is not a pattern from the table."},{"k":"B","prompt":"Explain one way that trade networks contributed to the growth of a specific city between 1200 and 1450.","skill":"Explaining a cause with specific evidence","model":"Trade networks made Timbuktu grow. Mali's rulers taxed and protected the trans-Saharan gold trade, and Mansa Musa built mosques and schools there. The wealth and Islamic learning drew merchants and scholars, which made Timbuktu a major center of trade and learning. (Other strong answers: Samarkand, Kashgar, Hangzhou, Malacca.)","tea":["Trade networks made Timbuktu grow.","Mali's rulers taxed and protected the trans-Saharan gold trade, and Mansa Musa built mosques and schools there.","The wealth and Islamic learning drew merchants and scholars, which made Timbuktu a major center of trade and learning. (Other strong answers: Samarkand, Kashgar, Hangzhou, Malacca.)"],"earns":"You name a specific city and explain how a trade network caused its growth.","weak":"\"Trade made cities bigger.\" This names no city and gives no specific link."},{"k":"C","prompt":"Explain one reason a specific trading city declined between 1200 and 1450.","skill":"Explaining a cause with specific evidence","model":"Baghdad declined because of foreign invasion. The Mongols sacked Baghdad in 1258 and killed many of its residents. The destruction of the city and its people ended its role as a major political and trading center. (Other strong answers: Constantinople after 1204 and plague; Kashgar after Tamerlane's attacks.)","tea":["Baghdad declined because of foreign invasion.","The Mongols sacked Baghdad in 1258 and killed many of its residents.","The destruction of the city and its people ended its role as a major political and trading center. (Other strong answers: Constantinople after 1204 and plague; Kashgar after Tamerlane's attacks.)"],"earns":"You name a specific city and give a specific cause of its decline (invasion, plague, or political instability) with evidence.","weak":"\"Cities declined because of problems.\" This names no city or cause."}]}]}]},"cheat":[{"title":"The Unit 2 pattern","kind":"list","items":["New and improved tools (credit, caravanserai, compass, saddles) → more trade → bigger cities and states → cultural and environmental effects.","Contextualization sentence: \"After 1200, existing trade routes across Afro-Eurasia intensified as stable states, especially the Mongols, protected merchants and new technologies made travel easier.\""]},{"title":"Three networks","kind":"table","rows":[["","Silk Roads","Indian Ocean","Trans-Saharan"],["Terrain","Overland","Sea (monsoons)","Desert"],["Transport","Caravans, caravanserai","Dhows, junks","Camel caravans"],["Key tools","Flying cash, saddles","Compass, lateen sail, astrolabe, rudder","Load-bearing camel saddle"],["Goods","Luxuries: silk, porcelain, tea, spices","Spices, cotton, gold, ivory, bulk goods","Gold north, salt south"],["Knot cities","Samarkand, Kashgar","Calicut, Malacca, Kilwa","Timbuktu, Gao"],["Religion spread","Buddhism, Neo-Confucianism, Islam","Islam (intermarriage), Hinduism, Buddhism","Islam"]]},{"title":"The four khanates","kind":"table","rows":[["Khanate","Where","Key fact"],["Yuan","China","Kublai; Chinese style; ended by the Ming in 1368"],["Il-khanate","Persia","Hulegu took Baghdad (1258); Persian officials; later Muslim"],["Golden Horde","Russia","Batu; ruled through Russian princes; lasted longest"],["Chagatai","Central Asia","Most traditionally Mongol"]]},{"title":"Dates to know","kind":"list","items":["1206: kuriltai elects Temujin (Genghis Khan).","1235: Sundiata founds Mali.  1240: Golden Horde destroys Kiev.","1258: Hulegu takes Baghdad.  1271: Kublai founds the Yuan.","c. 1250–1350: Pax Mongolica.  1324: Mansa Musa's pilgrimage.","1347–1351: Black Death in Europe.  1368: Ming replace the Yuan.","1405–1433: Zheng He's seven voyages.  1453: Ottomans take Constantinople."]},{"title":"Effects in one line each","kind":"list","items":["Religion: spread by merchants and rulers, often blending (syncretism): Chan, Neo-Confucianism, Angkor, Swahili, Urdu.","Technology: gunpowder and papermaking moved west; Islamic scholars saved Greek works and added Indian math.","Crops: Champa rice (China), bananas (Africa), citrus, sugar and cotton → population growth.","Environment: overgrazing, deforestation, erosion (Great Zimbabwe abandoned).","Disease: plague rode the trade routes → labor shortage → higher wages → feudalism weakened."]},{"title":"Travelers' points of view","kind":"list","items":["Marco Polo: Venetian merchant (trade and cities).","Ibn Battuta: Moroccan Muslim scholar (mostly Muslim lands).","Margery Kempe: English Christian pilgrim (a middle-class woman's life)."]}]},"u3":{"images":{},"decks":[{"id":1,"name":"Context: From the Mongols to Gunpowder","optional":false,"sections":[{"name":"Why the Mongols fell apart","cards":[{"term":"Power vacuum","def":"A region left without a strong ruler, which rivals rush to take over; the breakup of the Mongol Empire left one across Asia.","hook":"Empty throne, many claimants.","asks":[{"q":"After the Mongol khanates collapsed, Turkic dynasties quickly seized Anatolia, Persia and northern India. Which idea best explains this?","right":"New states filled a power vacuum","wrong":[["Mongol khans gave the regions away","The Mongols did not hand over their lands; their empire fell apart and others took the space."],["Europeans conquered the Mongol lands first","Europeans were not the ones who took Anatolia, Persia or India in this period."],["Trade routes closed and the regions emptied","The regions were not emptied of people; they lost a strong ruler."]],"exp":"When a strong ruler disappears, rivals rush in. That is a power vacuum."},{"q":"Which pair of events best shows a power vacuum being filled?","right":"Mongol khanates collapse; Turkic dynasties take over","wrong":[["The Ottomans take Constantinople; the Byzantine church becomes a mosque","That is one empire conquering another, not filling an empty space."],["Luther posts his theses; princes adopt Lutheranism","That is religious change."],["Akbar ends the jizya; Hindus serve in government","That is a policy choice."]],"exp":"When the Mongol Empire broke up, Asia was left without a strong ruler, and new powers rushed in."}]},{"term":"Rival khanates","def":"Family fights over who should rule split the Mongol Empire into four competing states.","hook":"One empire, four quarreling heirs.","asks":[{"q":"Which development most weakened Mongol unity from the inside?","right":"Succession fights that divided the empire","wrong":[["Conversion of every khan to Christianity in the 1300s","The khans adopted local religions such as Islam and Buddhism, not all Christianity."],["A single crushing defeat by the young Ottoman army","The Mongols did not fall to one big war; the Ottomans were small at the time."],["The invention of gunpowder in western Europe around 1300","Gunpowder came from Song China, and its spread did not split the Mongols."]],"exp":"The Mongols fell apart rather than losing one war. Family fights split the empire into four khanates."},{"q":"How did the split into four khanates set the stage for the gunpowder empires?","right":"Divided Mongol power left room for new states","wrong":[["It united Asia under one ruler, who later handed power to the Ottomans in peace","The split divided Asia; it did not unite it."],["It spread Shi'a Islam","Not on your card."],["It ended trade","Not on your card."]],"exp":"Family fights split the empire into competing states, weakening Mongol power."}]},{"term":"Mongol assimilation","def":"The khans adopted the religions and customs of the peoples they ruled, so they stopped acting as one people.","hook":"Rulers who became the ruled.","asks":[{"q":"The Il-khans became Muslim and the Yuan rulers adopted Chinese court customs. How did this affect Mongol power?","right":"It eroded their shared identity","wrong":[["It made the khanates reunite under one khan","Adopting different local customs pulled the khanates further apart."],["It ended all trade on the Silk Roads","Trade weakened for other reasons, such as plague; customs did not end it."],["It let them conquer western Europe","The Mongols never conquered western Europe."]],"exp":"Blending into the local cultures meant the Mongols no longer acted as one people."},{"q":"Which effect of assimilation contributed most to Mongol decline?","right":"The khans stopped acting as one people","wrong":[["The khans became stronger by forcing their customs on everyone they ruled","They adopted local customs instead."],["The khans gave up all religion","They adopted local religions."],["The khans moved back to the steppe","Not on your card."]],"exp":"Adopting local religions and customs divided the Mongols."}]},{"term":"Ming expulsion of the Mongols (1368)","def":"Chinese rebels drove the Yuan rulers out of China and founded a dynasty run by Han Chinese.","hook":"China for the Chinese again.","asks":[{"q":"Which event ended Mongol rule in China?","right":"A Chinese rebellion in 1368","wrong":[["The Manchu conquest of 1644","The Manchus overthrew the Ming, not the Mongols."],["The fall of Constantinople in 1453","That was the end of the Byzantine Empire, far from China."],["Timur's raids into India","Timur raided Persia and India; he did not end Mongol rule in China."]],"exp":"Rebels drove the Mongols out in 1368 and founded the Ming."},{"q":"What did the founding of the Ming in 1368 most directly show?","right":"Mongol power was collapsing even in China","wrong":[["The Mongols were growing stronger and pushing deeper into southern China","They were driven out."],["The Qing had taken Beijing","That was 1644."],["The Ottomans had reached China","No."]],"exp":"Chinese rebels drove out the Yuan and founded a Han Chinese dynasty."}]}],"intro":["In the 1200s the Mongols built the largest land empire in history. It did not last as one state. Genghis Khan's heirs fought over who should rule and split the empire into four rival khanates. The khans also took on the religions and customs of the people they ruled, so they stopped acting as one people. In China, rebels threw out the Mongol (Yuan) rulers in 1368 and founded the Ming dynasty. The result was a power vacuum across Asia: a huge area with no strong ruler, which new powers rushed to fill."]},{"name":"New powers rise","cards":[{"term":"Timur (Tamerlane)","def":"Turkic-Mongol conqueror from Samarkand who raided Persia and India in the late 1300s and crushed the Ottomans in 1402; Babur descended from him.","hook":"Lame, ruthless, and an ancestor of the Mughals.","asks":[{"q":"Which later empire was founded by a descendant of the conqueror who crushed the Ottomans in 1402?","right":"The Mughal Empire","wrong":[["The Safavid Empire","The Safavids were founded by Ismail I, not by a descendant of Timur."],["The Qing Empire","The Qing were founded by the Manchus of northeast China."],["The Songhai Empire","Songhai was a West African state with no link to Timur."]],"exp":"Babur, founder of the Mughals, descended from Timur and from Genghis Khan."},{"q":"How does Timur connect the Mongol era to the gunpowder empires?","right":"His descendant Babur founded the Mughals","wrong":[["He founded the Ottoman Empire after crushing the Byzantines in the year 1402","He crushed the Ottomans in 1402."],["He invented gunpowder","Song China did."],["He converted Persia to Shi'a Islam","That was Ismail I."]],"exp":"Babur descended from Timur."}]},{"term":"Ghazi ideal","def":"A warrior model from the steppes that blended nomadic cooperation with fighting as a holy warrior for Islam.","hook":"Nomad plus holy warrior.","asks":[{"q":"Historians say the founders of the Ottoman, Safavid and Mughal states followed a model of the warrior for the faith. What does this model help explain?","right":"Why their expansion had a religious purpose","wrong":[["Why their rulers rejected Islam in favor of steppe gods","The model is a fighter for Islam, so it supports Islam."],["Why they relied on navies more than on land armies","The model comes from the land-based steppes, not the sea."],["Why they avoided war with their Muslim and Christian neighbors","The model glorifies fighting, not avoiding it."]],"exp":"The ghazi ideal joined steppe warfare to holy war for Islam."},{"q":"Which earlier Islamic tradition does the ghazi ideal blend with steppe life?","right":"Fighting as a holy warrior for Islam","wrong":[["Living as merchants who traveled peacefully along the trade routes of Asia","The ideal is about warriors."],["Confucian scholarship","Not Islamic."],["Withdrawing from the world as monks","Not the ghazi ideal."]],"exp":"Nomadic cooperation plus fighting as a holy warrior for Islam."}]},{"term":"Gunpowder's origin","def":"Invented in Song China and carried west along Mongol trade networks.","hook":"Song made it, Mongols moved it.","asks":[{"q":"Why did Ottoman, Safavid and Mughal armies all have access to cannons by the 1500s?","right":"Gunpowder spread west along Mongol networks","wrong":[["All three empires invented gunpowder separately at about the same time","Gunpowder came from one place, Song China."],["The Portuguese sold it to all three in the early 1400s","It spread overland through Mongol networks long before most Portuguese contact."],["Byzantine engineers taught it to their Turkish neighbors","The Byzantines were the targets of Ottoman cannons, not the source."]],"exp":"This connects Unit 1 (Song inventions) and Unit 2 (Mongol networks) to Unit 3."},{"q":"Gunpowder spreading west from Song China is an example of which earlier pattern?","right":"Technology moving along Mongol trade networks","wrong":[["Technology spreading through European exploration of the Indian Ocean coasts","Your card credits Mongol trade networks."],["Technology kept secret by one state","It spread."],["Technology spreading by Christian missionaries","Not on your card."]],"exp":"Invented in Song China and carried west along Mongol trade networks."}]},{"term":"Shared roots of the Islamic empires","def":"The founders of the Ottoman, Safavid and Mughal states descended from Turkic nomads of Central Asia and spoke a Turkic language.","hook":"Three empires, one steppe family tree.","asks":[{"q":"Which statement best describes a similarity among the Ottoman, Safavid and Mughal founders?","right":"They came from Turkic nomadic roots","wrong":[["They all followed Shi'a Islam as the state faith","Only the Safavids were Shi'a; the Ottomans and Mughals were Sunni."],["They all ruled Hindu majorities in South Asia","Only the Mughals ruled a Hindu majority."],["They all built large navies to control the Indian Ocean","The Safavids had no real navy."]],"exp":"All three descended from Turkic nomads, used gunpowder, and filled spaces left by the Mongols."},{"q":"Which is a DIFFERENCE among the three Islamic empires, despite their shared roots?","right":"The Safavids were Shi'a; the others were Sunni","wrong":[["Only the Mughals descended from Turkic nomads who came from Central Asia","All three did."],["Only the Ottomans spoke a Turkic language","All three founders did."],["Only the Safavids used gunpowder","All three did."]],"exp":"Shared Turkic roots, but the Safavids made Shi'a Islam the state religion."}]},{"term":"Osman","def":"Leader of a small Turkish state on the Byzantine border around 1300; the empire that grew from it was named for him.","hook":"The name behind Ottoman.","asks":[{"q":"The name of the empire that took Constantinople comes from which founder?","right":"Osman, around 1300","wrong":[["Mehmed II, the sultan who took the city in 1453","Mehmed II conquered Constantinople, but the empire already had its name."],["Selim I, the victor at Chaldiran in 1514","Selim I won at Chaldiran; he did not found the state."],["Ismail I, the young ruler crowned in 1501","Ismail I founded the Safavid Empire."]],"exp":"Osman's small border state became the Ottoman Empire."},{"q":"Why is the Ottoman Empire named as it is?","right":"It is named for its founder, Osman","wrong":[["It is named for the Ottoman River, where the first Turkish state was founded","It's named after Osman."],["It means 'Mongol'","That's the Mughal name."],["It is named for Constantinople","No."]],"exp":"The empire that grew from Osman's small state was named for him."}]},{"term":"Armed trade","def":"Empires exchanged goods with one another but kept troops and weapons ready in case another empire challenged their right to do business.","hook":"Trade with a sword nearby.","asks":[{"q":"Two empires exchange goods, but each keeps warships nearby in case the other blocks its merchants. What is this practice called?","right":"Armed trade","wrong":[["Free trade","Free markets came later and did not rely on threats of force."],["Tax farming","Tax farming is a way of collecting taxes, not of trading."],["A tribute system","Tribute is payment from a weaker state, not trade backed by force."]],"exp":"Armed trade mixes commerce with readiness to fight, unlike later free markets."},{"q":"Why is \"armed trade\" a good description of relations among the gunpowder empires?","right":"They traded but stayed ready to fight","wrong":[["They refused to trade at all and fought every time their armies met","They did trade."],["They traded only with Europe","They traded with one another."],["They had no armies","They kept troops ready."]],"exp":"Empires exchanged goods but kept troops and weapons ready."}]}],"intro":["Into that vacuum came new Turkic warrior leaders from Central Asia. Timur (Tamerlane) raided from Persia to India and even crushed the Ottomans in 1402, and later the founder of the Mughals traced his family back to him. Many of these warriors followed the ghazi ideal: nomad fighters who saw themselves as holy warriors for Islam. They also had a new tool. Gunpowder, invented in Song China, had traveled west along Mongol trade routes. One small Turkish state on the Byzantine border, led by Osman around 1300, would grow into the Ottoman Empire."]}],"intro":["Unit 3 covers 1450 to 1750. The big question: after the Mongol Empire broke apart, who filled the gap, and how? The answer is a set of new land-based empires, most of them founded by Turkic peoples from Central Asia, that used a new weapon, gunpowder, to grow fast."]},{"id":2,"name":"Expansion (3.1)","optional":false,"sections":[{"name":"Gunpowder","cards":[{"term":"Gunpowder empires","def":"Large states with many peoples that relied on cannons and firearms to conquer and control territory.","hook":"Cannons build empires.","asks":[{"q":"Your study guide names three of these states; your textbook adds Russia. What do all of them share?","right":"Firearms drove their conquests","wrong":[["All were ruled by Muslim dynasties","Russia was Orthodox Christian."],["All were sea-based empires that relied on navies","They were land-based empires; sea empires are Unit 4."],["All were made up of a single ethnic group","They ruled many ethnic and religious groups."]],"exp":"The label comes from how they expanded: cannons and muskets."},{"q":"Which feature would a historian most likely use to group states as gunpowder empires?","right":"Using firearms to conquer and control many peoples","wrong":[["Sharing a single religion and treating all of their subjects in the same way","They differed in religion."],["Being small city-states","They were large states."],["Avoiding war","They relied on cannons and firearms."]],"exp":"Large, multi-ethnic states that relied on cannons and firearms."}]}],"intro":["\"Gunpowder empire\" is the label for big states with many peoples that conquered and held land with cannons and firearms. Your study guide means the Ottoman, Safavid and Mughal Empires; some sources also count the Qing and Russia. If a question asks how these empires grew so fast, the safe answer is gunpowder weapons plus strong central rulers."]},{"name":"Ottoman Empire","cards":[{"term":"Mehmed II","def":"Ottoman sultan called the Conqueror (r. 1451–1481) who took the Byzantine capital in 1453 and made it his own capital.","hook":"The Conqueror.","asks":[{"q":"Which ruler used a 26-foot bronze cannon to break walls that had stood for centuries?","right":"Mehmed II","wrong":[["Suleiman I","Suleiman ruled later (1520–1566) and besieged Vienna."],["Shah Abbas I","Abbas was a Safavid shah in Persia."],["Babur","Babur used cannons at Panipat in India, not against city walls."]],"exp":"Mehmed II's cannons broke Constantinople's triple walls in 1453."},{"q":"Mehmed II made Constantinople his own capital. What does this suggest about his goals?","right":"He meant to rule from the conquered city","wrong":[["He planned to destroy the city and return home once its treasures were taken","He made it his capital."],["He wanted to return it to the Byzantines","No."],["He meant to give it to the pope","No."]],"exp":"He took the Byzantine capital in 1453 and made it his own."}]},{"term":"Fall of Constantinople (1453)","def":"Ottoman cannons broke the city's triple walls, ending the Byzantine Empire; renamed Istanbul, it controlled the Bosporus Strait.","hook":"Unit 3 begins here.","asks":[{"q":"Why did the Ottoman capture of this city matter for trade?","right":"It controlled the Black Sea passage","wrong":[["It opened the first route to the Americas","Routes to the Americas were opened by Europeans at sea."],["It gave the Ottomans Mecca and Medina","The holy cities came later, from the Mamluks in 1516–1517."],["It ended trade on the Silk Roads","Istanbul remained the western end of the Silk Roads."]],"exp":"Istanbul controlled the Bosporus, the only waterway linking the Aegean and Black Seas."},{"q":"What ended with the fall of Constantinople in 1453?","right":"The Byzantine Empire","wrong":[["The Mongol Empire, whose last khan had ruled from the city for a century","The city was Byzantine."],["The Safavid Empire","Founded in 1501."],["The Holy Roman Empire","Not on your card."]],"exp":"Ottoman cannons broke the walls, ending the Byzantine Empire."}]},{"term":"Hagia Sophia","def":"Great Byzantine church that Mehmed II turned into a mosque after 1453.","hook":"A church becomes a mosque.","asks":[{"q":"Mehmed II turned the city's greatest church into a mosque. What does this act most clearly show?","right":"A change in who held power","wrong":[["Continuity of Byzantine religion","Converting it marked a break, not a continuity."],["A failed Ottoman siege","The siege of 1453 succeeded."],["Ottoman rejection of architecture","The Ottomans kept and restored the building."]],"exp":"The conversion signaled that a new, Muslim dynasty now ruled the city."},{"q":"Turning Hagia Sophia into a mosque is best used as evidence of","right":"using religion to legitimize a new ruler","wrong":[["the Ottomans' wish to convert to Christianity after they took Constantinople","They made it a mosque."],["the decline of the Ottoman Empire","It was at the start of its rise."],["a peace treaty with the Byzantines","It followed conquest."]],"exp":"Converting the great church showed Muslim rule over the city."}]},{"term":"Selim I","def":"Ottoman sultan who beat the Safavids at Chaldiran (1514) and took Egypt and Syria from the Mamluks (1516–1517), gaining guardianship of Mecca and Medina.","hook":"Grim conqueror of the Mamluks.","asks":[{"q":"Which conquest gave the Ottomans a strong claim to lead Sunni Islam?","right":"Taking the Mamluk lands in 1516–1517","wrong":[["Taking Constantinople from the Byzantines in 1453","That gave a capital and trade, not the holy cities."],["Winning the Battle of Mohács against Hungary in 1526","Mohács gave them Hungary, a Christian land."],["Besieging the Habsburg capital of Vienna in 1529","The Vienna siege failed and had no link to the holy cities."]],"exp":"Control of Mecca and Medina came with the Mamluk lands."},{"q":"How did Selim I's conquests change the Ottoman Empire's religious standing?","right":"It gained guardianship of Mecca and Medina","wrong":[["It became a Shi'a state after defeating the Safavids at the Battle of Chaldiran","The Ottomans were Sunni."],["It lost control of Egypt","Selim took Egypt."],["It became Christian","No."]],"exp":"Taking Egypt and Syria gave the Ottomans guardianship of the holy cities."}]},{"term":"Suleiman the Magnificent","def":"Ottoman sultan (r. 1520–1566) who issued law codes, took most of Hungary and besieged Vienna; the empire peaked under him.","hook":"Peak size, power and law.","asks":[{"q":"Under which ruler did the Ottomans reach their greatest power and push deepest into Europe?","right":"Suleiman I","wrong":[["Mehmed II, the Conqueror","Mehmed took Constantinople but did not reach Hungary or Vienna."],["Osman, the founder","Osman founded a small border state around 1300."],["Selim I, conqueror of the Mamluks","Selim pushed east and south, against the Safavids and Mamluks."]],"exp":"Suleiman's reign (1520–1566) was the Ottoman peak."},{"q":"Which shows Suleiman's role as a lawgiver, not just a conqueror?","right":"He issued law codes","wrong":[["He took most of Hungary at the Battle of Mohács in 1526","That's conquest."],["He besieged Vienna","That's conquest."],["He built Isfahan","That was Abbas I."]],"exp":"Suleiman issued law codes; the empire peaked under him."}]},{"term":"Battle of Mohács (1526)","def":"Suleiman's victory that gave the Ottomans most of Hungary.","hook":"Hungary falls.","asks":[{"q":"Which victory brought the Ottomans to the edge of Austria?","right":"Mohács, 1526","wrong":[["Chaldiran, 1514","Chaldiran was fought in Persia against the Safavids."],["Lepanto, 1571","Lepanto was an Ottoman naval defeat."],["Panipat, 1526","Panipat was Babur's victory in India, the same year."]],"exp":"Winning Hungary at Mohács set up the siege of Vienna three years later."},{"q":"Which pair are in the correct order?","right":"Mohács (1526), then the siege of Vienna (1529)","wrong":[["The siege of Vienna (1529), then Mohács (1526), opening the way into Hungary","Mohács came first."],["Lepanto (1571), then Mohács","Mohács came first."],["Second siege of Vienna (1683), then Mohács","Mohács came first."]],"exp":"Mohács gave the Ottomans Hungary; Vienna was besieged three years later."}]},{"term":"Siege of Vienna (1529)","def":"A failed Ottoman attack on the Habsburg city that marked their farthest push into Central Europe.","hook":"High-water mark.","asks":[{"q":"Which event marks the farthest Ottoman advance into Central Europe under Suleiman?","right":"The failed siege of Vienna in 1529","wrong":[["The capture of the island of Rhodes in 1522","Rhodes is an island in the eastern Mediterranean."],["The fall of the Byzantine capital in 1453","That was in southeastern Europe, not Central Europe."],["The victory over the Hungarians at Mohács in 1526","Mohács came before Vienna and was not the farthest point."]],"exp":"Vienna (1529) failed; the Ottomans never took it."},{"q":"Compare the sieges of Vienna in 1529 and 1683.","right":"Both failed; 1683 marked a turning point","wrong":[["Both succeeded, giving the Ottomans control of the Habsburg capital for decades","Both failed."],["1529 succeeded; 1683 failed","Both failed."],["Only 1683 was by the Ottomans","Both were Ottoman."]],"exp":"1529 was the farthest push; 1683 marked a turning point in Ottoman decline."}]}],"intro":["The Ottomans are the biggest story of 3.1. In 1453 Sultan Mehmed II used giant cannons to break the walls of Constantinople, ending the Byzantine Empire. He renamed the city Istanbul, made it his capital, and turned its great church, Hagia Sophia, into a mosque. Selim I then beat the Safavids and took Egypt and Syria, which made the Ottomans guardians of Mecca and Medina. Under Suleiman the Magnificent the empire hit its peak: he issued law codes, won most of Hungary at Mohács in 1526, and besieged Vienna in 1529. Vienna did not fall, and that marks the farthest the Ottomans pushed into Europe."]},{"name":"Safavid Empire","cards":[{"term":"Ismail I","def":"Founded the Safavid Empire in Persia in 1501 at about 14 or 15 and made Twelver Shi'a Islam the state religion.","hook":"Teen shah, Shi'a state.","asks":[{"q":"A new ruler in Persia makes Shi'a Islam the official faith in 1501. Which neighbor is most likely to see this as a threat?","right":"The Sunni Ottoman Empire","wrong":[["The Hindu Maratha kingdoms","The Marathas were in India and fought the Mughals."],["The Russian tsars","Russia was Orthodox Christian and far to the north."],["The Manchu banners","The Manchus were in northeast Asia."]],"exp":"Ismail I's Shi'a state set up the Sunni–Shi'a rivalry with the Ottomans."},{"q":"Making Twelver Shi'a Islam the state religion had what effect on Safavid–Ottoman relations?","right":"It sharpened their rivalry","wrong":[["It united the two empires as allies against Christian Europe for a century","They were rivals."],["It made them trading partners only","They fought."],["It had no effect","Religion was part of the rivalry."]],"exp":"Shi'a Safavids versus Sunni Ottomans fed a long conflict."}]},{"term":"Shah Abbas I","def":"Safavid ruler (r. 1588–1629) who rebuilt the army with muskets, artillery and enslaved soldiers and brought the empire to its height.","hook":"Abbas the Great.","asks":[{"q":"After the Safavids lost at Chaldiran, which ruler modernized their army with gunpowder weapons?","right":"Shah Abbas I","wrong":[["Ismail I, the founder","Ismail lost at Chaldiran; the army was rebuilt later."],["Selim I, the Ottoman victor","Selim was the Ottoman sultan who won at Chaldiran."],["Akbar, the Mughal emperor","Akbar was a Mughal emperor in India."]],"exp":"Abbas learned from Chaldiran and added cannons, muskets and ghulams."},{"q":"Which reform of Shah Abbas I is most similar to the Ottoman Janissary system?","right":"Building an army with enslaved soldiers","wrong":[["Moving the capital to Isfahan and filling it with grand buildings in 1598","That's legitimacy, not a slave army."],["Making Shi'a Islam the state religion","That was Ismail I."],["Building a large navy","The Safavids had no real navy."]],"exp":"Abbas rebuilt the army with muskets, artillery and enslaved soldiers."}]},{"term":"Isfahan","def":"City that Abbas I made the Safavid capital in 1598 and rebuilt as a show of power.","hook":"Abbas's showcase.","asks":[{"q":"Abbas I moved his capital in 1598 and filled it with grand buildings. Which city?","right":"Isfahan","wrong":[["Istanbul","Istanbul was the Ottoman capital."],["Delhi","Delhi was a Mughal capital."],["Tabriz","Tabriz became a border city between Sunni and Shi'a lands."]],"exp":"Abbas moved the capital from Qazvin to Isfahan."},{"q":"Rebuilding Isfahan as a show of power is most similar to which other ruler's project?","right":"Louis XIV's Versailles","wrong":[["Ivan IV's oprichnina, a black-clad force used to keep the nobles under control","That's a loyal force, not a building."],["Selim I's conquest of Egypt","That's conquest."],["The Peace of Augsburg","That's a treaty."]],"exp":"Grand capitals and palaces showed a ruler's power."}]},{"term":"Shah","def":"The Persian title for king, used by the Safavid rulers.","hook":"Persian for king.","asks":[{"q":"A source calls the ruler of Persia by a Persian royal title. Which title?","right":"Shah","wrong":[["Sultan","Sultan is a Muslim ruler's title used by the Ottomans."],["Tsar","Tsar is the Russian title."],["Shogun","Shogun is the Japanese military ruler."]],"exp":"Safavid rulers were shahs; Ottoman rulers were sultans."},{"q":"Which pair of titles matches the right empire?","right":"Shah: Safavid; sultan: Ottoman","wrong":[["Shah: Ottoman; sultan: Safavid, since both titles mean the same thing","It's the other way round."],["Shah: Qing; sultan: Mughal","Shah is Persian."],["Shah: Russia; sultan: Japan","No."]],"exp":"Shah is the Persian title for king, used by the Safavids."}]},{"term":"Safavid weaknesses","def":"The empire had no real navy and no natural defenses.","hook":"Open borders, no fleet.","asks":[{"q":"Which feature most separated the Safavids from the Ottomans as a military power?","right":"The Safavids had no real navy","wrong":[["The Safavids never used firearms","Abbas I armed the Safavids with muskets and artillery."],["The Safavids had no capital city","Isfahan was their capital."],["The Safavids ruled no Muslims","The Safavids were a Shi'a Muslim state."]],"exp":"The Ottomans had a strong navy; the Safavids had almost none."},{"q":"Why did having no navy and no natural defenses hurt the Safavids?","right":"They were open to attack and couldn't fight at sea","wrong":[["They had too many sailors to pay and too many mountains to cross for trade","Their weakness was the lack of these."],["They couldn't trade silk","Not the point."],["They couldn't use gunpowder","Abbas used gunpowder."]],"exp":"No real navy and no natural defenses left the empire exposed."}]}],"intro":["The Safavids ruled Persia (today's Iran). Ismail I founded the empire in 1501 when he was a teenager and made Shi'a Islam the state religion. That one choice set the Safavids against their Sunni neighbors, especially the Ottomans. About 90 years later Shah Abbas I (\"the Great\") rebuilt the army with muskets, cannons and enslaved soldiers and made Isfahan a showcase capital. The empire's weak spots: no real navy and no natural borders to defend it."]},{"name":"Mughal Empire","cards":[{"term":"Babur","def":"Descendant of Timur and Genghis Khan from Kabul who founded the Mughal Empire in 1526.","hook":"From Kabul to Delhi.","asks":[{"q":"Why is the Mughal founder's ancestry useful for a contextualization sentence?","right":"It links Mughal rule to the Mongols","wrong":[["It shows the Mughals were Hindu","The Mughal rulers were Muslim."],["It proves the Mughals were Persian Shi'a","The Mughals were Sunni."],["It connects the Mughals to the Ming","The Ming were Chinese and unrelated."]],"exp":"Babur descended from Timur and Genghis Khan; 'Mughal' comes from 'Mongol.'"},{"q":"Babur's family background is most useful for explaining which idea?","right":"Continuity between the Mongols and the Mughals","wrong":[["A sharp break between the Mughals and every earlier Central Asian ruler","His ancestry shows continuity."],["The spread of Christianity in India","No."],["The rise of the Safavids","Different empire."]],"exp":"Descended from Timur and Genghis Khan, he links the Mongol past to the Mughal Empire."}]},{"term":"First Battle of Panipat (1526)","def":"Babur's smaller army fought from behind linked carts with field cannons and matchlocks and beat the Sultan of Delhi.","hook":"Carts, cannons, a new empire.","asks":[{"q":"Which battle shows that gunpowder let a small army found a new empire?","right":"Panipat, 1526","wrong":[["Chaldiran, 1514","Chaldiran was a battle between two existing empires."],["Tondibi, 1591","Tondibi ended an empire rather than founding one."],["Lepanto, 1571","Lepanto was a sea battle the Ottomans lost."]],"exp":"At Panipat Babur beat Ibrahim Lodi with cannons and matchlocks."},{"q":"Which other battle is most similar to Panipat in what it shows?","right":"Tondibi, where firearms beat a larger army","wrong":[["The siege of Vienna, where the Ottomans failed to take a city with their guns","That was a failure."],["Lepanto, where a European fleet won at sea","That's naval."],["Kandahar","That was a contested fortress."]],"exp":"Both show gunpowder letting a smaller army win."}]},{"term":"Akbar","def":"Mughal emperor (r. 1556–1605) who conquered most of northern India and won Hindu support with religious tolerance.","hook":"Tolerance as strategy.","asks":[{"q":"A Muslim ruler of a Hindu-majority land ends the tax on non-Muslims and gives Hindus government posts. What was his main goal?","right":"Stabilizing a diverse empire","wrong":[["Converting all Hindus to Islam","He ended a tax that pressured Hindus; he did not force conversion."],["Weakening his own army","His tolerance won Hindu nobles to his side."],["Preparing to invade Persia","His policy targeted his own subjects, not Persia."]],"exp":"Akbar's tolerance won Hindu loyalty in a diverse empire."},{"q":"Why was Akbar's religious tolerance a smart political choice?","right":"It won support from the Hindu majority","wrong":[["It converted most Hindus in India to Islam within a single generation","Not on your card."],["It united India with Persia","No."],["It ended all wars","He conquered much of India."]],"exp":"Tolerance won Hindu support for a Muslim ruler."}]},{"term":"Aurangzeb","def":"Mughal emperor (r. 1658–1707) who pushed the empire to its largest size, brought back the jizya and enforced strict Sunni rule.","hook":"Biggest, then breaking.","asks":[{"q":"Which ruler made the Mughal Empire its largest yet left it weaker?","right":"Aurangzeb","wrong":[["Akbar","Akbar expanded the empire and stabilized it through tolerance."],["Shah Jahan","Shah Jahan is best known for building the Taj Mahal."],["Babur","Babur founded the empire in 1526."]],"exp":"Aurangzeb's wars in the south drained the treasury and his intolerance sparked revolts."},{"q":"Compare Akbar and Aurangzeb.","right":"Akbar tolerated; Aurangzeb enforced strict Sunni rule","wrong":[["Both brought back the jizya and enforced strict Sunni rule across India","Akbar did the opposite."],["Both were Hindu","Both were Muslim."],["Akbar was strict; Aurangzeb was tolerant","Reversed."]],"exp":"Akbar won Hindus with tolerance; Aurangzeb restored the jizya."}]},{"term":"Origin of the name Mughal","def":"The dynasty's title comes from 'Mongol,' a sign of the founder's descent from Genghis Khan.","hook":"Mughal = Mongol.","asks":[{"q":"Which word is the root of the name of the Muslim dynasty that ruled India from 1526?","right":"Mongol","wrong":[["Mamluk","The Mamluks ruled Egypt and Syria."],["Manchu","The Manchus founded the Qing in China."],["Maratha","The Marathas were Hindu rivals of the dynasty."]],"exp":"The name points back to Babur's Mongol ancestors."},{"q":"What does the name \"Mughal\" tell a historian about the dynasty?","right":"It claimed descent from the Mongols","wrong":[["It began as a Hindu dynasty that later converted to Islam in northern India","The name comes from 'Mongol.'"],["It came from Persia's royal family","Not the name's root."],["It was founded by Europeans","No."]],"exp":"The title comes from 'Mongol,' showing descent from Genghis Khan."}]}],"intro":["The Mughals ruled most of India. Babur, a descendant of Timur and Genghis Khan (the name Mughal comes from \"Mongol\"), invaded from Kabul. In 1526 at Panipat his smaller army, fighting from behind linked carts with cannons and muskets, beat the Sultan of Delhi. His grandson Akbar conquered most of northern India and kept the Hindu majority loyal by tolerating their religion. About a century later Aurangzeb made the empire its largest ever, but his strict Sunni rule and the return of the tax on non-Muslims stirred up rebellions."]},{"name":"Qing Empire","cards":[{"term":"Banner system","def":"Nurhaci's organization of the Manchus into military and administrative units.","hook":"Flags for every unit.","asks":[{"q":"Which institution organized the army that took Beijing in 1644?","right":"The Manchu banners","wrong":[["The Janissary corps","Janissaries were Ottoman soldiers."],["The Cossack bands","Cossacks fought for Russia in Siberia."],["The ghulam regiments","Ghulams served the Safavid shahs."]],"exp":"Nurhaci's banners were both army units and administrative units."},{"q":"Which institution is most similar in purpose to the Qing banners?","right":"The Ottoman Janissaries","wrong":[["The English justices of the peace, who kept order in the counties for the Tudors","They were local officials, not military units."],["The Peace of Westphalia","A treaty."],["The Codex Mendoza","A tribute record."]],"exp":"Both were organized military forces that served the ruler."}]},{"term":"Manchu conquest of China (1644)","def":"After rebels seized Beijing, the northeastern invaders allied with a Ming general, took the city and founded the Qing dynasty.","hook":"Outsiders take the dragon throne.","asks":[{"q":"Why did the Qing rulers have to work hard to prove their right to rule?","right":"They were a minority from outside China","wrong":[["They had no army to defend Beijing","Their banner armies took and held Beijing."],["They had rejected the civil service exam","The Qing kept the exam."],["They had lost the Mandate of Heaven to the Ming","The Qing replaced the Ming and claimed the Mandate."]],"exp":"As foreign rulers of a Han majority, the Manchus needed legitimacy."},{"q":"How did the Manchus take Beijing in 1644?","right":"By allying with a Ming general after rebels seized it","wrong":[["By sailing up the Yangtze River with a fleet of Portuguese gunships they had bought","Not on your card."],["By being invited by the Ming emperor","Rebels had seized the city."],["By winning a civil service exam","No."]],"exp":"After rebels seized Beijing, the Manchus allied with a Ming general."}]},{"term":"Kangxi","def":"Qing emperor (r. 1661–1722) who added Taiwan, Mongolia and parts of Central Asia and placed Tibet under Chinese protection.","hook":"Longest reign, biggest map.","asks":[{"q":"Which ruler presided over a long period of Qing stability and expansion that included Taiwan and Tibet?","right":"Kangxi","wrong":[["Qianlong","Qianlong ruled later (1736–1796) and annexed Xinjiang."],["Hongwu","Hongwu founded the Ming dynasty in 1368."],["Kublai Khan","Kublai founded the Yuan dynasty."]],"exp":"Kangxi took Taiwan in 1683 and extended control into Tibet."},{"q":"Which development under Kangxi best shows Qing expansion?","right":"Adding Taiwan and Mongolia","wrong":[["Annexing Xinjiang and fighting costly failed wars in Burma and Vietnam","That's Qianlong."],["Building the banner system","That's Nurhaci."],["Taking Beijing","That was 1644."]],"exp":"Kangxi added Taiwan, Mongolia and parts of Central Asia."}]},{"term":"Qianlong","def":"Qing emperor (r. 1736–1796) who annexed Xinjiang but emptied the treasury with failed campaigns in Burma and Vietnam.","hook":"Poet emperor, costly wars.","asks":[{"q":"Which development weakened the Qing treasury late in the 1700s?","right":"Failed campaigns in Burma and Vietnam","wrong":[["The loss of Taiwan to a Japanese invasion","The Qing held Taiwan in this period."],["The decision to end the civil service exam","The exam continued until 1905."],["Large tribute payments sent to the Mughal court","The Qing received tribute; they did not pay the Mughals."]],"exp":"Qianlong's costly southern campaigns drained the treasury."},{"q":"Qianlong's reign shows which pattern also seen in other gunpowder empires?","right":"Expansion that strained the treasury","wrong":[["Religious reform that split the empire into Catholic and Protestant regions","That's Europe."],["Peaceful decline with no wars at all","He fought costly wars."],["A shrinking empire","He annexed Xinjiang."]],"exp":"He annexed Xinjiang but emptied the treasury with failed campaigns."}]},{"term":"Zunghars","def":"A Mongol group in Central Asia that the Qing fought in long campaigns (also spelled Dzungars).","hook":"The last steppe rivals.","asks":[{"q":"Which group was the Qing's main rival on the Central Asian steppe?","right":"The Zunghar Mongols","wrong":[["The Hindu Marathas of the Deccan","The Marathas fought the Mughals in India."],["The Pashtun rebels of Afghanistan","Pashtun rebels sacked the Safavid capital."],["The Mamluk sultans of Egypt and Syria","The Mamluks were conquered by the Ottomans."]],"exp":"Kangxi defeated the Zunghars in 1696."},{"q":"Why did the Qing fight long campaigns in Central Asia?","right":"To defeat the Zunghars, a Mongol rival","wrong":[["To protect Russian fur traders who were crossing Siberia toward the Pacific","Not on your card."],["To spread Shi'a Islam","No."],["To reach the Indian Ocean","Not on your card."]],"exp":"The Zunghars were the Qing's main rival on the steppe."}]}],"intro":["The Qing were Manchus, outsiders from northeast of China. Their leader Nurhaci organized them into military units called banners. In 1644 rebels took Beijing and the Ming collapsed; the Manchus allied with a Ming general, took the city, and founded the Qing dynasty, China's last. Emperor Kangxi added Taiwan, Mongolia and parts of Central Asia. Qianlong added Xinjiang after long wars against the Zunghars, a Mongol group, but failed campaigns in Burma and Vietnam emptied the treasury."]},{"name":"Russia","cards":[{"term":"Ivan IV","def":"Crowned tsar in 1547 (called the Terrible); took Kazan and Astrakhan from the Golden Horde's heirs, opening the way east.","hook":"Terrible, and expanding.","asks":[{"q":"Which ruler first pushed Russia east by taking khanates ruled by descendants of the Golden Horde?","right":"Ivan IV","wrong":[["Peter the Great","Peter ruled later (1682–1725) and looked west."],["Kangxi","Kangxi was a Qing emperor."],["Suleiman I","Suleiman was an Ottoman sultan."]],"exp":"Ivan IV took Kazan and Astrakhan in the 1550s."},{"q":"How did Ivan IV's conquests reverse an earlier pattern in Russian history?","right":"Russia took lands from the Golden Horde's heirs","wrong":[["Russia became part of the Mongol Empire for the first time in its history","It had been ruled by the Golden Horde."],["Russia lost Moscow","No."],["Russia became Muslim","No."]],"exp":"Once ruled by the Golden Horde, Russia now took Kazan and Astrakhan from its heirs."}]},{"term":"Cossacks","def":"Fierce peasant warriors, hired by the Stroganov family, who used firearms to push Russian control across Siberia.","hook":"Russia's frontier gunmen.","asks":[{"q":"Which group fought local peoples and the Siberian khan so Russia could control the fur trade?","right":"Cossacks","wrong":[["Janissaries","Janissaries were Ottoman soldiers."],["Boyars","Boyars were Russian nobles, not frontier fighters."],["Samurai","Samurai were Japanese warriors."]],"exp":"The Stroganovs hired Cossacks to fight in Siberia."},{"q":"Why could small bands of Cossacks control large areas of Siberia?","right":"They had firearms","wrong":[["They had the support of the Qing banners, who sent troops to help them","Not on your card."],["Siberia had no people","They fought local peoples."],["They used ships","They moved overland."]],"exp":"Cossacks used firearms to push Russian control across Siberia."}]},{"term":"Russian push to the Pacific","def":"Fur traders and militias crossed Siberia and reached the ocean at Asia's eastern edge by 1639.","hook":"Fur all the way east.","asks":[{"q":"What mainly drove Russian expansion across Siberia?","right":"The fur trade","wrong":[["The search for a Shi'a
