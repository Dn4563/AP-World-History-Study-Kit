in central Vietnam.","Its drought resistance let farmers abandon terraces and settle the dry northern steppe.","Its popularity ended Chinese demand for luxury exports, shifting labor from workshops to farms."],"ans":0,"exp":"A reliable food supply grew the population, people migrated to the rice-growing south, and cities grew. Nothing in the text supports a capital move, abandoning terraces, or ending luxury exports.","why":["","The court did not move its capital to Champa; the rice arrived as tribute.","The rice's quick ripening, not drought resistance, mattered, and farmers did not abandon terraces for the steppe.","The rice did not end demand for luxury exports; it fed a growing population."]},{"id":"SQ17","deck":6,"q":"After the Black Death, a European laborer demands higher pay and a lord must agree. Which long-term effect does this best illustrate?","opts":["A rise in Mongol tribute demands that forced peasants to seek new employers.","The success of banking houses in lending money to peasants during the plague.","Labor shortages that raised the value of workers and helped weaken feudalism.","The growth of caravanserai that created new jobs for displaced farmworkers."],"ans":2,"exp":"With fewer workers, each person's labor became more valuable, so workers could demand higher wages, which helped lay the groundwork for feudalism's decline.","why":["Mongol tribute demands are not the cause of laborers demanding higher pay after the plague.","Banking houses lending to peasants is not what this scenario shows.","","Caravanserai are a Silk Road feature, not a source of jobs for farmworkers in Europe."]},{"id":"SQ18","deck":6,"q":"Indonesian seafarers introduced bananas to Sub-Saharan Africa. Which effect is directly supported by the textbook?","opts":["Banana plantations triggered the Atlantic slave trade by creating demand for enslaved labor in Africa.","The nutritious crop boosted population and let Bantu speakers settle where yams grew poorly.","The crop spread Islam into West Africa as Muslim merchants carried bananas across the Sahara.","The arrival of bananas ended trade with Southwest Asia since East Africa no longer needed food imports."],"ans":1,"exp":"Bananas provided more nutrition, spiking population and allowing Bantu-speaking peoples to move into regions where yams did not grow easily. The other options invent connections.","why":["Banana plantations did not trigger the Atlantic slave trade; the textbook supports no such link.","","Bananas did not spread Islam; the textbook gives no such connection.","Bananas did not end trade with Southwest Asia; the textbook gives no such effect."]},{"id":"SQ19","deck":7,"q":"Which statement is the best-supported difference between Indian Ocean trade and Silk Road trade?","opts":["Indian Ocean merchants relied on state protection, while Silk Road merchants traveled without any.","Indian Ocean trade spread religions, while Silk Road trade involved only goods and technology.","Indian Ocean trade began in 1200, while the Silk Roads had existed for over a thousand years.","Indian Ocean merchants moved goods too heavy for land, while Silk Road merchants specialized in luxuries."],"ans":3,"exp":"Ships could carry heavy cargo cheaply, while Silk Road merchants tended to specialize in luxury goods. Both networks used state protection and spread religions, and both predate 1200.","why":["Both networks relied on state protection, so this is not a difference.","Both networks spread religions, so this is not a difference.","Indian Ocean trade began long before 1200, so it did not start then.",""]},{"id":"SQ20","deck":7,"q":"Which similarity among the Silk Roads, Indian Ocean, and trans-Saharan networks is best supported?","opts":["Each depended on the same animals and ships to move goods between regions.","Each produced trading cities and relied on stable states to protect merchants and routes.","Each carried mostly luxury goods because bulky cargo could not be moved profitably.","Each was created by a single empire that opened the route after 1200."],"ans":1,"exp":"All three produced trading cities (the \"knots\" of the network) and needed stable states for protection. They used different transport and goods, and all predate 1200.","why":["The networks used different transport, such as camels and ships, so they did not rely on the same animals and ships.","","Not all carried mostly luxury goods; Indian Ocean ships also moved heavy cargo.","No single empire created all three, and all existed before 1200."]},{"id":"SQ21","deck":7,"q":"Which statement about gender in the networks of exchange, 1200–1450, is best supported?","opts":["Societies stayed mostly patriarchal, with exceptions such as Mongol women and Southeast Asian market women.","Trade increased women's political power in nearly every society along the major routes.","Mongol women were bound by the burka and foot binding adopted from conquered peoples.","European women were barred from guilds and worked only in households."],"ans":0,"exp":"Most societies remained patriarchies; Mongol women refused the burka and foot binding, Southeast Asian women controlled marketplaces, and European women worked as farmers and artisans and had their own guilds.","why":["","Trade did not give women political power in nearly every society; most remained patriarchal.","Mongol women refused the burka and foot binding, so this reverses the facts.","European women worked as farmers and artisans and had their own guilds."]}],"flows":[{"id":"FC1","title":"The Unit 2 pattern","deck":7,"steps":["Innovation (credit, caravanserai, compass, saddles)","More trade","Bigger cities and states","Cultural and environmental effects (religion, technology, crops, disease)"]},{"id":"FC2","title":"Mongol story","deck":2,"steps":["1206: Temujin elected Genghis Khan","1210–1227: conquers Jin, Kara Khitai, Khwarazm","1236–1240: Golden Horde takes Russia, Kiev destroyed","1258: Hulegu destroys Baghdad","1260: Kublai becomes Great Khan (Yuan from 1271)","1350s: White Lotus revolts","1368: Zhu Yuanzhang founds the Ming"]},{"id":"FC3","title":"Black Death path","deck":6,"steps":["Central or East Asia","along Silk Road and Mongol-era routes","trading ports and ships","Mediterranean and Europe (1347)","labor shortages and higher wages"]},{"id":"FC4","title":"Indian Ocean cycle","deck":3,"steps":["Monsoon timing","merchants wait in port for months","settle and marry locally","diasporic communities","cultural blending (Swahili culture, spread of Islam)"]},{"id":"FC5","title":"Mali's rise","deck":4,"steps":["Muslim merchants boost trans-Saharan trade (7th–8th centuries)","better saddles and caravans carry heavy loads","Mali taxes and protects the gold-salt trade (1200s)","Mansa Musa's 1324 pilgrimage","mosques and schools in Timbuktu"]}],"trees":["THE MONGOL EMPIRE (Genghis Khan, 1206–1227)\n├─ Yuan Dynasty ........ China (Kublai Khan; 1271–1368; Ming ends it)\n├─ Il-khanate .......... Persia / Southwest Asia (Hulegu; Persian officials)\n├─ Golden Horde ........ Russia (Batu; tribute through Russian princes)\n└─ Chagatai Khanate .... Central Asia (most traditionally Mongol)\n","NETWORKS OF EXCHANGE, 1200–1450\n├─ Silk Roads ........... overland (Central Asia)\n├─ Indian Ocean ......... maritime (monsoon zones)\n└─ Trans-Saharan ........ desert overland (camel caravans)\n","CONSEQUENCES OF CONNECTIVITY\n├─ Cultural\n│  ├─ Religions: Buddhism, Hinduism, Islam, Neo-Confucianism, Chan (Zen)\n│  ├─ Technology and learning: gunpowder, paper, translation\n│  ├─ Cities: grow (Hangzhou, Samarkand, Timbuktu, Malacca) or decline (Kashgar, Constantinople, Baghdad)\n│  └─ Travelers: Marco Polo, Ibn Battuta, Margery Kempe\n└─ Environmental\n   ├─ Crops: Champa rice, bananas, citrus, sugar\n   ├─ Degradation: overgrazing, deforestation, soil erosion\n   └─ Disease: bubonic plague (Black Death)\n"],"tables":[{"title":"The three networks compared","rows":[["","Silk Roads","Indian Ocean","Trans-Saharan"],["Terrain","Overland (Gobi, mountains, Central Asia)","Sea, driven by monsoon winds","Desert"],["Transport","Horses, camels, caravans","Dhows and junks","Camel caravans; people walked"],["Key technology","Caravanserai, flying cash, camel saddles","Compass, astrolabe, lateen sail, stern rudder","Camel saddle, organized caravans"],["Main goods","Silk, tea, porcelain, spices, paper, gunpowder","Cotton, spices, ivory, gold, rice, timber, slaves","Gold, ivory, slaves, kola nuts; salt, cloth, horses"],["Main challenge","Mountains, deserts, political division","Timing the monsoons; piracy","Extreme desert, finding water"],["Key cities and states","Kashgar, Samarkand, Chang'an","Calicut, Malacca, Gujarat, Swahili city-states","Timbuktu, Gao, Marrakesh, Cairo"],["Religions spread","Buddhism, Neo-Confucianism, Islam","Buddhism, Hinduism, Islam","Islam"]]}],"watch":[{"deck":4,"text":"The Fiveable cheat sheet lists salt among the goods from sub-Saharan Africa. That is backwards: salt came from the north (for example Taghaza) and moved south; gold moved north. The textbook and review doc agree. Also, the textbook is inconsistent about cloth (its text sends cloth south, its table sends cloth north), so do not rely on cloth's direction."},{"deck":2,"text":"The textbook says Hulegu converted to Islam and places the Il-khanate in \"Central Asia.\" The safe version for the test: the Mongols of the Il-khanate (in Persia and Southwest Asia) later converted to Islam."},{"deck":2,"text":"The textbook says Kublai defeated the Song in 1271. The Yuan was founded in 1271, but the Song itself ended in 1279 (the textbook dates the Song as 960–1279 elsewhere)."},{"deck":2,"text":"The textbook says some consider the cannon a Mongol invention and that Mongol tactics ended knights in armor and walled cities. These are overstatements. The safe test line, matching the cheat sheets: the Mongols spread gunpowder and siege technology; they did not invent it."},{"deck":2,"text":"The textbook says the Mamluks and Crusaders formed a temporary alliance to defeat Hulegu in 1260. The Crusader role is usually described as limited. Safe version: Mamluks under Baibars halted the Mongols in 1260."},{"deck":2,"text":"The textbook says the Golden Horde lost its territory by about 1369, yet also describes Kulikovo in 1380 and Mongol influence in Russia lasting longer. Safe version: Kulikovo (1380) began the Golden Horde's decline, and Moscow rose."},{"deck":2,"text":"The textbook says the Mongols brought the \"Arabic numbering system\" to Europe. The numerals began in India; use \"Hindu-Arabic.\""},{"deck":3,"text":"The textbook says Zheng He reached the Cape of Good Hope, but its own map shows East Africa. Say East Africa. Also say \"Ming admiral\" (the textbook calls him a Muslim admiral)."},{"deck":3,"text":"Monsoon wording differs: the textbook says winter winds come from the northeast and summer winds from the southwest; the review doc says summer winds blow southwest to northeast. Same pattern, described by where the wind comes from versus where it goes. Know both."},{"deck":5,"text":"The textbook calls Srivijaya a Hindu kingdom and Majapahit Buddhist. Historians generally describe Srivijaya as a major Buddhist center and Majapahit as Hindu-Buddhist. Safest label on the test: Hindu-Buddhist kingdoms."},{"deck":1,"text":"The textbook says caravanserai were about 100 miles apart. Spacing varied; what matters is that they were spaced so travelers and animals could rest and resupply. Also, the textbook's table dates (banking house c. 200 B.C.E., bill of exchange c. 700 C.E., Hanseatic League 1296) conflict with its own text. Just know these practices predate 1200 and expanded afterward."},{"deck":4,"text":"The textbook says Mansa Musa traveled with 100 camels; other accounts describe a much larger caravan. Do not memorize a number. Know: lavish gold, 1324, Mecca, then mosques and schools in Timbuktu."},{"deck":6,"text":"The textbook says South Asia and Sub-Saharan Africa were spared the plague because they had few ports. That claim is contested; do not rely on it. Also the plague's origin is described differently (Central Asia, southern China, East Asia); safe version: it began in Asia and spread along trade routes. Death tolls vary by source; \"about a third of Europe\" is the safest figure."},{"deck":6,"text":"The review doc says Champa rice ripened in about 60 days and gave two to three harvests; the textbook says quick-ripening with two crops a year, and some scholars think it originated in India. Safe version: quick-ripening, two crops a year, from Champa (Vietnam)."},{"deck":5,"text":"The review doc lists Kashgar only as a growing city. The textbook adds that it later declined after Tamerlane (1389–90). Both are true: it rose with the Silk Roads and declined with invasion."},{"deck":7,"text":"The textbook introduces the Vijayanagara reservoir quote as from the 1300s, but the source (Domingo Paes) is dated 1520–22. Use it as an example of large labor projects, not as 1200–1450 evidence."},{"deck":5,"text":"The textbook says Islam spread through merchants, missionaries, and conquests generally. For West Africa, the Swahili coast, and Malacca, the safe answer is merchants and rulers' conversion, not conquest."}],"practice":{"sections":[{"name":"MCQ Set A","mode":"practice","tips":["Read the attribution line first: who wrote it, when, and why. A Ming official, a Muslim scholar and a modern historian each have a different purpose.","Find the main idea of each paragraph before you look at the choices. Many questions ask about one paragraph only.","For \"best used as evidence of\" or \"best illustrates\" questions, first name the bigger development the source shows (more trade, Mongol connections, spread of religion, crops and disease), then pick the choice that matches it.","The wrong choices are usually true-but-not-in-the-source, from the wrong network or region, or too extreme. Cross them out with the X button.","\"Practice passage\" sources were written for this kit from your class materials. Only words inside quotation marks that are labeled as real are real quotations, so don't quote the rest on the test."],"sources":{"A1":{"title":"A king from beyond the desert, 1324","attr":"Practice passage in the voice of a Cairo official writing about a decade after Mansa Musa's visit.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["In the year of the pilgrimage the king of Mali, Musa, came to Cairo on his way to Mecca with a retinue larger than any the city had seen. He and his companions spent and gave away so much gold to officials, merchants and the poor that its price in our markets fell sharply. Even now, twelve years later, the dealers in gold have not recovered their losses.","The king told us that his kingdom lay many months' journey to the south, beyond the great desert, and that its wealth came from the gold of his lands, which the caravans carry north to trade for the salt of the desert. He takes a share of all this trade, and his soldiers keep the roads open for the merchants.","He is a Muslim who prays as we do, and he said that he meant to return home with learned men and books, so that the scholars of his own cities might teach the law and the faith."]},"A2":{"title":"Destroyers and connectors","attr":"Practice passage written in the style of a modern historian of the Mongol Empire.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["The Mongols are remembered for slaughter, and the memory is deserved. Their armies used terror as a weapon, and when Hulegu took Baghdad in 1258, the city was sacked and the caliph killed. Cities that resisted were often destroyed so that others would surrender without a fight.","Yet the same conquerors made the long overland routes safer than they had been in centuries. Wherever Mongol authority reached, roads were repaired and bandits were punished, and the yam, a relay system of messengers and stations, linked distant provinces. Merchants who had once paid tolls to a dozen rival rulers now dealt with a single authority that respected trade, and the khans tolerated many religions, so traders of every faith were welcome.","It is no accident that the travelers who carried Greek and Islamic medicine, Hindu-Arabic numerals and Chinese technology between Asia and Europe moved in these decades. The Pax Mongolica was built on conquest, but it connected Afro-Eurasia as never before."]},"A3":{"title":"A Persian envoy in Calicut, 1442","attr":"Practice passage built around the words of Abdu Razzak, a Persian envoy who visited Calicut in 1442. Only the sentence in quotation marks is his; it is quoted in your textbook.","label":"Practice passage written from your class materials; the quoted sentence is a real quotation from your textbook.","paras":["Calicut, on the southwest coast of India, is known to merchants as the City of Spices. Ships come to it from the ports of Arabia and Persia when the winds of the monsoon carry them east, and junks from China also anchor in its harbor. Pepper, cotton cloth and the steel of India are loaded here for the return voyage.","The ruler of the city welcomes foreign merchants of every faith, and many Arab merchants have settled here, married and raised families. The envoy was struck most by how safe trade felt: \"Wealthy merchants bring in big cargoes, which they unload and unhesitatingly send into the markets without thinking in the meantime of any security, or checking the account, or keeping watch over the goods.\"","Officers of the port collect the duties owed on the goods, and the ruler grows rich from this trade without sending out a single ship of his own."]},"A4":{"title":"The three networks compared","attr":"Your textbook (AMSCO).","label":"Adapted from a table in your textbook (AMSCO).","table":[["Network","Terrain","Transport and key technology","Goods"],["Silk Roads","Overland across Central Asia","Caravans, caravanserai, flying cash","Silk, porcelain, tea, spices (luxury goods)"],["Indian Ocean","Sea, driven by monsoon winds","Dhows, junks, compass, astrolabe, lateen sail","Spices, cotton, ivory, gold, and goods too heavy for land"],["Trans-Saharan","Desert","Camel caravans, load-bearing camel saddle","Gold, ivory, enslaved people; salt, horses"]]},"A5":{"title":"After the great dying","attr":"Practice passage written in the style of a modern historian of medieval Europe.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["The plague that reached Europe in 1347 traveled the same roads and sea lanes that had carried silk and spices. Fleas on rats rode in the holds of ships and among the bales of caravans, and the Mongol conquests that had joined Asia together helped carry the disease west. Between 1347 and 1351 it killed about a third of Europe's people, and many millions more in Asia.","The survivors inherited a changed world. In the countryside, so many workers had died that landowners who had once dictated terms to their tenants now competed for laborers. Wages rose, and peasants who could leave for better pay did so. The obligations that had tied workers to the land under feudalism began to weaken.","Trade and city life suffered in the short term, as markets emptied and cities lost many of their people. Writers such as Boccaccio, who lived through the plague in Florence, left accounts of the horror that historians still use today."]}},"questions":[{"id":"A-1","type":"mcq","skill":"Claim in a source","topic":"Trans-Saharan","stem":"Which of the following best describes a claim made in the first paragraph?","options":["Musa was robbed of most of his gold by the officials of Cairo during his stay","Musa's spending lowered the price of gold in Cairo for years","Musa's visit made Cairo's gold dealers rich for many years afterward","Musa came to Cairo to conquer it before going on to Mecca"],"ans":1,"exp":"So much gold flooded the market that its price fell, and dealers had not recovered twelve years later.","why":["The paragraph says he spent and gave gold away.","","The dealers had not recovered their losses.","He came as a pilgrim."],"src":"A1"},{"id":"A-2","type":"mcq","skill":"Best used as evidence","topic":"Trans-Saharan","stem":"The second paragraph can best be used as evidence that Mali's wealth came mainly from","options":["selling Chinese porcelain and silk to merchants arriving by sea from India","conquering the cities of North Africa","salt mines in the heart of the kingdom","taxing and protecting the trans-Saharan gold trade"],"ans":3,"exp":"Gold went north for salt; the king took a share and his soldiers kept the roads open.","why":["Mali is inland; its trade crossed the desert.","The paragraph describes trade, not conquest.","Salt came from the desert to the north.",""],"src":"A1"},{"id":"A-3","type":"mcq","skill":"Context / effect","topic":"Culture","stem":"Musa's plan in the third paragraph most directly contributed to which development?","options":["The conversion of all West Africans to Islam within a single generation","Timbuktu's growth as a center of Islamic learning","The end of the trans-Saharan trade","Mali's conquest by Songhai"],"ans":1,"exp":"After his pilgrimage Mansa Musa built mosques and schools in Timbuktu.","why":["Most West Africans kept traditional beliefs.","","Trade continued.","That came later and for other reasons."],"src":"A1"},{"id":"A-4","type":"mcq","skill":"Historian's argument","topic":"Mongols","stem":"Which of the following best states the historian's main argument?","options":["The Mongols were peaceful traders whose reputation for violence is unfair","The Mongols destroyed trade by sacking cities across Asia","Mongol conquest was destructive, but it also linked Afro-Eurasia","The Mongols invented the trade routes they controlled"],"ans":2,"exp":"Destroyers and connectors: slaughter (paragraph 1) and connection (paragraphs 2–3).","why":["Paragraph 1 says the memory of slaughter is deserved.","Paragraph 2 says trade routes became safer.","","The routes were older; the Mongols made them safer."],"src":"A2"},{"id":"A-5","type":"mcq","skill":"Evidence for an argument","topic":"Mongols","stem":"Which evidence does the historian use to support the claim that the Mongols \"respected trade\"?","options":["Merchants dealt with one authority instead of many tolls","Hulegu sacked Baghdad and killed the caliph in 1258","Cities that resisted were destroyed so others would surrender","Mongol armies used terror as a weapon of war"],"ans":0,"exp":"One authority instead of a dozen rival rulers, plus repaired roads and punished bandits.","why":["","That supports the destroyer side.","That supports the destroyer side.","That supports the destroyer side."],"src":"A2"},{"id":"A-6","type":"mcq","skill":"Continuity and change","topic":"Mongols","stem":"Based on the passage, which best describes a CHANGE in Silk Road trade under the Mongols?","options":["Safer routes under one ruler carried more trade and ideas","Trade switched from overland routes to the sea because the roads were destroyed","Merchants stopped traveling because of Mongol violence","Religious differences closed the routes"],"ans":0,"exp":"The routes were old; Mongol unity made them safer and busier (the Pax Mongolica).","why":["","The passage says the roads were repaired.","Travelers moved in these decades.","The khans tolerated many religions."],"src":"A2"},{"id":"A-7","type":"mcq","skill":"Sourcing","topic":"Indian Ocean","stem":"The envoy's description of merchants in the quoted sentence best suggests that Calicut","options":["was a dangerous port where merchants had to guard every cargo day and night","refused to let foreign merchants unload goods","had no market at all","was a safe, orderly market that trusted foreign traders"],"ans":3,"exp":"Merchants didn't bother with security or accounts: trade was safe and orderly.","why":["He says they did not need to keep watch.","Merchants unloaded freely.","Goods went straight into the markets.",""],"src":"A3"},{"id":"A-8","type":"mcq","skill":"Best used as evidence","topic":"Indian Ocean","stem":"The third paragraph can best be used as evidence of which feature of Indian Ocean states?","options":["Rulers built large navies to conquer the ports of their rivals across the ocean","Rulers banned foreign merchants","Rulers grew rich from duties on trade","Rulers depended on farming taxes alone"],"ans":2,"exp":"Customs duties gave states revenue from trade (compare Gujarat and Malacca).","why":["The ruler sends out no ships of his own.","He welcomes them.","","The passage stresses duties on goods."],"src":"A3"},{"id":"A-9","type":"mcq","skill":"Context","topic":"Indian Ocean","stem":"The settling and marriage of Arab merchants described in the second paragraph most directly contributed to","options":["the spread of Buddhism from India to China along the overland Silk Roads","the spread of Islam through family ties","the end of trade between Arabia and India","the Mongol conquest of southern India"],"ans":1,"exp":"Merchant intermarriage spread Islam through families rather than conquest.","why":["Wrong religion and wrong network.","","Settlement deepened trade.","Not in the passage or your cards."],"src":"A3"},{"id":"A-10","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Based on the table, which is a DIFFERENCE between the Indian Ocean and the Silk Roads?","options":["The Indian Ocean carried goods too heavy for land","Only the Silk Roads used any new technology to make long-distance trade easier","Only the Indian Ocean carried luxury goods","The Silk Roads depended on monsoon winds"],"ans":0,"exp":"Indian Ocean: sea, monsoon, bulk goods. Silk Roads: overland luxuries.","why":["","Both rows list technology.","The Silk Roads carried luxuries.","That's the Indian Ocean."],"src":"A4"},{"id":"A-11","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"Which conclusion about all three networks is best supported by the table?","options":["All three networks traded exactly the same goods along their routes","All three relied on monsoon winds","Each network had transport suited to its terrain","All three used flying cash"],"ans":2,"exp":"Caravans for land, ships for sea, camels and saddles for desert.","why":["The goods differ by row.","Only the sea route did.","","Only the Silk Roads row lists it."],"src":"A4"},{"id":"A-12","type":"mcq","skill":"Claim in a source","topic":"Environment","stem":"Which of the following best describes the historian's claim in the first paragraph?","options":["The plague spread along the same routes as trade","The plague began in Europe and spread east along the roads to Central Asia","The plague spread only by sea","The Mongols stopped the plague"],"ans":0,"exp":"Fleas on rats rode ships and caravans; Mongol conquests helped carry it west.","why":["","It reached Europe from the east.","Caravans carried it too.","Their conquests helped carry it."],"src":"A5"},{"id":"A-13","type":"mcq","skill":"Effect","topic":"Environment","stem":"The second paragraph can best be used as evidence that the plague","options":["strengthened landowners by giving them more power over the surviving peasants","lowered wages across Europe","had no effect on the countryside","weakened feudalism by making labor scarce"],"ans":3,"exp":"Labor shortages raised wages and weakened feudal obligations.","why":["Landowners now competed for workers.","Wages rose.","It transformed it.",""],"src":"A5"}]},{"name":"MCQ Set B","mode":"practice","tips":["Read the attribution line first: who wrote it, when, and why. A Ming official, a Muslim scholar and a modern historian each have a different purpose.","Find the main idea of each paragraph before you look at the choices. Many questions ask about one paragraph only.","For \"best used as evidence of\" or \"best illustrates\" questions, first name the bigger development the source shows (more trade, Mongol connections, spread of religion, crops and disease), then pick the choice that matches it.","The wrong choices are usually true-but-not-in-the-source, from the wrong network or region, or too extreme. Cross them out with the X button.","\"Practice passage\" sources were written for this kit from your class materials. Only words inside quotation marks that are labeled as real are real quotations, so don't quote the rest on the test."],"sources":{"B1":{"title":"A scholar on the Niger, c. 1352","attr":"Practice passage built around the words of Ibn Battuta, a Muslim scholar from Morocco. Only the words in quotation marks are his; they are quoted in your textbook.","label":"Practice passage written from your class materials; the quoted words are a real quotation from your textbook.","paras":["Ibn Battuta began traveling at 21 and spent about thirty years visiting mostly Muslim lands, from Mali to China. Late in his travels he crossed the Sahara to Mali, then the richest kingdom in West Africa. He wrote as a Muslim scholar, and he paid close attention to how well the people he met followed the faith.","Of his trip along the river he wrote: \"From Timbuktu I sailed down the Nile [Niger] on a small boat, hollowed out of a single piece of wood... I went on . . . to Gawgaw [Gao], which is a large city on the Nile [Niger]... The buying and selling of its inhabitants is done with cowry-shells, and the same is the case at Malli [the city of Mali].\"","From Gao he joined \"a large caravan of merchants from Ghadamas\" heading north across the desert. Such caravans, with guides, provisions and thousands of camels, moved from oasis to oasis carrying the gold of West Africa north and returning with salt."]},"B2":{"title":"Old tools, bigger scale","attr":"Practice passage written in the style of a modern economic historian.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["Historians sometimes credit the Mongols with inventing the commercial tools of the Silk Roads, but the tools were older. Caravanserai, roadside inns where travelers could rest, store goods and stable their animals, had stood along the routes for centuries. China had long had a money economy, and its government had developed paper money and flying cash, a form of credit that let a merchant deposit money in one city and collect the same amount in another, because copper coins were too heavy to carry for large trades.","What changed after 1200 was scale. Under a single Mongol authority, these tools served many more merchants over far greater distances. In Europe, merchants used bills of exchange, promises to pay a set amount on a set date, and banking houses that handled such bills appeared in the 1300s.","The lesson is one of continuity as much as change: the age of the Mongols improved and spread the tools of trade more than it invented them."]},"B3":{"title":"Towns of the coast","attr":"Practice passage in the voice of a medieval geographer describing the East African coast.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["The towns of this coast, among them Kilwa, Mombasa and Mogadishu, are governed by their own rulers and look out on the sea. Their merchants buy gold and ivory from the peoples of the interior and sell them to the ships that arrive with the monsoon from Arabia, Persia and India. In return they receive cotton cloth from India, and porcelain from China is common in the houses of the rich.","The people speak a language of the coast that mixes their own Bantu speech with many Arabic words; the name the Arabs give them means \"people of the coast.\" Most of the leading men are Muslims, for the Arab and Persian merchants who settled here married the daughters of local families, and their children grew up in the faith.","Enslaved people from the interior are also sold here and carried to North Africa, to the lands of the Arabs and to India, where they labor in the cities, serve in households or fight as soldiers."]},"B4":{"title":"Goods carried across the Sahara","attr":"Built from the table in your textbook (AMSCO) and your review cards.","label":"Table adapted from your class materials.","table":[["Direction of travel","Goods"],["South to north","Gold, ivory, enslaved people, kola nuts"],["North to south","Salt, horses, books, copper and brass"]]},"B5":{"title":"Crops on the move","attr":"Practice passage written in the style of a modern environmental historian.","label":"Practice passage written from your class materials (textbook, review sheet, slides); not a real quotation.","paras":["The trade networks of 1200 to 1450 carried seeds as well as silk. The Chinese court received a quick-ripening rice from the rulers of Champa, in what is now central Vietnam, as tribute. Because it resisted both drought and flood, a farmer could harvest two crops a year from the same field, and as it spread across southern China the population grew.","Across the Indian Ocean, Indonesian seafarers brought bananas to Sub-Saharan Africa. The nutritious fruit let Bantu-speaking farmers settle in places where yams did not grow, and their numbers rose. Citrus fruits moved through Muslim lands and markets such as Samarkand into the Mediterranean.","Yet more people meant more pressure on the land. Overgrazing, deforestation and soil erosion cut farm output in several regions; near Great Zimbabwe, overgrazing helped force people to abandon the city in the late 1400s."]}},"questions":[{"id":"B-1","type":"mcq","skill":"Sourcing","topic":"Travelers","stem":"The first paragraph suggests that a historian using Ibn Battuta's account should keep in mind that he","options":["was a European merchant interested mainly in prices and the goods for sale","never actually visited West Africa","wrote as a Christian pilgrim","judged what he saw from a Muslim scholar's point of view"],"ans":3,"exp":"He wrote as a Muslim scholar who paid attention to how people followed the faith.","why":["That describes Marco Polo.","He traveled there.","That describes Margery Kempe.",""],"src":"B1"},{"id":"B-2","type":"mcq","skill":"Best used as evidence","topic":"Trans-Saharan","stem":"The quotation in the second paragraph can best be used as evidence that West African cities","options":["used Chinese flying cash brought across the desert by merchants from the north","had no trade at all","used cowrie shells as currency","traded only by sea"],"ans":2,"exp":"\"The buying and selling of its inhabitants is done with cowry-shells.\"","why":["He describes cowrie shells.","He describes buying and selling.","","He traveled by river and caravan."],"src":"B1"},{"id":"B-3","type":"mcq","skill":"Context","topic":"Trans-Saharan","stem":"The caravans described in the third paragraph were made possible most directly by","options":["camels and saddles suited to desert travel","the monsoon winds, which carried the caravans quickly across the open sand","the Mongol yam relay system","Chinese junks"],"ans":0,"exp":"Camels, which go long without water, and load-bearing saddles made the crossing practical.","why":["","Monsoons drove ships, not caravans.","That was in Asia.","Those were ships."],"src":"B1"},{"id":"B-4","type":"mcq","skill":"Historian's argument","topic":"Commercial","stem":"Which best states the historian's argument?","options":["The Mongols invented caravanserai, credit and paper money after they united Asia","Trade declined after 1200","The tools of trade were improved and spread, not invented","Europe invented all commercial tools"],"ans":2,"exp":"\"Improved and spread the tools of trade more than it invented them.\"","why":["The historian says the tools were older.","Trade grew in scale.","","The passage credits China and Persia too."],"src":"B2"},{"id":"B-5","type":"mcq","skill":"Cause","topic":"Commercial","stem":"According to the first paragraph, China developed flying cash because","options":["the Mongols banned the use of coins and forced merchants to use paper instead","paper was cheaper than silk","banking houses required it","copper coins were too heavy for large trades"],"ans":3,"exp":"Deposit in one city, collect in another, because heavy coins were hard to carry.","why":["The passage gives coin weight as the reason.","Not the reason given.","Banking houses were European.",""],"src":"B2"},{"id":"B-6","type":"mcq","skill":"Comparison","topic":"Commercial","stem":"The European practice described in the second paragraph was most similar in purpose to","options":["the caravanserai, where merchants could rest and stable animals on the roads","the camel saddle","China's flying cash","the lateen sail"],"ans":2,"exp":"Bills of exchange and flying cash both moved money without carrying coins.","why":["Those gave shelter, not credit.","That raised loads.","","That caught wind."],"src":"B2"},{"id":"B-7","type":"mcq","skill":"Claim in a source","topic":"Indian Ocean","stem":"Which of the following best describes the main idea of the first paragraph?","options":["Coastal towns traded African goods for Asian goods","Coastal towns made porcelain and cotton cloth to sell to Chinese merchants","Coastal towns were ruled by China","Coastal towns traded only with each other"],"ans":0,"exp":"Gold and ivory went out; Indian cloth and Chinese porcelain came in.","why":["","Porcelain came from China and cloth from India.","They had their own rulers.","They traded across the ocean."],"src":"B3"},{"id":"B-8","type":"mcq","skill":"Best used as evidence","topic":"Culture","stem":"The second paragraph can best be used as evidence of","options":["the forced conversion of the coast by Arab armies after a long period of war","the isolation of the coast from Arabia","the spread of Buddhism in Africa","cultural blending caused by trade"],"ans":3,"exp":"A blended Bantu-Arabic language and Islam spreading through marriage.","why":["Islam spread through marriage, not conquest.","Arab merchants settled there.","Not in the passage.",""],"src":"B3"},{"id":"B-9","type":"mcq","skill":"Comparison","topic":"Comparison","stem":"The slave trade described in the third paragraph differed from the later Atlantic slave trade because enslaved people were","options":["often used in cities, households and armies","sent mainly to work on large sugar plantations in the Americas for European owners","never sold to other regions","all from Asia"],"ans":0,"exp":"They labored in cities, served in households or fought as soldiers.","why":["","That's the later Atlantic trade.","They were carried abroad.","They came from the African interior."],"src":"B3"},{"id":"B-10","type":"mcq","skill":"Data","topic":"Trans-Saharan","stem":"Which conclusion is best supported by the table?","options":["West Africa produced all of its own salt, so salt was sent north to buyers there","Each region traded goods the other lacked","Horses moved south to north","Gold moved north to south"],"ans":1,"exp":"Gold from the south, salt from the north: each side supplied what the other lacked.","why":["Salt moved south.","","Horses moved north to south.","Gold moved south to north."],"src":"B4"},{"id":"B-11","type":"mcq","skill":"Context","topic":"Trans-Saharan","stem":"The flow of gold shown in the table most directly helped cause","options":["the decline of West African kingdoms, which lost all of their gold to the north","the wealth of empires such as Mali","the spread of Buddhism in North Africa","the Mongol conquest of the Sahara"],"ans":1,"exp":"Mali taxed and protected the gold trade and grew richer than Ghana.","why":["Mali grew rich by taxing the gold trade.","","Not on your cards.","Did not happen."],"src":"B4"},{"id":"B-12","type":"mcq","skill":"Claim in a source","topic":"Environment","stem":"The first two paragraphs support which claim?","options":["New crops reduced population because they replaced the older and healthier foods","New crops carried by trade led to population growth","Crops moved only by conquest","Crops never left their homelands"],"ans":1,"exp":"Champa rice and bananas fed growing populations.","why":["Population rose.","","Tribute and seafarers moved them.","They spread widely."],"src":"B5"},{"id":"B-13","type":"mcq","skill":"Continuity and change","topic":"Environment","stem":"The final paragraph shows which consequence of the developments described earlier?","options":["Larger populations strained the land","Larger populations led to more forests, since farmers planted trees for fruit","Farm output rose without limit","Cities grew everywhere"],"ans":0,"exp":"Overgrazing, deforestation and soil erosion followed population growth.","why":["","Deforestation, not more forests.","Output fell in places.","Great Zimbabwe was abandoned."],"src":"B5"}]},{"name":"MCQ Set C","mode":"practice","tips":["Read the question stem before the source so you know what you are looking for.","For \"best used as evidence of\" or \"best illustrates\" questions, first name the idea the source shows (cause, effect, continuity, change, connection between regions), then pick the option that matches that idea.","Eliminate options that are true in history but not shown by the source, or that belong to the wrong time or region.","Watch for extreme words (\"only,\" \"all,\" \"first,\" \"created,\" \"ended,\" \"every\"): they are usually wrong.","For \"claim\" or \"evidence the author uses\" questions, the answer must be stated or directly supported in the text. Do not use outside knowledge to pick it.","For point-of-view questions, ask who wrote it, when, for whom, and why."],"sources":{"S16":{"title":"Angkor Thom","attr":"Adapted from a textbook description of the royal monuments of the Khmer Empire.","label":"Practice source (adapted for practice; not a verbatim quotation).","text":"The Khmer Empire, in present-day Cambodia, was the most successful kingdom in Southeast Asia. The royal monuments at Angkor Thom show both Hindu and Buddhist influences. Hindu artwork and sculptures of Hindu gods adorned the city. Later, when Khmer rulers had become Buddhist, they added Buddhist sculptures and artwork onto buildings while keeping the Hindu artwork."},"S17":{"title":"Cultural influences of Islam in Afro-Eurasia","attr":"Adapted from a textbook table.","label":"Practice source (adapted for practice).","table":[["Region","Influences"],["Africa","The Swahili language blends Bantu and Arabic; Timbuktu became a center of Islamic learning; leaders deepened Islamic ties through pilgrimages to Mecca"],["South Asia","Islam's emphasis on equality attracted lower-caste Hindus; architecture blended Hindu designs with Islamic patterns; the Urdu language drew on Hindi, Arabic, and Persian"],["Southeast Asia","Javanese stories, puppetry, and poetry absorbed Muslim characters and techniques"]]},"S18":{"title":"Women in the Mongol Empire","attr":"Adapted from a textbook description.","label":"Practice source (adapted for practice; not a verbatim quotation).","text":"In the Mongols' nomadic culture, women tended flocks of sheep and goats in addition to raising children and providing meals. Because they rode horses as men did, Mongol women wore the same kind of leather trousers. They could remarry after being widowed and could start divorces. In the lands the Mongols ruled, Mongol women moved about freely, and women were often top advisors to the great khan."},"S19":{"title":"The kingdom of Gujarat","attr":"Adapted from a textbook description.","label":"Practice source (adapted for practice; not a verbatim quotation).","text":"The western Indian kingdom of Gujarat became the go-between for trade between the East and West. Its rulers raised money through customs, which were taxes on imported goods, and through fees for the use of seaports. The revenue from customs in Gujarat was many times greater than the entire worth of some European states."},"S20":{"title":"Learning and technology on the trade routes","attr":"Adapted summary of a textbook account.","label":"Practice source (written for practice; not a verbatim quotation).","paras":["Islamic scholars translated Greek literary classics into Arabic, saving the works of Aristotle and other thinkers. They also brought back mathematics texts from India and techniques for making paper from China.","Papermaking reached Europe from China in the 13th century. Together with printing technology, it helped lead to a rise in literacy."]}},"questions":[{"id":"C1","type":"mcq","src":"S16","skill":"Best illustrates a trend","stem":"The monuments described in the passage best illustrate which of the following about the spread of Indian religions into Southeast Asia?","options":["Buddhism completely replaced Hinduism once Khmer rulers converted.","Indian religions spread mainly when Indian armies conquered Southeast Asia.","Southeast Asian rulers rejected Indian religious influence in their architecture.","New religions were often added to earlier traditions rather than replacing them."],"ans":3,"exp":"The Khmer rulers added Buddhist art while keeping the Hindu art, which shows that religions often blended or coexisted rather than replacing one another. Indian religions spread through trade, not conquest by Indian armies, and the monuments show acceptance of Indian influence, not rejection.","why":["The monuments show Buddhist art added alongside Hindu art, not one replacing the other.","Indian religions spread through trade and contact, not conquest by Indian armies.","The Khmer rulers built Indian-influenced monuments, so they accepted rather than rejected Indian influence.",""]},{"id":"C2","type":"mcq","src":"S16","skill":"Strengthening an argument","stem":"Which additional evidence would best support the claim that Khmer rulers used religion to strengthen their authority?","options":["Merchants from India described the temples in letters sent home.","Sculptures showed kings sharing the powers of Hindu gods.","Farmers paid taxes in rice to support the builders of the city.","Buddhist monks lived in monasteries on the edges of the capital."],"ans":1,"exp":"Showing kings as sharing divine powers directly links religion to royal authority, as in Khmer ideas of divine kingship. Travelers' letters, tax payments, and monks living nearby do not show religion being used to support rule.","why":["Merchants' letters about the temples do not show rulers using religion to support their authority.","","Farmers paying taxes in rice supports the builders but does not link religion to royal authority.","Monks living near the capital does not show rulers using religion to strengthen their rule."]},{"id":"C3","type":"mcq","src":"S16","skill":"Drawing an inference from a source","stem":"Which of the following can best be inferred about the role of religious imagery on the royal monuments?","options":["It helped rulers collect customs duties from foreign merchants.","It showed that rulers wished to end earlier religious traditions.","Royal monuments linked the ruling family with divine imagery.","It was designed mainly to attract Chinese merchants to Cambodia."],"ans":2,"exp":"Monuments built by rulers and filled with religious art tied the royal family to sacred authority; Khmer kings drew on Hindu ideas of divine kingship. Nothing in the passage connects the imagery to customs duties, ending older traditions, or attracting Chinese merchants.","why":["Nothing links the religious imagery to customs duties.","The monuments kept older traditions alongside new ones, so rulers did not want to end them.","","Attracting Chinese merchants is not mentioned as the purpose of the imagery."]},{"id":"C4","type":"mcq","src":"S17","skill":"Drawing a conclusion from a source","stem":"Which of the following is best supported by the information in the table?","options":["The spread of Islam produced blended cultures rather than uniform ones.","Islam spread primarily through military conquest in each of the three regions listed.","Islamic learning remained limited to cities in sub-Saharan Africa.","Local traditions disappeared once Islam arrived in each region."],"ans":0,"exp":"The Swahili language, blended architecture, Urdu, and Javanese puppetry with Muslim characters all show cultural blending. The table does not mention conquest, does not limit Islamic learning to Africa, and does not say local traditions disappeared.","why":["","The table does not say Islam spread mainly through conquest in all three regions.","The table does not say Islamic learning was limited to cities in sub-Saharan Africa.","The table shows local traditions blending with Islam, not disappearing."]},{"id":"C5","type":"mcq","src":"S17","skill":"Challenging a claim","stem":"A student claims Islam spread in South Asia mainly through force. Which detail in the table most directly challenges that claim?","options":["Architecture blended Hindu designs with Islamic patterns.","Leaders in Africa deepened Islamic ties through pilgrimages to Mecca.","The Urdu language drew on Hindi, Arabic, and Persian.","Islam's emphasis on equality attracted lower-caste Hindus."],"ans":3,"exp":"Lower-caste Hindus being attracted by Islam's emphasis on equality points to voluntary conversion for social reasons, which challenges the claim of force. The architecture and Urdu show blending, and the pilgrimage detail concerns Africa, not South Asia.","why":["Blended architecture shows cultural mixing but does not address whether conversion was forced.","The pilgrimage detail concerns Africa, not South Asia.","Urdu shows blending but says nothing about whether Islam spread by force.",""]},{"id":"C6","type":"mcq","src":"S17","skill":"Best illustrates a trend","stem":"The existence of the Urdu language best illustrates","options":["the replacement of Persian by Arabic across South Asia.","Mongol efforts to unify their empire under one script.","cultural blending that followed Islam's arrival in South Asia.","the isolation of South Asian languages from outside influence."],"ans":2,"exp":"Urdu drew on Hindi, Arabic, and Persian, which shows blending after Islam arrived. Uyghur script, not Urdu, was the Mongol writing system, and Urdu neither replaced Persian nor shows isolation.","why":["Urdu drew on Persian as well as Arabic; it did not show Persian being replaced.","The Mongol script was Uyghur, not Urdu.","","Urdu drew on Hindi, Arabic, and Persian, so it shows outside influence, not isolation."]},{"id":"C7","type":"mcq","src":"S18","skill":"Best illustrates a trend","stem":"The passage best illustrates which of the following about gender in Afro-Eurasia in this period?","options":["Women gained equal political power in nearly every society of the period.","Women's roles varied, and some enjoyed more freedom than was typical.","Nomadic societies gave women fewer rights than farming societies did.","Patriarchal norms vanished in every society the Mongols conquered."],"ans":1,"exp":"Mongol women had more freedom than women in most other parts of Afro-Eurasia, even though the empire was still a patriarchy. The passage does not support equal power everywhere, fewer rights for nomadic women, or the disappearance of patriarchy.","why":["'Equal political power in nearly every society' is much stronger than the passage supports.","","The passage says Mongol women had more freedom, not fewer rights.","The empire was still a patriarchy; norms did not vanish."]},{"id":"C8","type":"mcq","src":"S18","skill":"Best used as evidence of","stem":"The roles of Mongol women are best used to illustrate which of the following about the relationship between environment and society?","options":["A way of life shaped by environment could produce different gender roles.","Religious teachings were the main source of gender norms in every society.","Wealth from conquest was the main reason women gained greater freedom.","Patriarchal norms were weaker wherever long-distance trade was heavy."],"ans":0,"exp":"Herding and horse-riding on the steppe gave women practical roles that differed from those in settled societies, which shows how environment and way of life shaped gender roles. The other options rely on extreme or unsupported claims such as 'in every society' and 'wherever trade was heavy.'","why":["","'Main source in every society' is an extreme claim the passage does not make.","Wealth from conquest is not given as the reason women had freedom.","'Wherever long-distance trade was heavy' is unsupported by the passage."]},{"id":"C9","type":"mcq","src":"S18","skill":"Best used as evidence of","stem":"The freedoms of Mongol women are best used as evidence of which of the following?","options":["Social structures were identical in every single part of the Mongol Empire.","Mongol rule ended class distinctions among the people it conquered.","The Mongol Empire was the only patriarchal society in Afro-Eurasia.","Gender norms differed even among societies that were mostly patriarchal."],"ans":3,"exp":"Societies were mostly patriarchal, yet Mongol women had more freedom than most, which shows variation. The other options rely on extreme words: \"identical,\" \"ended,\" and \"only.\"","why":["'Identical in every single part' is far too extreme.","The passage does not say Mongol rule ended class distinctions.","'The only patriarchal society' is false; most societies were patriarchal.",""]},{"id":"C10","type":"mcq","src":"S19","skill":"Best used as evidence of","stem":"The information in the passage can best be used as evidence that","options":["Indian Ocean states relied mainly on farming to pay for their governments.","states could grow wealthy by taxing trade that passed through their ports.","European states controlled Indian Ocean commerce through their own customs systems.","Gujarat's wealth depended on the protection of Mongol armies on land."],"ans":1,"exp":"Gujarat raised enormous revenue from customs and port fees, showing that states could grow wealthy by taxing trade. The passage does not say Indian Ocean states relied on farming, that European states controlled the trade, or that Mongol armies protected Gujarat.","why":["The passage describes revenue from customs and port fees, not farming.","","No European control of Indian Ocean commerce is mentioned.","Gujarat's wealth came from port customs, not from Mongol armies."]},{"id":"C11","type":"mcq","src":"S19","skill":"Comparison","stem":"Gujarat's economic role was most similar to that of which of the following?","options":["Kashgar, whose river valley grew the food that travelers needed.","Timbuktu, whose scholars wrote and sold books in the 1500s.","Malacca, which collected fees from ships on a crucial route.","Hangzhou, a cultural center that was home to famous poets."],"ans":2,"exp":"Both Gujarat and Malacca grew wealthy as go-betweens that taxed or charged fees on trade. The other cities are best known for food supply, learning, or culture.","why":["Kashgar is known for food supply from its river valley, not for charging fees on trade.","Timbuktu is known for learning and books in the 1500s, not for taxing a strait.","","Hangzhou is known as a cultural center, not for collecting fees as a go-between."]},{"id":"C12","type":"mcq","src":"S20","skill":"Identifying a claim","stem":"Which of the following best describes a claim made in the first paragraph?","options":["Islamic scholars brought back mathematics texts from India.","Greek scholars translated Arabic works into Latin.","Paper was invented by Islamic scholars in Baghdad.","Aristotle's works were lost before they could be translated."],"ans":0,"exp":"The paragraph says scholars brought back mathematics texts from India and papermaking techniques from China. It says Islamic scholars translated Greek works into Arabic (not the reverse) and saved Aristotle's works, and it says papermaking came from China.","why":["","Islamic scholars translated Greek works into Arabic, not Arabic works into Latin.","Paper came from China, not from Islamic scholars in Baghdad.","Islamic scholars saved Aristotle's works instead of losing them."]},{"id":"C13","type":"mcq","src":"S20","skill":"Identifying a claim","stem":"Which of the following is a claim made in the second paragraph?","options":["Papermaking arrived in Europe before it reached the Islamic world.","Printing technology began in Europe and later spread to China.","Rising literacy in Europe led directly to the spread of papermaking.","Papermaking and printing helped lead to rising literacy in Europe."],"ans":3,"exp":"The paragraph says papermaking reached Europe from China in the 13th century and, with printing, helped lead to a rise in literacy. It does not say papermaking reached Europe first, that printing began in Europe, or that literacy caused papermaking.","why":["Papermaking reached the Islamic world before it reached Europe.","The paragraph says printing began in China, not Europe.","The paragraph reverses cause and effect; papermaking helped raise literacy, not the other way around.",""]}]},{"name":"SAQs","mode":"practice","tips":["Use TEA for every part: T = Topic sentence (answer the question directly, restating its words), E = Evidence (a specific person, place, term, date, or detail from the source or your knowledge), A = Analysis (explain how that evidence proves your topic sentence, using \"which led to,\" \"because,\" or \"this allowed\").","Label your answers A, B, and C and write in complete sentences. No introduction or thesis.","Each part is worth 1 point. Name a specific, accurate piece of evidence (a person, place, term, date, or technology), then explain how it connects to what the question asks.","\"Describe\" means give accurate details. \"Explain\" means show how or why, using a link such as \"which led to,\" \"because,\" or \"this allowed.\"","Stay inside 1200 to 1450 unless the question says otherwise.","Sentence frame: \"One way ___ was ___. For example, ___. This mattered because ___.\"","Aim for about 13 minutes per SAQ on the real test: about 1 to plan and 12 to write.","Self-check before you reveal the answer: Did I give a specific example, not just a general idea? Did I explain the connection? Is it the right time and place? Did I answer the exact verb (describe or explain)?"],"sources":{"SQ1":{"title":"Matthew Paris on the Mongols, 1240","attr":"Matthew Paris, an English Benedictine monk writing from an abbey in England, Chronica Majora, 1240.","label":"","text":"Swarming like locusts over the face of the earth, they [the Mongols] have brought terrible devastation to the eastern parts [of Europe], laying it waste with fire and carnage. After having passed through the land of the Saracens [Muslims], they have razed cities, cut down forests, overthrown fortresses, pulled up vines, destroyed gardens, killed townspeople and peasants."},"SQ2":{"title":"Marco Polo on Hangzhou","attr":"Marco Polo, a Venetian merchant who visited the court of Kublai Khan, writing about China after returning to Italy in 1295.","label":"","text":"They use paper money as currency. The men as well as the women are fair-skinned and handsome. Most of them always dress themselves in silk, as a result of the vast quantities of that material produced in Hangzhou, exclusive of what the merchants import from other provinces."},"SQ3":{"title":"Goods carried across the Sahara","attr":"Adapted from a textbook table.","label":"Practice source (adapted for practice).","table":[["Direction of travel","Goods"],["North to South","Horses, books, salt"],["South to North","Gold, ivory, enslaved people"]]},"SQ4":{"title":"Zheng He's voyages","attr":"Adapted summary of a historian's account.","label":"Practice source (written for practice; not a verbatim quotation).","text":"In 1405, the Ming emperor Yongle sent the admiral Zheng He on the first of seven great voyages across the Indian Ocean. At its height his fleet included more than 300 ships carrying about 28,000 people. The voyages displayed the might of the Ming Dynasty and brought tribute from the peoples Zheng He met. Some officials, however, thought the voyages were too costly, and the voyages ended in 1433."},"SQ5":{"title":"The three networks compared","attr":"Adapted from textbook tables.","label":"Practice source (adapted for practice).","table":[["Network","Terrain","Transport and key technology","Goods"],["Silk Roads","Overland across Central Asia","Caravans, caravanserai, flying cash","Silk, porcelain, tea, spices (luxury goods)"],["Indian Ocean","Sea, driven by monsoon winds","Dhows, junks, compass, astrolabe, lateen sail","Spices, cotton, ivory, gold, and goods too heavy for land"],["Trans-Saharan","Desert","Camel caravans, load-bearing camel saddle","Gold, ivory, enslaved people; salt, horses"]]},"SQ6":{"title":"Margery Kempe's pilgrimages","attr":"Adapted summary of a textbook description of The Book of Margery Kempe.","label":"Practice source (adapted for practice; not a verbatim quotation).","text":"Margery Kempe, an English woman who could neither read nor write, dictated an account of her pilgrimages to Jerusalem, Rome, and Spain in the early 1400s. She describes being so overcome by her first sight of Jerusalem that she nearly fell off her donkey."},"SQ7":{"title":"Mongol Empires in the 13th Century","attr":"Map from a textbook, World History Modern: AP Edition (AMSCO).","label":"Map (from your textbook).","img":"map_mongol","text":"The map shows four Mongol-ruled regions: the Empire of the Great Khans/Yuan Dynasty, the Batu Kipchak Empire (Golden Horde), the Ilkhan Empire, and the Empire of the Chaghatai Khanate. Cities labeled include Karakorum, Khanbaligh, Kiev, Moscow, Sarai, and Constantinople."},"SQ8":{"title":"Strait of Malacca","attr":"Map from a textbook, World History Modern: AP Edition (AMSCO).","label":"Map (from your textbook).","img":"map_malacca","text":"Caption: The shortest route from East Asia to Southwest Asia on the Indian Ocean trade route was through the Strait of Malacca."}},"questions":[{"id":"SAQ1","type":"saq","src":"SQ1","lead":"Using the excerpt, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one claim Matthew Paris makes about the Mongols.","skill":"Describing a claim from a source","model":"One claim Matthew Paris makes is that the Mongols caused terrible destruction in eastern Europe. He writes that they \"razed cities, cut down forests, overthrown fortresses\" and \"killed townspeople and peasants.\" This shows he portrays the Mongols as a destructive invading force that attacked civilians as well as armies.","tea":["One claim Matthew Paris makes is that the Mongols caused terrible destruction in eastern Europe.","He writes that they \"razed cities, cut down forests, overthrown fortresses\" and \"killed townspeople and peasants.\"","This shows he portrays the Mongols as a destructive invading force that attacked civilians as well as armies."],"earns":"You accurately describe any specific claim in the passage (for example, that the Mongols razed cities, killed civilians, destroyed farmland, or passed through Muslim lands before reaching Europe).","weak":"\"He says the Mongols were bad.\" This does not name a specific claim from the text."},{"k":"B","prompt":"Explain one way that Mongol rule, despite the violence described in the excerpt, helped expand networks of exchange between 1200 and 1450.","skill":"Explaining a cause with specific evidence","model":"One way Mongol rule expanded networks of exchange was by making Silk Roads travel safer, a period known as the Pax Mongolica. The Mongols improved roads, punished bandits, and ran the yam, a relay system of posts with fresh horses and supplies. With less risk of robbery and faster, safer travel, merchants could carry goods farther across Eurasia, which increased trade between East Asia, the Middle East, and Europe.","tea":["One way Mongol rule expanded networks of exchange was by making Silk Roads travel safer, a period known as the Pax Mongolica.","The Mongols improved roads, punished bandits, and ran the yam, a relay system of posts with fresh horses and supplies.","With less risk of robbery and faster, safer travel, merchants could carry goods farther across Eurasia, which increased trade between East Asia, the Middle East, and Europe."],"earns":"You name a specific Mongol policy or condition (Pax Mongolica, safer roads, punished banditry, the yam relay, one authority that respected merchants, religious tolerance) and explain how it increased trade.","weak":"\"The Mongols helped trade a lot.\" (No specific evidence and no explanation.) Also avoid saying the Mongols created the Silk Roads; the routes already existed."},{"k":"C","prompt":"Explain one cultural, technological, or environmental effect of the increased connections that Mongol rule created.","skill":"Explaining an effect with specific evidence","model":"One effect of the connections Mongol rule created was the spread of the bubonic plague. The Black Death traveled along trade routes from Central Asia and reached Europe by 1347, killing roughly a third of Europe's people. Because Mongol-linked routes moved people and goods quickly over huge distances, they also moved disease, and the resulting labor shortages in Europe raised wages.","tea":["One effect of the connections Mongol rule created was the spread of the bubonic plague.","The Black Death traveled along trade routes from Central Asia and reached Europe by 1347, killing roughly a third of Europe's people.","Because Mongol-linked routes moved people and goods quickly over huge distances, they also moved disease, and the resulting labor shortages in Europe raised wages."],"earns":"You give one specific effect (a technology, body of knowledge, religion, crop, or disease) and explain how the connections caused it.","weak":"\"Ideas and diseases spread.\" This names no specific example and does not explain the link."}]},{"id":"SAQ2","type":"saq","src":"SQ2","lead":"Using the excerpt, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one piece of evidence in the excerpt that shows Hangzhou was part of a commercial economy.","skill":"Describing evidence from a source","model":"Polo's description shows that Hangzhou had a commercial economy. He says people \"use paper money as currency\" and that Hangzhou produced vast quantities of silk while merchants also imported goods from other provinces. Paper money, silk made in large amounts for sale, and imports from other provinces show goods were bought and sold across a large market, not just made for local use.","tea":["Polo's description shows that Hangzhou had a commercial economy.","He says people \"use paper money as currency\" and that Hangzhou produced vast quantities of silk while merchants also imported goods from other provinces.","Paper money, silk made in large amounts for sale, and imports from other provinces show goods were bought and sold across a large market, not just made for local use."],"earns":"You accurately describe any trade-related detail from the passage (paper money, large-scale silk production, or merchants importing goods).","weak":"\"Polo says it was a nice city.\" This is not evidence of commerce."},{"k":"B","prompt":"Explain one way that commercial innovations such as the one Polo mentions helped long-distance trade grow between 1200 and 1450.","skill":"Explaining a cause with specific evidence","model":"One way paper money helped long-distance trade grow was by making large payments easier to carry and trust. Chinese flying cash and paper money let a merchant deposit money in one city and withdraw it in another, and bills of exchange worked in a similar way. Merchants no longer had to haul heavy copper coins over dangerous routes, so they could make larger deals over longer distances, which increased trade along the Silk Roads.","tea":["One way paper money helped long-distance trade grow was by making large payments easier to carry and trust.","Chinese flying cash and paper money let a merchant deposit money in one city and withdraw it in another, and bills of exchange worked in a similar way.","Merchants no longer had to haul heavy copper coins over dangerous routes, so they could make larger deals over longer distances, which increased trade along the Silk Roads."],"earns":"You name a specific innovation (flying cash, paper money, bills of exchange, banking houses) and explain how it made long-distance trade easier or safer.","weak":"\"Money made trade easier.\" This does not name a specific innovation or explain how it helped. Also remember these credit tools were existing technologies that were improved and spread, not brand-new inventions of 1200."},{"k":"C","prompt":"Explain one way Marco Polo's point of view limits this excerpt as evidence about Chinese society.","skill":"Sourcing and point of view","model":"Polo's point of view limits this excerpt because he was a foreign merchant writing for Europeans. Polo was a Venetian merchant who visited the court of Kublai Khan and wrote about China after returning to Italy in 1295. As an outsider focused on trade, he may have exaggerated or ignored parts of Chinese society that did not interest merchants, so historians must check his account against Chinese sources.","tea":["Polo's point of view limits this excerpt because he was a foreign merchant writing for Europeans.","Polo was a Venetian merchant who visited the court of Kublai Khan and wrote about China after returning to Italy in 1295.","As an outsider focused on trade, he may have exaggerated or ignored parts of Chinese society that did not interest merchants, so historians must check his account against Chinese sources."],"earns":"You identify something specific about Polo (a merchant, a Venetian, an outsider, writing for Europeans) and explain how it could limit what the source shows.","weak":"\"He might be biased.\" This does not explain why or how his point of view matters."}]},{"id":"SAQ3","type":"saq","src":"SQ3","lead":"Using the table, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one pattern shown in the table.","skill":"Describing a pattern in a source","model":"One pattern in the table is that goods moved in both directions, with each region sending what the other lacked. Gold, ivory, and enslaved people went north across the Sahara, while salt, horses, and books went south. This shows trans-Saharan trade was a two-way exchange built on the different resources of North Africa and West Africa.","tea":["One pattern in the table is that goods moved in both directions, with each region sending what the other lacked.","Gold, ivory, and enslaved people went north across the Sahara, while salt, horses, and books went south.","This shows trans-Saharan trade was a two-way exchange built on the different resources of North Africa and West Africa."],"earns":"You accurately describe a pattern in the data (two-way exchange, salt traded for gold, or different regions supplying different goods).","weak":"\"There were many goods.\" This is not a pattern from the table."},{"k":"B","prompt":"Explain one way that technology or the environment shaped trans-Saharan trade between 1200 and 1450.","skill":"Explaining a cause with specific evidence","model":"One way technology shaped trans-Saharan trade was the camel saddle. Saddles developed by the Somalis let camels carry loads of up to about 600 pounds, and camels could travel long distances with little water. This let large caravans move heavy goods such as salt from oasis to oasis across the desert, which made regular long-distance trade possible.","tea":["One way technology shaped trans-Saharan trade was the camel saddle.","Saddles developed by the Somalis let camels carry loads of up to about 600 pounds, and camels could travel long distances with little water.","This let large caravans move heavy goods such as salt from oasis to oasis across the desert, which made regular long-distance trade possible."],"earns":"You name a specific factor (the camel saddle, camels, caravans, or oases) and explain how it made desert trade possible or bigger.","weak":"\"Camels helped.\" This does not explain how. Also avoid saying the saddle started the trade; it improved an existing trade."},{"k":"C","prompt":"Explain one effect of the growth of trans-Saharan trade on West African societies between 1200 and 1450.","skill":"Explaining an effect with specific evidence","model":"One effect of trans-Saharan trade was that it made the Mali Empire wealthy and strengthened Islam in West Africa. Mali's rulers taxed and protected the gold trade, and after Mansa Musa's 1324 pilgrimage to Mecca displayed this wealth, he built mosques and schools in Timbuktu. Timbuktu became a center of Islamic learning, which spread Islam and increased the prestige and power of Mali's rulers.","tea":["One effect of trans-Saharan trade was that it made the Mali Empire wealthy and strengthened Islam in West Africa.","Mali's rulers taxed and protected the gold trade, and after Mansa Musa's 1324 pilgrimage to Mecca displayed this wealth, he built mosques and schools in Timbuktu.","Timbuktu became a center of Islamic learning, which spread Islam and increased the prestige and power of Mali's rulers."],"earns":"You give one specific effect (Mali's rise and wealth, Mansa Musa, Timbuktu, or the spread of Islam through merchants) and connect it to the growth of trade.","weak":"\"Mali got rich.\" This does not explain how trade caused it or give specific evidence."}]},{"id":"SAQ4","type":"saq","src":"SQ4","lead":"Using the excerpt, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one purpose of Zheng He's voyages, according to the excerpt.","skill":"Describing a claim from a source","model":"One purpose of Zheng He's voyages was to show the power of the Ming Dynasty. The excerpt says the voyages \"displayed the might of the Ming Dynasty\" and brought tribute from the peoples Zheng He met. Sending more than 300 ships carrying about 28,000 people showed foreign rulers China's strength and gained tribute for the emperor.","tea":["One purpose of Zheng He's voyages was to show the power of the Ming Dynasty.","The excerpt says the voyages \"displayed the might of the Ming Dynasty\" and brought tribute from the peoples Zheng He met.","Sending more than 300 ships carrying about 28,000 people showed foreign rulers China's strength and gained tribute for the emperor."],"earns":"You name a purpose stated in the passage (displaying Ming power or collecting tribute).","weak":"\"To explore.\" The passage does not say this, and the question asks for a purpose according to the excerpt."},{"k":"B","prompt":"Explain one way earlier developments in Indian Ocean trade made voyages like Zheng He's possible.","skill":"Explaining a cause with specific evidence","model":"Earlier navigation knowledge and ship technology made voyages like Zheng He's possible. Sailors already understood the seasonal monsoon winds and used the magnetic compass, the stern rudder, and large compartmented Chinese junks, and ports such as Calicut were already established. This let the fleet time its voyages, steer across open water, and sail to existing trading ports instead of exploring from scratch.","tea":["Earlier navigation knowledge and ship technology made voyages like Zheng He's possible.","Sailors already understood the seasonal monsoon winds and used the magnetic compass, the stern rudder, and large compartmented Chinese junks, and ports such as Calicut were already established.","This let the fleet time its voyages, steer across open water, and sail to existing trading ports instead of exploring from scratch."],"earns":"You name a specific earlier development (monsoon knowledge, the compass, the astrolabe, the rudder, lateen sails, junks, or established ports) and explain how it enabled the voyages.","weak":"\"Zheng He started trade across the ocean.\" This is incorrect; Indian Ocean trade was centuries old, and Zheng He's voyages built on it."},{"k":"C","prompt":"Explain one reason the Ming government ended the voyages.","skill":"Explaining a development with specific evidence","model":"One reason the Ming government ended the voyages was Confucian opposition and their high cost. Confucian scholars distrusted foreign contact and trade, officials thought the fleets were too expensive, and Yongle's successor ended the voyages in 1433. Because the court valued China's stable, agrarian society over overseas expansion and thought the cost was not worth it, it stopped funding the fleets.","tea":["One reason the Ming government ended the voyages was Confucian opposition and their high cost.","Confucian scholars distrusted foreign contact and trade, officials thought the fleets were too expensive, and Yongle's successor ended the voyages in 1433.","Because the court valued China's stable, agrarian society over overseas expansion and thought the cost was not worth it, it stopped funding the fleets."],"earns":"You give a specific reason (Confucian opposition to foreign contact, the cost of the fleets, or the successor's policy against overseas sailing) and explain how it led to the end of the voyages.","weak":"\"They didn't want to do it anymore.\" This gives no reason and no evidence."}]},{"id":"SAQ5","type":"saq","src":"SQ5","lead":"Using the table, answer (A), (B), and (C).","parts":[{"k":"A","prompt":"Describe one difference between two of the networks shown in the table.","skill":"Describing a difference from a source","model":"One difference is that the Silk Roads were an overland network while the Indian Ocean network was a sea network. The Silk Roads mostly carried luxury goods such as silk and porcelain by caravan, while Indian Ocean ships also carried bulky goods. Ships could carry far more weight than camels, so sea trade moved a wider range of products than overland trade.","tea":["One difference is that the Silk Roads were an overland network while the Indian Ocean network was a sea network.","The Silk Roads mostly carried luxury goods such as silk and porcelain by caravan, while Indian Ocean ships also carried bulky goods.","Ships could carry far more weight than camels, so sea trade moved a wider range of products than overland trade."],"earns":"You accurately describe a difference shown in the table (terrain, transport, technology, or goods) between two named networks.","weak":"\"They were different.\" This does not name the networks or any specific difference."},{"k":"B","prompt":"Explain one similarity between the Silk Roads and the Indian Ocean trade networks in the period 1200 to 1450.","skill":"Comparison with specific evidence","model":"One similarity is that both networks produced powerful trading cities. Samarkand grew rich on the Silk Roads, and Calicut grew rich on the Indian Ocean network. Cities where routes met earned money from taxes, markets, and services for merchants, so trade built urban wealth in both networks.","tea":["One similarity is that both networks produced powerful trading cities.","Samarkand grew rich on the Silk Roads, and Calicut grew rich on the Indian Ocean network.","Cities where routes met earned money from taxes, markets, and services for merchants, so trade built urban wealth in both networks."],"earns":"You name a specific similarity (growth built on existing routes, state protection, improved technology, trading cities, diasporic merchant communities, or the spread of religions) and support it with evidence from both networks.","weak":"\"Both traded things.\" This is too general and gives no evidence from either network."},{"k":"C","prompt":"Explain one way that geography shaped the technology used on one of these networks.","skill":"Explaining a cause with specific evidence","model":"One way geography shaped technology was that the monsoon winds of the Indian Ocean shaped sailing technology. Seasonal monsoon winds led sailors to rely on the
