st ended all trade.", "why": ["The plague struck cities across Eurasia, not only Europe and the Mediterranean.", "'Alone was enough' is too strong; the passage shows stable states still lost wealth.", "", "The passage does not say Ottoman conquest ended all trade between Europe and Asia."]}, {"id": "M11", "type": "mcq", "src": "S14", "skill": "Comparison", "stem": "Which of the following cities experienced a decline most similar in cause to Constantinople's setbacks from invasion?", "options": ["Kashgar, which declined after invasion and Tamerlane's attack.", "Hangzhou, which grew as the southern end of the Grand Canal in China.", "Malacca, which grew rich from fees on ships using the busy strait.", "Timbuktu, which became a famous center of trade and Islamic learning."], "ans": 0, "exp": "Kashgar declined after conquests by nomadic invaders and was ravaged by Tamerlane in 1389–90. The other cities are examples of growth through trade.", "why": ["", "Hangzhou grew through trade, so it is not an example of decline.", "Malacca grew rich from fees, which is not a decline.", "Timbuktu grew as a center of trade and learning, which is not a decline."]}, {"id": "M12", "type": "mcq", "src": "S15", "skill": "Identifying a claim", "stem": "Which of the following best describes a claim made in the first paragraph?", "options": ["Most enslaved people were sent to farms in southern India.", "Enslaved people were sold only to buyers within East Africa.", "Merchants in northern Africa bought most enslaved people from India.", "Some enslaved people worked as sailors or soldiers in the region."], "ans": 3, "exp": "The first paragraph says some enslaved people served as sailors or soldiers. It says they were sold to buyers in northern Africa, the Middle East, and India, not only within East Africa, and it names seaports and households, not farms, as common workplaces.", "why": ["The paragraph names seaports and households as workplaces, not farms in southern India.", "They were sold to buyers in northern Africa, the Middle East, and India, not only within East Africa.", "The first paragraph does not say merchants in northern Africa bought most enslaved people from India.", ""]}, {"id": "M13", "type": "mcq", "src": "S15", "skill": "Identifying a claim", "stem": "Which of the following is a claim made in the second paragraph?", "options": ["Enslaved people lived under the same conditions as those taken to the Americas.", "Town life gave enslaved people more chances to form communities and work with free laborers.", "Enslaved people were forbidden to form communities in the cities where they lived.", "African customs and music disappeared soon after enslaved people arrived in Oman and in India."], "ans": 1, "exp": "The paragraph says living in towns and cities gave enslaved people more chances to form communities and to work alongside free laborers than those taken to the Americas. It also says African words, music, and customs survived, so the other options contradict it.", "why": ["The paragraph says conditions differed from those of people taken to the Americas.", "", "The paragraph says town life gave more chances to form communities, not that they were forbidden.", "The paragraph says African words, music, and customs survived."]}]}, {"name": "Mock Test: SAQs", "type": "saq", "sources": {"MS1": {"title": "The Sultanate of Malacca", "attr": "Adapted summary of a textbook account.", "label": "Practice source (written for practice; not a verbatim quotation).", "text": "The Sultanate of Malacca, a Muslim city-state on the Strait of Malacca, grew wealthy by charging fees on the ships that passed through the strait between India and China. Its sultans built a navy to keep the waters safe from pirates, and in the 1400s the state expanded into Sumatra and the southern Malay Peninsula. Merchants from Arabia, India, China, and Southeast Asia lived and traded in the city until the Portuguese conquered it in 1511."}, "MS2": {"title": "Why cities grew and declined", "attr": "Adapted from textbook tables.", "label": "Practice source (adapted for practice).", "table": [["Factors contributing to the growth of cities", "Factors contributing to the decline of cities"], ["Political stability and decline of invasions", "Political instability and invasions"], ["Safe and reliable transportation", "Disease"], ["Rise of commerce", "Decline of agricultural productivity"], ["Plentiful labor supply", ""], ["Increased agricultural output", ""]]}}, "questions": [{"id": "MSAQ1", "type": "saq", "src": "MS1", "lead": "Using the excerpt, answer (A), (B), and (C).", "parts": [{"k": "A", "prompt": "Describe one way Malacca's rulers used the city's location to gain wealth, according to the excerpt.", "skill": "Describing a claim from a source", "model": "Malacca's rulers used the city's location to gain wealth by charging fees on passing ships. The excerpt says the sultanate grew wealthy \"by charging fees on the ships that passed through the strait between India and China.\" Because ships traveling between India and China had to pass through the strait, the fees created a steady stream of income.", "tea": ["Malacca's rulers used the city's location to gain wealth by charging fees on passing ships.", "The excerpt says the sultanate grew wealthy \"by charging fees on the ships that passed through the strait between India and China.\"", "Because ships traveling between India and China had to pass through the strait, the fees created a steady stream of income."], "earns": "You accurately describe a way stated in the passage (fees on passing ships, or building a navy to keep the strait safe so trade would continue).", "weak": "\"They traded a lot.\" This does not describe how the location produced wealth."}, {"k": "B", "prompt": "Explain one way that knowledge of the monsoon winds contributed to the growth of trading cities such as Malacca between 1200 and 1450.", "skill": "Explaining a cause with specific evidence", "model": "Knowledge of th function distractors(card,n,field){
  const target=card[field];
  const tiers=[ALL.filter(c=>c!==card&&c.sec===card.sec),ALL.filter(c=>c!==card&&c.deck===card.deck&&c.sec!==card.sec),ALL.filter(c=>c.deck!==card.deck)];
  const out=[];
  for(let ti=0;ti<tiers.length;ti++){
    const cand=shuf(tiers[ti]);
    const close=cand.filter(c=>{const r=c[field].length/target.length;return r>=0.7&&r<=1.3;});
    const rest=cand.filter(c=>close.indexOf(c)<0);
    const ord=close.concat(rest);
    for(let k=0;k<ord.length;k++){const c=ord[k];if(out.length>=n)break;if(c[field]!==target&&!out.some(o=>o[field]===c[field]))out.push(c);}
    if(out.length>=n)break;
  }
  return out;
}

ACT.resetall=()=>{if(!ask("Reset EVERYTHING: study progress, lessons, and the whole practice test?"))return;SAVE.known={};SAVE.trouble={};SAVE.done={};SAVE.li=0;UI.L=null;FC=null;if(typeof PTreset==='function')PTreset();save();render();};

'use strict';
const PT={sec:0,secs:[],timerOn:false,elapsed:0,iv:null,retest:null,msg:'',intro:{},shuffled:false};
const newSt=()=>({elim:[],visited:false,checked:false,sel:null,correct:null,flag:false,ans:{A:'',B:'',C:''},revealed:false,parts:{A:null,B:null,C:null}});
D.practice.sections.forEach(s=>{
  const sec={name:s.name,type:s.type,sources:s.sources,qs:s.questions,byId:{},cur:0,st:{},oo:{}};
  sec.qs.forEach(q=>{sec.byId[q.id]=q;sec.st[q.id]=newSt();if(q.options)sec.oo[q.id]=[0,1,2,3];});
  sec.orig=sec.qs.map(q=>q.id);sec.order=sec.orig.slice();PT.secs.push(sec);
});
const TIPS_MCQ=['Read the question stem before the source so you know what you are looking for.','For "best used as evidence of" or "best illustrates" questions, first name the idea the source shows (cause, effect, continuity, change, connection between regions), then pick the option that matches that idea.','Eliminate options that are true in history but not shown by the source, or that belong to the wrong time or region.','Watch for extreme words ("only," "all," "first," "created," "ended," "every"): they are usually wrong.','For "claim" or "evidence the author uses" questions, the answer must be stated or directly supported in the text. Do not use outside knowledge to pick it.','For point-of-view questions, ask who wrote it, when, for whom, and why.'];
const TIPS_SAQ=['Use TEA for every part: T = Topic sentence (answer the question directly, restating its words), E = Evidence (a specific person, place, term, date, or detail from the source or your knowledge), A = Analysis (explain how that evidence proves your topic sentence, using "which led to," "because," or "this allowed").','Label your answers A, B, and C and write in complete sentences. No introduction or thesis.','Each part is worth 1 point. Name a specific, accurate piece of evidence (a person, place, term, date, or technology), then explain how it connects to what the question asks.','"Describe" means give accurate details. "Explain" means show how or why, using a link such as "which led to," "because," or "this allowed."','Stay inside 1200 to 1450 unless the question says otherwise.','Sentence frame: "One way ___ was ___. For example, ___. This mattered because ___."','Aim for about 13 minutes per SAQ on the real test: about 1 to plan and 12 to write.','Self-check before you reveal the answer: Did I give a specific example, not just a general idea? Did I explain the connection? Is it the right time and place? Did I answer the exact verb (describe or explain)?'];
const TIPS_MOCK_M=['Treat this like the real test: turn the Timer on, leave Shuffle off, and work through all 13 questions without looking anything up.','Aim for about one minute per question. Mark hard ones with Flag for review and come back.','You can check answers as you go or at the end; checking only at the end is closer to real test conditions.','When you finish, do the "Mock Test: SAQs" tab (about 13 minutes per SAQ), then use Retest Missed Questions on each tab.'];
const TIPS_MOCK_S=['Turn the Timer on and give yourself about 13 minutes per SAQ (1 to plan and 12 to write).','Write complete sentences for A, B, and C, and only then click Check Answer.'];
function ul(a){return '<ol>'+a.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>';}
function introHTML(sec){
  const mock=/Mock/.test(sec.name),saq=sec.type==='saq';
  const title=mock?'How to take this mock test':(saq?'How to answer these':'How to attack these questions');
  const open=!!PT.intro[sec.name];
  let h='<div class="intro"><button class="lnk" data-act="ptintro">'+(open?'▾ ':'▸ ')+title+'</button>';
  if(open){if(mock)h+=ul(saq?TIPS_MOCK_S:TIPS_MOCK_M);h+=(mock?'<p><b>Question tips</b></p>':'')+ul(saq?TIPS_SAQ:TIPS_MCQ);}
  return h+'</div>';
}
function fmt(s){const m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function status(q,s){
  if(q.type==='mcq'){if(s.checked)return s.correct?'ok':'bad';return s.visited?'vis':'new';}
  const p=['A','B','C'].map(k=>s.parts[k]);
  if(p.every(v=>v!==null))return p.every(v=>v===true)?'ok':'bad';
  return s.visited?'vis':'new';
}
function curView(){
  const sec=PT.secs[PT.sec],R=(PT.retest&&PT.retest.sec===PT.sec)?PT.retest:null;
  return {sec:sec,R:R,ids:R?R.ids:sec.order,st:R?R.st:sec.st,h:R||sec};
}
function secScore(sec,ids,st){
  if(sec.type==='saq'){let p=0;ids.forEach(id=>{['A','B','C'].forEach(k=>{if(st[id].parts[k]===true)p++;});});return p+' of '+(ids.length*3)+' points';}
  let ok=0,ch=0;ids.forEach(id=>{if(st[id].checked){ch++;if(st[id].correct)ok++;}});return ok+' correct of '+ch+' checked';
}
function srcHTML(s){
  if(!s)return '';
  let h='<div class="src"><div class="stitle">'+esc(s.title)+'</div><div class="sattr">'+esc(s.attr)+'</div>'+(s.label?'<div class="slab">'+esc(s.label)+'</div>':'');
  if(s.img&&D.images&&D.images[s.img.replace('map_','')])h+='<img class="srcimg" alt="'+esc(s.title)+'" src="'+D.images[s.img.replace('map_','')]+'">';
  if(s.table)h+='<div style="overflow-x:auto"><table class="gt">'+s.table.map((r,i)=>'<tr>'+r.map(c=>i?'<td>'+esc(c)+'</td>':'<th>'+esc(c)+'</th>').join('')+'</tr>').join('')+'</table></div>';
  else if(s.paras)h+=s.paras.map((p,i)=>'<p class="stext"><span class="pn">Paragraph '+(i+1)+'</span> '+esc(p)+'</p>').join('');
  else h+='<p class="stext">'+esc(s.text)+'</p>';
  return h+'</div>';
}
function ptHTML(){
  const v=curView(),sec=v.sec,ids=v.ids,st=v.st,hd=v.h;
  if(hd.cur>=ids.length)hd.cur=Math.max(0,ids.length-1);
  const id=ids[hd.cur],q=sec.byId[id],s=st[id];s.visited=true;
  let h='<div class="ptbar"><div class="subtabs">'+PT.secs.map((x,i)=>'<button class="stab '+(i===PT.sec?'on':'')+'" data-act="ptsec" data-i="'+i+'">'+esc(x.name)+'</button>').join('')+'</div>';
  h+='<div class="ptctl"><button class="btn sec" data-act="pttimer">Timer: '+(PT.timerOn?'On':'Off')+'</button>'+(PT.timerOn?'<span id="pttime" class="score">'+fmt(PT.elapsed)+'</span>':'')+'<button class="btn sec" data-act="ptshuffle">Shuffle questions'+(PT.shuffled?' ✓':'')+'</button><button class="btn sec" data-act="ptunshuffle">Reset to original order</button><button class="btn sec" data-act="ptretest">Retest missed questions</button><button class="btn sec" data-act="ptprint">Print view</button><button class="btn sec" data-act="ptresetsec">Reset section</button><button class="btn sec" data-act="ptresetall">Reset entire test</button></div>'+(PT.msg?'<p class="msg">'+esc(PT.msg)+'</p>':'')+'</div>';
  PT.msg='';
  h+='<div class="panel"><div class="rtop"><h2>'+esc(sec.name)+'</h2><span class="score">'+secScore(sec,ids,st)+'</span></div>';
  if(v.R){const done=ids.filter(i=>status(sec.byId[i],st[i])==='ok').length;h+='<div class="banner">Retest round: '+done+' of '+ids.length+' now correct. <button class="lnk" data-act="ptendretest">Back to the full section</button></div>';}
  h+=introHTML(sec);
  h+='<div class="pals">'+ids.map((x,n)=>'<button class="pal '+status(sec.byId[x],st[x])+(n===hd.cur?' cur':'')+(st[x].flag?' flag':'')+'" data-act="ptjump" data-n="'+n+'">'+(n+1)+'</button>').join('')+'</div>';
  h+=srcHTML(sec.sources[q.src]);
  const nav='<button class="btn sec" data-act="ptprev"'+(hd.cur===0?' disabled':'')+'>Previous</button><button class="btn sec" data-act="ptflag">'+(s.flag?'Unflag':'Flag for review')+'</button><button class="btn sec" data-act="ptnext"'+(hd.cur>=ids.length-1?' disabled':'')+'>Next</button>';
  if(q.type==='mcq'){
    h+='<div class="qtitle">Question '+(hd.cur+1)+' of '+ids.length+'</div><div class="stem">'+esc(q.stem)+'</div><div class="opts">';
    s.elim=s.elim||[];sec.oo[id].forEach((oi,pos)=>{let c='opt';const ex=s.elim.indexOf(oi)>=0;if(s.checked){if(oi===q.ans)c+=' ok';else if(oi===s.sel)c+=' bad';}else if(oi===s.sel&&!ex)c+=' sel';h+='<div class="optrow'+(ex?' cxrow':'')+'">'+(s.checked?'':'<button class="elimb'+(ex?' on':'')+'" data-act="ptelim" data-o="'+oi+'" title="'+(ex?'Bring this choice back':'Cross this choice off')+'" aria-label="'+(ex?'Restore':'Cross off')+' choice '+'ABCD'[pos]+'">✕</button>')+'<button class="'+c+(ex?' cx':'')+'" data-act="ptopt" data-o="'+oi+'"'+(s.checked||ex?' disabled':'')+'><b>'+'ABCD'[pos]+'.</b> '+esc(q.options[oi])+'</button></div>';});
    h+='</div><div class="row"><button class="btn" data-act="ptcheck"'+(s.sel===null||s.checked?' disabled':'')+'>Check Answer</button>'+nav+'</div>';
    if(s.checked){const od=sec.oo[id].map(oi=>({t:q.options[oi],ok:oi===q.ans,why:oi===q.ans?'':(q.why&&q.why[oi])||''}));h+='<div class="fb '+(s.correct?'okbox':'badbox')+'"><b>'+(s.correct?'Correct.':'Incorrect.')+'</b> <span class="skill">Skill: '+esc(q.skill)+'</span></div>'+whyHTML(od,sec.oo[id].indexOf(s.sel),esc(q.exp));}
  }else{
    h+='<div class="qtitle">SAQ '+(hd.cur+1)+' of '+ids.length+'</div><p>'+esc(q.lead)+'</p>';
    q.parts.forEach(p=>{
      h+='<div class="part"><div class="pl"><b>('+p.k+')</b> '+esc(p.prompt)+'</div><textarea rows="4" data-ans="'+p.k+'" placeholder="Write your answer in complete sentences...">'+esc(s.ans[p.k])+'</textarea>';
      if(s.revealed){h+='<div class="fb badbox" style="background:var(--accbg);border-color:var(--acc)"><div class="skill">Skill: '+esc(p.skill)+'</div><div><b>Model answer (TEA):</b><div class="tea"><div><span class="tk">T</span><span><b>Topic sentence:</b> '+esc(p.tea[0])+'</span></div><div><span class="tk">E</span><span><b>Evidence:</b> '+esc(p.tea[1])+'</span></div><div><span class="tk">A</span><span><b>Analysis:</b> '+esc(p.tea[2])+'</span></div></div></div><div><b>Earns the point if:</b> '+esc(p.earns)+'</div><div><b>A weak answer to avoid:</b> '+esc(p.weak)+'</div><div class="mark">Self-mark: <button class="mk '+(s.parts[p.k]===true?'on ok':'')+'" data-act="ptmark" data-p="'+p.k+'" data-v="1">I got it right</button><button class="mk '+(s.parts[p.k]===false?'on bad':'')+'" data-act="ptmark" data-p="'+p.k+'" data-v="0">I got it wrong</button></div></div>';}
      h+='</div>';
    });
    h+='<div class="row"><button class="btn" data-act="ptcheck"'+(s.revealed?' disabled':'')+'>Check Answer</button>'+nav+'</div>';
  }
  return h+'</div>';
}
function PTinput(t){const v=curView(),id=v.ids[v.h.cur];v.st[id].ans[t.dataset.ans]=t.value;PTsave();}
function cur3(){const v=curView(),id=v.ids[v.h.cur];return {v:v,id:id,q:v.sec.byId[id],s:v.st[id]};}
function syncMain(){
  const R=PT.retest;if(!R||R.sec!==PT.sec)return;const sec=PT.secs[R.sec],c=cur3(),m=sec.st[c.id],r=R.st[c.id];
  if(c.q.type==='mcq'){if(r.checked&&r.correct){m.checked=true;m.correct=true;m.sel=c.q.ans;}}
  else if(['A','B','C'].every(k=>r.parts[k]===true)){m.revealed=true;m.parts={A:true,B:true,C:true};}
}
ACT.ptsec=t=>{PT.sec=Number(t.dataset.i);render();};
ACT.ptintro=()=>{const n=PT.secs[PT.sec].name;PT.intro[n]=!PT.intro[n];render();};
ACT.ptjump=t=>{const v=curView();v.h.cur=Number(t.dataset.n);render();};
ACT.ptprev=()=>{const v=curView();if(v.h.cur>0)v.h.cur--;render();};
ACT.ptnext=()=>{const v=curView();if(v.h.cur<v.ids.length-1)v.h.cur++;render();};
ACT.ptopt=t=>{const c=cur3();const o=Number(t.dataset.o);if(!c.s.checked&&(c.s.elim||[]).indexOf(o)<0)c.s.sel=o;render();};
ACT.ptelim=t=>{const c=cur3();if(c.s.checked)return;const o=Number(t.dataset.o);c.s.elim=c.s.elim||[];const p=c.s.elim.indexOf(o);if(p>=0)c.s.elim.splice(p,1);else{c.s.elim.push(o);if(c.s.sel===o)c.s.sel=null;}render();};
ACT.ptcheck=()=>{const c=cur3();if(c.q.type==='mcq'){if(c.s.sel===null||c.s.checked)return;c.s.checked=true;c.s.correct=(c.s.sel===c.q.ans);}else{c.s.revealed=true;}syncMain();render();};
ACT.ptmark=t=>{const c=cur3();c.s.parts[t.dataset.p]=(t.dataset.v==='1');syncMain();render();};
ACT.ptflag=()=>{const c=cur3();c.s.flag=!c.s.flag;render();};
ACT.ptshuffle=()=>{PT.secs.forEach(sec=>{sec.order=shuf(sec.orig);sec.cur=0;sec.qs.forEach(q=>{if(q.options)sec.oo[q.id]=shuf([0,1,2,3]);});});PT.shuffled=true;render();};
ACT.ptunshuffle=()=>{PT.secs.forEach(sec=>{sec.order=sec.orig.slice();sec.cur=0;sec.qs.forEach(q=>{if(q.options)sec.oo[q.id]=[0,1,2,3];});});PT.shuffled=false;render();};
function freshSec(sec){sec.qs.forEach(q=>{sec.st[q.id]=newSt();});sec.cur=0;}
ACT.ptresetsec=()=>{freshSec(PT.secs[PT.sec]);if(PT.retest&&PT.retest.sec===PT.sec)PT.retest=null;render();};
ACT.ptresetall=()=>{if(!ask('Reset the entire practice test?'))return;PT.secs.forEach(freshSec);PT.retest=null;PT.elapsed=0;render();};
ACT.ptretest=()=>{
  const sec=PT.secs[PT.sec],ids=sec.order.filter(id=>status(sec.byId[id],sec.st[id])==='bad');
  if(!ids.length){PT.msg='No missed questions in this section yet. Check some answers first.';render();return;}
  const st={};ids.forEach(id=>{st[id]=newSt();});PT.retest={sec:PT.sec,ids:ids,st:st,cur:0};render();
};
ACT.ptendretest=()=>{PT.retest=null;render();};
ACT.pttimer=()=>{PT.timerOn=!PT.timerOn;clearInterval(PT.iv);if(PT.timerOn)PT.iv=setInterval(()=>{PT.elapsed++;const e=document.getElementById('pttime');if(e)e.textContent=fmt(PT.elapsed);if(PT.elapsed%5===0)PTsave();},1000);render();};
ACT.ptprint=()=>{
  const sec=PT.secs[PT.sec],seen={};let b='';
  sec.order.forEach((id,n)=>{const q=sec.byId[id];if(!seen[q.src]){seen[q.src]=1;b+=srcHTML(sec.sources[q.src]);}
    if(q.type==='mcq')b+='<div class="q"><b>'+(n+1)+'.</b> '+esc(q.stem)+sec.oo[id].map((oi,pos)=>'<div>'+'ABCD'[pos]+'. '+esc(q.options[oi])+'</div>').join('')+'</div>';
    else b+='<div class="q"><b>SAQ '+(n+1)+'.</b> '+esc(q.lead)+q.parts.map(p=>'<p>('+p.k+') '+esc(p.prompt)+'</p><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div>').join('')+'</div>';});
  const w=window.open('','_blank');
  if(!w){PT.msg='Your browser blocked the print window. Allow pop-ups and try again.';render();return;}
  w.document.write('<html><head><title>'+esc(sec.name)+'</title><style>body{font:14px Georgia,serif;margin:24px;line-height:1.45}.src{border:1px solid #888;padding:8px;margin:12px 0}.stitle{font-weight:bold}.sattr,.slab{font-size:12px;color:#444}.q{margin:14px 0}.ln{border-bottom:1px solid #999;height:24px}table{border-collapse:collapse}td,th{border:1px solid #888;padding:4px 8px}</style></head><body><h2>AP World History · Unit 2 · '+esc(sec.name)+'</h2>'+b+'</body></html>');
  w.document.close();w.focus();setTimeout(()=>w.print(),300);
};
/* ---------- persistence ---------- */
const PTK='apw_unit2_pt_v1';
function PTpack(){return {sec:PT.sec,timerOn:PT.timerOn,elapsed:PT.elapsed,shuffled:PT.shuffled,intro:PT.intro,
  secs:PT.secs.map(s=>({name:s.name,order:s.order,cur:s.cur,st:s.st,oo:s.oo})),
  retest:PT.retest?{sec:PT.retest.sec,ids:PT.retest.ids,st:PT.retest.st,cur:PT.retest.cur}:null};}
function PTsave(){try{localStorage.setItem(PTK,JSON.stringify(PTpack()));}catch(e){}}
function PTload(o){
  try{
    if(!o||!o.secs)return;
    o.secs.forEach(x=>{const s=PT.secs.find(y=>y.name===x.name);if(!s)return;
      if(Array.isArray(x.order)&&x.order.length===s.orig.length&&x.order.every(id=>s.byId[id]))s.order=x.order;
      if(typeof x.cur==='number')s.cur=Math.min(Math.max(0,x.cur),s.order.length-1);
      s.qs.forEach(q=>{const st=x.st&&x.st[q.id];if(st&&typeof st==='object')s.st[q.id]=Object.assign(newSt(),st,{ans:Object.assign({A:'',B:'',C:''},st.ans||{}),parts:Object.assign({A:null,B:null,C:null},st.parts||{})});
        const oo=x.oo&&x.oo[q.id];if(q.options&&Array.isArray(oo)&&oo.length===4)s.oo[q.id]=oo;});});
    if(typeof o.sec==='number'&&PT.secs[o.sec])PT.sec=o.sec;
    PT.shuffled=!!o.shuffled;PT.intro=o.intro||{};PT.elapsed=Number(o.elapsed)||0;
    PT.retest=null;
    if(o.retest&&PT.secs[o.retest.sec]&&Array.isArray(o.retest.ids)){const rs=PT.secs[o.retest.sec];if(o.retest.ids.every(id=>rs.byId[id])){PT.retest={sec:o.retest.sec,ids:o.retest.ids,st:{},cur:o.retest.cur||0};o.retest.ids.forEach(id=>{PT.retest.st[id]=Object.assign(newSt(),o.retest.st[id]||{});});}}
    if(o.timerOn&&!PT.timerOn){PT.timerOn=true;PT.iv=setInterval(()=>{PT.elapsed++;const e=document.getElementById('pttime');if(e)e.textContent=fmt(PT.elapsed);if(PT.elapsed%5===0)PTsave();},1000);}
  }catch(e){}
}
function PTreset(){PT.secs.forEach(s=>{s.qs.forEach(q=>{s.st[q.id]=newSt();if(q.options)s.oo[q.id]=[0,1,2,3];});s.order=s.orig.slice();s.cur=0;});PT.retest=null;PT.elapsed=0;PT.shuffled=false;PT.sec=0;PTsave();}
try{const r=localStorage.getItem(PTK);if(r)PTload(JSON.parse(r));}catch(e){}
render();

</script></body></html>
