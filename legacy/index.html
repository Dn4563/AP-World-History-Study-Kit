<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP World Unit 2 Study Kit</title><style>*{box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2233;--mut:#5d6779;--line:#d8deea;--acc:#2f6fdb;--accbg:#e8f0fd;--ok:#2e9d57;--okbg:#e4f6ea;--bad:#d64545;--badbg:#fdeaea;--warn:#d99a00;--warnbg:#fff6d9;--gray:#cfd4de}

@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#12161f;--card:#1b2230;--ink:#e8ecf4;--mut:#9aa6bb;--line:#2c3547;--acc:#5b93f0;--accbg:#1f2c47;--ok:#3fb56b;--okbg:#17301f;--bad:#e56a6a;--badbg:#3a1d1d;--warn:#e8b32a;--warnbg:#3a3014;--gray:#3a4357}}

#app{max-width:1000px;margin:0 auto;padding:0 14px 70px}
header{padding:18px 0 8px}.lab{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}

.meter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.92rem}.bar{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
button{font:inherit;color:inherit}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.tcard{border-left:5px solid var(--acc);background:var(--bg);border-radius:8px;padding:10px 12px;margin:8px 0}.tt{font-weight:700}.hook{color:var(--mut);font-size:.9rem;margin-top:4px}
.rtop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.rtop b{flex:1}.timer{font-weight:700;color:var(--warn)}
.qask{color:var(--mut);font-size:.9rem}.qprompt{font-size:1.05rem;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}.opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--accbg)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:10px;padding:10px 14px;margin:12px 0}.okbox{background:var(--okbg);border:1px solid var(--ok)}.badbox{background:var(--badbg);border:1px solid var(--bad)}.skill{color:var(--mut);font-size:.85rem;margin-right:8px}
.big{font-size:1.3rem;font-weight:700}.rev{border-top:1px solid var(--line);padding:10px 0}.exp{color:var(--mut);font-size:.92rem}.row{display:flex;gap:8px;flex-wrap:wrap}
.gt{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0}.gt td,.gt th{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left}.gterm{font-weight:600;width:28%}.gt th{background:var(--accbg)}

.ctl{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 12px;font-size:.9rem}select,input[type=number],textarea{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}textarea{width:100%}
.form label{display:flex;gap:8px;align-items:center;margin:8px 0}.form .grp{display:flex;flex-wrap:wrap;gap:12px}
.ptbar{margin:8px 0}.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.stab{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}.stab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ptctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ptctl .btn{padding:5px 11px;font-size:.82rem;margin:0}
.pals{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pal{position:relative;width:36px;height:36px;border-radius:8px;border:2px solid transparent;cursor:pointer;font-weight:600}
.pal.new{background:var(--gray)}.pal.vis{background:var(--card);border-color:var(--warn)}.pal.ok{background:var(--ok);color:#fff}.pal.bad{background:var(--bad);color:#fff}.pal.cur{box-shadow:0 0 0 3px var(--ink)}.pal.flag::after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:.8rem;color:var(--warn);text-shadow:0 0 2px #000}

.qtitle{font-weight:700;margin:6px 0}.stem{margin:6px 0 10px;font-size:1.02rem}.part{margin:12px 0}.pl{margin-bottom:6px}.mark{margin-top:6px}.mk{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:8px;cursor:pointer;margin-right:6px}.mk.on.ok{background:var(--ok);color:#fff}.mk.on.bad{background:var(--bad);color:#fff}
.banner{background:var(--accbg);border:1px solid var(--acc);padding:8px 12px;border-radius:8px;margin:8px 0}.msg{color:var(--warn);font-size:.9rem}
.score{font-weight:700}.intro{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:8px 0;font-size:.92rem}

@import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap");
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;text-wrap:balance}
.label{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tabs{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:max-content;max-width:100%;margin:8px 0}
.tab{border:0;background:none;border-radius:999px;font-weight:700;padding:8px 16px;white-space:nowrap}
@media(max-width:560px){.tab{padding:8px 10px;font-size:.92rem}}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 14px}
.lbox{padding:14px 18px}.lbox .bar{margin-top:8px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.lbox .qmeta{margin:0}
.btn.small{padding:5px 11px;font-size:.85rem;margin:0}
.lmap{margin-top:12px;display:grid;gap:14px}.lmap .chips{padding:6px 0 0}.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.deck-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}.deck-sub{color:var(--mut);margin:6px 0 16px;max-width:65ch}
.chain{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}.chain ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chain li{display:flex;align-items:center;gap:6px}.chain li span{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.9rem}.chain li+li::before{content:"→";color:var(--mut)}
.rows{border-top:1px solid var(--line)}.lrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 16px;padding:11px 0;border-bottom:1px solid var(--line)}.lrow .t{font-weight:700}.lrow .hook{display:block;margin-top:4px;font-size:.88rem;color:var(--acc)}

.qbox .opts{display:grid;gap:8px}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}.explain .okc{color:var(--ok)}.explain .noc{color:var(--bad)}
.kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.72rem;color:var(--mut);text-align:center;margin-top:-4px}
.scorebig{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.6rem;font-weight:800}
.missed{display:grid;gap:8px;margin-top:14px}.missed div{border-left:3px solid var(--bad);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0;font-size:.93rem}
.watch b{display:block;margin-bottom:2px}
.tea{display:grid;gap:6px;margin:6px 0 8px}.tea>div{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}.tk{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;background:var(--acc);color:#fff;border-radius:6px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:.78rem;margin-top:1px}
.gk{width:1%;white-space:nowrap}.know{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:.78rem;cursor:pointer}.know[aria-pressed=true]{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}.chip small{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.7rem;opacity:.8}

.optrow{display:flex;gap:6px;align-items:stretch}.optrow>.opt,.optrow>.lopt{flex:1;min-width:0}
.elimb{flex:none;width:34px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;cursor:pointer;font-size:.9rem}.elimb:hover{color:var(--bad);border-color:var(--bad)}.elimb.on{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.cx{opacity:.5;text-decoration:line-through}.cxrow .elimb{opacity:1}
.why{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.95rem}.badw{background:var(--badbg);border:1px solid var(--bad)}.goodw{background:var(--okbg);border:1px solid var(--ok)}

bf8Aflf8KP7L07/nwtv+/K/4Uf2Xp3/Phbf9+V/wo/svTv8Anwtv+/K/4Uf2Xp3/AD4W3/flf8KP7L07/nwtv+/K/wCFH9l6d/z4W3/flf8ACj+y9O/58Lb/AL8r/hR/Zenf8+Ft/wB+V/wo/svTv+fC2/78r/hR/Zenf8+Ft/35X/Cj+y9O/wCfC2/78r/hR/Zenf8APhbf9+V/wo/svTv+fC2/78r/AIUf2Xp3/Phbf9+V/wAKP7L07/nwtv8Avyv+FH9l6d/z4W3/AH5X/Cj+y9O/58Lb/vyv+FH9l6d/z4W3/flf8KP7L07/AJ8Lb/vyv+FH9l6d/wA+Ft/35X/Cj+y9O/58Lb/vyv8AhR/Zenf8+Ft/35X/AAo/svTv+fC2/wC/K/4Uf2Xp3/Phbf8Aflf8KP7L07/nwtv+/K/4Uf2Xp3/Phbf9+V/wo/svTv8Anwtv+/K/4Uf2Xp3/AD4W3/flf8KP7L07/nwtv+/K/wCFH9l6d/z4W3/flf8ACj+y9O/58Lb/AL8r/hR/Zenf8+Ft/wB+V/wo/svTv+fC2/78r/hR/Zenf8+Ft/35X/ClXS9OLD/QLbr/AM8V/wAK6bwxa29vFIIII4hv6IgXt7Vv1//Z"}, "decks": [{"id": 1, "name": "Silk Roads and Commercial Growth", "color": "#2F6FDB", "sections": [{"id": "1A", "name": "Why trade grew", "cards": [{"term": "Intensification", "def": "After 1200, existing routes carried more trade over greater distances; the routes themselves were centuries old (revived by Arab merchants in the 8th and 9th centuries).", "hook": "Same roads, bigger flow."}, {"term": "Mongol stability", "def": "The textbook's most significant cause of Silk Road growth: the Mongols united the routes under one authority that respected merchants, enforced laws, improved roads, and punished bandits.", "hook": "Safe roads, more trade."}, {"term": "Luxury goods demand", "def": "Elites in Europe, Africa, and Asia wanted silk, porcelain, spices, and fine textiles, so artisans expanded production for export.", "hook": "Status symbols drive supply."}, {"term": "Crusades (effect on demand)", "def": "Crusaders returned to Europe with eastern fabrics and spices, raising European demand for Asian luxury goods.", "hook": "Knights came home wanting silk."}, {"term": "Caravan", "def": "A group of merchants and animals traveling together with guides; safer than traveling alone.", "hook": "Safety in numbers."}, {"term": "Camel saddle (Silk Roads)", "def": "Travelers learned to design saddles that greatly increased the weight camels could carry.", "hook": "Better saddle, bigger load."}]}, {"id": "1B", "name": "Commercial innovations", "cards": [{"term": "Caravanserai", "def": "A roadside inn (Persian for caravan plus palace) with stalls for animals and rooms and storage for travelers; made travel safer and cheaper.", "hook": "Caravan plus palace."}, {"term": "Money economy", "def": "An economy that uses money instead of barter with goods like cowrie shells or salt; China had long had one.", "hook": "Money, not barter."}, {"term": "Flying cash", "def": "Chinese credit system: deposit paper money in one place and withdraw the same amount elsewhere, because copper coins were too heavy to carry for big trades.", "hook": "Cash that flies to another city."}, {"term": "Paper money", "def": "Currency in paper form, first used in China, which eased large transactions.", "hook": "Light enough to carry."}, {"term": "Bill of exchange", "def": "A document promising payment of a set amount on a set date, letting merchants move money without carrying coins.", "hook": "An IOU that travels."}, {"term": "Banking house", "def": "A precursor to modern banks where bills and credit were handled; European banking houses appeared in the 1300s.", "hook": "Where the IOU gets cashed."}, {"term": "Improved, not invented", "def": "Caravanserai, credit, and paper money all existed before 1200; the key point is that they were improved and spread.", "hook": "Upgrades, not inventions."}]}, {"id": "1C", "name": "Cities and production", "cards": [{"term": "Kashgar", "def": "Oasis city at the western edge of China where northern and southern Silk Road routes met; river water fed crops; once Buddhist, it became a center of Islamic scholarship; ravaged by Tamerlane in 1389–90.", "hook": "Kashgar is the crossroads of China."}, {"term": "Samarkand", "def": "Trading city in present-day Uzbekistan between China and the Mediterranean; religiously diverse; known for artisans, mosques, and Islamic learning.", "hook": "Stalls and scholars."}, {"term": "Proto-industrialization", "def": "Rising demand pushed China to expand iron, steel, and porcelain production for trade.", "hook": "China's forges heat up."}, {"term": "Luxury production centers", "def": "Chinese silk and porcelain and Persian and Indian textiles all expanded for export.", "hook": "China, Persia, India supply."}]}]}, {"id": 2, "name": "The Mongol Empire", "color": "#D64545", "sections": [{"id": "2A", "name": "Rise and methods", "cards": [{"term": "Temujin / Genghis Khan", "def": "Mongol leader (born 1162) elected \"ruler of all\" at the 1206 kuriltai; united the clans and promoted talent over family. Also spelled Chinggis.", "hook": "Temujin becomes \"ruler of all.\""}, {"term": "Kuriltai", "def": "A meeting of Mongol chieftains; the one in 1206 elected Temujin khan.", "hook": "Council of chiefs."}, {"term": "Khan / khanate", "def": "A khan is a king; a khanate is his kingdom.", "hook": "Khan king, khanate kingdom."}, {"term": "Mongol warfare", "def": "Skilled horse archers, strict discipline, feigned retreats, terror, and terrain mapping; the Mongols also adopted conquered peoples' technology.", "hook": "Fast, fierce, borrowed tech."}, {"term": "Siege weapons", "def": "Portable towers and catapults used against walled fortifications, built with the help of captured Chinese and Persian engineers.", "hook": "Walls fall to borrowed machines."}, {"term": "Mongol motive", "def": "The Mongols coveted the wealth of neighbors nearer the Silk Roads (silk, gold) and recruited skilled captives such as craftworkers, miners, and scribes.", "hook": "Follow the luxury."}]}, {"id": "2B", "name": "Four khanates", "cards": [{"term": "Yuan Dynasty", "def": "Kublai Khan's Chinese dynasty (1271–1368); more Chinese in style, rebuilt the capital as Dadu, tolerated many religions; ended by the Ming.", "hook": "Yuan is China."}, {"term": "Il-khanate", "def": "Khanate in Persia and Southwest Asia founded by Hulegu; Persians served as officials; the Mongols there later converted to Islam.", "hook": "Il-khanate is Persia."}, {"term": "Golden Horde", "def": "Western khanate under Batu that conquered Russia and destroyed Kiev in 1240; ruled through Russian princes who paid tribute; lasted longest.", "hook": "Golden Horde is Russia."}, {"term": "Chagatai Khanate", "def": "Central Asian khanate that stayed the most traditionally Mongol.", "hook": "Chagatai is Central Asia."}, {"term": "Kublai Khan", "def": "Genghis Khan's grandson; Great Khan from 1260; founded the Yuan; welcomed foreigners such as Marco Polo.", "hook": "Kublai, the Chinese-style khan."}, {"term": "Hulegu", "def": "Genghis Khan's grandson who destroyed Baghdad in 1258 and killed the caliph.", "hook": "Hulegu equals Baghdad."}, {"term": "Indirect rule", "def": "The Golden Horde ruled northern Russia through existing Russian princes who sent regular tribute.", "hook": "Rule through locals."}]}, {"id": "2C", "name": "Pax Mongolica and transfers", "cards": [{"term": "Pax Mongolica", "def": "\"Mongol Peace\" (c. 1250–1350): safer routes, maintained roads, punished banditry, and religious tolerance boosted trade.", "hook": "Peace pays."}, {"term": "Yam", "def": "Mongol relay messenger system that linked the far reaches of the empire.", "hook": "Mongol pony express."}, {"term": "Religious tolerance", "def": "Genghis Khan and Kublai Khan allowed many religions, unusual in the 13th century and helpful to trade.", "hook": "Tolerate and trade."}, {"term": "Greco-Islamic medical knowledge", "def": "Greek medicine, advanced by Islamic scholars such as Ibn Sina, reached Western Europe through Mongol-era contact.", "hook": "Greek to Islamic to Europe."}, {"term": "Numbering systems", "def": "Hindu-Arabic numerals, which began in India, reached Europe.", "hook": "\"Arabic\" numbers began in India."}, {"term": "Uyghur script", "def": "Writing system adapted to represent the Mongol language and used to help run the empire.", "hook": "Uyghur letters, Mongol words."}]}, {"id": "2D", "name": "Decline", "cards": [{"term": "Causes of Mongol decline", "def": "Succession disputes, vast distances, assimilation into local cultures, the Black Death, failed expansion (Japan, Java, others), and revolts.", "hook": "Too big, too split."}, {"term": "Foreign officials (Yuan grievance)", "def": "Yuan rulers hired foreigners, dismantled the civil service exams, and stayed apart from the Chinese, angering the scholar-gentry.", "hook": "Locals shut out."}, {"term": "White Lotus Society", "def": "Secret society that organized against Yuan rule in the 1350s.", "hook": "White Lotus, rebel network."}, {"term": "Zhu Yuanzhang", "def": "Buddhist monk from a poor peasant family who led the revolt that overthrew the Yuan in 1368 and founded the Ming.", "hook": "Peasant monk topples khan."}, {"term": "Tamerlane (Timur)", "def": "Conqueror who took over Central Asian territories around 1369 and ravaged Kashgar in 1389–90.", "hook": "Timur takes Central Asia."}, {"term": "Mongol legacy", "def": "Largest continuous land empire in history; both destructive and connecting; spread ideas of centralized government.", "hook": "Destroyers AND connectors."}]}]}, {"id": 3, "name": "The Indian Ocean", "color": "#1B9AAA", "sections": [{"id": "3A", "name": "Causes of growth", "cards": [{"term": "Monsoon winds", "def": "Seasonal winds that reverse direction: winter winds from the northeast, spring and summer winds from the southwest; merchants timed voyages and waited in port for months.", "hook": "Wait for the wind."}, {"term": "Lateen sail", "def": "Triangular sail that catches wind from many directions; used by Arab sailors (its origin is debated).", "hook": "Triangle turns with the wind."}, {"term": "Stern rudder", "def": "Chinese invention at the back of the ship that improved stability and steering.", "hook": "Rudder at the rear."}, {"term": "Magnetic compass", "def": "Chinese navigation tool that spread across the seas through trade.", "hook": "Compass from China."}, {"term": "Astrolabe", "def": "Tool improved by Muslim navigators in the 12th century that shows how far north or south of the equator a ship is.", "hook": "Astro means stars."}, {"term": "Dhow", "def": "Small wooden ship with lateen sails used by Arab and Indian sailors; dominated the seas of this period.", "hook": "Dhow: Arab and Indian."}, {"term": "Junk", "def": "Large Chinese ship with multiple sails and a compartmented hull, up to 400 feet long.", "hook": "Junk: the Chinese giant."}]}, {"id": "3B", "name": "Goods and states", "cards": [{"term": "Specialized products", "def": "Cotton, pepper, and steel from India; spices from the Spice Islands; gold, ivory, and slaves from the Swahili coast; silk and porcelain from China; horses and dates from Southwest Asia.", "hook": "Every region had a specialty."}, {"term": "Calicut", "def": "Southwest Indian port known as the \"City of Spices\"; Arab and Chinese merchants met here and local rulers welcomed them.", "hook": "Calicut, spice central."}, {"term": "Gujarat", "def": "Kingdom in western India that served as the go-between for East-West trade; customs revenue was huge.", "hook": "Gujarat, the go-between."}, {"term": "Swahili city-states", "def": "East African coastal trading cities (Kilwa, Mombasa, Mogadishu) that exchanged gold and ivory for Chinese porcelain and Indian cotton; \"Swahili\" means \"coasters,\" and the language blends Bantu and Arabic.", "hook": "Coastal traders."}, {"term": "Sultanate of Malacca", "def": "Muslim city-state on the Strait of Malacca; grew rich from fees on passing ships and built a navy; fell to Portugal in 1511.", "hook": "Toll booth with a navy."}, {"term": "Customs duties", "def": "Taxes on imported goods and port fees that gave states revenue from trade.", "hook": "Tolls fund thrones."}]}, {"id": "3C", "name": "Effects", "cards": [{"term": "Diaspora", "def": "A settlement of people away from their homeland; settlers introduce their traditions into local cultures, which influence the settlers in turn.", "hook": "Settle, share, swap."}, {"term": "Merchant intermarriage", "def": "Arab and Persian merchants stayed in Indian and East African ports and married local women, spreading Islam through family ties rather than missionaries or conquest.", "hook": "Marriage, not missionaries."}, {"term": "Zheng He", "def": "Ming admiral who led seven voyages (1405–1433) with fleets of up to 300 ships to show Ming power, collect tribute, and open markets; reached Southeast Asia, India, Arabia, and East Africa.", "hook": "Treasure fleet, tribute."}, {"term": "End of the voyages", "def": "Confucian scholars feared foreign contact and the cost; Yongle's successor ended the voyages and discouraged sailing abroad.", "hook": "Cost plus Confucians equals stop."}, {"term": "Indian Ocean slave trade", "def": "East Africans were enslaved and sold to North Africa, the Middle East, and India, often for urban labor, household work, or soldiering.", "hook": "Different from the Atlantic."}]}]}, {"id": 4, "name": "Trans-Saharan Trade", "color": "#E0A100", "sections": [{"id": "4A", "name": "Desert logistics", "cards": [{"term": "Sahara and oases", "def": "Huge arid desert (about the size of China) where only small oases have water; caravans traveled oasis to oasis.", "hook": "Oasis, the water stop."}, {"term": "Camel", "def": "Native to Arabia; drinks over 50 gallons quickly and travels long without water; replaced horses and donkeys in North Africa after 300 CE.", "hook": "Built for the desert."}, {"term": "Camel saddle", "def": "Saddle developed by the Somalis to carry loads of up to 600 pounds; made heavy camel freight practical.", "hook": "Saddle turns camel into cargo carrier."}, {"term": "Trans-Saharan caravan", "def": "Large organized groups with guides, provisions, and thousands of camels; family partners, credit, and agents linked cities.", "hook": "Safety, supplies, trust."}]}, {"id": "4B", "name": "Goods", "cards": [{"term": "Gold", "def": "The most precious trans-Saharan good, from West Africa; it drew foreign traders.", "hook": "Gold goes north."}, {"term": "Salt", "def": "Came from North Africa (for example the Taghaza oasis) and was traded south for gold.", "hook": "Salt goes south."}, {"term": "Trans-Saharan goods", "def": "South to north: gold, ivory, slaves, kola nuts. North to south: salt, textiles, horses, copper and brass.", "hook": "Gold up, salt down."}, {"term": "Cowrie shells", "def": "Shells used as currency in West African trading cities.", "hook": "Shells as cash."}]}, {"id": "4C", "name": "Mali and Islam", "cards": [{"term": "Mali Empire", "def": "West African empire that rose in the early 1200s; taxed and protected trade and became richer than Ghana.", "hook": "Mali, the gold taxman."}, {"term": "Sundiata", "def": "Founder of Mali, the \"Lion Prince,\" who returned from exile in 1235 and defeated his rivals; likely Muslim; built the gold trade.", "hook": "Lion Prince, 1235."}, {"term": "Mansa Musa", "def": "Mali ruler whose lavish 1324 pilgrimage to Mecca displayed Mali's wealth; afterward built mosques and schools in Timbuktu.", "hook": "Gold to Mecca."}, {"term": "Timbuktu", "def": "Mali city that became a world-renowned center of Islamic learning.", "hook": "Timbuktu: books and gold."}, {"term": "Songhai", "def": "Kingdom that replaced Mali as the West African powerhouse in the late 1400s.", "hook": "Songhai follows Mali."}, {"term": "Spread of Islam in West Africa", "def": "Spread by merchants and rulers' conversions rather than conquest; most West Africans kept traditional beliefs.", "hook": "Merchants carried Islam."}]}]}, {"id": 5, "name": "Culture, Cities, and Travelers", "color": "#8A4FD3", "sections": [{"id": "5A", "name": "Religion and language", "cards": [{"term": "Buddhism in East Asia", "def": "Came from India along the Silk Roads; the monk Xuanzang helped popularize it in China; Korea and Japan adopted it too.", "hook": "India to China to Korea and Japan."}, {"term": "Chan (Zen) Buddhism", "def": "Syncretic faith blending Buddhism with Daoist ideas; popular with ordinary Chinese.", "hook": "Buddhism plus Daoism."}, {"term": "Neo-Confucianism", "def": "Syncretic faith blending rational Confucian thought with Daoist and Buddhist ideas; Korea's state ideology; spread to Japan and Vietnam.", "hook": "Confucius gets a remix."}, {"term": "Syncretism", "def": "The blending of beliefs from different religions into a new faith.", "hook": "Blend, don't replace."}, {"term": "Hinduism and Buddhism in Southeast Asia", "def": "Spread by trade; the Khmer Empire's Angkor monuments show both Hindu and Buddhist influences.", "hook": "Angkor shows both."}, {"term": "Islam in Africa and Asia", "def": "Spread by merchants, missionaries, and conquest; shaped Swahili culture, Timbuktu's learning, and South Asian architecture and language.", "hook": "Islam rides the trade routes."}, {"term": "Urdu", "def": "Language blending Hindi with Arabic and Persian influences after Islam reached South Asia.", "hook": "Hindi plus Persian plus Arabic."}]}, {"id": "5B", "name": "Technology and learning", "cards": [{"term": "Gunpowder", "def": "Chinese invention (used for weapons) that spread west and changed warfare.", "hook": "China's boom."}, {"term": "Papermaking", "def": "Chinese technique that reached Europe in the 13th century; made books cheaper and raised literacy and record-keeping.", "hook": "Paper makes books cheap."}, {"term": "Islamic scholars as translators", "def": "Translated Greek classics into Arabic, saving works by Aristotle and others, and added mathematics from India and advances in medicine.", "hook": "Translators saved the Greeks."}]}, {"id": "5C", "name": "Cities", "cards": [{"term": "Hangzhou", "def": "Chinese city of about a million at the southern end of the Grand Canal; a center of culture and trade with a thriving Arab community; described by Marco Polo.", "hook": "Hangzhou, Polo's wow."}, {"term": "Why cities grew", "def": "Political stability, safe transport, commerce, plentiful labor, and more farm output.", "hook": "Safe, busy, fed."}, {"term": "Why cities declined", "def": "Political instability and invasion, disease, and falling farm productivity.", "hook": "Fights, fever, famine."}, {"term": "Constantinople", "def": "Walled city weakened by the Fourth Crusade (1204) and plague (1346 and 1349), then fell to the Ottomans in 1453.", "hook": "Constantinople crumbles."}]}, {"id": "5D", "name": "Travelers", "cards": [{"term": "Marco Polo", "def": "Venetian merchant who visited Kublai Khan's court and wrote about China (back in Italy by 1295); focused on trade and cities; many Europeans doubted him.", "hook": "A merchant's eye."}, {"term": "Ibn Battuta", "def": "Moroccan Muslim scholar who began traveling at 21 (1325) and spent about 30 years visiting mostly Muslim lands, including Mali and China; Muslim point of view.", "hook": "A scholar's eye."}, {"term": "Margery Kempe", "def": "English Christian mystic (c. 1373–c. 1440) who dictated a book about pilgrimages to Jerusalem, Rome, and Spain; a middle-class woman's life.", "hook": "A pilgrim's eye."}, {"term": "Reading travel accounts", "def": "Travel accounts are primary sources shaped by the writer's religion, culture, and purpose, so always note the point of view.", "hook": "Who wrote it and why?"}]}]}, {"id": 6, "name": "Environmental Effects", "color": "#3A9D4F", "sections": [{"id": "6A", "name": "Crops", "cards": [{"term": "Champa rice", "def": "Quick-ripening, drought- and flood-resistant rice that yielded two crops a year; came from Champa (central Vietnam), was offered to China as tribute, and fed population growth.", "hook": "Fast rice, more people."}, {"term": "Bananas", "def": "Indonesian seafarers brought bananas to Sub-Saharan Africa; the nutritious food boosted population and let Bantu-speaking peoples settle where yams did not grow.", "hook": "Bananas, Bantu boom."}, {"term": "Citrus crops", "def": "Spread through Muslim lands and markets (such as Samarkand) into the Mediterranean.", "hook": "Citrus follows Islam."}, {"term": "Sugar and cotton", "def": "Caliphs' conquests spread their cultivation; later European demand for sugar fueled mass use of enslaved labor in the Americas.", "hook": "Sweet, with a dark future."}]}, {"id": "6B", "name": "Degradation", "cards": [{"term": "Environmental degradation", "def": "Larger populations strained the land: overgrazing, deforestation, and soil erosion cut farm output.", "hook": "More people, thinner soil."}, {"term": "Overgrazing and soil erosion", "def": "Overgrazing near Great Zimbabwe forced people to abandon the city in the late 1400s; deforestation and soil erosion hurt feudal Europe.", "hook": "Land wears out."}]}, {"id": "6C", "name": "Plague", "cards": [{"term": "Bubonic plague (Black Death)", "def": "Disease that spread along trade routes from Central Asia, reaching Europe in 1347 and peaking 1347–1351; killed about a third of Europe and many millions in Asia.", "hook": "Trade carried it."}, {"term": "How the plague spread", "def": "Fleas on rats and other animals traveled on ships and caravans; Mongol conquests helped transmit it.", "hook": "Fleas ride the caravans."}, {"term": "Effects of the plague", "def": "Labor shortages raised wages and weakened feudalism; trade and cities suffered.", "hook": "Fewer workers, higher wages."}, {"term": "Boccaccio", "def": "Italian writer who lived through the plague; his Decameron was inspired by it.", "hook": "Boccaccio witnessed it."}]}]}, {"id": 7, "name": "Comparing the Networks", "color": "#E0742B", "sections": [{"id": "7A", "name": "Similarities", "cards": [{"term": "Shared origins", "def": "All the networks built on routes older than 1200 and grew as states and empires expanded.", "hook": "Old routes, new traffic."}, {"term": "Stable states", "def": "Kingdoms, caliphates, city-states, and empires protected merchants and routes and funded upgrades such as compasses, lateen sails, saddles, and high-yield crops.", "hook": "Safe trade needs strong rulers."}, {"term": "Trading cities as \"knots\"", "def": "Each network produced trading cities that held it together: Samarkand (Silk Roads), Calicut and Malacca (Indian Ocean), Timbuktu and Gao (trans-Saharan).", "hook": "Cities tie the net."}, {"term": "Centralization", "def": "Trade wealth encouraged centralized planning, such as Malacca's navy and standardized currencies.", "hook": "Wealth builds government."}, {"term": "Beyond goods", "def": "Merchants, diplomats, and missionaries exchanged ways of life as well as products.", "hook": "Goods plus ideas."}]}, {"id": "7B", "name": "Differences", "cards": [{"term": "Silk Roads profile", "def": "Overland; luxury goods (silk, tea, porcelain, spices); horses, camels, and caravanserai; spread Buddhism, Neo-Confucianism, and Islam.", "hook": "Land and luxuries."}, {"term": "Indian Ocean profile", "def": "Maritime; monsoon-dependent; goods too heavy to move by land; dhows and junks; compass, lateen sail, astrolabe, rudder.", "hook": "Sea, bulk, monsoon."}, {"term": "Trans-Saharan profile", "def": "Desert; camel caravans; gold traded for salt; load-bearing saddles; spread Islam into Sub-Saharan Africa.", "hook": "Desert, gold and salt."}, {"term": "Currencies", "def": "Silk and tin ingots, cowrie shells, then metal coins and Chinese flying cash.", "hook": "Each region, its own money."}, {"term": "Maritime versus overland", "def": "As production rose, maritime trade volume began to exceed overland routes, requiring larger ships and better navigation.", "hook": "Ships carry more."}]}, {"id": "7C", "name": "Society", "cards": [{"term": "Labor", "def": "Free peasants, artisans, debt labor, and enslaved people; trade in enslaved people was common along Indian Ocean and trans-Saharan routes.", "hook": "Old labor, bigger demand."}, {"term": "Gender", "def": "Societies remained patriarchal; exceptions included Mongol women, Southeast Asian marketplace women, and European guild women.", "hook": "Mostly patriarchal, some exceptions."}, {"term": "Centers of learning", "def": "Trade cities such as Canton, Samarkand, Timbuktu, Cairo, and Venice became educational centers.", "hook": "Trade cities study too."}, {"term": "Environmental processes", "def": "Plague outbreaks and environmental strain (deforestation, overgrazing) accompanied growth.", "hook": "Growth has costs."}]}]}], "sq": [{"id": "SQ1", "deck": 1, "q": "A classmate claims, \"The Silk Roads were created after 1200 when the Mongols and merchants built brand-new routes.\" Which reply is most accurate?", "opts": ["Mongols laid out the first overland routes, and merchants later added caravanserai and credit along them.", "They vanished after the Han and Rome fell, so the post-1200 network had no earlier trade behind it.", "They were revived by Arab merchants in the 8th–9th centuries; after 1200 they carried more goods farther.", "Merchants opened them to reach Europe, since Chinese demand for gold and silver was already strong."], "ans": 2, "exp": "The Unit 2 rule is growth and intensification of existing routes. The wrong answers either credit the Mongols with creating the routes or treat the network as new or disconnected from earlier trade.", "why": ["The Mongols did not lay out the first overland routes; the routes already existed and the Mongols united them.", "The routes were not dead after the Han and Rome fell; they were revived by Arab merchants before 1200.", "", "This invents a reason for opening the routes; the textbook describes revival and growth of existing routes."]}, {"id": "SQ2", "deck": 1, "q": "Why did Chinese authorities develop flying cash for merchants?", "opts": ["Mongol rulers demanded that customs duties be paid in paper to fund the caravanserai network.", "Bulky copper coins hampered large trades, so deposits in one city could be redeemed in another.", "China lacked a money economy, so paper credit was introduced to replace barter along the routes.", "European banking houses insisted on a Chinese credit system before buying silk and porcelain."], "ans": 1, "exp": "China already had a money economy, so the idea that paper credit replaced barter is wrong; the problem was that copper coins were too heavy to carry for big trades. Nothing in the textbook ties flying cash to Mongol duties or European demands.", "why": ["The text does not say Mongol rulers required duties to be paid in paper to fund caravanserai.", "", "China already had a money economy; flying cash solved the problem of carrying heavy copper coins.", "Nothing says European banking houses demanded a Chinese credit system."]}, {"id": "SQ3", "deck": 1, "q": "A student building a causal chain for Silk Road growth wants to open with the cause the textbook treats as most significant. Which should come first?", "opts": ["Crusaders returning to Europe with a taste for eastern spices.", "Chinese artisans expanding porcelain production for export.", "The Mongol Empire uniting the routes under one authority.", "Improved camel saddles raising the loads caravans could carry."], "ans": 2, "exp": "The textbook says no other cause had as much impact as the rise of the Mongol Empire. The other choices are real but secondary causes.", "why": ["The Crusades are a real cause but secondary; they did not unite the routes the way the Mongols did.", "Expanded porcelain production is a real cause but not the one the textbook calls most significant.", "", "Better camel saddles helped, but the textbook ranks the Mongol Empire above them."]}, {"id": "SQ4", "deck": 2, "q": "In 1250, a Russian prince keeps ruling his own city but sends regular tribute to the Golden Horde. This arrangement best illustrates the Mongols'", "opts": ["insistence on replacing local officials with Mongol governors.", "use of forced conversion to unify conquered peoples.", "habit of destroying every city that surrendered to them.", "reliance on indirect rule through existing local rulers."], "ans": 3, "exp": "The Mongols ruled northern Russia through existing princes who paid tribute; they chose indirect rule partly because they did not want to live in the forests. Surrendering cities were often spared, and the Mongols tolerated religions.", "why": ["The Mongols kept local princes in place; they did not replace them with Mongol governors.", "The Mongols tolerated religions and did not force conversion.", "Cities that surrendered were often spared; the Mongols did not destroy every one.", ""]}, {"id": "SQ5", "deck": 2, "q": "A Chinese scholar in the 1340s complains that foreigners fill government posts and the civil service exams have been abandoned. Which result most directly followed from this kind of resentment?", "opts": ["A revolt led by Zhu Yuanzhang that ended the Yuan and founded the Ming in 1368.", "A Mongol retreat to Karakorum after Kublai Khan lost the title of Great Khan in 1260.", "A Yuan conquest of Japan and Java that restored the dynasty's prestige among scholars.", "A merger of the Yuan with the Il-khanate to counter the rising White Lotus Society."], "ans": 0, "exp": "Hiring foreigners and dismantling the exams alienated the scholar-gentry; with the White Lotus Society organizing and Yuan military failures (including Japan and Java), Zhu Yuanzhang overthrew the Yuan in 1368.", "why": ["", "The Mongols did not retreat to Karakorum because of resentment among Chinese scholars; this event is unrelated.", "Yuan campaigns against Japan and Java failed and hurt the dynasty; they did not restore its prestige.", "The Yuan did not merge with the Il-khanate; the White Lotus Society opposed them."]}, {"id": "SQ6", "deck": 2, "q": "A student writes that the Mongols invented the gunpowder weapons that reshaped warfare. Which revision is most accurate?", "opts": ["Mongols developed gunpowder in Central Asia and carried it east into China during the Yuan.", "Mongols spread and adapted Chinese gunpowder and siege technology picked up from conquered peoples.", "Mongols acquired gunpowder only after the Ming, when Zheng He's fleets carried it west.", "Mongols avoided new weapons, relying only on horse archery until the Black Death."], "ans": 1, "exp": "Unit 2 stresses that the Mongols facilitated the transfer of technologies they did not invent. Gunpowder came from China, and the Mongols borrowed siege weapons from conquered engineers.", "why": ["Gunpowder was developed in China, not in Central Asia.", "", "The Mongols used gunpowder weapons long before the Ming and Zheng He.", "The Mongols did not avoid new weapons; they borrowed siege technology from conquered peoples."]}, {"id": "SQ7", "deck": 3, "q": "In summer, a Swahili merchant reaches Calicut with ivory and gold and wants to return to East Africa. Why would he most likely wait in port for months?", "opts": ["Chinese law barred foreign ships from the Indian coast until the next trading season began.", "Lateen sails could not catch the wind during the summer months, so ships stayed in harbor.", "The astrolabe could only fix a ship's latitude in winter, so navigators refused summer voyages.", "Sailing home depended on the winds reversing, so he waited for the northeast winter monsoon."], "ans": 3, "exp": "Monsoon knowledge was essential: summer winds from the southwest carried ships toward India, and the winter winds from the northeast carried them back. Merchants often stayed in port for months waiting for favorable winds.", "why": ["No Chinese law barred foreign ships from the Indian coast; the delay was caused by the winds.", "Lateen sails could catch the wind; the problem was that the monsoon winds blew the wrong way until they reversed.", "The astrolabe worked in any season; it is not what kept ships in port.", ""]}, {"id": "SQ8", "deck": 3, "q": "Malacca grew wealthy even though it had little farmland or mining. Which explanation is best supported by the textbook?", "opts": ["It charged fees on ships using the strait and used the revenue to build a navy.", "It sold surplus rice from large farms to the fleets of Zheng He.", "It mined tin and gold on the peninsula for export to Arabia and India.", "It manufactured porcelain for Muslim buyers using imported Persian cobalt."], "ans": 0, "exp": "Malacca's prosperity rested on trade, not agriculture, mining, or manufacturing: fees on passing ships funded a navy that kept the strait safe.", "why": ["", "Malacca had little farmland and did not sell rice to Zheng He's fleets as its source of wealth.", "The scenario says Malacca had little mining, so mining tin and gold cannot explain its wealth.", "Malacca grew rich from trade fees, not from manufacturing porcelain."]}, {"id": "SQ9", "deck": 3, "q": "Arab and Persian merchants settled in western Indian ports and married local women, raising their children as Muslims. This best shows that Islam often spread in South Asia through", "opts": ["state-run conversion programs organized by the Abbasid caliphs across the coast.", "the forced migration of Muslim artisans ordered by Mongol rulers.", "merchant settlement and intermarriage, not only through missionaries or armies.", "Chinese tribute missions that required local rulers to convert."], "ans": 2, "exp": "The textbook says Dar al-Islam merchants brought Islam to southern Asia through intermarriage, not missionary work or conquest alone. The other choices describe mechanisms the text does not support.", "why": ["The Abbasid caliphs did not run conversion programs across the coast; merchants spread Islam by settling and marrying.", "The Mongols did not order Muslim artisans to migrate to spread Islam.", "", "Chinese tribute missions did not require local rulers to convert."]}, {"id": "SQ10", "deck": 4, "q": "Which description of exchange across the Sahara is accurate?", "opts": ["Gold moved north and salt moved south, with horses also flowing from the north.", "Salt moved north from the Sahel to pay for gold produced in North African mines.", "Camels carried silk south while West Africans sent porcelain north across the desert.", "Gold and salt both traveled south from the Mediterranean to pay for horses."], "ans": 0, "exp": "Gold, ivory, slaves, and kola nuts went north; salt, textiles, horses, and metals went south. The wrong answers reverse the directions or import goods from other networks.", "why": ["", "This reverses the direction: salt moved south and gold moved north.", "Silk and porcelain belong to the Silk Roads and Indian Ocean, not to Sahara trade.", "Gold traveled north, not south; this reverses the direction of exchange."]}, {"id": "SQ11", "deck": 4, "q": "A student writes, \"Mali created the trans-Saharan trade in the 1200s.\" Which revision best fits the evidence?", "opts": ["Mali built the first caravan routes after Ghana weakened and then invited Muslim merchants to use them.", "Mali grew rich taxing and protecting a trade that already existed before its rise.", "Mali began the gold trade when Sundiata learned of Saharan salt mines while in exile.", "Mali expanded an older trade, but only after Songhai conquests opened routes to North Africa."], "ans": 1, "exp": "Trans-Saharan trade grew with Muslim merchants in the 7th–8th centuries and was already famous by the 8th century; Mali taxed and protected it. Songhai replaced Mali later, so the claim that Songhai conquests came first is out of order.", "why": ["The trade already existed before Mali; Mali did not build the first routes.", "", "This invents a story about Sundiata and salt mines; the trade began far earlier.", "Songhai replaced Mali later, so Songhai conquests could not have opened the routes first."]}, {"id": "SQ12", "deck": 4, "q": "Camels were in North Africa by the 3rd century B.C.E., yet heavy cargo trade across the Sahara boomed much later. Which development best explains the shift?", "opts": ["The introduction of the horse, which was better suited to long stretches without water.", "Caravanserai networks across the Sahara that housed traders and animals like Silk Road inns.", "The use of cowrie shells as currency, which made payment for heavy goods easier.", "A saddle developed by the Somalis that let camels carry loads of roughly 600 pounds."], "ans": 3, "exp": "Without a load-bearing saddle, camels could not carry heavy trade goods. Camels replaced horses in the desert, so the claim that horses were introduced to solve the problem reverses the story.", "why": ["Horses are not better suited to deserts; camels replaced horses there, so this reverses the story.", "Caravanserai are a Silk Road feature, not what explained the boom in Sahara trade.", "Cowrie shells are a currency; they do not allow camels to carry heavier loads.", ""]}, {"id": "SQ13", "deck": 5, "q": "A Chinese monk explains Buddhist ideas using Daoist concepts his listeners already know. This best illustrates", "opts": ["conquest, in which a ruler imposes one religion over local traditions.", "isolation, in which Chinese scholars rejected all foreign religious ideas.", "syncretism, in which beliefs blend to form new faiths such as Chan Buddhism.", "replacement, in which Buddhism fully displaced Daoism among ordinary Chinese."], "ans": 2, "exp": "Monks related Buddhism to Daoist principles, and the blend became Chan (Zen) Buddhism. Religions usually blended with local beliefs rather than replacing them.", "why": ["Conquest imposes a religion; here the monk blends ideas, which is the opposite.", "Isolation means rejecting foreign ideas; the Chinese here accepted and blended Buddhism.", "", "Replacement means Buddhism displaced Daoism, but the two blended instead."]}, {"id": "SQ14", "deck": 5, "q": "A historian reads Marco Polo's description of Hangzhou, which stresses silk production and paper money. What is the most reasonable inference about the source?", "opts": ["It reflects a Muslim scholar's view, so it likely stresses religious learning and sacred law.", "It reflects a merchant's view, so it likely stresses trade and should be cross-checked.", "It reflects a Chinese official's view, so it likely downplays foreign trade and commerce.", "It reflects a pilgrim's view, so it likely stresses sacred sites and spiritual visions."], "ans": 1, "exp": "Polo was a Venetian merchant whose point of view kept him focused on trade-related matters. Ibn Battuta wrote as a Muslim scholar; Margery Kempe wrote as a pilgrim.", "why": ["Polo was a Venetian merchant, not a Muslim scholar; Ibn Battuta wrote as a Muslim scholar.", "", "Polo was a foreigner, not a Chinese official.", "Polo was a merchant, not a pilgrim; Margery Kempe wrote as a pilgrim."]}, {"id": "SQ15", "deck": 5, "q": "A student wants a city whose history shows that trade prosperity was not permanent. Which evidence about Constantinople fits best?", "opts": ["Founded by Mongol khans, it was abandoned when the Ming ended their rule in 1368.", "Its Silk Road markets collapsed when Tamerlane ravaged it in 1389–90.", "It lost its trade when monsoon patterns shifted away from the Bosporus in the 1300s.", "The Fourth Crusade in 1204 and plague in the 1340s weakened it before 1453."], "ans": 3, "exp": "Constantinople was weakened by the 1204 Fourth Crusade, and plague in 1346 and 1349 killed about half its people, before the Ottomans took it in 1453. Tamerlane ravaged Kashgar, not Constantinople.", "why": ["Constantinople was not founded by Mongol khans and was not abandoned in 1368.", "Tamerlane ravaged Kashgar, not Constantinople.", "Monsoon patterns did not shift away from the Bosporus; monsoons are an Indian Ocean feature.", ""]}, {"id": "SQ16", "deck": 6, "q": "How did Champa rice most directly contribute to the growth of Chinese cities?", "opts": ["Quick ripening and two crops a year fed more people, spurring migration and city growth.", "Its tribute value led the Chinese court to move its capital to Champa in central Vietnam.", "Its drought resistance let farmers abandon terraces and settle the dry northern steppe.", "Its popularity ended Chinese demand for luxury exports, shifting labor from workshops to farms."], "ans": 0, "exp": "A reliable food supply grew the population, people migrated to the rice-growing south, and cities grew. Nothing in the text supports a capital move, abandoning terraces, or ending luxury exports.", "why": ["", "The court did not move its capital to Champa; the rice arrived as tribute.", "The rice's quick ripening, not drought resistance, mattered, and farmers did not abandon terraces for the steppe.", "The rice did not end demand for luxury exports; it fed a growing population."]}, {"id": "SQ17", "deck": 6, "q": "After the Black Death, a European laborer demands higher pay and a lord must agree. Which long-term effect does this best illustrate?", "opts": ["A rise in Mongol tribute demands that forced peasants to seek new employers.", "The success of banking houses in lending money to peasants during the plague.", "Labor shortages that raised the value of workers and helped weaken feudalism.", "The growth of caravanserai that created new jobs for displaced farmworkers."], "ans": 2, "exp": "With fewer workers, each person's labor became more valuable, so workers could demand higher wages, which helped lay the groundwork for feudalism's decline.", "why": ["Mongol tribute demands are not the cause of laborers demanding higher pay after the plague.", "Banking houses lending to peasants is not what this scenario shows.", "", "Caravanserai are a Silk Road feature, not a source of jobs for farmworkers in Europe."]}, {"id": "SQ18", "deck": 6, "q": "Indonesian seafarers introduced bananas to Sub-Saharan Africa. Which effect is directly supported by the textbook?", "opts": ["Banana plantations triggered the Atlantic slave trade by creating demand for enslaved labor in Africa.", "The nutritious crop boosted population and let Bantu speakers settle where yams grew poorly.", "The crop spread Islam into West Africa as Muslim merchants carried bananas across the Sahara.", "The arrival of bananas ended trade with Southwest Asia since East Africa no longer needed food imports."], "ans": 1, "exp": "Bananas provided more nutrition, spiking population and allowing Bantu-speaking peoples to move into regions where yams did not grow easily. The other options invent connections.", "why": ["Banana plantations did not trigger the Atlantic slave trade; the textbook supports no such link.", "", "Bananas did not spread Islam; the textbook gives no such connection.", "Bananas did not end trade with Southwest Asia; the textbook gives no such effect."]}, {"id": "SQ19", "deck": 7, "q": "Which statement is the best-supported difference between Indian Ocean trade and Silk Road trade?", "opts": ["Indian Ocean merchants relied on state protection, while Silk Road merchants traveled without any.", "Indian Ocean trade spread religions, while Silk Road trade involved only goods and technology.", "Indian Ocean trade began in 1200, while the Silk Roads had existed for over a thousand years.", "Indian Ocean merchants moved goods too heavy for land, while Silk Road merchants specialized in luxuries."], "ans": 3, "exp": "Ships could carry heavy cargo cheaply, while Silk Road merchants tended to specialize in luxury goods. Both networks used state protection and spread religions, and both predate 1200.", "why": ["Both networks relied on state protection, so this is not a difference.", "Both networks spread religions, so this is not a difference.", "Indian Ocean trade began long before 1200, so it did not start then.", ""]}, {"id": "SQ20", "deck": 7, "q": "Which similarity among the Silk Roads, Indian Ocean, and trans-Saharan networks is best supported?", "opts": ["Each depended on the same animals and ships to move goods between regions.", "Each produced trading cities and relied on stable states to protect merchants and routes.", "Each carried mostly luxury goods because bulky cargo could not be moved profitably.", "Each was created by a single empire that opened the route after 1200."], "ans": 1, "exp": "All three produced trading cities (the \"knots\" of the network) and needed stable states for protection. They used different transport and goods, and all predate 1200.", "why": ["The networks used different transport, such as camels and ships, so they did not rely on the same animals and ships.", "", "Not all carried mostly luxury goods; Indian Ocean ships also moved heavy cargo.", "No single empire created all three, and all existed before 1200."]}, {"id": "SQ21", "deck": 7, "q": "Which statement about gender in the networks of exchange, 1200–1450, is best supported?", "opts": ["Societies stayed mostly patriarchal, with exceptions such as Mongol women and Southeast Asian market women.", "Trade increased women's political power in nearly every society along the major routes.", "Mongol women were bound by the burka and foot binding adopted from conquered peoples.", "European women were barred from guilds and worked only in households."], "ans": 0, "exp": "Most societies remained patriarchies; Mongol women refused the burka and foot binding, Southeast Asian women controlled marketplaces, and European women worked as farmers and artisans and had their own guilds.", "why": ["", "Trade did not give women political power in nearly every society; most remained patriarchal.", "Mongol women refused the burka and foot binding, so this reverses the facts.", "European women worked as farmers and artisans and had their own guilds."]}], "flows": [{"id": "FC1", "title": "The Unit 2 pattern", "deck": 7, "steps": ["Innovation (credit, caravanserai, compass, saddles)", "More trade", "Bigger cities and states", "Cultural and environmental effects (religion, technology, crops, disease)"]}, {"id": "FC2", "title": "Mongol story", "deck": 2, "steps": ["1206: Temujin elected Genghis Khan", "1210–1227: conquers Jin, Kara Khitai, Khwarazm", "1236–1240: Golden Horde takes Russia, Kiev destroyed", "1258: Hulegu destroys Baghdad", "1260: Kublai becomes Great Khan (Yuan from 1271)", "1350s: White Lotus revolts", "1368: Zhu Yuanzhang founds the Ming"]}, {"id": "FC3", "title": "Black Death path", "deck": 6, "steps": ["Central or East Asia", "along Silk Road and Mongol-era routes", "trading ports and ships", "Mediterranean and Europe (1347)", "labor shortages and higher wages"]}, {"id": "FC4", "title": "Indian Ocean cycle", "deck": 3, "steps": ["Monsoon timing", "merchants wait in port for months", "settle and marry locally", "diasporic communities", "cultural blending (Swahili culture, spread of Islam)"]}, {"id": "FC5", "title": "Mali's rise", "deck": 4, "steps": ["Muslim merchants boost trans-Saharan trade (7th–8th centuries)", "better saddles and caravans carry heavy loads", "Mali taxes and protects the gold-salt trade (1200s)", "Mansa Musa's 1324 pilgrimage", "mosques and schools in Timbuktu"]}], "trees": ["THE MONGOL EMPIRE (Genghis Khan, 1206–1227)\n├─ Yuan Dynasty ........ China (Kublai Khan; 1271–1368; Ming ends it)\n├─ Il-khanate .......... Persia / Southwest Asia (Hulegu; Persian officials)\n├─ Golden Horde ........ Russia (Batu; tribute through Russian princes)\n└─ Chagatai Khanate .... Central Asia (most traditionally Mongol)\n", "NETWORKS OF EXCHANGE, 1200–1450\n├─ Silk Roads ........... overland (Central Asia)\n├─ Indian Ocean ......... maritime (monsoon zones)\n└─ Trans-Saharan ........ desert overland (camel caravans)\n", "CONSEQUENCES OF CONNECTIVITY\n├─ Cultural\n│  ├─ Religions: Buddhism, Hinduism, Islam, Neo-Confucianism, Chan (Zen)\n│  ├─ Technology and learning: gunpowder, paper, translation\n│  ├─ Cities: grow (Hangzhou, Samarkand, Timbuktu, Malacca) or decline (Kashgar, Constantinople, Baghdad)\n│  └─ Travelers: Marco Polo, Ibn Battuta, Margery Kempe\n└─ Environmental\n   ├─ Crops: Champa rice, bananas, citrus, sugar\n   ├─ Degradation: overgrazing, deforestation, soil erosion\n   └─ Disease: bubonic plague (Black Death)\n"], "table": [["", "Silk Roads", "Indian Ocean", "Trans-Saharan"], ["Terrain", "Overland (Gobi, mountains, Central Asia)", "Sea, driven by monsoon winds", "Desert"], ["Transport", "Horses, camels, caravans", "Dhows and junks", "Camel caravans; people walked"], ["Key technology", "Caravanserai, flying cash, camel saddles", "Compass, astrolabe, lateen sail, stern rudder", "Camel saddle, organized caravans"], ["Main goods", "Silk, tea, porcelain, spices, paper, gunpowder", "Cotton, spices, ivory, gold, rice, timber, slaves", "Gold, ivory, slaves, kola nuts; salt, cloth, horses"], ["Main challenge", "Mountains, deserts, political division", "Timing the monsoons; piracy", "Extreme desert, finding water"], ["Key cities and states", "Kashgar, Samarkand, Chang'an", "Calicut, Malacca, Gujarat, Swahili city-states", "Timbuktu, Gao, Marrakesh, Cairo"], ["Religions spread", "Buddhism, Neo-Confucianism, Islam", "Buddhism, Hinduism, Islam", "Islam"]], "watch": [{"deck": 4, "text": "The Fiveable cheat sheet lists salt among the goods from sub-Saharan Africa. That is backwards: salt came from the north (for example Taghaza) and moved south; gold moved north. The textbook and review doc agree. Also, the textbook is inconsistent about cloth (its text sends cloth south, its table sends cloth north), so do not rely on cloth's direction."}, {"deck": 2, "text": "The textbook says Hulegu converted to Islam and places the Il-khanate in \"Central Asia.\" The safe version for the test: the Mongols of the Il-khanate (in Persia and Southwest Asia) later converted to Islam."}, {"deck": 2, "text": "The textbook says Kublai defeated the Song in 1271. The Yuan was founded in 1271, but the Song itself ended in 1279 (the textbook dates the Song as 960–1279 elsewhere)."}, {"deck": 2, "text": "The textbook says some consider the cannon a Mongol invention and that Mongol tactics ended knights in armor and walled cities. These are overstatements. The safe test line, matching the cheat sheets: the Mongols spread gunpowder and siege technology; they did not invent it."}, {"deck": 2, "text": "The textbook says the Mamluks and Crusaders formed a temporary alliance to defeat Hulegu in 1260. The Crusader role is usually described as limited. Safe version: Mamluks under Baibars halted the Mongols in 1260."}, {"deck": 2, "text": "The textbook says the Golden Horde lost its territory by about 1369, yet also describes Kulikovo in 1380 and Mongol influence in Russia lasting longer. Safe version: Kulikovo (1380) began the Golden Horde's decline, and Moscow rose."}, {"deck": 2, "text": "The textbook says the Mongols brought the \"Arabic numbering system\" to Europe. The numerals began in India; use \"Hindu-Arabic.\""}, {"deck": 3, "text": "The textbook says Zheng He reached the Cape of Good Hope, but its own map shows East Africa. Say East Africa. Also say \"Ming admiral\" (the textbook calls him a Muslim admiral)."}, {"deck": 3, "text": "Monsoon wording differs: the textbook says winter winds come from the northeast and summer winds from the southwest; the review doc says summer winds blow southwest to northeast. Same pattern, described by where the wind comes from versus where it goes. Know both."}, {"deck": 5, "text": "The textbook calls Srivijaya a Hindu kingdom and Majapahit Buddhist. Historians generally describe Srivijaya as a major Buddhist center and Majapahit as Hindu-Buddhist. Safest label on the test: Hindu-Buddhist kingdoms."}, {"deck": 1, "text": "The textbook says caravanserai were about 100 miles apart. Spacing varied; what matters is that they were spaced so travelers and animals could rest and resupply. Also, the textbook's table dates (banking house c. 200 B.C.E., bill of exchange c. 700 C.E., Hanseatic League 1296) conflict with its own text. Just know these practices predate 1200 and expanded afterward."}, {"deck": 4, "text": "The textbook says Mansa Musa traveled with 100 camels; other accounts describe a much larger caravan. Do not memorize a number. Know: lavish gold, 1324, Mecca, then mosques and schools in Timbuktu."}, {"deck": 6, "text": "The textbook says South Asia and Sub-Saharan Africa were spared the plague because they had few ports. That claim is contested; do not rely on it. Also the plague's origin is described differently (Central Asia, southern China, East Asia); safe version: it began in Asia and spread along trade routes. Death tolls vary by source; \"about a third of Europe\" is the safest figure."}, {"deck": 6, "text": "The review doc says Champa rice ripened in about 60 days and gave two to three harvests; the textbook says quick-ripening with two crops a year, and some scholars think it originated in India. Safe version: quick-ripening, two crops a year, from Champa (Vietnam)."}, {"deck": 5, "text": "The review doc lists Kashgar only as a growing city. The textbook adds that it later declined after Tamerlane (1389–90). Both are true: it rose with the Silk Roads and declined with invasion."}, {"deck": 7, "text": "The textbook introduces the Vijayanagara reservoir quote as from the 1300s, but the source (Domingo Paes) is dated 1520–22. Use it as an example of large labor projects, not as 1200–1450 evidence."}, {"deck": 5, "text": "The textbook says Islam spread through merchants, missionaries, and conquests generally. For West Africa, the Swahili coast, and Malacca, the safe answer is merchants and rulers' conversion, not conquest."}], "practice": {"sections": [{"name": "MCQ Set A", "type": "mcq", "sources": {"S1": {"title": "Mansa Musa of Mali in Cairo, 1324", "attr": "Adapted from an Arabic account written about a decade later.", "label": "Practice source (adapted for practice; not a verbatim quotation).", "text": "The king of Mali, Musa, entered Cairo on his way to Mecca with a very large retinue. He and his companions spent and gave away so much gold to officials and to the poor of the city that its value in the markets fell sharply. Merchants who dealt in gold had not recovered their losses twelve years later. The king told his hosts that his kingdom lay many months' journey to the south, beyond the great desert, and that he meant to bring learned men home with him."}, "S2": {"title": "The Mongols: Destroyers and Connectors", "attr": "Argument by a modern historian.", "label": "Practice source (written for practice; not a verbatim quotation).", "text": "The Mongols are remembered for slaughter, and the memory is deserved: Baghdad was sacked in 1258 and much of its population killed. Yet the same conquerors made the long overland routes safer than they had been in centuries. Roads were repaired and bandits were punished wherever Mongol authority reached, and a relay system of messengers and stations linked distant provinces. Merchants who had once paid tolls to a dozen rival rulers now dealt with a single authority that respected trade. It is no accident that the travelers who carried medical learning, numbers, and technology between Asia and Europe moved in these decades."}, "S3": {"title": "A Persian envoy describes Calicut, 1442", "attr": "Abdu Razzak, Persian envoy who visited the port of Calicut, in his description of the city, 1442.", "label": "", "text": "Wealthy merchants bring in big cargoes, which they unload and unhesitatingly send into the markets without thinking in the meantime of any security, or checking the account, or keeping watch over the goods."}, "S4": {"title": "A Moroccan scholar sets out, 1325", "attr": "Ibn Battuta, a Muslim scholar from Morocco, describing his departure at age 21, from the account of his travels dictated years later.", "label": "", "text": "I set out alone, having neither fellow-traveller in whose companionship I might find cheer, nor caravan whose part I might join, but swayed by an overmastering impulse within me and a desire long-cherished in my bosom to visit these illustrious sanctuaries."}, "S5": {"title": "The plague arrives in a port city, 1347", "attr": "Adapted from a fourteenth-century European chronicle.", "label": "Practice source (adapted for practice; not a verbatim quotation).", "paras": ["Merchants returning from the Black Sea ports in the autumn of 1347 brought with them a sickness that struck the harbor quarter first. Within weeks the dead lay in the streets, and physicians trained in the learning of the Arabs and the Greeks were unable to cure it.", "By the next harvest, many villages stood empty. Landowners who had once dictated terms to their tenants now begged laborers to work their fields, and the workers who survived demanded wages that would have been unthinkable a few years earlier. Some lords complained that the world had been turned upside down."]}}, "questions": [{"id": "Q1", "type": "mcq", "src": "S1", "skill": "Purpose of a detail", "stem": "The author most likely mentions that gold merchants had not recovered their losses twelve years later in order to", "options": ["criticize Musa for wasting Mali's wealth on a pilgrimage.", "show that Cairo's gold merchants knew little about West Africa.", "show how a ruler's wealth could reshape distant economies.", "explain why Mali's gold supply was soon exhausted."], "ans": 2, "exp": "The twelve-year effect shows that one ruler's spending reshaped prices in a distant economy. The author reports the loss without criticizing Musa, says nothing about what Cairo's merchants knew of West Africa, and never suggests that Mali's gold ran out.", "why": ["The author only reports the effect on Cairo's gold market. Nothing in the detail criticizes Musa or calls his spending wasteful.", "The detail is about how long the losses lasted, not about what Cairo's merchants knew of West Africa.", "", "The passage never says Mali's gold ran out; the loss was in Cairo's market, not in Mali's supply."]}, {"id": "Q2", "type": "mcq", "src": "S1", "skill": "Best illustrates a trend", "stem": "The effect on Cairo's gold market described in the passage best illustrates which of the following about trade networks in this period?", "options": ["Distant regions were economically linked, so events in one could affect prices in another.", "West African gold was valued more highly in Egypt than in any other region of Africa or Asia.", "Muslim pilgrims in Cairo carried goods for sale between Mecca and North Africa.", "Rulers used gifts of gold to secure the loyalty of officials in other states."], "ans": 0, "exp": "The effect on Cairo's prices shows that distant regions were economically linked. The passage does not say gold was valued more in Egypt than elsewhere, describe pilgrims selling goods, or say the gifts were meant to buy loyalty.", "why": ["", "The passage never compares Egypt's valuation of gold with other regions; it only shows the effect on Cairo's prices.", "No pilgrims selling goods between Mecca and North Africa are described in the passage.", "Musa's gifts are not described as buying officials' loyalty; this answer adds a motive the source does not give."]}, {"id": "Q3", "type": "mcq", "src": "S1", "skill": "Reasoning with \"despite\"", "stem": "Which of the following best explains how a ruler from beyond the great desert could reach Cairo, despite the distance described in the passage?", "options": ["Mongol authority over North Africa had made desert travel safe for pilgrims.", "Sea routes along the Atlantic coast carried most pilgrims from West Africa to Egypt.", "Cairo's rulers sent armies each year to escort pilgrims across the Sahara.", "Camel caravans moving between oases already linked West Africa and North Africa."], "ans": 3, "exp": "Camel caravans moving between desert oases already linked West Africa with North Africa, and Musa's journey used those links. The Mongols did not rule the Sahara, Atlantic sea routes were not how pilgrims reached Egypt, and nothing describes Cairo sending escorts.", "why": ["The Mongols did not rule North Africa or the Sahara, so their authority cannot explain Musa's journey.", "Pilgrims from West Africa reached Egypt over desert routes, not by sea along the Atlantic coast.", "Nothing in the passage says Cairo sent armies to escort pilgrims; this is invented.", ""]}, {"id": "Q4", "type": "mcq", "src": "S2", "skill": "Evidence the author uses", "stem": "Which of the following pieces of evidence does the author use most directly to support the claim that Mongol rule benefited merchants?", "options": ["Baghdad was sacked in 1258 and much of its population was killed.", "Medical learning, numbers, and technology were carried between Asia and Europe by travelers.", "Merchants dealt with a single authority instead of paying tolls to many rulers.", "A relay system of messengers and stations linked the distant provinces."], "ans": 2, "exp": "The author says merchants who once paid tolls to a dozen rulers now dealt with one authority that respected trade; that is the evidence aimed directly at merchants. The sack of Baghdad supports the destruction claim, and the relay system and the movement of learning are about communication and ideas, not merchants' costs.", "why": ["The sack of Baghdad supports the claim that the Mongols were destructive, not that they benefited merchants.", "This is evidence about the spread of ideas and technology, not about the cost or safety of trade for merchants.", "", "The relay system is evidence about communication between provinces, not about what merchants paid or risked."]}, {"id": "Q5", "type": "mcq", "src": "S2", "skill": "Evidence the author uses", "stem": "Which of the following does the author cite as evidence that the routes were safer under the Mongols than in previous centuries?", "options": ["Travelers carried medical learning, numbers, and technology between Asia and Europe.", "Roads were repaired and bandits were punished wherever Mongol authority reached.", "Merchants had previously paid tolls to as many as a dozen rival rulers.", "Baghdad's fall in 1258 removed a rival power from the trade routes."], "ans": 1, "exp": "Repaired roads and punished bandits are the author's direct evidence of safety. The toll detail describes the earlier cost of trade, not safety; the movement of learning is a result, and the passage does not link Baghdad's fall to safer routes.", "why": ["The movement of learning and technology is a result of connection, not evidence that routes were safer.", "", "The tolls describe what trade cost before the Mongols, not whether travel was safe.", "The passage does not link Baghdad's fall to safer routes; this is an unsupported connection."]}, {"id": "Q6", "type": "mcq", "src": "S2", "skill": "Identifying an author's argument", "stem": "Which of the following best describes the author's overall argument about the Mongol Empire?", "options": ["Mongol violence was exaggerated by later writers, and its effects on trade were minor.", "Mongol rule benefited merchants only because the empire deliberately promoted cultural exchange across Eurasia.", "The Mongols destroyed existing trade routes and then rebuilt them to serve their own armies.", "Mongol conquest was destructive, yet it created conditions that encouraged exchange across Eurasia."], "ans": 3, "exp": "The author says the reputation for slaughter is deserved and that Mongol authority also made routes safer and encouraged exchange. The words \"exaggerated,\" \"only,\" and \"to serve their own armies\" claim more than the passage says.", "why": ["The author says the Mongols' reputation for slaughter is deserved, so violence was not exaggerated.", "The word 'only' and the claim that the Mongols deliberately promoted cultural exchange go beyond the passage.", "The passage does not say the Mongols destroyed the routes and rebuilt them for their armies.", ""]}, {"id": "Q7", "type": "mcq", "src": "S3", "skill": "Best used as evidence of", "stem": "The conduct of the merchants described in the passage can best be used as evidence of", "options": ["the role of stable, well-governed ports in long-distance trade.", "the growing use of credit instruments by Indian Ocean merchants.", "the importance of Muslim merchants in Indian Ocean commerce.", "the dominance of Indian merchants over East African trade."], "ans": 0, "exp": "Merchants who leave valuable cargo unwatched must trust that the port is secure, which shows how stable states supported trade. The passage says nothing about credit instruments, the role of Muslim merchants, or Indian dominance over East African trade.", "why": ["", "Credit instruments are not mentioned anywhere in the passage.", "The passage does not focus on the role of Muslim merchants; it is about merchants trusting the port.", "The passage says nothing about Indian merchants dominating East African trade."]}, {"id": "Q8", "type": "mcq", "src": "S3", "skill": "Evaluating what would challenge an inference", "stem": "Which of the following, if true, would make the merchants' conduct described in the passage most difficult to explain?", "options": ["Merchants trading in Calicut came from many different regions of Asia and Africa.", "Most goods reaching Calicut arrived by sea rather than by overland caravan.", "Calicut's rulers had no means of keeping order in the city's markets.", "The envoy who wrote the account was a Muslim from Central Asia."], "ans": 2, "exp": "The merchants' trust in unguarded cargo makes sense only if the port was secure, so rulers who could not keep order would contradict it. Where the merchants came from, how goods arrived, and the envoy's origin do not affect whether the port was safe.", "why": ["Merchants coming from many regions fits a busy port and does not contradict their trust in its security.", "Whether goods arrive by sea or by caravan does not affect whether merchants can trust the port.", "", "The envoy's origin does not change how safe the port was."]}, {"id": "Q9", "type": "mcq", "src": "S3", "skill": "Continuity", "stem": "Merchants trading at Calicut in 1442 most clearly illustrate which of the following continuities?", "options": ["The dominance of overland caravans in moving luxury goods between Asia and the Middle East.", "Indian Ocean commerce, which had thrived long before the Mongols or the Ming voyages.", "The reliance of Indian Ocean traders on Chinese state fleets for protection.", "The control of Indian Ocean ports by a single empire that unified the region."], "ans": 1, "exp": "Indian Ocean trade existed as early as 200 B.C.E. and continued and grew in this period. The source shows a busy port, not overland caravans, Chinese protection, or one unifying empire.", "why": ["The passage shows a sea port, not overland caravans moving luxury goods.", "", "The merchants are not shown relying on Chinese fleets for protection.", "The source shows a busy port, not one empire controlling the whole Indian Ocean."]}, {"id": "Q10", "type": "mcq", "src": "S4", "skill": "Motive for travel", "stem": "The passage most clearly reflects which of the following motives for travel in this period?", "options": ["A merchant's wish to profit from trade in luxury goods.", "A diplomat's duty to deliver a ruler's message abroad.", "A refugee's wish to escape the turmoil of Mongol conquests.", "A traveler's religious devotion to holy places."], "ans": 3, "exp": "The author says an overmastering impulse and a long-cherished desire drove him to visit illustrious sanctuaries, which shows religious devotion as a motive. He never mentions profit, a diplomatic duty, or fleeing turmoil.", "why": ["The author never mentions profit or trade as his reason for leaving.", "The author is not delivering a ruler's message; he leaves for personal reasons.", "He does not mention Mongol conquests or fleeing turmoil.", ""]}, {"id": "Q11", "type": "mcq", "src": "S4", "skill": "Sourcing and point of view", "stem": "A historian using this passage as evidence of why people traveled in this period should most carefully consider that", "options": ["it reflects one Muslim scholar's religious motives, which may not represent merchants' motives.", "it was dictated to a scribe years later, which makes every detail in it unreliable for historians studying the period.", "it describes a solitary departure, so it cannot be connected to any trade network.", "it was composed in Arabic, so it cannot reflect experiences beyond Muslim-ruled lands."], "ans": 0, "exp": "Ibn Battuta wrote as a devout Muslim scholar traveling to holy places, so his motives may differ from a merchant's. The other options overstate: later dictation does not make every detail unreliable, one traveler can still use trade networks, and language does not limit where an author traveled.", "why": ["", "Later dictation can reduce accuracy, but it does not make every detail unreliable; 'every' is too extreme.", "One traveler's departure can still use trade networks; the passage does not prove it was cut off from them.", "The language of a text does not limit where its author traveled."]}, {"id": "Q12", "type": "mcq", "src": "S5", "skill": "Identifying a claim", "stem": "Which of the following best describes a claim made in the first paragraph?", "options": ["The sickness reached the Black Sea ports before spreading to the harbor quarter.", "Physicians trained in Arab and Greek learning were unable to cure the sickness.", "Merchants from the Black Sea ports deliberately spread the sickness through the city.", "Most of the city's physicians died before the sickness reached the streets."], "ans": 1, "exp": "The paragraph says the physicians could not cure it. It says merchants brought the sickness, not that they spread it deliberately, and it does not say the physicians died first.", "why": ["The paragraph does not say the sickness reached the Black Sea ports before the harbor quarter.", "", "The merchants brought the sickness, but nothing says they spread it deliberately.", "The paragraph does not say the physicians died before the sickness reached the streets."]}, {"id": "Q13", "type": "mcq", "src": "S5", "skill": "Identifying a claim", "stem": "Which of the following is a claim made in the second paragraph?", "options": ["Lords forced the surviving laborers to stay on their land at the old wages.", "Villages emptied because lords had moved their tenants
